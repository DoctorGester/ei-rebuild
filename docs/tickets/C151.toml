note = "Style re-check of round-1 areas against the later rules (2026-11-05, digest build/style_review/round1b/terrain.md). Items T2, T5, T6 (G1, Z8, Z4, X5, X3, X4, Y8). The ten address comments (terrain_sector.h:102; terrain_sector.cpp:24, :56; terrain_landscape.cpp:51-55, :71; terrain_ambience.cpp:38); AmbientSoundClass's unused_04 / unused_0C columns and its 'layout of game.exe's table' comment; kZeroPosition / kIdentityRotation and kTerrainClassName become literals; kWaterFalloff moves to render_terrain.cpp, its only user; the dead TerrainMaterial::warpSpeed and opacity and ClassVotes::count go; SectorVertex loses #pragma pack (check render_terrain.cpp for a sizeof or offset use first). Ambience: the one-shot spot is g_clientRandom.Range(-spot, spot) + position.x (exact; kTwoToMinus32 goes); Cell keeps a Vector3 centre and the offsets and vote sums use the vector operators (the same per-component products and sums; check the operand order); the votes' initialisation keeps only soundClass; one StopLoop for the two stop loops; the snprintf name buffers become std::format like their neighbours. AddDecalTriangles' clamps as std::min / std::max, CellBound's x87 narration and the 'Lower' comment; DrawPass's dead pipeline reload; lib::Contains on waterMaterials. Comments: Rebirth's LandscapeDrawRadius as 'always on' (terrain.h:109); the stale tile edge flag arrays (terrain_sector.h:6-7, :162-163) and 'Returns 1'. Style only: goldens the same (wire, save and file bytes unchanged), float operation order untouched, no new forwarders, normal C++ classes."
order = 1151
