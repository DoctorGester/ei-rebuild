note = "User 2026-11-12: goal is making a port of Pro100 possible, not shipping it. Before work on holes A1-C7 (build/mf18_pro100.md): use the earlier address investigation (build/spelladdon, mapped through commit e3f76656b where every function still has its game.exe address) to map every Memory.Read/Write offset and call address in Pro100's main.lua (build/pro100), and addon.dll's Lua rule sites (LuaRecalcUnitStats, LuaGetModifiedDamage, ...), to our functions and fields. Report per hole: the sites, what each touches in our code, and a revised size and scope. MF18a verdict (report build/mf18a_pro100_map.md, data build/mf18a/, in this worktree): main.lua has no raw address; it goes through Pro100's lua wrapper library (about 90 fields, about 37 written, 17 natives), each mapped to our member. Lua rules: 19 entry points over 30 game.exe sites (RecalcUnitStats alone 13), the same in Rebirth 0.12.4.2 and the fork; Pro100 changes 18 (all but DistributeLmpExp). Holes re-sized to 12: A1 2, B1 1 (sites done here), B2 1, B3 2, C1 2, new C1a 1 (replicated per-unit values, replacing the smell-sense channel), C2 3 (13 sites), C3 2 (plus OnHit and OnHeal), C4 2, C5 2 (no own hook site; a cast-cost rule), C6 1 (no LMP split), C7 3 (the fork's 17 UI functions). Port traps: isMoving is Unit::obstacle (1 when idle), mana cost and heal encoded /1000, perk level bytes rewritten, bow flag never cleared, monsters keep units.udb HP."
