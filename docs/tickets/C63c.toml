note = "C63's method for world.h and the server world (world_*.cpp but world_client*, persistent_globals, base_manager, magic_trap, combat*, spell*, unit*, object.h): about 130 std::list uses, the most in world.h (30), persistent_globals.cpp (13), base_manager (15), magic_trap (12). Many hold objects whose pointers are kept (world object lists): check each. AnimationSteps (combat.h) inherits from std::vector<AnimationStep>: composition. Goldens unchanged. From C63b: UnitServer::armourSpells (combat.h) stays a list unless TickItemSpells, which holds an entry across world->CastSpell, can be shown not to reach RefreshItemSpells (which appends). Done: std::list in src 237 -> 197. AnimationSteps holds its vector (steps); TotalDuration folded into Duration. UnitServer::armourSpells a vector of HeldRef entries: TickItemSpells keeps its entry across CastSpell, which never reaches RefreshItemSpells (callers: ShowWeapon from the order system / ResyncWithUnit, RefreshEquipment from network, scripts, interface; combat.md). MagicTrap::inside a HeldRef vector, its unit lists vectors; CountedListLoad's std::list overload gone. Vectors: WorldServer::counted, ClearMapObjects / Tick / SendFreshObjects / ShareAmongSoloPlayers locals, BaseManager::Destroy ids, PlayerSource::TakeNew's links, LightFactory::litIds; BaseManager spares are per-type deques held by value. PendingIndex gone (dynamicNodes a plain map). Kept lists with a comment: WorldServer::projectiles (a hit casts the struck unit's item spells, CreateMissile appends while Tick walks it), BaseManager::objectList and WorldClient::dynamicObjects (iterators kept by id), persistent_globals' MSVC 2010 map (bucket iterators, splice). The client-world lists in world.h (platforms, sector grid cells, screen entries, heroes / objects, decals, selectedIds, UnitsInBox, ObjectsInRange, the fog manager) and the unit speech queue are C63e's (client files). Goldens 122 the same / 32 without a golden."
