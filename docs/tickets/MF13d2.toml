id = "MF13d2"
title = "Crash taking the harness's zone gz21g from gz20g (UiSurface::~UiSurface -> DropPicture)"
group = "mods"
note = "Seen by MF13d (2026-11-11) on both the vanilla and the converted install: newgame, 'zone gz20g 0', waitzone, 'zone gz21g 0' crashes right after the leave's save ('Saved savea'): C0000005 reading 0x2F8 in BattleScreen::Update -> UiContainer::Update -> UiSurface::~UiSurface -> render::ui::DropPicture -> _free_base. The AI graph code is not on that path (gz20g is a binary map; the crash comes before gz21g's load). Not checked on main. Wanted: reproduce on main, find whether it is the harness's zone jump from the last zone or a game bug (gz20g's exit to zonemichel), fix, and a scenario. Cause: gz21g names zonemichel.mpr/.mob, which no install has (no shipped exit reaches gz21g; gz20g is not involved, zone gz21g from zone1 crashes the same). NewZone returns 0 after TeardownZone and StartZone ignored EnterZone's result, so the game played on with no world: the battle screen read party units gone with the zone (C0000005 at 0x2F8 in HudPortraits::Update; the DropPicture frames were stale words of the scanned stack). Fix: StartZone goes to the main menu with the warning 'Zone <name> cannot be entered' when EnterZone fails, as for an unknown zone. Scenario zone_gz20g_gz21g with goldens on both installs."
order = 1406
