note = "Style review round 3 (2026-11-04, https://claude.ai/artifact/KKkymAu9dSoUWGGcbsLwPa, digests in build/style_review/round3/*.md; user: file the tickets). Item A8 (L). The stream thread with its quit flag, busy/late/once/endAfterSwitch, nameLock, unlock/relock and the recursive mutex exist to save about 0.2 ms; step the music from the main loop with a deeper queue instead. First measure underruns during zone loads and the theme switch latency; only proceed if both stay inaudible. Plan first, then implement. Style only: goldens the same (wire, save and file bytes unchanged), float operation order untouched, no new forwarders, normal C++ classes. Measured 2026-11-04 (two real-device runs, WASAPI 441-frame periods, realtime: menu music, new game, a jingle (victory.mp3, ~66 s), a zone change to gz15h; EI_AUDIO_TRACE plus temporary request/switch logs). The stream thread's step: a fader step, then per free half (7680 frames, 174 ms) a QueueHalf copy and FillSpareBuffer (MP3 decode 0.1-0.19 ms a half; a file's opening 1.2-2.6 ms); request to switch decoded 137-190 ms with the thread. Thread: 0 frames starved in the whole run, though the zone change held the main loop 2711 ms in one pass (cold) and the new game 222 ms. Prototype with the thread off and the steps from the main loop (FollowClock on the real clock, the same two halves): the new game starved 60 frames, the zone change (a 388 ms pass, warm) 4272 frames = 97 ms of silence in the middle of the jingle; the cold 2.7 s load would starve about 2.4 s. A queue deep enough for a cold load is 3 s or more, and a Now / AtMarker switch lands after the queued audio (streamPosition + streamBufferFrames), so a combat track would start 3 s late instead of 0.2-0.5 s; the no-device path's halves would free on other frames (goldens). Decision: the thread stays (C123a); C123 does the bounded part, one lock for the stream's state. Done (bounded): one lock for the stream's state (nameLock, onceQueued, the atomic state and end-after flag gone; the thread shows a switch's result under streamLock once the file has opened). Suites: image 196 the same, Rebirth 112 the same. The thread's removal is C123a."
