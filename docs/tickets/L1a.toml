id = "L1a"
title = "AddMob's script errors on the console; Lost in Astral's AddMob'd scripts fail on Duplicate script"
group = "lua"
note = "L1 survey (lua-scripting.md, Survey): 55 of Lost in Astral's 61 AddMob'd mobs fail at their first DeclareScript ('Duplicate script VCheck#1#1'): the zone they load into declares the same name and FindScript's !n! retry finds it, so those zones play without the added scripts. MobFile::Load ignores the load's result (LoadZoneScripts prints 'Script error: <zone>.mob line <n>: ...'). Say so on the console the same way; then decide with the user whether a later file's DeclareScript of a name an earlier file declared should get its own qualified definition (behaviour change: the mod's sub-scripts would run). Check the original game does the same first (rebirth.md: no patch touches FindScript)."
order = 1316
