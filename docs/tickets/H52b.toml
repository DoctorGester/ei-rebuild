note = "After H52 a fresh worktree's first build takes every object from sccache, but sccache runs cl -EP before each lookup (its direct mode is gcc / clang only): about 0.5 s of CPU per object, 330-470 CPU-s per verify build, which is most of a warm first build's 20-30 s and grows under load. Measure which headers make the preprocessed size (cl /E | wc per object, the heaviest includes: windows.h through src/platform, <format>, the big game headers) and cut includes where a forward declaration or a narrower header serves; check that the warm first build and a plain compile both get faster."
