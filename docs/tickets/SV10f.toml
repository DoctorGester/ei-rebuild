note = "User 2026-10-21 (\"Yeah\", after: the standalone has no dgVoodoo dependency). The image (ei_standalone.exe) always draws with our D3D11 renderer, but the harness runs it from run\\vanilla (and run\\rebirth), the copies the original game.exe also uses, which hold dgVoodoo's DDraw.dll / D3D8.dll / D3D9.dll / D3DImm.dll. So app::GetDxVersion (0045E310) loads dgVoodoo's DDraw.dll and D3D8.dll only to read a version: 0.45-1.3 s of every image run's start-up (SV10b's profile), the largest part left. With the system's DDRAW.DLL, PF3's native path already takes DirectX 7 as given (app_dxversion.cpp). Give the image runs a run folder without dgVoodoo's DLLs (the rest of the install as now; links or a filtered copy, made by run_all's prepare like run\\<install>), so the check behaves as for a player with the standalone in a clean folder. The original game.exe runs (--no-hooks) keep dgVoodoo: it draws them. Check: the log's 'native run' line in image runs, start-up before/after from the TIMING: lines (before from main's latest runs), work.py test --golden 0 differ on both installs. Watch for anything else the image loads from the install folder (mss32, binkw32, mp3dec.asi stay)."
