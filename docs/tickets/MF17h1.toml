note = "User 2026-11-11: buffs should be moddable beyond Buff.lua's one Apply call, with more moddable stats. Today an active effect (MapEffect: record, power, ticks, value) does what hard-coded SpellType checks say: UnitStats Recompute in unit_vitals.cpp (protections + antimagic's larger-of, sight / day sight / near, conspicuity sight/hearing/near floored at 0 and smell, haste speed - slow; strongest of each kind), the strengthen/weaken hit point factor (unit_vitals.cpp:80), regeneration per tick (:181), stun/teleport SetStunned on add/remove and the scale step (map_object.cpp), feeblemind's NoCasting (combat.cpp, unit.cpp), the client's look and sounds (map_object_client_effects.cpp), Silence's sound mute (unit_client_effects.cpp). Make effect kinds records (assets, TOML; a spell record's  names one): modifiers {stat, op add / subtract_floor0 / multiply / larger_of, stacking strongest or sum}, flags {stunned, no_casting, scale}, look {particle effect, sounds}. Recompute applies modifiers in a fixed pass order so the original 20 kinds are bit-exact; the SpellType switches go (one path; user's reuse rule). Stat names for what the original kinds touch now (MF17h3 adds the rest). Goldens and old saves the same (MapEffect unchanged); unit check per kind."
