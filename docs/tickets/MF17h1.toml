note = "User 2026-11-11: buffs should be moddable beyond Buff.lua's one Apply call, with more moddable stats. Today an active effect (MapEffect: record, power, ticks, value) does what hard-coded SpellType checks say: UnitStats Recompute in unit_vitals.cpp (protections + antimagic's larger-of, sight / day sight / near, conspicuity sight/hearing/near floored at 0 and smell, haste speed - slow; strongest of each kind), the strengthen/weaken hit point factor (unit_vitals.cpp:80), regeneration per tick (:181), stun/teleport SetStunned on add/remove and the scale step (map_object.cpp), feeblemind's NoCasting (combat.cpp, unit.cpp), the client's look and sounds (map_object_client_effects.cpp), Silence's sound mute (unit_client_effects.cpp). User 2026-11-11 chose Lua-first over declarative modifiers. An effect kind is Lua (the buff's script, e.g. Buff.lua or one file per family, Res\\spells\\): OnStats(effect, stats) called from Recompute with the strongest value of its kind (the original's stacking; a kind may ask for sum), OnApply / OnEnd (stunned, no casting, scale step) and OnTick (regeneration), through a stats binding whose operations are float operations (add, subtract floored at 0, larger of, multiply; Lua numbers are doubles: one operation per call, never a chain). Recompute calls the kinds in a fixed order matching the original's, so the original 20 are bit-exact; the SpellType switches in unit_vitals / map_object / combat / unit go (one path; user's reuse rule); looks stay for MF17h2. Measure Recompute's cost with Lua (units with effects only; a town fight with buffs, --quiet). Stat names for what the original kinds touch now (MF17h3 adds the rest). Goldens and old saves the same (MapEffect unchanged); spells_old_buff resumes the same."
