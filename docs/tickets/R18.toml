note = "User 2026-10-21: the camera moves jerkily at 1x speed on a 120 Hz screen. Cause: world ticks are 55 ms (0078FF34); the main loop moves the camera once per frame by the elapsed real time (RunPass, app_main.cpp) and again by a whole tick in RunWorlds on every client tick, so about half of each pan / turn / zoom arrives as a jump 18 times a second. CCamera::Update's tracking drift (kTrackGain 0.2, 0073BAD4) and focus height lag (kHeightLag 0.1) are per call, not per second, so they change with the frame rate. A followed unit's position only changes per tick in single player. Behind an option, off by default (goldens unchanged): drop the per-tick camera update and give the per-frame update the same total time so speeds stay as they are; make the two gains time-based (1 - (1 - g)^(dt / reference)); follow the tracked unit's position blended between its last two ticks by the client's tickFraction_. Check with a scenario at a fixed frame time that the camera covers the same distance as without the option. Done 2026-10-21: option smoothcamera (EI_RENDER word / render::SetSmoothCamera, off by default; renderer.md section 14). On: no camera update at client ticks, the frame's update gets real time + the client time that passed (own clock: ticks run + backlog up to a tick), drift/height lag 1-(1-g)^(dt/ref) with ref = one call's time at 60 fps (0.465 ticks), target blended between its last two ticks by tickFraction_ (camera::NoteTargetTick). Check: scenario camera_smooth (image only, frametime 8 on the virtual clock): pan/turn/zoom totals within 2.0/0.4/0.2% of the plain camera's, 0 jumps with the option (23/20/16 without), follow 0 jumps. Suites: image 121 the same, original 114 the same. For R19: the followed place lags the unit by up to a tick; units still draw at tick positions, so a followed unit steps on screen until R19 interpolates the draws."
