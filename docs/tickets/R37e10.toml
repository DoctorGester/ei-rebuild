note = "R37e3: the world's multisampled pass is shading-bound (the save's 1.91 ms at msaa 1, 2.03 at msaa 8; anisotropy changes nothing); the ground takes 1.1 ms in the save and 0.68 in the town at night, of which the shadow map's lookups 0.15 and the occlusion's 0.05; the occlusion's search 0.17-0.21 ms and blurs 0.10-0.13. Low value while the main thread is the limit (save: GPU 3.25 against 9 ms of CPU; the town at night is GPU-bound at 2.3 ms but far under 8.3 ms). Split terrain.hlsl's cost by part (point-light loop, PCSS, clouds, roofs, weather, water reflections) with probes, then cheapen the dearest (e.g. an early-out when no point light reaches the page, fewer PCSS taps where the blocker search finds none). Measure with the R37e3 kit (build/r37e3 in the main checkout: the save5 scenario, probe.patch's main-thread parts, gputiming) at 4K msaa 8, one game at a time; renderer.md section 13 item 2a. User 2026-11-06: 'the world pass is 2 ms, mostly ground shading - this doesn't sound normal'. Reworked: find where the ground's 1.1 ms goes. Hypotheses: (1) geometry - every tile at full detail at any distance, drawn to the map edge since R62: tiny far triangles, 2x2-quad overshading, vertex cost; (2) overdraw - ground drawn before opaque objects, no early-z; (3) per-pixel shader: PCSS search 8 + filter 8/16 taps with sqrt/sin/cos per tap (constant table), point-light loop with 8-tap shadows, roof 9 taps, weather noise. Measure with RenderDoc (triangle counts, quad overdraw, per-draw) and gputiming pass; try ground after opaque casters, far-tile LOD, disc table. Deliver ms per cause and a fix list (delete first)."
