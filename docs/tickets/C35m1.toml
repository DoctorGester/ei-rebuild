files = ["src/game/figure_mesh.h src/game/link_figure.h"]
note = "Found by C35m (2026-10-28) on main f14ce2571 plus a code-neutral change: the image suite's effects run crashed once after quit (report written, 0 failures) with C0000005 in ntdll's free: _free <- operator delete <- vector<MeshCorner>::~vector <- CLinkMesh::~CLinkMesh <- CLinkMesh scalar deleting destructor <- CLinkFigureLoader::~CLinkFigureLoader <- CWorld::Destroy <- CWorldClient::Destroy <- app::GameMain. Three reruns passed. Suspect a double free or a byte copy over the vector (C14v-style) in the link mesh's lifetime (figure_mesh.h corners_, link_figure.h GetPartData hands out MeshCorner*). Reproduce with EI_HEAP_JITTER or page heap on effects; resolve with tools/resolve_crash.py --raw. Root cause (2026-10-28): not the link mesh. C35g turned CWorldServer::Destroy's heap PlayerIterator (released right after its loop) into a local whose destructor ran at the end of the function, after CWorld::Destroy had deleted the player list: --refCount_ on the freed 0xAC block (offset 4). At quit the client world's destroy came next, so whichever heap structure took that block (a free-list link, another object's field) was damaged and a later free failed; which free depended on the layout. Found in one effects run with a guard heap (C35m1a). Fix: the iterator scoped to the loop; PlayerIterator, CountedRef and CLinkMeshBase made non-copyable (none was copied). Rule in the rewrite guide, rule 6."
