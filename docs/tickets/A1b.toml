note = "From V30 (build/reviews/v30c_miniaudio.md): (1) src/platform/audio_formats.cpp ReadWaveInfo walks chunk headers with no size check: pass the buffer size (SetWave has it), stop at the end, clamp dataLength. (2) miniaudio/audio.cpp Position returns the start while paused and Resume counts the paused time as played (startedAt not moved): a stolen looping voice restarts at the wrong loop spot. Keep the game-clock end rules (ends from WaveMilliseconds) as they are unless the fix is for both. (3) Optional: ScanMp3 counts a Xing/Info frame dr_mp3 skips, so Markers1/2 loop points would shift ~50 ms for a LAME-encoded mod track (no shipped track has one). Goldens unchanged."
