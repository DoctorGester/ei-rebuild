note = "C54a folded the On* forwarders (input handlers, Draw, and the plain void ones: MessageResult, UnitJoined/Left, Deactivate, CloseScreen -> OnClose, TakeItem, ShowBriefing, Speech, QuestVariable). Left, all in ui_*.h: (1) named non-On bodies behind an override: CHudMap / CHudUnitPanel Update -> UpdateVanilla, the HUD Build -> SetupVanilla, CUiContainer Show / Redraw / RedrawTips / Update -> ShowChildren / RedrawContainer / RedrawChildTips / UpdateBase (check the qualified callers), CTradePanel Update -> UpdateHeld, CConstructorPage / CSpellMakerPage ItemAt -> ItemMakerItemAt / SpellMakerItemAt, CMpHeroScreen RefreshStats / HeroRecord / Weight -> RefreshHero / GetHero / EquipmentWeight, CBattleScreen PlayerList -> SetPortraitMode, CItemInfoPanel Deactivate -> DescribeItem, CExchangeScreen TakeItem -> MoveOffered; CloseScreen -> Close / CloseDialog / RestoreAlphaRef where the named function has no other caller. Fold where the name has no other caller (the compiler finds them), else keep. (2) The converting ones: CMpConnectScreen::MessageResult -> OnBoxResult(uint32) (BoxKind is a uint32 enum: int compare warns at /W4), CBattleScreen::ItemsPicked(void*) -> OnItemsPicked(std::list<CItem*>*), CBriefingScreen::PlayersChanged -> ShowChat(char). Recipe: C:/Users/Kirill/AppData/Local/Temp/claude/E--workspace-ei/68b512f1-2aa8-49c2-bc9c-9e235d7da745/scratchpad/C54a/c54a.py (fold_all). Goldens unchanged (golden suite + ei_ui_check). C54e did the HUD and battle screen ones: CHudMap / CHudUnitPanel Update, the HUD Setup (SetupVanilla -> Setup, CHudMovePanel::Build, CHudTopPanel::Setup), CBattleScreen CloseScreen / ReadyToStopPolling / PlayerList folded, ItemsPicked takes std::list<CItem*>* (CUiContainer and CInterface3D::OnItemsPicked too).  C54d did the item / hero / exchange ones: CMpHeroScreen CloseScreen / RefreshStats / HeroRecord / Weight hold the bodies (Close, RefreshHero, GetHero, EquipmentWeight, CallShowHero gone; SetModeVanilla is SetMode), CExchangeScreen CloseScreen / ExchangeDone / TakeItem hold theirs (MoveOffered, CanMove, the empty MessageResult gone). CItemInfoPanel::Deactivate -> DescribeItem stays (other callers).C54f folded (2)'s CMpConnectScreen::MessageResult and CBriefingScreen::PlayersChanged / PlayerList, and the CloseScreen ones of CBriefingScreen, CSaveLoadWindow (CloseDialog), CHelpWindow, CMainMenu and CObjectivesWindow (RestoreAlphaRef)."
