note = "Re-planned 2026-10-29 (user: re-plan and start after the ready batch). Goal: the code that only draws (no game state) built for SSE2 with plain float maths, the x87 emulation kept only where game state or the goldens depend on it. Counts now: static_cast<float> 3,975, static_cast<double> 943, x87:: helpers ~575 (fistp 181, fcos 81, fsin 78, FromUnsigned 79, CopyBits 77, fpatan 27, RoundToInt 23, flog 15, fexp 7); whole build /arch:IA32 /fp:precise. Watch out: R35a showed the goldens depend on the drawn view through picking (the drawn matrices pick units), so camera/view/picking maths stays x87 unless the goldens prove otherwise; client-only effects are on g_clientRandom since R34a, so their float maths no longer feed game state. Steps, one worker each, golden-checked (121 / 113 the same): C30a flags only: a per-file /arch:SSE2 list in CMakeLists (src/render, ui_*, particles, effects drawing, sound, terrain drawing, sky, weather), code untouched; a file whose switch changes a golden goes back to IA32 and is listed with the golden; also an x87 control word check at the seams (calls from SSE2 files into x87 code keep the precision word set); report frame time before/after on R37's scenes. C30b scripted rewrite on the C30a list only: static_cast<float> of an int or float dropped where plain, static_cast<float>(static_cast<double>(a) / b * k) as float maths, x87::fsin / fcos / fpatan -> std::sin / cos / atan2, x87::fistp -> std::lround (nearest), x87::CopyBits -> plain assignment or std::bit_cast, FromUnsigned -> static_cast<float>; off-pattern sites left for hand review. C30c the hand-review tail, and the check_x87 rule narrowed to the files still on IA32. Not in C30: game-state code (stays x87 while the goldens compare against game.exe; see portability-direction). Superseded by C70 (2026-11-03): the build is x64 only, so all code is SSE2 and the x87 helpers are gone (0 x87:: calls left). Nothing left to do."
