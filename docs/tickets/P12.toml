note = "User 2026-11-10: players asked for Rebirth's starter option 'Камера Чейза' (a freer camera; EIStarter.exe's preset tables, build/chase_camera/tables.txt). First branch (a9b6bc5a1) made it a [camera] ChaseCamera switch; user 2026-11-11 reworked it: no setting, the freer values are the defaults (settings_catalog.inc: pitch -45..90 on maps and village screens, CameraMinHeight 0, NearClipDistance 1, distances 3..50 with hard limits 3..70 on both; 3 = the least distance at which the near plane clears a hero at pitch -45, also the original's hard limit; the ZoomBy floor dropped, not needed at 3), FarClipDistance removed (GameOptions field, reachW, TransformPipeline::BeyondReach and its checks in world_client_view, object3d_client, particle_manager, lightning; gen_settings_doc DROPPED). Kept: Pan along the ground (backwards below level, NaN at level). Underground views fixed: ClampAboveObjects kept only the camera's point a CameraMinHeight over the ground; at 0 the near plane's lower edge went up to 0.6 under slopes (sweep of zone1 at -45, 20 back: 287 of 677 views); the clearance is now at least Camera::NearPlaneReach (1.17 at 4:3, 1.24 at 16:9), also after a shake: 0 of 677, least 0.52. Harness: camrange ground; the snapshot (registry.reg) marks the changed camera values absent so runs take the defaults; scenario camera_chase renamed camera_limits. An existing ei_settings.ini keeps its written camera values (Save writes the whole table). Frame time on gz19h 4K msaa 1 aniso 1: no measurable change (level view +29 meshes, main thread +0.1 ms, GPU not slower). Not merged: user tests first."
