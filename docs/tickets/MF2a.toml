id = "MF2a"
title = "Zip mods: the files the game writes into a mod (config\\tutorial.ini, addrbook.ini) kept in a writable folder over the zip"
group = "mods"
depends = ["MF2"]
note = "Found by MF2: a folder mod's config\\tutorial.ini (written at every interface shutdown: the help topics seen) and an edited addrbook.ini go into the mod's folder; a zip is read only, so with Lost in Astral from LostInAstral.zip those writes fail silently (File::Open false) and the help topics show again each start. Proposal: a written layer above the zip (e.g. <game>\\saves\\<mod>\\files\\, or a folder named by the user), the zip's PathLayer marked read only so a game write of a file it holds goes to that layer, an Update copying the zip's bytes up first (PathLayers::Map, path_layers.cpp; the harness already writes to its overlay). Needs the user's choice of folder. User 2026-11-10: OK for the proposal: the writes go to <game>\\saves\\<mod>\\files\\ over the zip."
order = 1311
