note = "Batch 2 (review): .c_str() lines in src 1107 -> 905 (same grep as at batch start). Done: ui_item_info Writer (Text / Value / Joined / Title / Wrapped on string_view, Head on std::string); local helpers on string_view: Compare / CompareNoCase / CompareNames / SameName / SameText / SameFolder / CompareText / MbsCmp / IndexOf / HighestFileNumber, BoxText / SurfaceText / DrawPanelText / DrawRowText / DrawPiece / DrawWord / DrawLine; FindZone (string overload, 4 files), AddFigure / Marker / SendSay / WriteString (world_save, unit_save) / settings Document::Set and FindValue; c_str dropped at callers of functions that already took std::string (KeyName, text::PreviousCharacter / NextCharacter / CharacterStart, InFolder, Named, MakeWeapon, ReadTutorText, NamesRequirement, SearchWays, FirstLineOf, MidOf / Left). check_signatures 0 problems, goldens 121 the same. Stays: printf-style args (Format / FatalError / DebugLog / sprintf), Win32 / CRT calls, and every function registered with EI_REWRITTEN (a string_view adds a stack argument and check_signatures compares RET n): CFileRegistry::Open, BufferedFile::Open, CMappedResource::OpenResource (also virtual), CBaseManager::GetFile / AddArchive, CMapDatabase::FindMap, NamedFloatTable Set / Get, LocalPlayerVariable, SetTipString, SetText, ShowStatusText, database Load, AckTable Find. Left for C14a: CTextManager Open / GetString / FindLine callers (about 60). Small helpers still open: DrawEllipsis, SexOf, TextLength, VariableGet / VariableSet. Registered functions (EI_REWRITTEN; check_signatures compares RET n, a string_view adds a stack argument) keep const char* until C20 retires their registrations: CFileRegistry::Open, BufferedFile::Open, CMappedResource::OpenResource, CBaseManager::GetFile/AddArchive, CMapDatabase::FindMap, NamedFloatTable Set/Get, LocalPlayerVariable, SetTipString, SetText, ShowStatusText, the database Load functions, AckTable::Find. Batch 3 (review): .c_str() lines in src 1349 -> 1065 (git grep -c). EI_REWRITTEN is gone, so the batch-2 'stays' list was lifted for these: FindMap / FindAllod, NamedFloatTable Get / Set / Remove, LocalPlayerVariable / PlayerZeroVariable / VariableGet / VariableSet / SetVariable / SetVariableMax, ShowStatusText. New string_view: text::Split / SplitWords, TextKeyFromName, FindName (two plus the ScriptNamedValues member), CItemManager::CreateItem and the unit_record / party_members wrappers, the four FindByName, DeltaField::WriteStringBoth, OnQuestVariable (x4) + virtual QuestVariable, ConsoleWindow / CUiSpin / CUiScrollText AddText, RequestStream, ShowZone, CopyImage, DrawWrappedText; const std::string&: ClearSaveFolder, PlayMovie. New str::ToInt / str::ToDouble (std::atoi / std::atof of a std::string, 54 callers) and std::strcmp(a.c_str(), b) -> str::Compare (27). c_str dropped at callers of DrawTextIn, TextWidth, CompareIgnoringCase (2 args). Still open: CTextManager GetString / Open (C14a), CFileRegistry::Open / BufferedFile::Open / OpenResource / GetFile / AddArchive, SetTipString / SetText, database Load, AckTable::Find, Play3D, LoadPart / SetSkins / SetUpAnimatedFigure / LoadTexture / CreateSpellItem (their callees take const char*), ClassifyToken (EI_RECORD'd). Note: --all-rebirth ui_gallery_deals fails (objectives window never opens); not a rebirth scenario (config/rebirth_scenarios.csv), --rebirth is all pass. Batch 4 (review, redone on main at C38b): .c_str() lines in src 1051 -> 840 (git grep -c; 233 removed, 22 added back as std::string(x).c_str() in printf-style or C-API spots). std::string_view: GetFile / HasFile / FindEntry / GetFilePlain (CBaseManager, CResourceManager, CMappedResource, CMMIOResource, modfolders::GetFile), Play2D / Play3D / LoadSample, SetTipString / SetTipText / CUiTooltip ctor + SetText, CUiScrollText / CUiEditField SetText, AckTable::Find, Named (3 tables), FindLevel / IndexOf (skills), FindQuest, PrototypeByName, FindByCode, NamedPartyRecords::Find, CreateSpellItem / CreateSpellFromText, SetUpAnimatedFigure / LoadPart / LoadParts / MakeFigure / SetModel / LoadSkeletonLinks / LoadFigureBounds, Announce, RequestZone x2 / LeaveToZone / StartZone, FindZone (3 local copies), SetScriptName (virtual, 3), GetFileData, CIniFile::SetPath, ShowItem / HideSpeaker / AddPortrait / ChooseFigure, PrototypeObjectClass, CompleteBriefing / QueueBriefingScript / ApplyMercBriefing, HasVariable, CParty::AddMember, TextFile::WriteString, CObjectivesWindow::Setup. const std::string& (the callee passes it to a C API): OpenResource / CMappedFile::Open / AddArchive / RemoveArchive / AddMmioArchive, BufferedFile::Open, CFileRegistry::Open, the 7 database Load and LogicSettings::Load, AddWaveSource, CSoundManager::SetPath. Bug found on the way: CFigureModelPart (a novtable view of CMappedResource whose slot 5 was GetFile) called the changed virtual with the old signature and crashed every run at load; the class is gone, LoadBoneTracks takes CMappedResource* and calls GetFile (rule: a hand-matched vtable view breaks silently when a virtual's signature changes; only the goldens catch it). check_signatures 0, goldens 121 the same / 24 without. Still open: CTextManager Open / GetString / FindLine (C14a, ~100 lines); SetSkins (a null name differs from an empty one: needs an optional); CUiWindow::LoadTexture / AddSprite (null directory / name); NewZone / SelectMaps / FindScript (nullable or pointer-walking); CachedModel / CachedTexture, DrawRow / DrawEllipsis / ZonePosition, TakePrototype (virtual chain into BuildFromPrototype), debug panel Set, GetIntArray (registry and ini), lib FileExists / OpenFile (fopen); ClassifyToken (tests/vectors); the printf-style args (~230) and Win32 / CRT calls. Batch 5 (review): .c_str() lines in src 840 -> 765 (git grep -c). Nullable arguments split into two functions where the null case is its own operation: CFigureManager::NewFigure(string_view) + NewBlankFigure(), CUiWindow::AddSprite(string_view) + AddBlankSprite() (151 AddSprite(nullptr|0) callers) over a shared AddSceneObject, CUiWindow::LoadTexture(name, kind) (the directory argument was null at every caller; CTextureManager::LoadTextureFrom was dead and is gone). std::optional<std::string_view> where a null skips work: SetSkins, NewZone zone, SelectLoadingMovie. string_view: texture manager FindTexture / FindTypedTexture / TakeFromCache / FindOrCreate / FindOrLoad, ItemModel / ItemFigureTexture / CachedModel / CachedTexture, ReplaceSceneObject, hud AddWeapon / AddItem / AddSpell / AddAction, virtual TakePrototype (CMapObject, CUnit) + BuildFromPrototype, FindScript (no pointer walking), SelectMaps / MapPath / NewZone / EnsureZone / ReadAIGraph / LoadMap / LoadMapObjects (world maps chain), global map AllodTitle / ZoneTitle / QuestTitle / ZonePosition / QuestPosition (format strings became prefixes), DrawRow, DrawEllipsis + text::CopyFitting, virtual CDebugPanel Set / Remove, ModelIsFemale, Terrain::LoadMap, PlayJingle / PlayBriefing / PlayConstructor, LinkPiece, SpellCodeByName / SpellModifierCodeByName, RequestZoneChange, ObjectVariableName, FindPartIndex, TopicTitle, ConsoleAddText. const std::string&: lib::FileExists / OpenFile, CResourceStream::OpenFile, console::Execute, PlayMovies; console::Stream got operator<<(const std::string&). FigFileFormat is gone. No novtable views exist in src any more (checked before the two virtual changes). Checks: build verify / release / debug clean, check_signatures 0, goldens 121 the same / 24 without. Still open: CTextManager Open / GetString / FindLine (C14a); registry / ini GetIntArray (the whole CFileRegistry family would go on string_view and FindData takes a null key; 2 lines); GetList; CMessageBox / OpenBox title and text; CScript::LoadFile (ReadTextFile), SendText13 / WriteString, OnStringEvent (null check), SetHero (null title), BriefingSpeakerInto / BriefingVariableInto, RegisterQuests; the 5 remaining std::string(x).c_str() are printf-style arguments; printf-style args and Win32 / CRT calls. Helper scripts: scratchpad C14f5 (dropc.py, e1.py to e4.py, lib.py). Batch 6 (review): .c_str() lines in src 765 -> 426 (git grep -c). CTextManager (C14a is done): Open / OpenData / GetString / FindLine / TextSources Find / FindKeyText on string_view, AddSource / RemoveSource / TextSources Add / Remove on const std::string&; FindLine(nullptr) became FindHeader() (4 callers); GetString copes with name aliasing out (compares data()). New src/lib/printf_args.h: str::Format, game::FatalError, game::DebugLog, SayFormat and CScript::Error each have a template overload (requires an argument that is a std::string) that passes the string's text on to the C-variadic one, so 280 callers dropped .c_str() on %s arguments (a class object other than std::string among the arguments is a static_assert; std::string(sv) temporaries work too). Rule from the script: dropping ->c_str() on a std::string* argument compiled and would have passed a pointer to the string (3 spots fixed to *p); dropc.py now matches ->c_str() and each such site was checked. string_view: AddClaim / Hear / HearCall, SendText13, SendCommand, FindVariable, OnStringEvent (null check gone), CaseConverted, console Tokenize, FindPart / FindPartByPrefix / CollectPartsByPrefix / RemovePartNamed / FindBone, FindText / FindQuestRecord / LoadQuestPlaces, LoadMobFile / LoadZoneScripts / RequestLoad / LoadZoneQuests; const std::string&: CScript::LoadFile, ReadTextFile. Stays: ClassifyToken (EI_RECORD, RET n, 15 lines), const char* locals (const char* x = s.c_str()), assignments *out = s.c_str() (they cut at an embedded NUL: not mechanical), Win32 / CRT calls, BriefingVariableInto / ShareQuestFile / SwitchResourceDatabases / LoadGame / SaveGameThunk / StartNetworkZone / AllodOfMap / SetZoneMode / CountAmbientVariants (printf or C-string callees), ei::Log. Checks: verify / release / debug / asan build clean (debug has the standalone_main.cpp(259) C4702 that main has), check_x87 / signatures / stolen 0, goldens 121 the same / 24 without. Scripts: scratchpad C14f6 (dropc.py, a1.py to a3.py).  Batch 7 (review): .c_str() lines in src 426 -> 260 (git grep -c '\\.c_str()'). New: game::FatalError(const std::string&) (text is the format, as before) and str::Format with a std::string format (template on the format type: a plain const std::string& overload was ambiguous with the variadic one); ClassifyToken(const std::string&) inline overload (EI_RECORD in tests/vectors/record_script.cpp now casts to the const char* signature). string_view / const std::string& now: SetZoneMode, RequestBriefing, NameInList / AllodOfMap, SetSecondPrototypeByName, LootTableIndex, StreamInMod, PlaySound, ShowBriefing / OnBriefing (virtual), CMessageBox / CMasterRequestBox / OpenBox title, AddNamed, CopyPrefixed / GameLocalPlayerVariables, AddVariable, SameText (ui_item_view); SetHero takes optional<string_view>; const std::string&: ShareQuestFile, SwitchResourceDatabases, LoadGame, SaveGame / SaveGameThunk, StartNetworkZone, RegisterQuests, BriefingVariableInto / BriefingSpeakerInto, ApplyPrototype, GiveStartingEquipment, BuildNpcStats, MakeWeapon, LoadLights, MpHeroRecord ReadFile / WriteFile (+ InFolder / TempFile), StoreAtof. About 55 'const char* x = s.c_str();' locals now use the string; terrain ambience names built with str::Format instead of snprintf. Pointer-valued ->c_str() dropped as *p (Announce, CreateItem, Split, FindLevel, Compare). Checks: verify / release / debug / asan clean (debug has the standalone_main.cpp(259) C4702), check_x87 / signatures / stolen 0, goldens 121 the same / 24 without. What is left (260): Win32 / CRT / AIL / Bink calls (about 120), memcpy / strcpy-style copies of c_str into char arrays (script_effects, script_exec_run, world_effect_missile, world_units wave, random, ui_connect CopyText, unit_skins), assignments from c_str (cut at NUL: chunk_stream / map_spec / world_effect / script_load ReadString, ui_help_window, exit_area, script_addon_strings), accessors returning const char* (GetName family, item_db_open, item_stock, party_records), const char* parameters with null or buffer meaning (StartServer, MessageText, AnnounceToGuests, CountAmbientVariants, GetIntArray registry / ini, CursorImage, ClassifyToken itself, LoadFunction signature, JoinPath), printf-style args with mixed wide strings (ei::Log %ls), and the R27 files. Not worth another batch; the rest are C-API boundaries (C20 / later cleanup of those callees would be needed)."
