note = "Done earlier: 296 dead functions deleted (see the note). Result: 296 dead functions deleted (src/lib 25 files, src/game 153 files; 2,425 lines; 394 EI_REWRITTEN lines of them), not the ~4,900 a first scan suggested. Method: scratch builds of the verify config (build/c20g-od and c20g-odu, EI_UTF8 off and on, /Od so no call is inlined away, EI_REWRITTEN made empty so the records root nothing), a COFF relocation graph of the objects (checked against the linker's /OPT:REF map: 4 differences, all library inlines) giving the functions no root reaches; dead = unreached in both configs. First attempt on /O2 objects found 6,254 dead non-inline symbols (5,220 without templates, 3,866 after a closure), but /Ob2 had inlined the calls away: the sources still called them (3,074 compile errors) - those are false positives. /Od + union of the two configs: 439 / 373 dead, 327 planned, 296 compiled clean (31 kept: named by a constexpr table or template argument). Kept and why: files held by C14a (script_*, console*, text_split, mfc_string, string_map, mfc_coll) and C20e (short_functions, particle_create): 15; templates/lambdas 5; compiler-made members and ambiguous overloads 27; names in tests/tools/config only in generated lists (tests/coverage, config/functions.csv, library.csv): none were code. tools/ and tests/ compile (verify build). Not done: C14a batch 11 / C20 batch 3 files, header inline and template functions, static data only the dead code used. Verify, release and verify utf8 build with all checks 0; check_signatures 0; image suite 145 runs ALL PASS, 121 goldens the same, 0 differ."
