id = "R37e10d"
title = "The sun's shadow on the ground as a half-size screen mask"
group = "renderer"
files = ["src/render/shaders/shadow_receiver.hlsli", "src/render/shaders/terrain.hlsl", "src/render/render_occlusion.cpp"]
note = "R37e10: the sun's PCSS is the dearest part of the ground's shader: 0.26 / 0.20 ms a ground draw at 4K msaa 8 (save / town); with it compiled out the ground costs what a trivial shader does. Inside it: the 2 x 2 quad sharing 0.07 / 0.04, 16 filter taps where 8 would do 0.05 / 0.07, the blocker search 0.03, the per-tap sqrt/sin/cos 0.01-0.02 (a constant table wins nothing). It runs once per shader lane: 16.6 M lanes for the save's 8.3 M pixels (quads, msaa edges, overdraw). Work it out once per half-size pixel from the occlusion's half-size depth into a mask, read by the ground (and the models) with the occlusion's depth-aware upsample; expected 0.15-0.25 ms saved. Visual change (softer detail at shadow edges): the user's call; frame captures before and after."
order = 1272
