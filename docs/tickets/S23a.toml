id = "S23a"
title = "Drop-in layout in the harness: a scenario run of the exe inside a game folder, no EI_GAME_ROOT"
group = "standalone"
depends = ["S23"]
note = "S23 checked the drop-in exe's start-up by hand only (--check from C:\\ in a folder with an install's DLLs: imports from the exe's folder, the plain and the Rebirth profile picked from the folder's files, EI_Plugin.ini's players and pause). No scenario starts the exe from inside a game folder: ei_launch always sets EI_GAME_ROOT, so EnterGameFolder (standalone_main.cpp) and the folder's profile (startup.cpp) are never run by the suites. Add an ei_launch / run_all mode that starts the exe copied into an overlay of the install (nothing written to F:\\games) with no EI_GAME_ROOT and no ei_rebirth.ini, and scenarios of their own on both installs (boot; a check that the Rebirth profile's flags are on); not the golden ones (the plain profile turns WideScreen on).  Outcome: ei_launch --drop-in (also any --standalone run of a scenario with a '# drop-in:' line, so main's scheduler runs it with the worktree's ei_launch) makes <run>\\dropin like the --game install (its folders junctions, its files copies but game.exe and our own files), copies the build's ei_standalone.exe (and ASan's runtime) there, starts it from the run folder with EI_GAME_ROOT and EI_REBIRTH cleared, sets EI_DROPIN (vanilla / rebirth) and EI_HARNESS_SETTINGS (the build's config\\harness), and removes the folder when the game ends (reparse points removed, never followed; run_all removes a killed run's too). run_all plans drop-in scenarios on both image installs by default (standalone, standalone-rebirth; --vanilla-only / --rebirth-only one), never with --no-hooks or --widescreen. Harness (tests/verify/harness_dropin.*): in a drop-in run Work path / CD-ROM Path read .\\ (not the snapshot's absolute install), so the data goes through the junctions; step 'dropin' checks no EI_GAME_ROOT / EI_REBIRTH, the working directory and data folder the exe's folder, no ei_rebirth.ini, every flag against the profile worked out independently (config/ei_rebirth_standalone.ini on Rebirth: 40 on; the defaults and WideScreen on vanilla: 12 on), on Rebirth EI_Plugin.ini's players and pause. Scenarios dropin_boot, dropin_profile (no goldens). Checked: the 4 runs PASS (the folder's writes redirected to harness_saves, none refused); --no-hooks 127 PASS, goldens 114 same / 13 without; test_work_sched 35 OK. The image suite gains 4 runs without a golden (122 / 32)."
