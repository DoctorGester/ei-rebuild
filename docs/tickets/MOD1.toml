note = "User 2026-11-05: start on Lost in Astral support. Rebirth ships the 2005 expansion as starter/Mods/LostInAstral (Res, Maps, Config, Camera, Movies, Stream, config.reg); Rebirth's starter runs its own engine/game.exe with addon.dll, which (by its layout) reads a file from the mod folder when there, else the install. Ours: every platform.h file call takes its path from SystemPath(path, use) (src/platform/seams.h); the harness's MapPath (tests/verify/harness.cpp) already overlays reads/writes/saves. Build: (1) one overlay in src/platform (an ordered list of read roots, a write root, a saves root) used by both the product's SystemPath and the harness's MapPath (the harness's install overlay becomes one more layer); (2) folder listings merge the layers (a mod's file hides the install's of the same name, Windows case rules); (3) saves of a mod in their own folder (saves/<mod>/...), never mixing with the base game's; (4) the mod chosen by 'Mod = starter\\Mods\\LostInAstral' in ei_settings.ini [game] (docs/settings.md): the mod folder's path relative to the exe, or in full (user 2026-11-05: no search under starter/Mods); (5) the mod's config.reg values applied over the base registry values the game reads (read how the game reads config.reg / the registry files today). Write docs/notes/mods.md. A scenario that starts the base game with Mod set and shows a mod zone loads (the stub repo may need the mod's files: check the private stub's size rule, linux.md). Goldens the same. No restart-free switching here (MOD3)."
