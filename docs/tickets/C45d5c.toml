note = "Left by C45d5b. FindSkillAnimation's callers are all in ui_* (briefing, camp, hero screen, main menu, ui_model) and pass gesture numbers SkillAnimation does not name (0x21, 1, 3, 5, ...). Name those gestures (extend SkillAnimation or a gesture enum next to it, from the animation tables' names), then FindSkillAnimation takes the enum. Also the local 0x7FFF low-bits masks (kKeyLowBits in unit_client_update.cpp, the animation manager's and object3d_animations') on one named constant in map_object_figures.h. Goldens unchanged."
