id = "H50a1"
title = "Linux: a WSL dzn run's Windows slots follow its need"
group = "harness"
depends = ["H50a"]
note = "H50a: without --jobs a WSL run on dzn takes the Windows game slots free at its start (2 to 8) and keeps that many to its end. Started while Windows' 16 were busy it got 2 and stayed at 2 (347 s for the image suite, against 208 to 270 s with 6 to 8), and its last games hold slots they no longer use. Let the hold grow as Windows slots free (up to WSL_GPU_SLOTS) and give slots back as the queue empties; the Windows side of hold_windows_slots() then needs a way to take and release slots one at a time (stdin commands). docs/notes/linux.md, The GPU under WSL."
