note = "User 2026-11-03: tree shadows look somewhat blocky; maybe the shadow map does not handle alpha right. What I read (not measured): shadow_caster_fs is a binary alpha test on level 0 of the stage's texture (StageSampler, linear unless the stage asks point), cut at (alphaReference+0.5)/255, or 0.5 for blended passes; outside casters use StageSampler(StageState{}) and the cut remembered in g_cuts (default 0.5). The map is 4096 texels over the visible ground (render_shadows.cpp kMapSize, extent/kMapSize per texel), the PCSS filter at least kLeastRadius 1.5 texels. Candidates: point-filtered tree stages giving stair-stepped leaf edges magnified into the map; a cut too high for blended foliage; texel size too large at the far zoom; the narrowest filter too small to hide the steps; the range cells (kRangeCell 16) ending the filter early (around.y < z - reach returns 1 at cell edges). Find the real cause with captures first (a forest map at the default and far zoom, sun shadows and a point light near trees), then fix it in both GLSL and HLSL. Deliverable: before/after PNG pairs under build/reviews/r47_shadows/ (same view, same frame), and a short note of the cause. The coordinator publishes them for the user. Gating: goldens hold no frames, so goldens the same; ei_render_check and ei_shader_check green. Starts after R43c (it changes the shadow shaders' samplers and packing)."
