note = "User 2026-11-05: closing the game now takes about a second, it used to be practically instant. Time the exit on the release exe (both installs, windowed and full screen): stamp each stage of the shutdown in the log (StopGame, the world and databases freed, sound device closed, the GPU device thread joined and the device destroyed (R43d3), SDL quit, settings saved) and find the slow one; bisect over recent merges if no stage stands out (candidates: R43d3's device thread join, MOD3a's StopGame, A-track audio close, settings::Save). Fix it so the window goes at once; nothing the next start needs may be lost (settings, saves, logs flushed). A harness check that the exit stays under a limit if it can be measured there. Cause: gpu.cpp's frame-timer std::thread (on with the performance overlay, which Rebirth's profile turns on) was joinable at exit, so std::terminate aborted (0xC0000409) after the exit functions and the process waited 2-3 s for the crash report. Fix: render::Shutdown (perf::Release) from DestroyRenderer plus an atexit join. Exit stage stamps in the log; run_all checks the exit code and the game's own exit stages (2 s)."
