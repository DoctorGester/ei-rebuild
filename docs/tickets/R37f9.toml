note = "R37f5 (frame-plan.md, 'Measured after R37f3 and R37e4'): the largest part of the save's main thread is still the objects' draws, 1.34 ms of 4.0 (release terms), plus 0.25 ms of PlanMeshDraws, though 1766 of its 1822 meshes are the same as the last frame. Per part and frame the game makes the part's world matrix and pushes it on three stacks (PushMatrix 0.09 ms), tests it (ClipTest 0.17), lights it (PartLighting 0.05, the lights in reach walked per object), and the hand-over rebuilds a MeshDraw (BeginMesh 0.23 with FigureLight 0.13), reads the device's state (ReadPassState 0.06), finds the kept mesh and its changes (KeepMesh 0.13), and PlanMeshDraws fills a record (FillRecord 0.11) and binds (BindCachedMesh 0.13): about 0.4 us a mesh renderer side, as much game side. Delete the repeat: an object whose pose, scale, lights in reach, edge fade, wounds, texture animation, part set and LOD are unchanged re-sends last frame's batches and records instead of walking its parts. Design first (write it in renderer.md): (1) what the kept draw holds must not depend on the camera: today MeshDraw::matrix is the screen stack (view and projection in it) and the renderer takes the camera back out (CameraInverse::Under) - hand over the model's world matrix and the frame's view once instead; (2) what invalidates a kept draw (the game's MapObjectFlag::Static and FigureMeshFlag::Lit already mean 'unchanged since lit'; MeshChanged; the LRU dropping a kept mesh); (3) the per-frame verdicts that stay per frame (in view by R37f8's per-object test, caster strength, the drawn parts the shadow walk reads, FigureMeshFlag::Drawn); (4) units and other moving objects keep today's path. Expected: objects' draws 1.34 -> about 0.4 ms and PlanMeshDraws 0.25 -> about 0.08 in the save (about 1 ms); the town at night little (0.05 ms of still objects). Goldens the same; frames the same at tolerance 0 on the render_ scenarios. If the design proves too costly, R37f10 is the fallback (the same per-mesh path, cheaper). 2026-11-06: R37f8 dropped, so no dependency; the view test's per-part cost (0.27 ms) is for this ticket to take for still objects. Keep it small: the user drops tickets whose gain does not pay for the code they add."
