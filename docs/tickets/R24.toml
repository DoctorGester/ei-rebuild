note = "User 2026-10-22: later, not critical. R20's outside casters copy every part's world-space corners each frame (about +0.4 ms CPU in town, +1.2 ms with big buildings just off screen at 4K; 83k corners in the gate case). Static parts (trees, buildings) have the same world-space vertices every frame whatever the sun does: keep them in a GPU buffer per part, change only the sun's matrix per frame; the selection test stays per frame; animated parts and units keep the copy. Measure with the R21 overlay. Done (R24): the GPU caching itself came with R37c (corners kept by part in the pool, only the matrix per frame). R24 trimmed the walk (part ranges by string_view, no nested timer per caster, objects counted once per run of meshes) and put the walk into the overlay's SHADOW time (it was outside it). 4K harness numbers (shadow map CPU ms with outside casters / without; walk): town bz1g 0.23 / 0.14, walk 0.05-0.06 before and 0.045-0.05 after; gate 0.35-0.5 / 0.25-0.4, walk 0.07-0.10 both (noise). R20 had +0.4 / +1.0. Frames 0 px differ at tolerance 1 against the pre-change build (render_shadows*), goldens 198 / 113 the same."
