id = "C35k"
title = "C35 str::Format callers with a literal format and no float conversion to std::format (type-aware, optional)"
group = "cleanup"
note = "C35c left the ~200 str::Format calls with a literal format and no %e/%f/%g on str::Format, whose integer, character and string conversions are already the host's snprintf. Moving them to std::format deletes no CRT code; each needs its argument types read (a char or unsigned argument under %d, a negative int under %x, %3.3i's zero padding of a negative print differently in std::format), so it is not a mechanical batch. The ~150 calls with a named or run-time format (the game's texts) stay on str::Format, which reads a malformed format as VC6 did."
order = 504
status = "done"
