note = "Pattern of MF17g (assets/spells/Lightning.lua, docs/notes/items_spells.md 'The game's spells on scripts'): script + record fields in assets/spells/spells.sdb.toml (per_target, ends_with_target, the use fields), the same objects in the same order and the same ticks; delete the Start/Update/DamageKindOf cases and the kGameSpells rows. Goldens: only the missile record form and saves mid-cast may change (golden.py explain), re-record those by name from two agreeing passes. Lua numbers are doubles: pass floats on or one operation, never a chain; float constants need a binding value or an exact literal. healing, teleport, clairvoyence, fireworks, vision_fog. Missing: healing's attached particle with the full-health test for its sound and light (silentEnd on the cast) and a negative light range, and the item triggers keyed on the Healing behaviour (combat_actions, combat_update: a record field); teleport's Move + its own effect record + ResyncWithUnit and the CantTeleport shout (a binding for acks); clairvoyance's possessedGroup insert and WakeUnitsAround; fireworks' fright (brain.memory.Notice, FrightLevel) and wake; vision fog's EffectShowVisibility (a binding). Possession, link and charm stay (cut, unreached). MF17g3 added (use them): cast:Ground (grid / water height + above), cast:Release(handle), cast:SoundLoop (fireworks' numbered sounds as a list), Light velocity, Effect param/target/unit, cast.areaPower, OnResume's old.visual/sound/light handles. MF17g5 added the record field effect (what an active effect of the record does; MapEffect::Behaviour reads it): teleport's record says effect = \"teleport\" (the stun without a look) and its script puts cast:Apply(caster, \"own\"), as Buff.lua does."
order = 1371
