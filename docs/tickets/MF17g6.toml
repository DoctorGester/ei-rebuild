id = "MF17g6"
title = "Port the remaining spells (healing, teleport, clairvoyance, fireworks, vision fog) onto scripts"
group = "mods"
size = 3
depends = ["MF17g"]
note = "Pattern of MF17g (assets/spells/Lightning.lua, docs/notes/items_spells.md 'The game's spells on scripts'): script + record fields in assets/spells/spells.sdb.toml (per_target, ends_with_target, the use fields), the same objects in the same order and the same ticks; delete the Start/Update/DamageKindOf cases and the kGameSpells rows. Goldens: only the missile record form and saves mid-cast may change (golden.py explain), re-record those by name from two agreeing passes. Lua numbers are doubles: pass floats on or one operation, never a chain; float constants need a binding value or an exact literal. healing, teleport, clairvoyence, fireworks, vision_fog. Missing: healing's attached particle with the full-health test for its sound and light (silentEnd on the cast) and a negative light range, and the item triggers keyed on the Healing behaviour (combat_actions, combat_update: a record field); teleport's Move + its own effect record + ResyncWithUnit and the CantTeleport shout (a binding for acks); clairvoyance's possessedGroup insert and WakeUnitsAround; fireworks' fright (brain.memory.Notice, FrightLevel) and wake; vision fog's EffectShowVisibility (a binding). Possession, link and charm stay (cut, unreached)."
order = 1371
