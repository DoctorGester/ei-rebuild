note = "User 2026-11-04: WSL runs draw on lavapipe (CPU), about 12 cores a game and up to 190 s for a pair scenario. WSL exposes the GPU only as D3D12 (/dev/dxg, /usr/lib/wsl/lib); Ubuntu's Mesa has no dzn ICD. Build Mesa with -Dvulkan-drivers=microsoft-experimental (and the d3d12 gallium driver if useful) into ~/mesa-dzn in WSL home, never system-wide; point runs at it with VK_ICD_FILENAMES (an opt-in, e.g. EI_VK_ICD or a run_all --gpu-dzn flag; lavapipe stays the default and CI's reference). Check: SDL_GPU starts on dzn (ei_gpu_check, port_render), the image suite's goldens the same as on lavapipe, and the time of a full Linux image suite on dzn against lavapipe at the same --jobs. Say which SDL_GPU features dzn lacks, if any, and whether it is stable enough to be the local default. Document in docs/notes/linux.md."
