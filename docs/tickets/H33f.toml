id = "H33f"
title = "windows.h only where Windows is called: gameapi.h without the import prototypes, direct includes cut"
group = "harness"
note = "User 2026-10-30 asked why windows.h is everywhere. lib/gameapi.h (78 files) includes import_table.h / import_prototypes.h, the original's Win32 imports typed by their prototypes, so windows.h, mmsystem.h, shellapi.h, objbase.h and dsound.h reach every caller. Make gameapi.h expose the calls without the SDK headers (own declarations over lib/win_types.h, or the table kept to the few .cpp files that fill or call it), then audit the 62 direct windows.h includes (game 31, render 14, hook 8, standalone 5, lib 4): keep it only where Windows is really called (registry, sockets, files, window, DirectDraw), ideally a small platform layer; the rest take lib/win_types.h. User 2026-10-30: registry and DirectDraw should have no uses. They have none at run time: the standalone resolves 109 of game.exe's 504 imports and leaves 395 as traps, all DDRAW.dll and ADVAPI32 Reg* among them. What is left is declarations: ImportTable / gameapi.h are generated from game.exe's whole import directory, so gen_iat.py should emit only the reached imports (the unreached slots go, with their SDK prototypes), and system_text's UTF-8 Reg*A wrappers (and any other wrapper of an unreached import) are dead and go. The hook (src/hook/paths.cpp) still serves the original game.exe and keeps its own. Measure the clean build like H33a. gameapi.h / gen_iat.py are in the harness's reference key: goldens."
order = 792
