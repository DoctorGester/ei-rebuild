note = "Style re-check of round-1 areas against the later rules (2026-11-05, digest build/style_review/round1b/items.md). Items I6, I7, I8 (X4, Z10, X3, Y5, Z8, Y8). Trader stock: MagicIndices with its function pointer and SpellIndex / ModifierIndex become ItemIndices over the one table (after C149); lib::Contains for the two std::find tests; the appending out-pointers (ten Generate* members, AppendWeaponModelParts) take references; SetLevels and GenerateSpells take const float (&)[kSchoolCount]; CopyMagic takes const&; SaveLists writes the ints with WriteValue as LoadLists reads them; the stock:: constants move to item_stock.cpp, named by what the band does; RollDamage is g_random.Range(damage, damageSpread + damage) (exact); a comment in item_manager.h says why ItemConstructor::manager is counted by hand. Name builders: ForEachPart's strlen / memcpy / PartSpan become string concatenation and one WeaponModelParts returning the vector (AppendWeaponModelParts' one caller, unit_client_models.cpp:323, inserts it). Residue: split declarations and global aliases (item_manager.cpp:135, :279, :288; item_stock.cpp:375); ItemWeapon's three WeaponAt(PrototypeIndex(...)) through WeaponOf; Item::Weight() and unit.cpp's ItemWeight forwarder replaced by the field; FindItem inlined (13 uses); ItemDatabase::Load and SpellDatabase::Load return bool. Comments: the Rebirth wording in item_db.h:332, :364, :392, :406 and item_manager.h:54, :101 by Patch:: name or 'always on' (the code always returns null); the stale 1 / 0 returns of bool virtuals (item.h:62, :67). The five Add* forwarders may stay as the class templates' API (say so in the commit). Style only: goldens the same (wire, save and file bytes unchanged), float operation order untouched, no new forwarders, normal C++ classes. From C149: also I6 (MagicIndices as ItemIndices keyed by Named; out-pointers to references), I7 (ForEachPart with std::string; one spelling for WeaponOf), and SpellSchoolSkill / BestPartySkill / HeroSchoolSkill typed as SpellSchool to drop the new int casts."
