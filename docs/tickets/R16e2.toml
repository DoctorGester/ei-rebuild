note = "Found by R16e (renderer.md section 13 item 5). With the shadow map the object shadows' ProjectDecal 0056C750 (0.34 / 0.60 / 0.48-0.63 ms a frame in zone1 / the fight / the town, render_stats vanilla 4K) is read only for its mesh's bounds: the shadow's sphere (FitBounds in RenderShadow), which ShadowInView 0051E300 tests for objects out of view (CollectVisible 0056A990 then lists them for shadows and updates their pose) and vertices.size (DrawShadow's early return). A sphere around the decal's prism (the quad through the plane at the point minus depth * 0.33, clamped to the terrain's and platforms' heights under it) is conservative: more objects out of view listed for shadows (more casters in the map, which also helps the open 'casters off screen cast nothing'), more pose updates. Changes the shadow lists, so it waits for the user's call; check goldens 0 differ, render_shadows, renderstats' shadow projections gone with the map."
