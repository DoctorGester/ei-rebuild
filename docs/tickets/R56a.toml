note = "User 2026-11-05 found R56's 'first frame' bug: more a first-tick thing, only in town. Their save 'ShadowCorrupt' is the Rebirth install's saves/save3 (town bz1g, 2026-10-22), copied to E:/workspace/ei/build/shadowcorrupt/save3 (never write the install; put it in the run folder's saves). On the first few frames after loading it: (1) characters have different poses, (2) characters are lit differently (the interactable ones light up: the hover/talk highlight?), (3) the camera moves. Capture frames 1..N after the load with R56's capture bursts (capture <name> <count> after <text>), on Rebirth data at the user's resolution or 4K, and find each cause: animation state or R19's blending/interpolation starting from a default pose before the first tick, the highlight state of NPCs before the first mouse/hover update, R19/camera smoothing easing from a default camera to the saved one. Fix each so frame 1 after a load shows what the settled frames show (one uniform path, no load-only branches if avoidable). Add the save as a scenario only if it can be shipped as harness data (the stub repo route); else a scenario on an equivalent town save the harness makes. Goldens the same unless the fix is client-side only; frame checks for the first frames. Captures before/after. Done: (1) camera: a load leaves the camera's own pose stale until its update, and the drawn view spread that first tick's swing; the ticks before the first frame after a placement are now cuts. (2) camera: the base screen makes the leader the target after the load and the focus glided ~3 units (the save's pan); a target given before the first frame is drawn as reached (camera::SettleBy: a drawn-only gap the update shrinks with the drift; the own focus keeps the glide: moving it moved 153 goldens). (3) the people with a topic lit up a tick or two late (MarkPeople sent each mark through the server's player 0); the briefing marks them on the client (WorldClient::MarkPerson). Poses: no default-pose start found; what changed was the swing's angle and the lit figures. Virtual clock only: the save's Esc-menu pause shows the first ~14 frames still. Scenario render_load_town (vanilla + Rebirth). Captures build/captures/r56a."
