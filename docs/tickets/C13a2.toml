note = "After C13a1 (python tools/direct_calls.py --report -v --cast --library [--loose], after merging main): 534 'types differ' (431 with --loose), 102 rows in config/direct_calls_skip.csv; forwarder sites 2,014 (check_cleanup), 2,007 addresses. By forwarder file (--loose): src/lib/mfc.cpp 33, originals_library.h 29, originals_ui.h 20, originals_units.h 15, world_game.cpp 12, originals_gameplay.h 11, net_connection.cpp 10, base_manager.cpp 10, net_client_handlers.cpp 9, originals_script.h 8, unit_skins.cpp 7, ui_layouts.cpp 7, then 1-6 per file. Families: (1) STLport containers and strings on per-file raw types (about 115): StringAbi called on RawString / StringSlot / NameKey / net::StringRep / uint32_t[3] storage (class_templates, figure_*, item_constructor, net_*, sound_manager, world_game, unit_*), list / tree / vector ABIs on HeaderNode / ClientNode / void* record maps; the 13 'convertible' originals_library.h forwarders (StringInitEmpty, StringAssignSpan, StringInitFromChars, StringAssignRange, StringErase, StringReserve, StringAssignCStr, StringCopyConstruct, StringSplit -> text::Split on console::CStringArray, OstreamPutString / PutUnsigned / PutDouble on per-file stream classes, IniGetList) only compile once those types are stlp::string / libcrt::Ostream / mfc::CStringArray (a --apply attempt gave 99 errors; patch build/C13a1/library_apply.patch in the C13a1 worktree, gone with it). (2) MFC (about 50): mfc.cpp's CString / CFile / CStringArray / CArchive forwarders and their callers. (3) Other (about 266): CMpHeroScreen's weapon_ / armor_ / spellContainer_ (char*) and weaponPanel_ / spellPanel_ (void*) to CItem* / CHeroEquipPanel* / CHeroQuickStrip* (ShowWeapon / ShowArmour / ShowContainer); UiItemKinds::Is* (stdcall forwarders vs thiscall targets that ignore this); TextFormat -> CInterface3D::MessageText; Edit field / scroll text constructors taking a RECT by value; NewManagedTexture (CTexture*); AfxBeginThread; HoverPlayerVariable (double vs float); ShowBolt (Vector3 by value); ClientWorldTime (overloaded target); AIMemory hooks; RawPanel. Kept on purpose (not counted above): Rebirth-patched callees (131), vector recorders (49), replay stand-ins (CScript::RunWorldScript 004BCC60: ei_vectors' replay_script_load.cpp stands in), harness-replaced entries. Conventions from C13a1: game glue (00578xxx) functions ignore this - call world_glue.h's free functions without the dummy this / EDX; a forwarder taking uint32 float bits converts with std::bit_cast; by-value CString arguments become mfc::CString temporaries; a bare member call inside a class binds to that class's member - rename shim calls explicitly and run --golden after each shim-to-class commit. Result (C13a2, 2026-10-16): EI_ORIGINAL forwarders 1,971 -> 1,617 (check_cleanup); direct_calls --report -v: 1,620 in scope, 173 'types differ' left: family 1 (STLport per-file types, C13b) 131; family 2 (MFC) 11, all mfc.cpp CFile / CFileFind / CStringArray forwarders ei_vectors links without mfc_file / mfc_coll (kept under #else EI_VECTORS_REPLAY); family 3 31, all kept on purpose or library-shaped: hook targets (SetAnimation, Object3DAttach, DrawMesh2), function-pointer uses (DestroyPrint / DestroyPrint2, DestroyQuest / Link / Zone), template traits (ConstructGroups / ConstructMaps), ei_vectors-constrained (ShapeHandleInit, ShapeCacheGet, CacheSlot, ManagerFindObject, WorldRemoveTimed, LightningElementsDestruct, RunWorldScript, MbsInc, GameMbscmp, EhVectorConstructorIterator, ExceptionLink), short_functions (StlAllocator Init / Destroy, StreamNotify), the harness's HarnessPickSurface, and six hash400 / STLport ones for C13b (IdMapRemoveKeyOriginal, IdMapEraseOriginal, IdMapLookup, HashMapAt, TreeIncrementOriginal, ViewStackDestroyRange). mfc.cpp's CString / CFile / CFileFind / CTime / CStringArray / CArchive members now call mfc_string / mfc_file / mfc_time / mfc_coll / mfc_archive directly."
