note = "User 2026-11-04 asked whether all 216 static_casts to a pointer type (progress.py's count; list: build/ptrcasts.txt from the coordinator's scratch ptrcasts.py) are legitimate. A first pass: (1) fine: byte views of void* buffers (SDL transfer buffers, sockets, audio, CRT, movie), callback user data (SDL, sound callbacks), qsort comparators (could become std::sort with typed lambdas: sector_map SpiralCell, terrain_ambience ClassVotes), downcasts right after a class test (IsUnit then Unit*). (2) typing debt: downcasts justified only by a comment contract (item.h AsWeapon/AsArmor/AsLoot/AsQuick/AsQuest, ui_objectives children[0] as UiScrollText, ui.h's token and window casts, unit_ai FindMode(type) as PatrolMode/PlayerMode/AggressionMode, world_units' spec message kinds, mob_reader spec kinds), and void* or base-typed owner/context fields cast back (EngineObject::owner as FigureManager/TextureManager/ParticleManager/LightningManager/MapObjectManager/PlayerManager, BaseManager::context as World, companion/controller fields as Unit*/UnitServer/MapObjectServer/client specifics). Type the field or the container, give the base the virtual or the typed accessor, or keep a checked cast where the type is really dynamic. (3) wrong: file or archive bytes viewed as structs through static_cast from void* (MmpHeader in texture.cpp, texture_load.cpp, ui_item_view.cpp, render_textures.cpp; SectorHeader in ai_map_load.cpp; figure_manager.cpp's uint32_t* and const float* over file data; dib.cpp's DibHeader over raw operator new without constructing): read them through lib's byte reader / memcpy into a value. Report the count by class before and after; aim for only class (1) left, each with a one-line why where it isn't obvious. Normal C++ classes rule (memory normal-cpp-classes): no fake vtables, no forwarders added just to hide a cast. Goldens must stay the same."
