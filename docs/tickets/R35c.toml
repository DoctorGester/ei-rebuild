title = "Drawn view: no backward jerk after a slow frame, no zoom pulse on fast spins"
group = "renderer"
model = "opus"
note = "V30 review (build/reviews/v30_b.md), checked against camera.cpp. (1) SetViewProgress scales back by clamp(2 - passTicks) of the current frame, so after a 100 ms hitch back is ~0.16 and the next 8 ms frame ~0.75: the view jumps back ~0.6 of a step then forward; take the fade once per tick (NoteViewTick) or never let back grow between ticks. (2) DrawnView moves position linearly but turns rotation along the arc, so mid-step the camera is nearer the focus by d(1 - cos(theta/2)) (distance 40, 1 rad/tick: ~4.9 units pulse 18x/s; 0.43 rad: ~0.9): rebuild the position from the spread focus, heading, pitch and distance, or spread the focus offset along the arc; camera_spin should measure the distance to the focus, not only jumps. (3) g_viewStep is not reset on a zone change / load / scripted camera placement (one frame of the old step). (4) passTicks uses CameraSeconds (fixed 55 ms) while fast mode ticks every 27 ms: use elapsed / TickLength(). (5) Test gap: harness passes are 5 ticks so the spread is always 0 there; add one golden scenario with frametime 8 and a pan so the drawn view (Shown flags, visible / shadow lists, picking) is covered. Goldens of the existing set unchanged. Done (R35c branch): (1) the fade (2 - passTicks) is taken once, by the first pass after a tick, and kept for the step, so back only shrinks between ticks. (2) DrawnView turns the camera's offset from its focus back with the rotation and scales it by the step's stretch (1 - reach before / after): on the arc, not the chord; camtrace kind 'reach', camera_spin's camsame fast reach (drawn 5.96 vs camera 5.96; along the chord 144.6). Bit-exact own pose when back is 0. (3) camera::ForgetViewStep in SetFocus, SetHeading, RestoreView, SetDistancePitch, LookFrom, PlaybackStart, Init, Load. (4) passTicks = elapsed / TickLength(). (5) camera_drawn: golden scenario (vanilla + Rebirth, from the original) at frametime 8 with a pan, a turn and two clickunit clicks on a wolf. Image golden suite 121 the same + camera_drawn 2 the same; --no-hooks suite all pass. Left: following mode (flag 8, only from saves) turns about the stale focus (renderer.md 14)."
