note = "Seen twice on 2026-11-11 in main's Rebirth suite after merges (L10, L11), never in a rerun of the LIA scenarios alone: savea/visuals.sav 359 fields differ (weather cloudDriftA, visuals generator aa 1231877229 -> 3958333962), plus template moneyKey and partyManager record1 missing. Find which scenario writes savea, why its visuals (client-only random R34a?) or save timing depends on load, and make it deterministic. Repeat the full Rebirth suite several times to reproduce. Cause (H70): mod_lost_in_astral_cz_ingos timed out (both attempts) under the LIA runs' load; a timed-out run's savea is still the new game's autosave (gz31j's at the end never came), which the golden check reported as a visuals.sav difference. Fix: the scenario split in two (_cz_ingos: cz0k-cz2k; _cz_ingos_end: cz3k, cz4k, cz1j), harness movies unpaced on the virtual clock (cz4k's movie held 9 s), and the golden check names a run that did not pass first. Reproduced (LIA set: TIMEOUT twice, the same 359 visuals fields); after: 15 and 18 s there, 3 full Rebirth suites 147 the same, 0 differ."
