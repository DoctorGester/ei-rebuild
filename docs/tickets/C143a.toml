id = "C143a"
title = "Platform keys: the behaviour half of round 4's A4"
group = "cleanup"
depends = ["C143"]
note = "Left from C143, which made the keys platform::Key (values still the VK codes) as a style-only change. Each item here changes behaviour or goldens, so it needs the user's decision: (1) Drop the console's system-key release line (app.cpp OnKey: the VK number plus ReleaseData's rebuilt WM_KEYUP data, the original's debug print). That deletes ReleaseData and SystemKey's printing role and re-records the camera and ui_modifier_keys goldens (vanilla + rebirth: console.txt '121:-1069285375' / '18:-533200895'). Once it goes, Key's values need not be VK codes: only the harness recordings ('event key down 0x1b', harness_record.cpp) and tools/input_check (a comparison with Windows, which can convert) would still use them. (2) Alt+F4 / Alt+Tab out of the game's OnKey: SDL on Windows already turns Alt+F4 into a close (SDL_HINT_WINDOWS_CLOSE_ON_ALT_F4), so the backend would give CloseRequested and the game would drop its own check. Check the harness backend and the order against a key-down that reaches the interface. Also the PumpMessages quit-swallow bug from the review (app.cpp PumpMessages with platform_sdl TakeEvent). (3) The wheel's x120 (app.cpp WheelTurn) is the interface's unit: CameraInput::Wheel computes speed * float(delta) * kWheelStep and HudMap::WheelZoomFactor(delta), so notches through the interface need an exact float rewrite (or a golden re-record). Check: camera, ui_modifier_keys, the wheel scenarios' goldens. User 2026-11-04: go ahead as ordinary cleanup; drop the console's system-key release line and re-record camera and ui_modifier_keys (vanilla and Rebirth goldens)."
order = 1138
