id = "C127"
title = "Rule-9 fixes found by the round-4 style reviews (null reads, unbounded copies in combat, objects, world, app)"
group = "cleanup"
model = "opus"
note = "Style review round 4 (2026-11-04, build/style_review/round4/*.md). Rule-9 fixes the reviewers tripped over. Combat: StartLightning reads e->target->EyePoint() after CreateLightning tolerated a null target (spell_effect.cpp:219); StartHealing (:432) and StartCharm (:495) e->target unchecked; MissileImpact casts the target to Unit* without the class test two lines above (spell_effect_update.cpp:38 vs :45); RiseLight assumes a light (:123); ArmourPutOn faults on an out-of-range key (combat.cpp:789-792); ReportPath sends an uninitialised LocalMotionOrder (combat_motion.cpp:479-482); CreateSound memcpy into char[0x100] (spell_effect.cpp:664). Objects: Object3D::LoadParts uses manager before if (!manager) (map_object_figures.cpp:554-560); FigureBone::Place reads &pose->vertices with pose possibly null, and the parent branch derefs pose (figure_bones.cpp:20, 46-48); unbounded path copies into char[0x200]/[512] (figure_manager.cpp:83-87, 238-244, 305-309; link_loader.cpp:227-235); null checks after the dereference (object3d_client.cpp:200-202, link_loader.cpp:247-248); leaks: LoadLinkFile loses the new LinkMesh when the file is missing (link_loader.cpp:165-178), FindModel drops .bon/.anm when .mod is missing (figure_manager.cpp:322-325); ShadowInView adds then subtracts the position on the member sphere.center, drifting it (object3d_client.cpp:345-348; use a local). World: prototype->hair with no null test on the client (world_client_maps.cpp:479-480; the server checks, world_units.cpp:66); world_quests.cpp:241, 273 entry read before its null test; sound names memcpy'd into char name[0x100] (world_units.cpp:508, world_effect_missile.cpp:145). App: console_addon.cpp:126 Execs reads (*args)[0] with no size check; core_streams.cpp:84-87 ReadTagged size -= 8 wraps below 8 (about 4 GB allocation); settings.cpp:215, 223 %lu with uint32_t (UB on LP64; annotate ei::Log with format checking); app_frame.cpp:124-126 TypeRegistryRegister reads the prototype's vtable after guarding it for null. Check against the original first, then fix or note under 'Original bugs kept': FillCastKind gives RickMagic (fire) cast kind 1 = CastingElectricity and CurseMagic (lightning) 0 = CastingFire (combat_sight.cpp:131-132 vs combat_update.cpp:441); PumpMessages hands the Quit that TakeEvent returns to HandleWindowEvent, which ignores it (app.cpp:208-211, platform_sdl.cpp:379-389: a close during a loading screen may be lost); RestorePlayerItems treats campaign mode 4 (edge) as a network game (world_party.cpp:99). Fix each; keep only player-visible quirks; a golden that moves is re-recorded with the reason. Unit checks where practical."
