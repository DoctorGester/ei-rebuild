note = "User 2026-10-29. Run on a quiet machine (no other worker, suite or build). Profile build.cmd verify / release / debug / asan / play: wall time per step (cmake configure, compile, link, the build's checks: check_x87, check_signatures, check_stolen, gen_iat, perf_check, ui_check, the generators), compile time per file (/Bt+ or /d1reportTime, or MSBuild/ninja timings), header cost (heaviest includes per TU: windows.h, <format>, <iostream>, sokol, big game headers), PCH use, parallelism (/MP, ninja -j, link /CGTHREADS), incremental rebuild after touching one .cpp and one widely included header. Also the 8 MB ei_hook.dll (5.8 MB .text): /OPT:NOREF is from the hook era (hooks registered by unreferenced static objects, gone since S21): try /OPT:REF,ICF and check nothing reached only through static registration is dropped (goldens, harness, vectors); report the size before and after; iostream/locale machinery and other big contributors from ei_hook.map. Take the easy wins (no behaviour change, goldens unchanged), list the rest with numbers."
