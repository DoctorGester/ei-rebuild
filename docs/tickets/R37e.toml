note = "R37: shadow draws are 50-65% of all draws (town crowd: 571 world + 573 sun map + 453 point draws). Each caster draw is its own apply_bindings (2 vertex buffers, index buffer, 2 SRVs, 2 samplers) and two uniform blocks (two constant buffer updates). Submission CPU in the crowd: sun 0.32 ms, point 0.23 ms; d3d11.dll and the driver are 10% of the main thread's samples. Put the frame's per-caster data (light x model matrix, uv offset, alpha cut) into one structured buffer uploaded once and read by an instance index, bind the pool buffers once per layout and a texture only when it changes (casters sorted by texture). Expected sun + point submission 0.55 -> ~0.2 ms in the crowd. Measure again after R37a before starting. Check: render_shadows*, render_lighting frames identical."
