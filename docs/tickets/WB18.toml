note = "User 2026-11-03: regenerating the Rebuild progress board takes long though it should reuse its cache. Cause: dashboard_data.py's cache key is one hash over dashboard_data.py, check_cleanup.py, check_platform.py, progress.py and srcscan.py; any code change in one (today C71 changed check_cleanup.py, PL14 check_platform/progress) drops all ~400 history points and re-measures every sampled commit. Fix: a measured history point is kept (only new commits and the working tree are measured), and a metric whose rule changed is recomputed only for the working tree unless --no-cache asks for all (or per-metric versions if that is as simple; say which). Then retire the series that are finished and stay at 0 (the hook-era cleanup and standalone counts: offset_access, vcall, asm_blocks, float_control, x87_helpers, raw_addresses, at_views, slot_placeholders, mfc_*, stlp_*, crt_*, data_addresses, image_ties, fastcall_shims, platform_files, retired_vtables, named_ranges if obsolete) and the src/hook line count; keep lines of code by area and the live counts, and add today's goals where cheap (pc24 uses, ordered-sum helpers, UI canvas calls). Check why tests/verify counts 1.17M lines (generated data counted as code?) and fix it. Report regeneration time before/after, warm and after a tool edit."
