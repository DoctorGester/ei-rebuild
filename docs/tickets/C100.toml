note = "Style review round 2 (2026-11-04, https://claude.ai/artifact/14F6FPem4ZRbaKD4Byu3yu; user: schedule all items). Item U11. Regions and sprites take coordinates relative to their window and the panel offset is the window's origin; screen_layout::EnterLeftPanel/EnterRightPanel/LeavePanel (26 calls) and the hand-paired LeavePanel at early returns go, with the 18 addon-address comments around them. Captures of every HUD panel and window at 4:3 and widescreen, vanilla and Rebirth, the same before and after. Style only: goldens the same, float operation order untouched, no new forwarders. Done: UiWindow::originX (the window's origin, -/+EdgeShift for the 8 edge panels); the panels add it to every x they give SetRect/AddPoint/Place/Disc/SetRectangle/SetFrame/SetGrid/SetTriangle; PanelOffset/SetPanelOffset/Enter*/LeavePanel, MovedX and RightEdge/LeftEdge gone. Ring takes no origin (it never took the offset). Exactness: Place/Disc/SetGrid single adds as before; SetRectangle/SetFrame/SetGrid edges are exact integers so (l+o)+(r+o) == ((l+r)+o)+o; the movement panel's sectors (non-integer points) are shaped at x 0 then Place(originX). 108 frames (6 scenarios x 2 installs, 4:3 and 3840x2160) pixel-identical (tolerance 0) with main's build."
