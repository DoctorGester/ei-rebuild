id = "H74"
title = "Prune and tier the scenario suite: coverage per scenario, merge small ones, a smoke set"
group = "harness"
size = 3
note = "User 2026-11-11 agreed: ~310 vanilla + ~180 Rebirth runs (+ ~485 converted) is too many. 1) With the coverage build, record which functions each scenario reaches; list scenarios that reach nothing another doesn't and whose golden checks nothing unique (a digest section, a save, an outcome) as candidates to merge or drop; the list goes to the user before anything is deleted. 2) Merge scenarios that start a game to check one thing into shared longer runs where their steps fit (keep each check's assertion; goldens re-recorded by name for merged ones). 3) Tiers: a smoke set (~60, chosen for most coverage per run) for workers while iterating, the full set once per hand-back and at merge, the converted pass only when data or conversion code changed; run_all / work.py options and docs/worker-brief.md and docs/notes/harness.md updated. Report the before/after counts and coverage."
order = 1399
