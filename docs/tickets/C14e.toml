note = "User 2026-10-27: seemingly unnecessary aligned data structures. lib::AlignedArray (src/lib/containers.h) is the engine's 32-byte-aligned array with CArray growth and memcpy relocation, new slots uninitialised; replace with std::vector (or a small aligned vector only where the renderer or SIMD really needs the alignment), checking where code depends on garbage-initialised new slots, growth steps or memcpy moves of non-trivial types. Also review the 42 alignas / __declspec(align) and 22 #pragma pack uses: keep only file, save and packet layouts. Checks: verify/release, image suite goldens the same. Review: lib::AlignedArray in src 306 lines / 80 files -> 74 / 28 (225 declarations retyped to std::vector by a scratchpad script, then hand fixes). Kept for C14h: the declarations C14a's files (scene_loader, ui_item_info) reach and the figure mesh / link figure / party / unit / ui item arrays tied to them, plus the AlignedArray<T>::Allocate raw blocks. No aligned allocator: the build has no SIMD. Quirk fixes: typed CArray elements for tile lists and morph frames, construct_at in raw allocations (CUiRegion, CAnimationNode, SectorData, CCursor, part sets/groups), insert/erase at the memcpy/memmove sites, DrawStrip takes its points typed. named_data formats the 39 vector globals by the aligned arrays they replaced. pragma pack 24 -> 22 lines (PcmFormat's needless pack(2) gone; the rest are file / packet / game.exe layouts or C14a/C14b's; SectorVertex pack(1) left for C14h); alignas 41 kept (raw storage for hand lifetimes, 4-byte scratch, the 4096 image data). verify / release clean, x87 / signatures / stolen 0, image suite 121 the same."
