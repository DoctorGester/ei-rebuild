note = "Style review round 4 (2026-11-04, https://claude.ai/artifact/BzXaX58kMcB9E2dwRuhN2U, reviewer reports in build/style_review/round4/<area>.md; user: file them all). Item P5 (L; app.md A4). Give keys a platform enum across the boundary; Windows VK codes only where keyboard.ini and the options store them, converted at those readers; the WM_KEYUP lParam rebuild and the wheel's x120 go; Alt+F4/Alt+Tab decoding where it belongs. First check whether a golden reads the console's key line through g_consoleLineObserver. Plan first, then implement. Style only: goldens the same, float operation order untouched (any float rewrite exact and said why), no new forwarders, normal C++ classes; gameplay code stays (technical dead code goes). PLAN (worker, 2026-11-04). Findings: (1) two goldens read the console's system-key release line through g_consoleLineObserver: camera (vanilla+rebirth, '121:-1069285375', F10) and ui_modifier_keys (vanilla+rebirth, '18:-533200895', Alt). So the VK number and the rebuilt WM_KEYUP data stay byte-identical in a style-only change. (2) keyboard.ini stores key NAMES mapped to scan codes (g_keyNames), and the options store no key: no stored VK there. The VK numbers that are kept are the console's release line, the harness's input recordings ('event key down 0x1b ...') and tools/input_check's comparison with Windows. Inside the SDL backend the VK codes are the layout model (Windows' MapVirtualKeyEx / ToUnicodeEx; POSIX imitates them). (3) The wheel's x120 is the interface's unit: CameraInput::Wheel does speed * float(delta) * kWheelStep, so changing the unit changes float operation order. The platform already gives notches, and app.cpp converts at the game's edge. (4) Moving Alt+F4/Alt+Tab into the backend changes the event paths (SDL's Windows close-on-Alt+F4 hint, the harness backend). BOUNDED PART (this ticket, values unchanged so goldens are the same by construction): platform.h's kKey constants become 'enum class Key : std::uint8_t' with named enumerators for every key the backends make (letters, digits, F1-F12, keypad, punctuation, navigation, modifiers). The values stay Windows' virtual-key codes, said once as the console line's and the recordings' need, converted by a cast at those writers/readers. Event::key, sdl_keys (KeyCode, LayoutKey, KeyOfTyped, ControlCharacter), win32/posix keyboard, every game KeyDown/KeyUp override (UiInputSide, Interface3D, ConsoleWindow) and the harness (harness_input's duplicate VK enum, PostKey, ScanCode, TypedCharacter, recorder) take platform::Key. The local VK copies in ui_menu_keys.cpp/ui_edit_field.cpp go. The Char handlers compare characters with character constants, not key constants. The player client's 'press of no key' (-1) becomes Key::None (no handler reads either value; the compiler shows every use). LEFT FOR C143a (behaviour / user's call): drop the console's system-key release line (re-record camera + ui_modifier_keys), and with it ReleaseData and SystemKey; Alt+F4/Alt+Tab from the backend; the wheel's unit with an exact float rewrite."
