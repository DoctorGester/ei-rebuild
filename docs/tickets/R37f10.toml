files = ["src/render/render_mesh.cpp", "src/render/render_mesh_cache.cpp", "src/render/render_lighting.cpp", "src/render/render_buffers.cpp"]
note = "R37f5 (frame-plan.md, 'Measured after R37f3 and R37e4'): the renderer's side of a mesh's hand-over costs about 0.4 us: BeginMesh 0.23 ms in the save (FigureLight 0.13: the lights of each part worked out again though an object's parts share them), MeshPass 0.27 (KeepMesh 0.13 with ChangesOf's lookups in g_changes and MeshFrom's compare; ReadPassState 0.06: the device's 100-byte state read per pass though it changes a few times a frame), PlanMeshDraws 0.25 (FillRecord 0.11, BindCachedMesh 0.13 with GpuPool::Bind 0.09). Make each at least 2x faster without changing what is drawn: lights per object (keyed by the object and the frame), a state serial on the device so ReadPassState copies only after a change, the changes entry held by the kept mesh, Bind's slot found once per kept mesh a frame. Expected 0.75 -> about 0.35 ms in the save, 0.1 ms in the town's crowd (units). Later: R37f9 deletes most of this for still objects; take this one for what stays (units, moving objects) or if R37f9's design is rejected. Goldens the same."
