note = "SV10 measured: the two games of a pair never run at once (harness_pair.h: side 0's frame n+1 starts when side 1's frame n has ended), so a frame of net_pair_quest costs both games' frames: 19.3 ms median = 8-10 ms of each game's own work + 11-12 ms waiting (TIMING: pair wait), image and original alike; the pairs are the suite's longest runs (net_pair_quest bounds the suite's wall). Of a game's own frame, the drawing (app::FrameStep 00458010: the interface's Draw, EndScene, cursor, present) is 75-85%. Hand the turn on just before the frame step instead of at the after-frame peek, and wait for the next turn at the after-frame peek as now: the steps, the message pump, the worlds' updates and net::Pump stay inside the turn, so every mailbox operation and signal happens in the same order and frame as now and the goldens hold, while one game draws as the other updates. A frame then costs about max(A, B) instead of A + B: net_pair_* about 40-45% shorter (net_pair_quest ~140 s -> ~80 s at 4 games). Needs a hook point before FrameStep in the rewritten loop (app_main.cpp RunPass, ei::mainloop::g_harnessHooks) and the CALL of 00458010 in the original's WinMain redirected. Guard: a mailbox call (Bind, SendTo, RecvFrom, Close) or Signal / Signaled between the hand-off and the next turn fails the run (CInterface3D::Draw runs CloseAllPending, which can leave a game: if that ever reaches the network the guard says so). Check: the five net_pair goldens on both installs, image and --no-hooks --fresh, plain and under jitter. User 2026-10-21: do it (after SV5d5). Result (SV10a): the frame step pumps the network too (CWorldClient::Render calls net::Pump four times between its drawing stages), so the hand-off before FrameStep needed segment stamps on the datagrams (a receive takes earlier segments or its own; the frame step sends only to its own ports; other frame-step mailbox calls fail the run). Goldens unchanged. net_pair_quest median frame ~10 ms vs 18-22 ms on a quiet machine (EI_PAIR_OVERLAP=0 A/B), 76 -> 61 s in a full 16-slot suite (notes section 10)."
