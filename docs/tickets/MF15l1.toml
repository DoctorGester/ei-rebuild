note = "MF15l's proposals 3 and 4 (docs/notes/effects.md, 'The format review'), engine side, the old fields still read so the files keep loading: a field is a value or { start, tick } and tick alone also starts; spawn = one point expression (ball(), shell(), disc(), circle(...), a box by range(lo, hi) of vectors) drawn before the vars; position defaults to centre + p.spawn and moves by the velocity; velocity = { start, tick } (the tick sees p.velocity, so drag, gravity and wind are written in it); size's growth as a tick; an anchor's position. Then drop the update a dead particle still gets (particle_manager.cpp UpdateParticles releases it and still calls UpdateData once): it moves bounds, draws and writes only for kinds ended by kill or a frame mode. That one moves effects: run effect_check's coarse compare (tests/effects/coarse.txt, must pass), re-record tests/effects/reference.txt, and put before/after viewer captures of the moved effects in build/captures/mf15l/ (JPEG over ~300 KB). Goldens should stay the same (client particles are not in them). Also (from MF15l's merge): vector values made effect_check --coarse ~17% slower (1.39 s -> 1.63 s). Measure in the effect viewer on the busiest effects and get the cost back where it can (e.g. scalar fast paths, width-aware ops); report before/after."
