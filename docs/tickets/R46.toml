note = "R44 places every UI surface again after a resolution change and the interface draws immediately (texts laid out each frame at the current size and fonts: nothing to redraw). What was really wrong after a resize (captures at 1280x720 and 1000x800 of the menus, the Esc menu, the save window, the objectives, a zone tutorial, the camp's inventory and trade, the global map, a base's dialogue): the screen copies behind the windows (the Esc menu's and the main menu's greyed backdrop, a help window's) stayed the old frame stretched; a zone tutorial's pulsing frames at the battle screen's panels (the only EdgeShift outside the HUD) stayed at the old edges; the rebuilt HUD's clock and movement panel showed their state only at the battle screen's next Update (never while a window is over it, so the new backdrop showed them blank). Fixed by Interface3D::RetakeBackdrops (frame steps with the stack cut back, as PushWindow took them), HelpWindow::LayoutChanged (ShowPage again) and BattleScreen::LayoutChanged keeping the clock's blink / dial and showing the clock and movement panel at once. Check: render_resize_windows, render_resize_menus (samecapture against the window opened at the new size), render_resize_dialogue (captures)."
