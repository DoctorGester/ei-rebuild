note = "User 2026-11-06: the water's shader code now diverges so much it should be its own shader. Since R37e4b ground and water are separate draws and since R37e4c the vertex shader waves the water, so the per-draw branches (vs.water, fs.mode == kWater) only bloat one program. Split into terrain_ground.hlsl (ground lighting, ambient occlusion, weather, puddles, rain rings) and terrain_water.hlsl (waved, Water, ripples, reflections), with a shared include for the vertex layout, ground_light, shadows, clouds and fog. Drop the mode uniforms and branches that become constant. First scan every map of both installs (F:/games/EvilIslands and Evil Islands (Rebirth) Maps/*.mpr, read only): which textures the map lists as animated (MapAnimatedTexture) and whether any ground-layer tile uses one; the user thinks only water animates. If so, the animated tiles belong to the water program only (and the per-frame AnimateTiles walk can skip sectors without water tiles); if not, both keep them; report the counts. Same pictures (frames compared at tolerance 0 on the render_ terrain and water scenarios), goldens the same."
