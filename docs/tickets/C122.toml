note = "Style review round 3 (2026-11-04, https://claude.ai/artifact/KKkymAu9dSoUWGGcbsLwPa, digests in build/style_review/round3/*.md; user: file the tickets). Items A4, A5, A7. A4: OpenOutput(rate) (window, reverb, error ignored, always true; drop platform.h), delete NoteStreamTaken/Held with StreamGuard (<chrono> in 35 files), delete the test-only 8-bit stream, OpenMp3 from a vector. A5: a SoundParams struct shared by SoundSlot and DeferredSound (12 fields copied in 4 places), deferred sounds held by value, member initialisers on every sound struct, std::atomic for the thread flags (with C108), then QueueHalf copies its bytes (no three-buffer rotation, Movie::halves). A7: video MakeBlock (five block cases twice), a per-movie scratch vector, IntraBlock params, volume 0..127 (one scale instead of three), honest video::Waiting, BinkVideo::Open returns bool, bink_audio's per-frame allocation, one anonymous namespace per file. Style only: goldens the same (wire, save and file bytes unchanged), float operation order untouched, no new forwarders, normal C++ classes. From C121 (2026-11-04): an IsPlaying(handle) on SoundManager (3 files write FindPlaying || FindDeferred); Play3D callers pass 0/1 for bool loop; terrain_ambience's LoadWaveFile(name, nullptr, nullptr) probe never calls CloseFile (possible mapped-view leak, check)."
