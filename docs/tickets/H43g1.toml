note = "Found while writing the lobby, party, base screen and camp scenarios (coverage run of 2026-11-04, every function below unreached after them; read the callers before cutting). Network: the Clone methods and copy constructors of the messages (net_messages.cpp: LoginMessage, ZoneMessage, MapMessage, BindingMessage, FileRequestMessage, PlayerMessage, LineMessage, HostMessage, VariableMessage, FileMessage, TradeMessage, PartyMemberMessage, PartyMessage, PairMessage's), Connection::Clone and its copy constructor and constructor with an id (net_connection_life.cpp:47, 98), ReplicaEntry's copy constructor, Clone and OnShutdown, LoopbackLink and DriverLink's copy constructors, Clone and OnShutdown (net_link.cpp), NetLink and FileStream's constructor, Restart and Clear, Query::operator=, Message's copy constructor, TradeRecord's constructors, ServerEntry::OnShutdown, TypeRegistry::KeyOf, PushReplicated, CollectReplicated, ServerBase::Admit and SessionBase's six empty handlers (net_session.cpp:346), ClientBase::OnJoined, BufferView::ReserveRead and ReserveWrite, ReliableChunk's Sequence and Size. World: GiveBriefingRewards and CreateNamedItem (world_quests.cpp:54, 56): CompleteBriefing returns before them in any network game (the host is a client too) and a single-player game never holds a briefing record (the .mq files' records come from hosting; the quit to the menu drops the text sources, so the dialogue cannot start: tried in a scratch scenario). Interface: BriefingScreen::GameOver, ShowBriefing and SaveState (ui_briefing.cpp:144-159) and PlaceMover, StopTalking, SpeakerAnimationDone, Facing and DropMover (ui_briefing_create.cpp, _dialogue.cpp, _start.cpp), HudClock::LeftDown and LeftUp (ui_hud.cpp:387, 393). Player link handlers: PlayerClient::OnDisconnect, SendGoTo, SendFollow, TakeExit, OnObjectValues, OnWeaponRemoved; PlayerServer::Send17, SendObject0A, SendPair16, OnMessage37, OnRefreshParty, OnTakeExit, OnBriefingDone, OnGoTo, OnLeave, OnUnitLookup, OnFollow.