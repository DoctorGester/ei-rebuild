note = "Found in R16j1 (renderer.md section 13 item 10): no caster is missing; the user's 'missing' ruin and fern shadows are classic-decal effects. (1) Classic decals stack: overlapping objects each darken by half, the dirt under the fight's ruin is at 21% of its lit brightness classic and 43% with the map (kStrength 0.5, one sun). Options: a darker kStrength, or ambient-occlusion-like extra darkening where the map's blocker is close; show the user. (2) The classic direction sums the sun and the point lights in reach (0051CE60 LightDirection), so near the town's campfire shadows point away from the fire; the map has the sun only. Options: per point light a small cube or spot map for the strongest one or two lights near the camera (R16i territory), or leave. Wants the user's call; crops in build/R16j1. User 2026-10-21 on (1): 'Color-wise shadows looked about the same I think?' - keep kStrength 0.5, no extra darkening where shadows overlap. What is left is (2), point lights, which goes with R16i (GPU lighting)."
