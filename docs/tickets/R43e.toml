note = "From R43 (build/reviews/r43_sdl_gpu.md). Move every sg_* in src/render (19 files, 383 calls) onto gpu.h, along with ui_check, perf_check and tests/port/render_check (their WARP device becomes hardware D3D12, or lavapipe on Linux). Decide GpuTimer first: SDL_GPU has no timestamp queries, so the overlay's GPU line goes or becomes a whole-frame fence time. Re-baseline the image suite once. Delete graphics.h, graphics_d3d11.cpp, graphics_gl.cpp, third_party/sokol, EI_SHDC (build.cmd, play.cmd, workflows) and the GLSL. May be split by file group, with the switch in the last part.  User 2026-11-03 approved: D3D12 (FL 11_0, SM 6.0) or Vulkan is the minimum hardware; the smooth option's depth redesign is the worker's pick if it looks the same; the overlay's per-pass GPU times become one whole-frame GPU time.  User 2026-11-03 asked whether FloatingPointGuard is still needed: its 24 guards (7 render files) put MXCSR's control bits back around driver calls; no driver has been seen changing them. With the switch, delete the guards, floating_point.cpp and the platform.h class, and leave one check per frame on the main thread (verify builds: log if MXCSR's control bits changed, then restore) so a driver that does it is still caught. Split (worker 2026-11-03): sokol's Direct3D 11 / GL device and SDL_GPU's cannot share textures or buffers, so src/render cannot move file group by file group with main green between; the parts are R43e1 the switch (every sg_* and graphics:: call in src/render onto gpu.h in one commit group, with ui_check, perf_check and tests/port/render_check; graphics.h, graphics_d3d11/gl and the FloatingPointGuards deleted, one MXCSR check a frame; GpuTimer -> gpu::FrameGpuTime; the gamma ramp check on a texture of its own; composed textures from level k copied out of a full-size work texture; clouds frame R8 instead of R8UI; image suite re-baselined) and R43e2 the deletions (third_party/sokol, sokol-shdc and EI_SHDC in build.cmd / play.cmd / the workflows, the GLSL, gpu_shaders_sokol.h and shader_check's comparison with sokol-shdc, tools/gpu_spike's sokol replay and recorder hooks; notes)."
