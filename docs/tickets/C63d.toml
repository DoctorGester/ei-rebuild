note = "C63's method for net_*, player_* (net_classes.h 32, net_connection.h 6, player_messages.h 6, net_lobby 5, net_link.h 4, ...): 73 std::list uses. Message queues are often walked while they grow or erased while walked: check each. Goldens unchanged. Done: std::list in src 197 -> 152. Vectors: Connection's packet history / acknowledged (lost packets move over in one range), SentPacket::items, the reliable chunk queues (headers: the oldest rotated to the front), freedIds; ServerBase::joins; ServerSession's players, lines, files, fileRequests, bindings, queuedMaps, variables (FindVariable / FindOrAddVariable return vector iterators; new ones inserted at the front), awards, offers, trades, finishedTrades, banned; ClientBase::servers / waiting; ClientSession's players, lines, files, chunks, fileRequests, zones, variables, timers, awards, offers; DriverSession drivers / holders. Remove-by-value is std::erase_if; TimedEntry's noexcept move has a static_assert (a copy of a shared entry clones). LoopbackLink::queue a deque (MemoryStream does not move-assign). Kept lists with a comment: SessionBase::clients (OnUpdate keeps its node while a command's kick removes other connections), ClientSession::tradeRecords (a copy draws object ids). Left for C63e: player_client's std::list<Item*> for OnItemsPicked (ui.h). Goldens 122 the same / 32 without a golden (net_pair_* and net_lobby / net_second_master pass)."
