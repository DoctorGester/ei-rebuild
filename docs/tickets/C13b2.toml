note = "C13b1's leftovers (python tools/direct_calls.py --report -v --cast --loose --library after merging main; 1,426 forwarders by check_cleanup on 2026-10-20). (1) The opaque container helpers called on per-file storage (73: stlp::ListEnd / ListBegin on camera shakes, chunk_archive's saved list ..., VectorConstructBase / AllocProxyConstruct on hash buckets in base_manager / hash_tables_400 / chunk_stream / effects_weather): type the storage as stlp::list / vector / hash_map and use end() / begin() / value-initialisation. (2) The other void* objects (145 wrapper objects, 477 loose void* parameters: Str4 hashtables, list<RefPtr>, CList<void*>, CArray<Bytes<4>> ...): type the caller's storage, then rerun the tool. (3) 451 wrappers whose body is more than one member call (CountedRefList / SharedRefList Insert / Erase / Clear, PtrList RemoveAll / NewNode, ListAbi Construct ...): give the containers members, or call the wrapper statically. (4) WordArrayDestruct / ByteArrayDestruct (effects_weather, atexit_400): a destructor member on mfc::CArray that restores the instantiation's vtable. (5) 18 target not found (mfc::impl PtrList::Destruct<>, CFileFind, Plain24 / Plain16, GlobalMapPointRecords, CInterface3D::PlaySound, Commands::Subscript). Keep: WordsSetAtGrow, ViewStackDestroyRange, Rebirth-patched callees, vector recorders, replay stand-ins, harness-replaced entries. Small commits per family, --golden after each.  Result (C13b2, 2026-10-20): EI_ORIGINAL forwarders 1,426 -> 798 (check_cleanup) in 12 commits, each with --golden 0 differ; after merging main --golden (214 runs) and --no-hooks --golden --fresh (158 runs) all pass, 0 differ. CArray members and instantiation views (SetSize / SetAtGrow / Add / RemoveAt / Copy on the typed arrays; mfc::impl::ArrayAs<Abi> for policy instantiations; ScriptGroup, TrapArea / TrapPoints, AreaArray, net delta fields typed), PlainElements<CString>, AnimationSteps members, about 45 header constructors / destructors as ConstructHeader / DestructHeader / ConstructListHeader, the item screens' caches as stlp::map with a limit, help topics keyed by CStringLess, pool frees as stlp::deallocate, _Vector_base constructors as ConstructEmpty, record vectors resized through their VectorAbi (recordvec::ResizeUntyped). Fixed on the way: ui_battle_update stepped the 0x784-byte records by the wrong stride when adding to its array. See C13b3."
