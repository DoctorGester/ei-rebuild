note = "From C159 (2026-11-05): on llvmpipe a weather frame costs ~0.2 s of CPU at any resolution, so a smaller CI window won't help (render_weather_roofs ~150 s vs 180 s, render_weather ~430 s). Give the weather scenarios timeout lines that the EI_TIME_SCALE multiplies, or a separate CI job with a longer limit, then take them out of LINUX_SKIP. Confirm with a workflow_dispatch run naming them. Four render_weather* scenarios and camera_spin got timeout lines (550/200/150/650/200, x3 by EI_TIME_SCALE); the four are out of LINUX_SKIP. On the stub set they also needed rainsnow.mmp and basegipat005.mmp (KEPT, both installs). Pack 85.6 MB. Needs the repacked stub repo and a workflow_dispatch run naming the five. CI run 41994467127 (2026-11-05): all pass first try. render_weather 997 s / Rebirth 1122 s (limit 1650), render_weather_units 1638 s (limit 1950, 84%: raised to timeout 800 = 2400 s), roofs 432 s (600), camera_spin 267 s (600). render_water passed on both installs (H51d)."
