note = "Batch 1 (review): measured what still reaches a game.exe code address (docs/notes/standalone.md, Registration rules: the table). Code cells: none of the 825 left (static initialiser list 748, MFC message maps 35, CRT tables 35, ThrowInfo 7) was read at run time: retired (no image_code_cells.inc, FixCodeCells / FixUpCodePointer gone, those bytes zero; standalone_gaps lost its data kind). Registrations 809 -> 559: registration_readers now counts only run-time readers, and the harness's game.exe side, tests/vectors' recorders, named_data --check, gen_short_functions and gen_static_init's exit functions turned out to need only the function-to-original map (EI_REWRITTEN); 250 dropped. What still reads one: the generated static initialisers / exit functions 178, code literals in src/ 129, the harness's image side 5 (GameCode of FrameStep, CCamera::Update, CWorldClient::Segment, CWorldServer::Update, the cursor lock); unread but left: 210 EI_REPLACE_SHORT (C20e), 11 hand EI_REPLACE_SHORT in particle_create.cpp, 38 in the files C14a held (script_*, console_streams, mfc_string, string_map, mfc_coll). Next batches: (2, Opus) gen_static_init writes calls by name: d.Cdecl / Thiscall / AtExit of a function in the map become calls of the named function (the generator emits a declaration or include per name; anonymous-namespace functions get a name in a header), static_init.cpp's 114 calls and 225 AtExit, static_exit.cpp's 14; then --drop: about 178 go. (3, Sonnet, C20f) the 129 code literals: player_client / player_server handler tables (65), app_main's AtExit / factories / WndProc, game_folders, database_globals, renderer_sprites, the rest: take &Fn; then --drop. (4, Opus) the harness's 5 GameCode calls through hook points (ei::mainloop::g_harnessHooks) or tests/verify/image; original suite once. (5, Sonnet, C20e) gen_short_functions writes only the short functions something reads; --drop the 38 in C14a's files once it is done. (6, Opus) with no registration left: drop EI_REPLACE* and .eireg, CodeAddress's table / stubs / SetCodeTable and the image's InstallHooks, HasCode, check_thunks, check_registrations' replacement part, registration_readers, function_sizes.inc in the image, standalone_gaps (UnportedSlot reports keep their addresses as names); fold config/retired_vtables.csv (nothing in the image reads the live / retired split since the code cells went). C20g (dead functions) after 2-3.  Batch 2 (review): gen_static_init calls every port by name (d.Call(Fn, args) / d.Call(&Class::Method, object, args) / d.AtExit(Fn); static_init.h's Code::Call converts the decoded dwords to the parameters; a header declaring the name is included, else the generator declares the void __cdecl initialiser / exit function), static_exit.cpp's 14 exit functions are plain named functions (no ExitFunction switch, no exit-callee check) and its 26 registrations EI_REWRITTEN; 92 initialisers / exit functions moved out of their anonymous namespaces (same enclosing namespaces). static init readers 178 -> 29, registrations 434 (after C20f) -> 287 (121 dropped + static_exit's 26); static_init.cpp / static_exit.cpp byte-identical across the drop. Left by address: the 29 anonymous-namespace initialisers of the files C14a held (console_streams 19, mfc_string 4, mfc_coll 4, script_exec_helpers 2, string_map 1; their registrations, 40 unread ones included, untouched). check_signatures: an inline function's map copy counts for every file (its COMDAT moved CException(BOOL) to static_init.obj). Next: (2b, Sonnet) once C14a is done with those files, move the 29 out of their anonymous namespaces (the generator lists them; the mover is a small script: cut the definition, paste after the block), rerun gen_static_init, --drop the 29 + 40 unread; then Targets / ReportMissingTargets / Code's address calls can go when nothing is called by address. Batch 3 (review): the 29 anonymous-namespace initialisers moved out (console_streams 18, mfc_string 4, mfc_coll 4, script_exec_helpers 2, string_map 1; static_init.cpp / static_exit.cpp: same calls, same order, now all by name); registrations 72 -> 1 (the 29 and the ~40 unread dropped, DestroyScriptQuestName now AtExit(DestroyScriptQuestName), GameInfoRecord::Write's 0x00401000 false hit gone: cover.cpp / image_data.cpp use kGameTextBegin; only GameMain is left, read by HasCode / kGameWinMain). Nothing is called by address: gen_static_init refuses a call or atexit with no name, and Targets, ReportMissingTargets, Code's Cdecl / Stdcall / Thiscall / Import, AtExit(address), kGameAtExit are gone. Batch 6 (removing the machinery) still needs: the GameMain registration (HasCode / kGameWinMain / InstallHooks / CheckCode) turned into a plain call by name, then EI_REPLACE* and .eireg, CodeAddress's table / stubs / SetCodeTable, check_thunks, check_registrations' replacement part, registration_readers, function_sizes.inc in the image, standalone_gaps, config/retired_vtables.csv.  Batch 6 (review): no registration left. GameMain is EI_REWRITTEN and EiStandaloneMain calls app::GameMain by name after RunStartupActions (the Rebirth flags and startup actions, split out of InstallHooks); EI_REPLACE / _METHOD / _SHORT / _STANDALONE, .eireg / RegRecord, MemberAddress, CodeAddress / Code<F> / CodeLookups / HasCode / CheckCode, image_code.cpp (table, stubs, SetCodeTable), function_sizes.inc in the image, check_thunks (and its build.cmd line), registration_readers.py, standalone_gaps.py and config/standalone_unreachable.csv (reasons now comments at the MFC classes) are gone. InstallHooks is game.exe's only (EI_RECORD recorders with EI_VECTORS=1); check_stolen took over its function-start and one-per-address checks. check_registrations reads only .eiorg (8,297 EI_REWRITTEN, 0 twice). config/retired_vtables.csv folded into config/vtables.csv (class / file / note columns, 613 rows). EI_REWRITTEN (the map) stays: check_signatures, coverage, save_trace, ui_census_report, named_data, gen_static_init, gen_short_functions, progress / dashboard_data, check_cleanup, check_registrations read it; nothing at run time, in the harness or tests/vectors. Image suite --golden: 145 runs ALL PASS, 121 goldens the same. The harness key changed (src/hook, hook.h, harness.cpp, launcher): the next --no-hooks run records again. Follow-up C20i (gen_short_functions vs C20g)."
