note = "SV10 measured start-up (process start to the first frame) at 1.5-2.3 s for the image and 2.3-3.2 s for the original, about a third of the suite's game time (124 runs, median 6-7 s). Image profile of the 2.1 s: d3dcompiler compiling the renderer's shaders at every start 0.35 s (sokol's _sg_d3d11_compile_shader; compile to bytecode at build time, e.g. fxc / D3DCompile in a build step, and hand sokol the bytecode: no golden reads it, the product starts faster too), app::GetDxVersion's DirectDraw / Direct3D probing 0.45 s (the game's own check, ported; a harness answer would leave the product's code untested at start, so only with the user's word), the sound device open through AIL_waveOutOpen 0.3 s (the game's; muting it later changes nothing, not opening it changes the sounds that play and with them random draws: goldens), the exe check through imagehlp (FUN_00640060) 0.18 s. Gain of the shader part: ~0.35 s a run, ~45 s of slot time per suite. User 2026-10-21: do the faster start-up; the sound device open stays (not skipped). The GetDxVersion probe skip waits on the user (asked what it buys). SV10b done: shaders compiled at build time by fxc (src/render/shaders, render_shaders.cpp; bytecode identical to d3dcompiler's at run time but flags/checksum); the harness's FindMainThread used a machine-wide toolhelp snapshot (16,000 threads, 70-130 ms a run), now NtGetNextThread; the 9,350 hook log lines in one write; the D3D11 device made on a thread from the image's start (render::PrepareDevice). Start-up in full suites: median 3.0 -> 1.9 s, mean 2.9 -> 2.0 s. Left: GetDxVersion's probe runs through run\u000banilla's dgVoodoo DDraw.dll (0.45-1.3 s, the most of start-up now; kept, the game's code); the sound open 0.15-0.3 s (kept). The files field is off: src/render/render_*.cpp, src/render/shaders, tests/verify/harness_clock.cpp, src/hook."
