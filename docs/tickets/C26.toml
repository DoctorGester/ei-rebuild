title = "Host CRT first: try each game CRT family on the modern CRT, keep only what goldens prove differs"
group = "cleanup"
model = "opus"
note = "C26 result by family (both suites after the last merge: image 121 same / 23 without a golden, original 114 / 12).\n\nSWITCHED to the host CRT (goldens the same; port, data, registrations and review rows deleted):\n- locale: setlocale / _setmbcp / __initmbctable / _ismbcdigit / _ismbcspace (crt_locale.cpp deleted, incl. C25c's g_cLocaleName / g_localeCategories; crt_locale_data.h is accessors of the host's state).\n- atof and sscanf (crt_format.cpp's __strgtold12 / _input ports gone).\n- heap: malloc / free (realloc, calloc, _msize, _strdup had no callers). The harness's repeatable heap / jitter / fill / trace act on game.exe only now.\n- maths, part: floor, ceil, modf, fmod / _CIfmod.\n- strings and characters: strncmp, strncpy, _stricmp, _strnicmp, _memicmp, _mbscmp, _mbsicmp, _mbsinc, _ismbblead, isleadbyte, tolower, toupper, isalpha / isdigit / isspace / isprint, _mbsncmp, _mbclen, _mbslwr (thin libcrt wrappers kept for the EI_UTF8 branches and ei_vectors' record seams); memmove, memcpy, memset, strstr, wcslen, _mbschr, _mbsrchr, _mbsstr, _mbspbrk, atoi, _itoa, _splitpath called by name. EI_UTF8 start-up sets _MB_CP_SBCS.\n- exit list: atexit 006E727B / _onexit 006E71FD use _crt_atexit (converted to code at registration), exit 006E8DA7 is std::exit (image goldens the same).\n\nDIFFERED, reverted to the port (for C18r: port their game.exe reads into our CRT):\n- formatting output: sprintf 006E8715, vsprintf 006ECC47, fprintf 006EAEB0, printf 006E955F (VC6 _output, $I10_OUTPUT with the exe's power tables 0079AE60 / 0079AFC0). Host prints two exponent digits and \"inf\": crt vectors 3 of 258 vsprintf records fail (\"%g\" / \"%.6g\" of FLT_MAX \"3.40282e+38\" vs \"3.40282e+038\"; infinity \"inf\" vs \"1.#INF\"); 6 image goldens differ: combat, combat_more, sound, unit_ai_cast, unit_ai_corpse, unit_ai_heal (console line \"Unit ... attacked ... skill=3.40282e+038\" printed with e+38).\n- maths, rest: acos 006E7334 (_CIacos), asin 006E83D4 (_CIasin), pow / _CIpow 006E81C2, _hypot 006FD026 (and _ftol stays). 14 image goldens differ: #vitals of the hero (obj1000011214) in effects_bow, net_pair_quest, rebirth_fixes_ui, sound, spells_hero, ui_camp_make, ui_gallery_camp, ui_gallery_deals, units (console \"44.8744\" for golden \"44.8745\", a last-digit rounding); #unit of obj1000059184 in terrain_water_waves, ui_base_dialogue, ui_base_topic, ui_gallery_base, zone_base_bz1g. _controlfp stays the port (SV10k; host goldens were the same but its control word differs).\n- qsort 006E88FC: host qsort orders equal elements differently: image suite 16 same, 105 differ, 23 runs FAIL (e.g. app_disc_prompt save \"obj1804 controller.brain.memory.nearby.0: 1935 vs 1936\", the AI nearby list order; combat console \"sees unit\" vs \"new motivation\"; waitunit / waitfor timeouts). VC6's algorithm is already ported without game.exe reads (comparators via ei::Code), so nothing for C18r beyond keeping it.\n\nNOT SWITCHABLE (kept, no trial):\n- rand / srand 006E77F7 / 006E77EA: same LCG as the host, but the host's seed is not readable: the harness digest's \"crt.rand\" field (in every golden), randtrace (TracedRand) and the fixed ISAAC seed read / write libcrt::RandState(). No game.exe reads (thread_local seed in the image).\n- iostream (crt_iostream.cpp): the host has no VC6 <iostream.h>; the console's ostreams are the exe's layouts and vtables, and PutDouble formats through the _output port, so a host stream would print the same e+38 difference as printf."
