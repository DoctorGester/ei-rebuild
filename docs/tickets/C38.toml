note = "User 2026-10-28: a ton of one-liner getters that just repeat their name. ~370 `X() { return y; }` bodies in src: member getters (`Party() { return party_; }`) and port-era accessors returning a reference to a global (`AIEvent*& FreeEvents() { return g_freeEvents; }`). Global accessors: callers use the global directly (or a static member / function-local static where order of construction needs it), the accessor goes. Member getters with no invariant (no setter logic, nothing virtual, the field freely written elsewhere or returned by non-const reference): make the field public with the getter's name style (party, not party_) and drop the getter; keep getters that are virtual, part of an interface (render device, IDirect* wrappers), compute something, or guard a const-only view, and smart-pointer get()/operator->. Script the rename per class; spelling only, no behaviour change. Builds verify / release / debug, check_signatures 0, both suites' goldens."
