note = "C86a took the count from 154 to 96, all legitimate by C86's classes except a few to reconsider: net_messages ReadRef and party_manager's archive ObjectRef take the class the stream names without a check (a class test would catch a bad stream); the three reads the original makes unchecked (unit_ai_modes PlayerMode::UpdateCombat's commanded target as a unit, spell_effect_update MissileImpact's target as a unit, figure_part_draw's Object3D owner) could test the class once their reach is known; the lightning and particle managers' objectList walks and TextureManager::ReleaseObject read a manager's objects as its one class (a typed list on the manager would drop them). Goldens the same."
