note = "C86a took the count from 154 to 96, all legitimate by C86's classes except a few to reconsider: net_messages ReadRef and party_manager's archive ObjectRef take the class the stream names without a check (a class test would catch a bad stream); the three reads the original makes unchecked (unit_ai_modes PlayerMode::UpdateCombat's commanded target as a unit, spell_effect_update MissileImpact's target as a unit, figure_part_draw's Object3D owner) could test the class once their reach is known; the lightning and particle managers' objectList walks and TextureManager::ReleaseObject read a manager's objects as its one class (a typed list on the manager would drop them). Goldens the same. Part 3 done: net_messages TakeObject tests the wire message type, party_manager ObjectRefFields tests ArchiveType (kArchiveClass on ClassTemplate / PartyRecord), PlayerMode::UpdateCombat takes the commanded target through UnitOrNull (CommandAttack already did; MissileImpact already did). figure_part_draw's owner is always an Object3D by reach (DrawFigureLit has one caller, the scene's parts), commented. The lightning / particle walks and TextureManager::ReleaseObject stay downcasts by the manager's one class (commented); a typed list on BaseManager would be a structure change."
