id = "R37f6"
title = "PrepareShadows' per-frame walks deleted: one landscape matrix per frame matrix, casters by frame stamp, roofs and point casters only where they can matter"
group = "renderer"
size = 1
model = "opus"
files = ["src/render/render_shadows.cpp", "src/render/render_point_shadows.cpp", "src/render/render_weather.cpp", "src/render/render_internal.h"]
note = "R37f5 (frame-plan.md, 'Measured after R37f3 and R37e4'): PrepareShadows is 0.37-0.40 ms of the save's 4.0 ms main thread (release terms) and AddDrawnCasters 0.09 more; each walks every world mesh again. Delete: (1) the camera-inverse products (CameraInverse::Under, 0.13 ms in all) are made twice for the same matrices, by PrepareUnitWeather's g_models and ListCasters' ps.models (the same view->inverse, the same inputs): make them once per frame matrix and share them; (2) ShadowFrame::casters (an unordered_map rebuilt every frame, found per batch in AddDrawnCasters and CasterStrength, iterated into ListCasters' g_objectIndex, another map) becomes a per-object frame stamp and strength with an insertion-ordered list beside it; the point shadows' faces list their casters in that list's order, so their caster lists and redraws stay the same (check: the depth maps are order-independent, but Unchanged compares lists); (3) CollectUnitsAndRoofs places 8 corners of every caster mesh's box (ExtendPlaced, 0.12 ms) though only roofs over a unit are ever tested (Shelter) and the roof map wants them only while the weather shows: take a mesh's box only when its sphere (centre and radius) can cover a unit's points, all of them while the roof map is made; (4) ListCasters (0.16 ms) takes every caster mesh's sphere though MapLights keeps only those within a candidate light's reach: test the batch's placed centre against the candidates' spheres first. BoxSphere and ExtendPlaced by centre and |M| times the half extents where their result only gates an exact test. Expected: PrepareShadows 0.40 -> about 0.12 ms, AddDrawnCasters 0.09 -> 0.05. No golden change; frames the same at tolerance 0 (render_ shadow scenarios, the town at night with point shadows). Measure with build/r37f5's kit (probe patch, scenarios, sampler)."
order = 1288
