note = "User 2026-10-22, playing play.cmd (Rebirth data, Rebirth profile with WideScreen=1, the starter's WideScreen 1, 2703x1777 window, UTF-8 build): the dialogue window shows an outer frame and an inner frame offset from it (inner starts further right and lower), text drawn from the outer one. Likely WideScreen (Rebirth's patch folded in, or ui_widescreen) moving or scaling one of the dialogue's panels twice or not at all. Reproduce in a harness scenario (dialogue on the Rebirth install with widescreen), compare with addon's drawing (run_all --widescreen) and fix. Cause: CBriefingScreen::Update (00604130) showed every mesh in the phrases / rewards states; the original shows meshes 2 onwards, so the topics' frame (mesh 1, 195..605 x 425..575) was drawn inside the text's frame. Not WideScreen: every resolution and canvas (main's ui_gallery_base base_phrase showed it at 16:9 without the flag). Fixed in ui_briefing_create.cpp; ui_widescreen_dialogue compares the phrase with addon's recorded frame (fixed: 0 px differ; unfixed: fails), Rebirth golden."
