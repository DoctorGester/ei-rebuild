note = "User 2026-11-03 pointed at the Linux CI's warnings. A WSL build of main b496c9a60 (gcc 13, RelWithDebInfo, plain and -DEI_HARNESS=ON; list in build/linux_warn_{plain,harness}.txt) has 15 distinct: (1) -Winvalid-offsetof x11: memset/memcpy/memmove over member ranges by offsetof in TransformObject::CopyTransform (core_transform.cpp:15), VisibilityFog() (effects_weather.cpp:205), Light() (light.cpp:40), net::Connection copy (net_connection_life.cpp:112,114), ParticleSource() (particle_create.cpp:775). These are layout tricks the normal-classes rule forbids: give the members default initialisers (or a defaulted copy / plain member assignments) and delete the memsets; for CopyTransform copy the members it covers by name. Check each covered range's members against the class to keep exactly the same set (watch for members between the two offsets that hold something non-zero after construction). (2) -Wformat-truncation: harness.cpp:2551 and 2584 (char path[kPath] by snprintf with g_savesDir) to std::string paths; app.cpp:293 report[1024] with CodeReportFormat() (make the buffer a std::string or size it to fit). (3) -Wstringop-overread from vector<AnimationStep> copy/erase at combat_update.cpp:393 (gcc 13 false positive inlined through std::move; restructure the copy if it is cheap, else a scoped pragma with a one-line reason). Then add -Werror (or CMAKE_COMPILE_WARNING_AS_ERROR on the Linux job only) so new warnings fail the Linux CI; MSVC warnings out of scope. Goldens the same (main_suites), five Windows builds and the WSL build both clean. Also (user 2026-11-03): remove Ftol (world_client_maps.cpp:146, its 4 calls at 546-549 become plain casts to int, same truncation; fix the harness.cpp:435 comment's Ftol mention)."
