note = "User 2026-10-30 asked why unnamed pointer cells remain (dashboard 801). They are the dwords of game.exe's .rdata / .data copy (image_data.cpp's block, zero but the cells) that point into the block and get the shift at the move. By group (src/standalone/image_cells.inc): RTTI and C++ EH of the original's classes and libraries ~470 (base class arrays 128, locators / descriptors 117+53+53+53, type_info vtables 74 already marked retired, catchable types 41+12+10), the old CRT's locale / time / error / heap / lock tables ~240 (several marked unread: setlocale and the ctype classes are the host CRT's since C26), MFC's message / dispatch maps and CString's empty string ~15. None should have a reader now (0 MFC, own CRT, compiler-made vtables since C19, CxxThrowException uses the host's own ThrowInfo). Prove each group unread (no reference from src/ or tests/, gen_image_cells' UNREAD, a zero-filled trial as C25a did), drop it from gen_image_cells, and when the cells reach 0 and the import slots go (H33f), delete the block itself: image_data.cpp, image_data_bytes.inc, the section bounds in game_data.h, g_dataShift / GameAddress's range. Goldens are the check; do the CRT / MFC groups first, RTTI / EH last. C20t 2026-10-30: cells 801 -> 0. The proof covers all groups at once: src/ names no address of the moved range except its bounds and the import table, and in tests/verify only harness_heap's _crtheap (0x007CAF08, in the zero tail) is read in the image; everything else there is OriginalGameData, which runs in game.exe only. Our throws and classes carry the compiler's EH/RTTI, so no throw resolves to game.exe's ThrowInfo. Commits: CRT+MFC (260 cells) to UNREAD; then RTTI (404+74) and EH (63) together with removing the machinery (image_cells.inc, --bytes and its CMake command, image_data_bytes.inc, the fix-up loop; gen_image_cells.py's scan; the retired-vtables check moved to tools/retired_vtables.py, the PE mapper to exe_path.image). Still in place: the storage, g_dataShift, GameAddress's range, OnOldData and game_data.h's bounds, because the import slots (kImportsBegin, Imports()) sit at the start of the range until H33f. Goldens: 122 same / 32 without; rebirth 24 / 8."
