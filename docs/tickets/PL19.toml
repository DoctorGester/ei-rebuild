note = "User 2026-11-03. Waits on the SDL_GPU port (macOS has only OpenGL 4.1; R43's plan gives the port tickets, add them here as depends). A universal (arm64 + x86_64) ei-rebuild.app with the game folder from a picker or EI_GAME_ROOT (an .app can't sit inside the game folder), built on a macos-14 runner in release.yml's matrix, zipped or in a .dmg. Unsigned at first (players right-click Open or clear the quarantine flag); signing and notarisation need an Apple Developer account, the user's call.  2026-11-03: macos-port already runs on sokol's Metal backend, so the Mac release need not wait for SDL_GPU: after MAC4 it can ship on sokol Metal, and R43h later swaps the backend. 2026-11-04: ready. MAC4 + R43h (SDL_GPU Metal) and the user's macos-fixes (Metal upload strides, harness on macOS, full screen as a Space; the vanilla suite on an M4 Pro 144 the same) are on main; release.yml already builds and publishes Windows and Linux, so this adds the macOS job beside them (macos-14 or newer arm64 runner; DXC from the Vulkan SDK per docs/notes/macos.md, cached; universal arm64 + x86_64 if the toolchain allows, else arm64 and say so), ctest's port checks on the runner, the zipped unsigned .app in the same release. Signing / notarisation stays the user's call."
