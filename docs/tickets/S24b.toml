title = "Settings file: never overwrite on a read failure; unwritable folder; paths; resolution"
group = "standalone"
model = "opus"
note = "V30 review (build/reviews/v30_a.md 3-6). (1) settings_file.cpp Load writes the defaults over the file on any read failure (sharing violation: ReadWhole opens FILE_SHARE_READ only; cloud placeholder; read error; >=16 MB): write defaults only on ERROR_FILE_NOT_FOUND / ERROR_PATH_NOT_FOUND, otherwise run with defaults in memory and never write that session (say so in the log). (2) An unwritable exe folder (drop-in exe under Program Files) rewrites defaults every start and loses option changes: fall back to %LOCALAPPDATA%/EvilIslands/ei_settings.ini (read there first when the exe folder has none) or decide otherwise, and say which. (3) Defaults lack Work path / CD-ROM Path, so the game relies on the working directory being the data folder: the drop-in exe should use its own folder (S23), not the working directory. (4) The default resolution from GetSystemMetrics at first read: guard 0x0 (no desktop) and keep it after SetProcessDPIAware. Goldens unchanged. Outcome: (1) Load writes the defaults only on ERROR_FILE_NOT_FOUND / ERROR_PATH_NOT_FOUND; any other read failure (sharing violation, access denied, read error, 16 MB or more) logs 'cannot be read ... left as it is', runs on the defaults in memory and writes nothing that session (Flush skips); the read now shares read/write/delete, so an editor holding the file open no longer blocks it. (2) Chosen: exe folder first, then %LOCALAPPDATA%\\EvilIslands\\ei_settings.ini (read there when the exe folder has none; a missing file is written to the first place that takes it, the per-user folder made); nothing writable: in-memory defaults, logged. (3) host.cpp makes the exe's folder the working directory before ei_hook.dll loads when EI_GAME_ROOT is unset (ei_launch already starts the host in its data folder): Work path / CD-ROM Path .\\, res, saves and the image's DLL imports are the exe folder's from any working directory; no absolute paths in the defaults (a moved folder keeps working). (4) The default size is the primary monitor's mode (EnumDisplaySettings: physical pixels whatever the DPI awareness, so reader order no longer matters); 0x0 gives 1024x768 defaults in memory, not written; SetDesktopSize needs both sides. Hand tests (release, a copy of the vanilla data, started from C:\\ without EI_GAME_ROOT): missing file written at 3840x2160 and the game rendered; file held open for writing read and left unchanged; file locked (error 32) left byte-identical; folder denied write: per-user file written, read on the second start. settings_defaults / settings_save PASS; goldens untouched."
