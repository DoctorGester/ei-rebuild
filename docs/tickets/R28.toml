note = "User 2026-10-28: composing on the CPU is unnecessary. Today the game builds textures on the CPU in 16-bit and the renderer converts them at upload: unit skins composed from body/armour/weapon part textures (unit_skins.cpp, unit_client_models.cpp Compose 0x5551, texture_compose.cpp DrawLayers through 2DintMMX), wound overlays painted into a unit texture (unit_client_wounds.cpp, 4:4:4:4), the item preview packed by hand (ui_item_view.cpp), the 256x192 menu backdrop copy (ui_interface_input.cpp Rgb565Copy), global-map weather / clouds, blank targets (texture_blank.cpp). Do these on the GPU instead: skins as layered draws or a render-to-texture of the part textures, wounds as an overlay texture blended in the mesh pass, the item preview rendered to a texture, the backdrop as a copy of the frame target, clouds in a shader. Delete the CPU composition, the 16-bit conversions, texture_blank and 2DintMMX use that become dead (check whether 2DintMMX is needed at all afterwards: DXT decode may be the last use). The save screenshot stays 5:6:5 in shot.sav (read back from the frame). .mmp files on disk keep their formats. Renderer upgrades replace the old look (no switch). Goldens hold no frames: check visually with frame captures before/after. Overlaps P7 (CPU-written textures and clouds on the GPU): take P7 in or mark it done here. User 2026-10-28: runs now, in parallel with C45 and before C46/C47 (it deletes code they would otherwise clean)."
