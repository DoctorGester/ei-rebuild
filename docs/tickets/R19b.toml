note = "User 2026-11-04: the character figure in the top-left interface preview (UiModel, ui_model.cpp; hero screen and others drawing a kPreviewId Object3D at the interface clock) is yanked toward the top right each time its animation changes, since R19's blending (FigureAnimationState::BeginBlend, FigureBone::Place's root Lerp(fromPosition, at, blend)). Already ruled out by reading: Slerp takes the short arc; SetOffsets copies offsets untransformed. Suspects: the root's fromPosition/shownPosition or placedAt stale or in another space for preview objects (PlaceRoot sets placedAt only when it places; UiModel::Draw advances at InterfaceClock while blends use platform::FrameClock); a preview Load/RestartPose leaving shown bones from another figure; the preview's AnimationFactor/origin differing between the two poses. Reproduce with a scenario that opens the hero screen and switches the preview's animation, capture frames during the blend, fix, and add a frame check. World units must keep blending as now."
