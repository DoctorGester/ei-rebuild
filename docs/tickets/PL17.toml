note = "User 2026-11-03, WSLg (Mesa llvmpipe; /dev/dxg and d3d12_dri.so are there, so also try GALLIUM_DRIVER=d3d12): (1) resizing the window shows the newest frame at the bottom with its bottom cut off and older frames 'repeated' above it (screenshot in the thread). The frame sizes in ei-rebuild.log follow the window correctly (1910xN), so suspect the GL present: EndDrawable blits our framebuffer to the default one without clearing it, and the default framebuffer's size can differ from SDL_GetWindowSizeInPixels for a while (Xwayland); also check the viewport/scissor y origin under glClipControl(UPPER_LEFT) when the frame's target is larger than the frame. Clear framebuffer 0 every present, take its real size, and read back the window to prove it. (2) Audio stops completely soon after start (device 'RDP Sink through pulseaudio', no audio error in the log). Check whether it happens on main before PL15 (PL15 moved the stream thread to std::thread), whether slow llvmpipe frames starve the stream, and SDL's audio stream callbacks; log underruns. Test in WSL: build with the Linux cmake build, play with EI_GAME_ROOT=~/ei-game (a copy, never /mnt/f); a window at most 60 s.  User: not only stale bands, the whole image is offset down (bottom cut off). Fits a default framebuffer taller than the size we blit to: glBlitNamedFramebuffer's destination is counted from the bottom-left of framebuffer 0, so when GL's surface is taller than SDL_GetWindowSizeInPixels (Xwayland/EGL surface lagging or including something), the frame lands low and its bottom falls outside the visible window. Find the real default framebuffer size (e.g. a glGetIntegerv(GL_VIEWPORT) right after MakeCurrent on a fresh resize, or EGL's surface query) or recreate/resync the surface on SDL_EVENT_WINDOW_PIXEL_SIZE_CHANGED.  Audio moved to PL17a (after H47, user); PL17 is the resize only."
