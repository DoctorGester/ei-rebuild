note = "Style re-check of round-1 areas against the later rules (2026-11-05, digest build/style_review/round1b/items.md). Items I1, I2 (Y4, Z7, X5, Z5). Item's and ItemWeapon's constructors (item.cpp:45, :203) become default initialisers (-1.0f, count 1); ItemRecordHead::buildable is initialised to 1 instead of by the constructor; the five empty record constructors and the comment that they leave fields unset (item_db.h:217) go, absorbFirst and recordType get initialisers; ItemLink's out-of-line default constructor goes; ~Item stops calling Destroy (the Ref members release themselves; check the release order cannot be seen: ItemLink's and ItemTurn's OnShutdown are empty), and those two empty OnShutdown overrides go with their stale comments. Records: WeaponRecord's field 0x1C is read into a local 8-byte array (skillBonus copied out, the rest to unreadFields; unused_7D gone) instead of 8 bytes across two members; ArmorRecord gets a float firstFactor and AbsorbRowField takes float& without void* or memcpy (check GetCategory's callers, e.g. text_manager.cpp:125, before category stops holding the factor's bits: real factors never have the bits 2, 5 or 8; if in doubt keep writing them there too); AttachSpell's bit_cast<float> of a float goes (exact); ItemArmor's Load / Save use ReadValue / WriteValue of the arrays; ItemLoot::Load reads the enums directly as Save writes them; the float-array memcpys become array assignments (std::array members), while IsSameAs keeps its bitwise memcmp. Style only: goldens the same (wire, save and file bytes unchanged), float operation order untouched, no new forwarders, normal C++ classes."
