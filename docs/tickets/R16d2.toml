note = "docs/notes/renderer.md section 13 item 4. R16d streams interface sprites (CUiMesh::Draw 005E6D90, render::SetInterfaceDraw): the interface rewrites their quads and texels in place without RefreshBuffers (bars: ui_hud_panels.cpp, ui_hud_portraits.cpp; the minimap's markers and area: ui_hud_map.cpp; ui_hud_slide.cpp's markers; the original's and Rebirth's shape code). The global map uploads 106 + 75 KB of sprites a frame, the HUD a few KB. Signal each writer (render::MeshChanged Positions on the sprite) or keep a sprite's corners and compare its few source corners per draw, then drop SetInterfaceDraw. Check: meshcache check 0 stale in the ui_* and render_* scenarios; render_stats' map upload; frames with meshcache on / off at 8 / 0.1%. Measured, not built (2026-10-21): streamed sprites per frame (render_stats, vanilla 4K, temporary counter around their build): zone1 HUD 54 draws 17.9 + 6.1 KB 0.010 ms, fight 52 draws 18.6 + 6.1 KB 0.016 ms, camp 78 draws 30.5 + 14.5 KB 0.042 ms, global map 23 draws 105.8 + 74.9 KB 0.08-0.10 ms (+ about 0.02 ms ring copy), town and escape menu none. Keeping them still needs a per-draw read of the source corners: gain a part of 0.03-0.12 ms, nothing on the GPU, uploads small. SetInterfaceDraw stays (renderer.md section 13 item 4)."
