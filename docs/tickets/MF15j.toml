note = "From MF15c (docs/notes/effects.md, 'The original state machines on inputs'): ground(x, y) in expressions (anchors on the ground, kill planes); an action that adds an anchor (CastSwirl orbiters); anchor pick 'first' and an anchor by index (Casting's close sparks); scorch and shake actions (FireBlast, LightningBlast starts, EffectParticle::Spawn today); a list input (ShapeChange's path); an emission or sub-effect on a particle's death; a segment spawn shape (Link); inputs the server sets and replicates (today only the client's sources take SetInput / Fire). Also: RunParticleRecordChecks in the POSIX port check. Needed before MF15g's state-machine half. Landed (788e147bd): before_emit reactions, add_anchor, anchor spawn shapes (a.spawn.*), ground(x, y), list inputs, pick first, segment shape, on_death; RunParticleRecordChecks in the POSIX port check; proven by unit checks and by Shower1-4 (MF15g3b). Left: scorch / shake actions (MF15j1), server-set replicated inputs (MF15j2)."
