note = "From MF15c (docs/notes/effects.md, 'The original state machines on inputs'): ground(x, y) in expressions (anchors on the ground, kill planes); an action that adds an anchor (CastSwirl orbiters); anchor pick 'first' and an anchor by index (Casting's close sparks); scorch and shake actions (FireBlast, LightningBlast starts, EffectParticle::Spawn today); a list input (ShapeChange's path); an emission or sub-effect on a particle's death; a segment spawn shape (Link); inputs the server sets and replicates (today only the client's sources take SetInput / Fire). Also: RunParticleRecordChecks in the POSIX port check. Needed before MF15g's state-machine half."
