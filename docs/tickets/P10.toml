note = "User 2026-11-04: the pictures saved with a game (shot.sav, 256x192, RGB 5:6:5) are laughably small. Write the picture at the size the save / load window shows it on this screen (256x192 of the 800x600 layout scaled by height43 / 600, so about 920x690 at 4K; or a fixed larger size such as 1024x768, say which), 8 bits a channel, compressed (PNG or QOI through a small built-in codec, no new library unless it is tiny), as a new file beside shot.sav (e.g. shot.png). Loading prefers the new file and falls back to shot.sav, so original saves keep their pictures; decide whether we still write shot.sav (only the original exe reads it; say if anyone needs that). The window draws the picture at the window's size with filtering. The frame copy comes from the frame itself (P9 removes the UI readbacks: take the picture from the back buffer before the interface is drawn, or as P9 leaves CaptureScreen). Drop Rgb565Copy and ui_rgb565.hlsl if nothing else needs them. Check: save and load in a 4K window and at 800x600, captures of the load window, the harness's save digests unchanged apart from the new file (golden.py may need to ignore or hash it), an original save still shows its picture. User 2026-11-04: append it to shot.sav instead of a new file. shot.sav stays a plain 0x18000-byte 256x192 5:6:5 picture first (the original reads exactly those bytes and ignores the rest, as our loader does today); after it a small trailer: a magic, a version, width, height, the compressed full-colour picture's length and bytes. Our loader reads the trailer when the file is longer and its magic matches, else the 5:6:5 part. One file, original saves and the original exe both still work."
