note = "R37e10 (frame-plan.md, Ground GPU cost): the opaque models are drawn after the ground and hide some of it, and the ground's pages are in no depth order (the save shades 10.05 M ground pixels for 8.16 M shown, 1.23; the town 1.06). Drawing the ground after the opaque models (what precedes the first terrain draw, the sky, stays first) took 0.29 ms off the save's world pass at 4K msaa 8 (2.23 to 1.94, four pairs), nothing in the town; sorting the ground's piece runs nearest first should take up to 0.15 more. Risk: the ground is drawn blended (SRCALPHA / INVSRCALPHA, alpha from the page texture): check its alpha is 1 everywhere (blending off measured free) or keep the order where it is not; goldens hold no frames, frame captures may differ. Measure with the R37e10 kit (build/r37e10 in the main checkout)."
