note = "H43a/H43b found (python tools/coverage.py run, then reading the callers) code no play reaches, cut from the original: TryTame, UndoTaming, UndoIfTamedBy (combat_taming.cpp: UseSkill returns for skill 2 before its switch; WorldServer::CastSpell refuses charm), OrderTame (the interface sends use kinds 0 and 1 only), StartCharm, StartLink, StartPossession and the Link and Possession updates (spell_effect*.cpp: CastSpell returns for those three types; only a saved projectile of one would start them), the UseItem order (no setter: OrderPlan::TakeSteps, CanStillDo, the UseItem cases of FinishAction and the tick), TellParty(OutOfReach) and AIBrain::IsNearPath. The user decided 2026-11-03 that taming stays cut; decide per item: delete with their comments and table rows (a saved game with such a projectile would then need a refusal at load), or keep as documented. Check: build checks, image and Rebirth suites with every golden the same. H43c1/H43e1 (2026-11-04): AIBrain::IsNearPath is reachable, not dead: unit_ai_healer reaches it with a crafted mob (no unit of the shipped zones has a heal or protection spell with a non-text-key id, so it runs on no shipped data; a mod map's healer reaches it): keep it, drop it from this list. Also without any caller: TrapObject (the factory's Make<TrapObject>(Trap), but no mob record kind makes one), mapspec::UnitSpec::Apply (Spec::Remove / Refresh / Apply have no caller outside map_spec*.cpp; the Save writers went in H43c2). H43g2 (2026-11-04): ServerSession::RemoveVariable and GSDelVar's multiplayer branch are unreachable by play too (the only live GSDelVar calls, zone13.mob and zone2.mob, sit behind single-player story variables). User 2026-11-04: keep gameplay code that could be re-enabled (charm, link, possession effects, taming, the use-item order, TrapObject, RemoveVariable / GSDelVar's multiplayer branch, GiveBriefingRewards): keep it and document it as unreached; delete pure tech code (UnitSpec::Apply and the other Spec Remove / Refresh / Apply with no caller)."
