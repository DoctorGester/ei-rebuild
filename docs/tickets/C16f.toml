note = "docs/notes/cleanup-tooling.md 'NaN audit (C16c)' and its C16e item. C16e converted the named helpers; left are the inline NaN-keeping forms of the earlier port: about 380 lines with a negated comparison (!(a >= b), !(x > y): ai_footprint, ai_map, ai_motion, camera, camera_motion, lightning*, figure_mesh, ui_item_strip, ...; some are integer tests and stay) and about 35 equal-or-NaN tests written !(a < b) && !(a > b) or !(a < 0 || a > 0) (effects_weather, exit_area, lightning_draw, model_db, party_members, ui_camp, unit_vitals, world_game, ...), plus the shadow / decal helpers C16e left for R16e1 (device_shadow OneOrNaN, terrain_shadow AtMostZero, terrain_decal Lower / Raised). Same rule (rewrite guide 8): plain comparison with EI_NAN_AUDIT where the NaN result changes, the exact plain form (a >= b ? x : y) where it reads as naturally, loops must end on a NaN. Goldens --golden 0 differ, no 'NaN audit' line in the runs' logs. Opus; split by area if large."
