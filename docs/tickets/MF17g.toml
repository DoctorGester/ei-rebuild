note = "User 2026-11-11: the game's original content should use the functionality we expose to modders: more reuse, less duplication. After MF17b-d, move vanilla spells family by family onto the scripted runtime and bindings (shipped as readable Res\\spells\\ scripts or record fields), behaviour-exact (vanilla and Rebirth goldens the same, short eq checks), and delete the Spell::Type() switches and tables they replace. Split into batches if large. MF17a (2026-11-11): vanilla rows differ from 'offensive covers all' for Lichdom/Charm (offensive, victim not turned) and Rick/curses (not fighting); add turns_victim and fighting fields when porting. MF17c (2026-11-11): the bindings sit on SpellEffect's NewArrow / NewParticle / NewLightning + LightningEnd / NewPointLight / BuffRecord / MoveUnit / TypedHit, which the C++ Start*/Update* already call; Missile takes no speed (EffectArrow's fixed 0.67 a tick); FindUnits has no filter for CastSpell's several-target choice (party / AI visible list / diplomacy): add one when porting the t-rune casts; Has/Remove go by record place, the AI's has-it test by behaviour."
