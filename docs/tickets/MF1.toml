note = "Lookup order: <mod>\\Res\\<archive>\\, the mod's [RES] archives, Res\\<archive>\\, Res\\<archive>.res. One file source behind MappedResource::GetFile / ListFiles on the layered path map (src/platform/path_layers.h, src/game/mods/mod_folders.cpp). Case-free names indexed once at mount, sub-folders allowed (archive names have none), ListFiles merges loose and archive names. An unpack tool that unpacks every archive of an install into these folders, and a harness option that runs the suites on an unpacked install (every golden the same). Plan: the Claude Doc 'Evil Islands modding: loose files and common formats' (https://claude.ai/artifact/9VTQFTF9FwND5RLtdnVJVQ), user 2026-11-09. Original archives keep loading; a new format is a second loader that builds the same in-memory structure; the export tool (ei-convert) writes it from the game's own loaders; a round-trip unit check per format and the converted-install suite option keep every golden the same. Our exe only: no writers back to bespoke formats. New third_party code vendored unmodified at a pinned commit, and only after the user's OK to download."
order = 1301
