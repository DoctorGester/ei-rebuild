id = "R17a4"
title = "Water: the lake views' water costs 1.2 ms at 4K msaa 8"
group = "renderer"
depends = ["R17a3"]
note = "Found in R17a3 (renderer.md, 'shaders/terrain.hlsl: the water', the cost paragraph): at 3840x2009 msaa 8 the lake views render_water's steps reach (water_lake, water_lake_night) spend about 1.2 ms on the water's draws even without the reflected rays (sceneOn 0), against 0.16-0.3 ms for the shore, sea and river views. Find why (overdraw of the lake's pages or layers, blending into 8 samples over a screen of water, the shader's cost per pixel) with the fence-probe kit in build/R17a3 of the main checkout; make it cheaper without changing the look. R17a4 result: the lake views' water covers 81-86% of the 3840x2009 frame (others 13-28%); per frame of water the cost is the same (1.2-1.5 ms). Not the shading (flat fragment the same). The per-sample writes are, mostly the msaa R32F depth copy every depth-writing world draw writes: no pipeline writing it saves 0.55-1.2 ms a frame in all six views and leaves the lakes' water at 0.25 ms. Not water-local, so no code change here: R17a4a."
