id = "MF17h2"
title = "Active effects' looks and sounds from the effect's script or record; client switches gone"
group = "mods"
size = 2
note = "After MF17h1 (Lua-first, user 2026-11-11). The client picks an active effect's particle look and start / loop / end sounds by SpellType (map_object_client_effects.cpp) and Silence mutes the unit (unit_client_effects.cpp). Move them onto the effect kind (a look field naming a data effect, sound paths, or OnLook in its script), so a mod's new buff has its own look; the switches go. Ties to MF15h (records name their effects). Captures before / after the same. MF17h1 left on SpellType for this ticket: Unit::CanCastSpell's feeblemind test (client side: the battle interface's spell cursor and caster choice; the client has the effects' kinds, not their values or the server's Lua, so its EffectTotals are none). A client-side fact per kind (a look, a sound, no casting) needs a way to reach the client: the record's fields or an OnLook hook evaluated where the client can run it."
order = 1389
