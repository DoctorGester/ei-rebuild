note = "Seen 2026-11-04 after the PL16 merge: in the full image suite world_client-standalone passed (RESULT: PASS) but wrote no digest.txt and no harness saves, so the golden compare counted it as differing; 5 reruns by name were all the same. Find why the run ends without writing them (exit path, a timing race with the new event queue, or the harness's save step) and make it deterministic. Goldens the same. Cause (2026-11-05): a batch started later for the same scenario in the same build (a rerun by name, a second suite) emptied the run folder (run_all.empty_folder) after the first batch's last game and before its --golden comparison read it; shown with a suite of world_client + zone_gz15h_tornado_client and a rerun by name (PASS, then GOLDENS DIFFER: the run has none). Fix: work_sched.reserved_folders, a batch's run folders belong to it until its work.py test ends. Not reproducible by games alone (40 sequential reruns, two 16-game suites)."
