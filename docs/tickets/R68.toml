note = "User 2026-11-09: too many point lights on screen and some go dark. Caps today: the ground takes the 16 lights nearest the camera (kMostSceneLights), each object part the 8 nearest its origin (kMostMeshLights, FigureLight's sort), 4 point shadows (kMostPointShadows). Plan (user agreed): every visible light into one GPU storage buffer each frame; the CPU bins them into a 2D grid over the landscape (cells about 8-16 m, over the view's ground footprint plus reach); ground and mesh shaders look up the pixel's cell and loop over its lights only. Objects take their lights from the grid in the shader too, so Object3DClientSpecific::DrawParts' walk over every light (InReach) and FigureLight's per-part sort and MeshLight::points go. No cap on lights per scene; a per-cell cap only as a safety bound, large enough never to bite in real scenes. Point shadows stay 4: choose them by on-screen weight (brightness x view coverage) and fade a shadow in/out over a few frames instead of popping. Must work on every SDL_GPU backend (D3D12, Vulkan, Metal). Net lines should go down or stay level; report added and removed. Frames differ where lights used to drop (captures page: a crowded night town before/after); goldens the same. Measure main thread and GPU frame time before (main's latest numbers) and after at Msaa 1, Anisotropy 1; the GPU cost should not grow in normal scenes."
