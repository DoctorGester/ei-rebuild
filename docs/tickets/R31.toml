note = "After R30f the GPU draws and clips everything; 3DfpFPU.dll (CTransformPipeline::transform_, model.h ITransformPipeline) is left projecting vertices: ProjectClipped (mesh bounds for the hand-over and the flag-1 picking rectangle, device_draw.cpp), ProjectTerrain / ProjectTerrainClipped (terrain before hand-over), ProjectFlat (shadows), Project / TransformPoints (particles, weather, lightning, lines), FitBounds (figure load), SetProjection. Replace each with plain C++ on the pipeline's matrices (ClipTest is ours already), drop what only fed the old CPU draw, stop loading the DLL (render_helper TransformLibraryName, renderer_init / renderer_lifetime) and delete ITransformPipeline. Gameplay reads projected positions for picking and the selection box: goldens (and R30f1's edge scenario) decide; any golden difference is reported, not re-recorded. Notes: renderer.md sections 9 / 10 / 13. User asked 2026-10-29 whether the clipping is needed at all."
