note = "From MF15j. EffectParticle::Spawn adds a scorch mark (FireBlast: radius typeParam; LightningBlast: radius size, then camera Shake(position, size, 2, 0.25)) after its catch-up ticks, drawing g_clientRandom for the angle (RandomAngle) and fading by alpha * kScorchAlpha. Design: actions { scorch = { radius, alpha } } and { shake = { strength, time, falloff } }, run by a reaction event 'spawn' that EffectParticle::Spawn fires for a data source after the catch-up (so g_clientRandom draws where it draws today), the angle drawn by the runtime; unit check of the parse and the queue, docs/modding.md 'Effects'. Then the two type checks in Spawn go once FireBlast and LightningBlast are on data (MF15g4); until then the action has no original user, so port one of them here if it fits. MF15g4 added the shake half generally: an action { shake = <strength>, time, decay } (Camera::Shake about the source's origin, applied with the tick's actions; Mushroom's burst uses it from an emit reaction). Left: the scorch action and the 'spawn' event; MF15g6 takes them with FireBlast / LightningBlast. Done in MF15g6 (2026-11-11): the scorch action { scorch = <radius>, alpha } and the 'spawn' reaction (effectdata::Spawned from EffectParticle::Spawn after the catch-up, g_clientRandom drawn where it was); FireBlast and LightningBlast use them, Spawn's two type checks are gone."
