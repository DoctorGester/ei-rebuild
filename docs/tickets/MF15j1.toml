note = "From MF15j. EffectParticle::Spawn adds a scorch mark (FireBlast: radius typeParam; LightningBlast: radius size, then camera Shake(position, size, 2, 0.25)) after its catch-up ticks, drawing g_clientRandom for the angle (RandomAngle) and fading by alpha * kScorchAlpha. Design: actions { scorch = { radius, alpha } } and { shake = { strength, time, falloff } }, run by a reaction event 'spawn' that EffectParticle::Spawn fires for a data source after the catch-up (so g_clientRandom draws where it draws today), the angle drawn by the runtime; unit check of the parse and the queue, docs/modding.md 'Effects'. Then the two type checks in Spawn go once FireBlast and LightningBlast are on data (MF15g4); until then the action has no original user, so port one of them here if it fits."
order = 1374
