note = "R16c2 measured SectorData::Animate 006C3E80 at 1.0 ms a frame in zone1 (1.2 Rebirth, 0.35 in the town) with the water waves option on (EnableWaterWaves; off in the harness's registry, so no scenario reaches the waves now). The circling waves' sineX / sineY depend only on the column / row and the world time (read per vertex): 33 values each per call; the time once per call. Same float expressions, so bit-exact; needs a scenario with the option on (a harness step setting enableWaterWaves_ before newgame) and a golden or vectors for Animate. docs/notes/renderer.md section 13 item 3 (R16c2)."
