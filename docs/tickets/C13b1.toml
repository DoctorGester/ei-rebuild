note = "C13b's leftovers (python tools/direct_calls.py --report -v after merging main). (1) Strings on per-file storage: net::StringRep (net_classes.h / net_messages.h, embedded in many net classes; their destructors free it through StringRepDestroy / StlStringDestroy) and the net_server_* / net_client* callers, sound_manager (WaveRecord's name bytes, uint32_t key[3]), quest_database, script_exec, string_map, ui_chat_overlay, ui_objectives, unit_skins, world_game: retype to stlp::string, then StringInitEmpty / StringAssignSpan / StringInitFromChars / StringInitWithAllocator / StringBufferFree / StringRepDestroy / StlStringDestroy / StringEndOfStorage / StringInitRange / StringCopyConstruct / StringErase / StringReserve go. (2) 114 forwarders taking the container as void* (Str4 hashtables, list<RefPtr>, CList<void*>, vector<unsigned int>, CArray<Bytes<4>> ...): type the caller's storage, then the unwrap applies. (3) 414 wrappers whose body is more than one member call (ListAbi Construct / Insert / Erase, VectorAbi Deallocate, HashtableAbi ...): give the containers members the wrappers call, or call the wrapper statically where that reads better. (4) 184 'target not found': teach direct_calls.py alias templates (`template <...> using PairTree = ...` in net_connection_trees.h: Records 11, Objects 10, SentIds 7, Entries 7) and class-scope aliases (`Second::Type`); function-pointer template arguments of EachElements / InitElements (gamelists, gamearrays, recordarrays, mfc::impl). (5) CWorldServer::countdowns_ (world.h raw bytes, a TweenArray; 006D43E0 in config/direct_calls_skip.csv); CCamera::viewStack_ as stlp::deque (ViewStackDestroyRange 00411DF0 and its node / map frees); WordsSetAtGrow (renderer_strip.cpp, scene_meshes.cpp); the four convertible in world_client_draw.cpp / ground_print.cpp once the renderer work is merged. Run --golden after each retyping commit.  Result (C13b1, 2026-10-20): EI_ORIGINAL forwarders 1,513 -> 1,426 (check_cleanup), in four commits, each with --golden 0 differ (and --no-hooks --golden --fresh 0 differ after the strings and after merging main). (a) direct_calls.py reads alias templates (net::trees::PairTree ...), class-scope aliases and function template arguments (EachElements<..., &f>); 34 container forwarders direct, target-not-found 184 -> 18. (b) net::StringRep is gone: the net classes' strings are stlp::string (built in place and freed by Destruct as before), locals RAII, inlined assigns Assign / AssignFrom, operator+ stlp::Plus, new string::substr; sound voices' / deferred sounds' names stlp::string (WaveRecord keeps raw words with Name(): its CList copies it bitwise); string_map, unit_skins, ui_objectives, script_exec, chunk_archive, quest_database, world_game on string members; all 21 string init / assign / append / erase / free forwarders removed. (c) The loose tier (path cells, looks, indices, element destructs, pointer-block frees as stlp::deallocate), ScriptNamedValues Load / Save on NamedValues(&vars->...), the visibility grid's Resize. (d) MFC plain-array SetSize / SetAtGrow as mfc::CArray members; CWorld::countdowns_ typed as mfc::CArray<TweenEntry>. WordsSetAtGrow kept on purpose (skip csv); ViewStackDestroyRange untouched. Left (direct_calls --report -v --cast --loose --library: 1,429 in scope, 0 convertible): 931 'types differ' (451 wrapper bodies not one member call, 234 objects of another type - 145 of them void*, 787 loose parameter mismatches - 477 void*; 73 are the opaque ListEnd / ListBegin / VectorConstructBase / AllocProxyConstruct helpers), 18 target not found (mfc::impl PtrList::Destruct<>, CFileFind, Plain24 / Plain16, GlobalMapPointRecords, CInterface3D::PlaySound, Commands::Subscript), plus the kept-on-purpose rows (Rebirth 131, skip list 94, vector recorders 49, ...). See C13b2."
