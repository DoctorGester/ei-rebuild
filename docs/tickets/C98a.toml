note = "Rest of C98 (style review round 2, item U9). C98 did the ownership (unique_ptr surfaces/regions/models/children/inputs, tooltip a plain struct owned by its region, UiSurface virtual destructor), the TextToken value struct and UiScrollText having a UiScrollbar. Left: the virtuals with fewer than two real overrides. UiContainer: AsBriefing, ItemsPicked, Speech, QuestVariable, ShowBriefing, PlayersChanged, ExchangeDone, DebugFill have one override each (UnitJoined/UnitLeft/GameOver/ReadyToStopPolling/SaveState/HelpTopic/LayoutChanged/PlayerList two or more). ItemScreen: TopicClicked, BestPartySkill, RefreshWeapons, NextHero, PreviousHero, HeroUnit, ChooseFigure, Weight, Price one override each (TakeItem, CanEquip 3; RefreshStats, HeroRecord 2). UiScrollbar::SetRect now has one override (UiSlider). Decide per virtual: a non-virtual on the one class with the caller typed to it, or the base's default dropped where every caller already holds the derived type; no downcast chains. Style only: goldens the same, float op order untouched, no new forwarders, creation order unchanged. Done: UiContainer's eight one-override virtuals via Interface3D::battle/briefing/exchange/camp + OnTop; ItemScreen's nine via UiItemPanel::camp/heroScreen; UiScrollbar::SetRect non-virtual; Interface3D stack/backdrops/screenCopy/fps/status unique_ptr, PushWindow/Activate take unique_ptr, dead queuedWindow gone, QuickSave's surface a local. Main 196 same, Rebirth 112 same, asan ui_* no reports."
