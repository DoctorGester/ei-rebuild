note = "User 2026-10-20 asked whether net_pair_quest's run time had been improved: it has not. work.db's run table: 30 s before SV5d3 added the quest, then 130-240 s every run (standalone 133-238, vanilla 143-214; two games each, timeout 480 against the 60 s default), the longest scenario in both suites. The time goes to: the hero walking across zone9 to the old camp and back (lookat + clickground steps repeated because fights stop the walk, frames 150 each), the ten undead's fights, the briefing clicked through with wait 4000 / 800 steps (twice), and the 60 s of game time before CompleteZone's awards reach the clients (frames 400). Measure each part from the run's ei_hook.log timestamps first, then shorten without losing what the scenario reaches (CompleteZone 00418ED0, kind 0 / 1 awards, ClientOnAward 0041EF90, OnMaster 0041ACA0): e.g. the game's own speed-up (harness speed / the virtual clock if the pair can run on it), fewer and shorter walk steps, waitwindow instead of fixed waits. Only inputs the original handles. Goldens re-recorded only if the steps change; vanilla and image goldens must still agree. It also flakes on the original: C13b3 (2026-10-20) saw net_pair_quest vanilla's golden differ once (random count 233 against 222 at tick 19472; two fresh reruns the same), and R16d reran it on the original again, so workers spend extra 3-minute runs confirming a flake on code they never touched. Find the timing that moves the random count in the two-process pair and make the scenario deterministic (or wait on an event instead of a frame count there). Done (SV5d5): 6400 frames -> 2840 (vanilla 61-69 s, the image 72-89 s under load, from 130-240 s): walks wait on waitidle (20 idle frames; 3800 old frames were the hero idle in fixed frames 150), the camp on waitdead, the end on waitaward (the award reaches both clients ~20 frames after CompleteZone; 380 frames of frames 400 gone). The flake: UpdateMusic's combat-track PickName draw followed the real-time stream thread's reported track (both installs, original and image); both games play with 'music 0' (AudioStreaming 0). 12 vanilla + 12 image runs four at a time agree, Rebirth original and image agree; follow-up SV5d6 for every other scenario."
