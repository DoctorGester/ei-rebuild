note = "C18c's pointer-aware check can name them once their targets are ours: the 7 CRuntimeClass records src/lib names (mfc_file, mfc_gdi, mfc_exception) point at base records other game records share (CObject, CDC, CGdiObject, CException, CFile), so the form is the whole MFC hierarchy (41 records; CObject is also the base of the 5 serializable .data records the static initialisers link via AfxClassInit: decide those first). The EH ThrowInfo records (mfc_exception's 5, 00759908 game error, 0074C640 out_of_range) share catchable types and point at type descriptors in .data: their form is the compiler's own throw once the thrown classes carry the original's decorated names. docs/notes/standalone.md 'Named data (C18)'. Done: the 41 CRuntimeClass records are named (lib/mfc_runtime_class.h; the 5 serializable .data ones in mfc_coll.cpp and dib.cpp, linked by ported static initialisers), with 10 small create-function ports; the six pointer ThrowInfos (mfc_exception's five, 00759908) are compiler throws of classes with the game's names (mfc_try.h, dx_errors.h). Left: 0074C640 out_of_range (thrown by value, game vtables, C19); the dead ThrowInfo/catchable records stay in the image with their cells. Game data addresses 1,748 -> 1,733; image suite 121 and original suite 114 the same."
