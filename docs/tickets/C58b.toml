id = "C58b"
title = "CDib: padded row size in AllocateBits, the unused GDI palette gone"
group = "cleanup"
note = "Found by C58a. CDib::AllocateBits sizes rows without the 4-byte padding while Write writes imageSize (padded rows), so a capture whose row is not a multiple of 4 bytes reads past the bits (original bug; asan would catch it). Size the bits with the padded stride. Also CDib::MakePalette / palette build a GDI palette nothing reads: delete (P8 removed GDI drawing). Check: Scroll Lock / render_present_shot captures at an odd width, goldens."
order = 763
status = "done"
started = "2026-10-29"
