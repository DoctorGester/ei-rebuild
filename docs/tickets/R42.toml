note = "Dropped 2026-11-03: user chose SDL_GPU over compiling sokol twice (R43 spike). User 2026-11-03: OpenGL on Windows (to test the Linux path on Windows), and the backend chosen at run time, not at compile time: Direct3D 11 by default on Windows, OpenGL by a flag (a setting in the ini's renderer section and/or EI_RENDER=gl) and as the fallback when no D3D11 device can be made. sokol_gfx builds one backend per implementation: compile it twice (SOKOL_D3D11 and SOKOL_GLCORE) with its public symbols prefixed, and a thin sg_* layer (generated from sokol_gfx.h by a script, checked in the build) that forwards to the chosen one; or another design if simpler, said why. sokol-shdc then emits hlsl5 and glsl430 on Windows (descs pick by sg_query_backend). platform::graphics: both backends linked on Windows, one chosen before the window is made (the SDL window needs the OpenGL flag for GL); the harness's window path the same. Linux keeps GL only. Check: all suites on D3D11 as main; the image suite once with GL on Windows (report which differ and why; frames, not goldens, should be where they differ); ui_check and perf_check on both; the Linux workflow green."
