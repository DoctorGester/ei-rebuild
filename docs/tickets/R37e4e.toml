note = "User 2026-11-06 (yes to the hash schedule). Class 14 (speed 5 of kAlwaysSteps) is the only tile kind still stepped on the CPU (SectorData::AnimateTiles): each step a resting tile draws g_clientRandom and with 0.5% plays one cycle, then rests on frame 0; each step rewrites its UVs and marks the zone mesh Moved (an upload nearly every step with ~12.6K such tiles). Replace it with a shader schedule from the global tileSteps the vertex shader already gets: windows of a few cycles, hash(tile position, window) decides whether the tile plays in that window and at which step; otherwise frame 0; keep the mean rate close to the original's 5/1000 per resting step. All animated tiles then go one path: delete the CPU loop, the UV rewrites, the Moved upload from stepping, onGpu/stepsOnCpu and the per-tile speed field if nothing else reads it. The tile's start frame at sector build may stay a client random draw or become the hash too (prefer the hash: one path, no draw order dependence on sector loading); say which. Client random stream changes, so re-record the goldens that differ once (client effects/ambience only; server digests must stay the same) and list them. Check visually in a render_water capture over a minute of steps that class-14 tiles sparkle at a similar rate. Report main-thread time of the stepping before/after on the stress save at the user's settings (Msaa 1, Anisotropy 1). R37e4e worker 2026-11-06: code done in commit 8273261bc (verify build green; release not built), goldens NOT re-recorded: stopped on a server-digest difference. With the hash schedule no client random is drawn by tiles or sector builds, so the client generator stream shifts; units shown in dialogue and lobby screens take their animation from g_clientRandom (ui_briefing_dialogue.cpp:103,105 and the other UI draws), and that field is part of the server unit's digest: ui_base_dialogue, ui_base_topic, ui_widescreen_dialogue, ui_gallery_base, render_resize_dialogue, net_pair_* (database, leave, quest, speed, zone, zone_visuals), net_host_death, net_zone_leader, net_zone_vars (+ mod_lost_in_astral_start, mod_lost_in_astral_cz_jigran on Rebirth): obj units 'animation' 123 -> 121 (ui_base_dialogue, record 13). Outcomes, deaths, positions the same. Vanilla suite: 37 the same, 184 differ; Rebirth 13 the same, 122 differ (client units' hashes and visuals.sav generator). Also render_shadows_decals fails deterministically (printlight spell spell_bare ratio 0.978, wanted 1.04 .. 1.2: the lightning's light depends on the draws) and passes on main. Coordinator 2026-11-06: re-record accepted. The server-digest difference is the display animation of units in the dialogue and lobby screens: the UI writes an animation drawn from g_clientRandom into the server unit (ui_briefing_dialogue.cpp), so its value follows the shifted client stream; outcomes, deaths and positions are the same. No separate stream (user/coordinator decision). Goldens re-recorded once (vanilla 184, Rebirth 122, saves' visuals generator and client units, plus the server units' animation in the dialogue/lobby scenarios). render_shadows_decals: its capture was one frame after the cast (wait 150 passes one frame) and fell on the bolt's first frame, whose light depended on the generator; now frames 6 after the cast (same check, ratio 1.065, band kept)."
