note = "User 2026-11-03: resizing the window works today but only scales the output: the game still renders at its start resolution. Make a resize (drag, maximise, a monitor DPI change) change the rendering resolution: back buffer, render targets, the screen layout (src/game/screen_layout.*, widescreen axes, the interface's panels and fonts), camera projection and the UI's cached sizes, without restarting the zone; one path that a resolution change from the settings (options screen / ini) also takes later, so expose it as one call (e.g. app::SetResolution) and say what the options screen needs to use it. No device re-creation (R41 removed recovery; resize the swap chain and remake the size-dependent targets only). Letterboxing/pillarboxing (windows narrower than 4:3, screen_layout's marginY; the movie player's letterbox; the cutscene letterbox bars in ui_interface_input.cpp) must map input correctly: the cursor's window position to the game's point through the same transform the picture uses, camera edge pan (ui_camera_keys.h / ui_camera_input.cpp) triggered at the edges of the drawn picture, not the window's, and clicks in the bands ignored. Keep it backend-agnostic: R43 may replace sokol_gfx with SDL_GPU. Harness: a scenario step that resizes the window mid-zone (4:3 -> wide -> narrower than 4:3) with captures, and one for edge pan in a letterboxed window; frames, not goldens, should show the change. Check: suites 154/3 (or with the new scenarios), --rebirth-only, x64; ui_check; perf_check. play.cmd: try dragging the window."
