id = "A2"
title = "Replace Bink: an open decoder for the game's videos"
group = "port"
model = "opus"
depends = ["A1"]
note = "User 2026-10-30: Miles and Bink are dropped entirely, not kept as backends; our own backends replace them. User 2026-10-29: later. binkw32.dll (10 Bink* calls: open, frame, copy to buffer, goto, volume, wait, Miles sound) is a 32-bit proprietary DLL; replace with an open Bink 1 decoder drawing frames through the renderer and audio through A1's backend. All 20 Movies/*.bik of the GOG install are Bink 1 revision i (BIKi), which FFmpeg decodes. User 2026-10-30 asked how best to decode Bink in our code. Plan: our own decoder in src/ (demuxer, Bink 1 video, Bink audio DCT / RDFT) written from the format description (multimedia.cx wiki), with FFmpeg used only offline as the oracle (ffmpeg -f framemd5 of every .bik: frame and audio checksums our decoder must match), so the MIT exe links no LGPL code; the alternative is a minimal FFmpeg DLL (LGPL, dynamic) if the own decoder proves too costly. User 2026-10-30 chose our own decoder. An MIT-labelled libbink was once on GitHub (now gone); if a copy turns up, check its provenance before reading it (several Bink decoders derive from FFmpeg's LGPL code). Same playback (skippable intro, titles, credits), frame timing and sound. Check every .bik the installs ship decodes. PL6 (2026-10-30): the seam is src/platform/video.h with a header-only backend in src/platform/null/video.cpp (black frames at the movie's rate); A2 implements the same header (frame numbering, Waiting on a real-time clock, RGBX CopyFrame, sound through A1's output): docs/notes/platform.md, 'For A1 and A2'."
order = 652
