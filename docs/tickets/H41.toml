note = "User 2026-10-30 idea: a test-only data set built from the install by a tool, so the harness runs where the real files are not (GitHub Actions, a clean checkout). Keep what decides game state: maps / terrain and collision, models' geometry, skeletons and animations (bones, timings, events), databases, scripts, text, unit/item tables. Stub what only shows or sounds: textures as 1x1 or same-size blank (keep the dimensions where layout reads them), sounds and speech as silent clips of the same length (scripts wait on speech), Bink movies as frame count / size / rate only, fonts kept for metrics or replaced by metric tables. Step 1: list every read the harness's runs make (file, which fields reach state) and prove each stub keeps the goldens (all suites the same on the stub set as on the install). Step 2: the stub tool (tools/stub_data.py) writing archives in the original formats so no new loader path is needed; a null renderer / no-audio run if the CI runner has no GPU. Step 3: CI job. User 2026-10-30: if the data can be private, CI can use the real game instead of stubs. Note (mine): Actions cache is NOT private in a public repo (fork PRs can restore the base branch's cache, 10 GB cap, 7-day eviction), and public repo releases are public. Private options: a separate private repo holding the install, cloned with a fine-grained read-only PAT in a secret (secrets are not given to fork PRs); or a self-hosted runner on the user's machine (no upload, has a GPU, but must never run fork PRs). Stubs remain useful only if the data must go somewhere public. Frame-capture scenarios stay local.  User 2026-11-03: plan settled: a stubbed data set (tens of MB, so CI downloads stay fast; the full 1.5 GB install would slow every run) in a private repo (or private bucket), fetched with a read-only token in a secret, optionally also encrypted with a key in a second secret (a secret holds at most 48 KB, so never the blob itself). Never in the public repo, a public release or the Actions cache (fork PRs can read base caches). The job runs only on pushes and same-repo PRs, never prints or uploads the data. Steps unchanged: read list and proof that stubs keep the goldens, the stub tool, then the CI job."
