id = "C154c"
title = "A client leaves the server's zone when the server's items or spells are of another database"
group = "cleanup"
depends = ["C154b"]
note = "C154b: the world server drops a player whose party names records its databases lack (message 0x11, our client shows the reason) and a trade partner's offer naming them is refused, but a client receiving the world server's blocks (WorldClient::LoadItemsAndSpells / LoadNewItemsAndSpells, PlayerClient::OnParty / OnPartyUpdate) still ends the game (RequireEveryRecord, game::FatalExit) when an item or spell names a record its databases lack (a host with another items.idb or spells.sdb, e.g. zone loot the guest's database lacks). Why not refused there: the client has no way to leave the server's zone from inside a message handler; a refusing handler goes to PlayerMessageError (game::FatalError: exit without Rebirth's DisableExitOnCrashReport, with it the session carries on with the data missing) and WorldClient::RunTick's lost-connection path is FatalError too. Needed: a deferred client-side disconnect (the loader empties the managers / party and returns false, the handler marks the session to leave; after the tick the game flow drops the sessions and returns to the base or menu with a message box, like the interface's disconnect box), then the four loaders refuse with HasEveryRecord instead of RequireEveryRecord. Check with a pair scenario if a second database can be staged (a stub data set with one extra item record on the host)."
order = 1182
