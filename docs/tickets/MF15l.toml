note = "User 2026-11-11, after MF15g5a: a worker takes another look at the 83 effect files and the format now that every original effect is on data. Find repeated patterns in expressions and blocks (the same spawn shapes, fades, curves, random ranges, anchor walks, per-family vars) and make them data driven where that makes sense: named helpers or built-in functions in the expression language, defaults, shared definitions (like, from MF15g5a), fewer special-purpose fields. Goals: more expressive, unified, simple; the files shorter and saying what they mean; the engine code (particle_record / particle_data / particle_expr) more concise and intentional, special cases folded into general rules. Report first what was found and the proposed changes (a short list in the hand-back or docs/notes/effects.md), then do them. effect_check 146 cases the same (bit-exact: float operation order kept), vanilla/Rebirth --golden the same, docs/modding.md 'Effects' rewritten to match; mods' existing effect files keep loading or get a clear migration note (the showcase mod updated)."
