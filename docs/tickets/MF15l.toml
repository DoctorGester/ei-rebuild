note = "User 2026-11-11, after MF15g5a: a worker takes another look at the 83 effect files and the format now that every original effect is on data. Find repeated patterns in expressions and blocks (the same spawn shapes, fades, curves, random ranges, anchor walks, per-family vars) and make them data driven where that makes sense: named helpers or built-in functions in the expression language, defaults, shared definitions (like, from MF15g5a), fewer special-purpose fields. Goals: more expressive, unified, simple; the files shorter and saying what they mean; the engine code (particle_record / particle_data / particle_expr) more concise and intentional, special cases folded into general rules. Report first what was found and the proposed changes (a short list in the hand-back or docs/notes/effects.md), then do them. effect_check 146 cases the same (bit-exact: float operation order kept), vanilla/Rebirth --golden the same, docs/modding.md 'Effects' rewritten to match; mods' existing effect files keep loading or get a clear migration note (the showcase mod updated). User 2026-11-11 (later): bit-exactness is not worth keeping; individual particles may drift if the effect looks the same overall. So: operation order, draw order and float-exact rules may change for simplicity; effect_check's reference is re-recorded where an effect changes on purpose, and each changed effect is checked by eye: before/after viewer captures (on the captures page) plus a coarse compare (particle counts, lifetimes, bounds, average size and colour within a tolerance; add that mode to effect_check). Goldens should stay the same (client particles are not in them); if one moves, explain it. User 2026-11-11: look into a general vector solution: expressions use vectors a lot but every value is a float (ball_x/ball_y/ball_z, x/y/z triples of fields). Proposal to weigh: every value is a v4 (shading-language style): scalars broadcast to all lanes, a scalar context reads .x, components and swizzles (.x .xyz), vec3()/vec4() constructors, dot/length/normalize/cross/lerp/mix, ball() and shell() returning a point, fields and vars that are positions / velocities / colours as one vector name. Measure the cost (a v4 stack per op; SIMD is fine) on the busiest effects in the viewer."
