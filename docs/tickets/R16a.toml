note = "docs/notes/renderer.md section 13, item 1. Today every shown window surface is compared with its snapshot at every blit (4-32 MB a frame at 4K: 1-3 ms CPU on interface screens, about 0.9 ms in the world) and uploaded whole when it changed (up to 4 MB; the escape backdrop 32 MB). Mark changes where the game writes the memory (DC release 005FDC60, pixel code, SwapContents / Freeze, CopyFrameTo, greyscale; N0 census lists the writers), upload the changed rectangle. The harness build keeps the memcmp as a missed-writer check that fails the run. Measure with render_stats (renderstats: memory compared, CPU textures ms). Check: ui_* / render_* captures at 8 / 0.1%."
