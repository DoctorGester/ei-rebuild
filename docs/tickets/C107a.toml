note = "C107 did the value-returning screen_layout transforms (ToScreen / FromScreen / *NoMargin replace Interface3D's seven Scale* forwarders), const Rect& for FrameRect, the scroll bar's, slider's, scroll text's and console's SetRect and SetConsoleRect, and about 50 index loops in the UI files to range-for (the ones that read only the element; loops whose comment says by index, the inserting / erasing ones such as CampPages' TakeOff loop, and those that use the index otherwise stay). Left: (1) g_interface: there is one Interface3D (ui_interface_input.cpp), so it is the global; UiWindow, UiSurface, UiRegion and UiInput each keep a stored Interface3D* ui and every window constructor takes one (99 Interface3D* mentions, about 400 ui-> uses in 51 files, ConsoleWindow's screen): drop the members and parameters and use g_interface, a whole-tree scripted retype in one or two batches (local Interface3D* ui = &g_interface / page->ui copies too). (2) UiItemPanel::ItemAt(Point, int* topic): ForwardingStrip writes a cursor shape (0x16-0x18 for its modes 1-3) into the same int, which its callers (CampPages / ExchangeScreen / MpHeroScreen DrawSprites, UiItemPanel::LeftDown) then read as a help topic when no item is under the point (an empty strip cell shows help topic 0x16..0x18; LeftDown passes the x coordinate's address as the topic). Split into a value result (item, topic) and decide the strip's cursor: keep the topic value it produces today unless goldens show the help panel. (3) The hand-written vector inserts / erases with memmove (BattleScreen::CreateScreen / UnitJoined, BriefingScreen's party) become insert / erase. Style only: goldens the same, no new forwarders. Done: g_interface is the only Interface3D (UiWindow/UiSurface/UiRegion/UiInput/ConsoleWindow pointers and every window constructor's parameter dropped, scripted; app.cpp's input too); ItemAt returns ItemUnder {item, topic} (ForwardingStrip's 0x16-0x18 kept as named help topics, FigureStrip's override gone, LeftDown's x-address topic gone: unobservable); BattleScreen/BriefingScreen party memmoves are insert/erase. Main 196 same 0 differ, Rebirth 112 same 0 differ, WSL plain+harness 0 warnings."
