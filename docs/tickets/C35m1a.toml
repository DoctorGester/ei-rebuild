note = "C35m1 found its write-after-free with a throwaway operator new / delete replacement (scratchpad C35m1/guard_heap_diag.cpp): header + canary trailer per block, freed blocks filled 0xDD and kept in a 160 MB quarantine, logs bad headers, overwritten trailers, double frees and writes into freed blocks with RtlCaptureStackBackTrace callers (ei_hook+offset). One effects run found the bug deterministically where reruns had not; 8 scenarios ran clean under it within their time limits. Make it a verify-build option (run_all passes EI_* through) with a resolver for the log, so flaky heap crashes are found in one run; keep the release build's operator new the CRT's. Done with AddressSanitizer instead (user's direction): build.cmd asan (build\\asan; reports to the run's asan.<pid>, run_all fails such a run). The sweep found and fixed: IdPool::Allocate's read through end() after pop_back, the sprite clipper writing past the corner vector's size, window surfaces' sized-delete mismatch, particle table reads at -1 / past the end (ByLife), DistancePointPoint's over-read, the harness's stack-dump memcpy. Last sweep: 0 reports."
