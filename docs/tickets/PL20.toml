note = "User 2026-11-03: a Linux player reports janky camera controls in our build; on Windows they feel right. The guide the player followed (a GOG-under-Wine registry fix) sets exactly our defaults (CameraDefaultRotateSpeed 0.15, PitchSpeed 0.0015, ScrollSpeed 1.5, ZoomSpeed 2, ... all equal settings_catalog.inc), so settings are not the gap; do not change defaults. What I read (not measured): CameraInput::MouseMove runs once a frame (ui_battle.cpp:228) and sets the turn and tilt TARGET RATE from that frame's mouse motion (g_cursor.motion from MouseDevice::Poll); camera.cpp then approaches the rate and turns dt * rate. So the turn per second scales with 1/frame rate, and a frame with no motion event (mouse report rate below the frame rate, uneven compositor pacing) sets the target to 0: the turn speed depends on the machine's frame rate and stutters when frames and mouse reports beat. Windows hides this at its usual frame rate and mouse rate. Second candidate, already fixed on the user's origin/macos-port (26d016239, Cursor::SetHeld polls and drops pre-press motion and snapshots the position): motion from before the right-button press turns the camera on the next frame (a jump at press). Third to check: the held cursor (SDL relative mode plus a 1x1 SDL_SetWindowMouseRect) on X11 (XFixes barriers) and Wayland (pointer constraints), and edge scrolling with nothing confining the pointer to the window. Plan: (1) a trace (like PL17a's EI_AUDIO_TRACE) logging per frame dt, motion, target and actual turn, on Windows and in WSL (X11 via WSLg; Wayland if available) to confirm; (2) make the mouse turn and tilt frame-rate independent: the same turn per mouse count as Windows gives at a reference frame rate (measure the original's feel on Windows at its usual rate, likely 60), e.g. turn by accumulated motion directly or average the rate over a fixed window, so one mouse speed gives one camera speed at any frame rate; keyboard turning unchanged; (3) take the SetHeld fix from 26d016239 (only the cross-platform part, not the Cocoa SDL patch; MAC4 brings the rest). Goldens: camera scenarios may change if the turn math changes; re-record with --reason only for the drag scenarios and say which. Ask the coordinator if a choice changes how Windows feels."
