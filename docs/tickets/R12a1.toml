id = "R12a1"
title = "Smooth option: exercise the copy into the multisampled target"
group = "renderer"
note = "R12a draws the world view multisampled and copies the frame target's colour and depth into every sample when a world run follows other draws in a frame (render_smooth.cpp CopyIntoMultisampled). No scenario reaches that order (the world view is the frame's first draw), so the copy is only compiled, never drawn. Add a harness way to reach it (e.g. a verify-build switch that puts a depth clear or blit before the world range) and check the frame against one without it."
