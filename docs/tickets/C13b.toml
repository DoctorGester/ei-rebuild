note = "1,000 forwarders whose target the map does not name as written: per-file aliases and template instantiations of the STLport / MFC container ABIs (Map8 94, Vector4 63, Str4 50, ArrayHeader<> 41, Vector12 35, PtrList 35, List16 34, CountedRefList 30, SharedRefList 27, ItemCache 21, Plain4 20 ...). Either teach tools/direct_calls.py to resolve using-aliases and instantiations against the map, or retire them with the container work (C14 / C15). Result (C13b, 2026-10-20): EI_ORIGINAL forwarders 1,617 -> 1,513 (check_cleanup). tools/direct_calls.py now resolves registrations through using-aliases (the file's own, the headers it includes, and the namespaces it opens with `using namespace`), <cstdint> typedefs and left-out default template arguments, writes template-ids through the aliases a site sees, and turns a forwarder of a static container wrapper (VectorAbi / ListAbi / TreeAbi / ArrayAbi ...) whose body is one member call into that member call on the container, also for an erased element (Opaque<N> / Bytes<N>) or a same-size integer / data pointer element (vector<unsigned int> serving vector<int> or vector<T*>, never float). Per-file strings (RawString / StringSlot / NameKey) became stlp::string in class_templates, figure_*, item_constructor, unit_save, unit_lever, world_units, world_quests, registry (mfc::CString). The six hash400 / STL ones: HashMapAt, IdMapRemoveKey, IdMapErase, IdMapLookup through hash400::PositionAt / PositionsRemoveKey / ObjectsRemoveKey / ObjectsFind (hash_tables_400.h), TreeIncrement through stlp::map::Next / rb::Next; ViewStackDestroyRange stays (CCamera::viewStack_ is camera.h's own deque layout). Of the 13 originals_library.h ones, StringAssignRange / AssignCStr / CopyConstruct / Split / Ostream* / IniGetList are gone; StringInitEmpty, StringAssignSpan, StringInitFromChars, StringErase, StringReserve remain for the net / sound callers (C13b1). Left (direct_calls --report -v, 1,516 in scope): 854 'types differ' (414 wrapper bodies that are not one member call, 189 objects of another type - 114 of them void*, 27 parameter types, 24 wrappers not inline, 22 bodies passing more than their parameters), 184 'target not found' (alias templates such as net::trees::PairTree 35, function-pointer template arguments of gamelists / gamearrays / recordarrays / mfc::impl EachElements / InitElements ...), plus the kept-on-purpose rows (Rebirth 131, skip list 94, vector recorders 49, ...). Four convertible ones are left in world_client_draw.cpp and ground_print.cpp while the renderer work runs. See C13b1."
