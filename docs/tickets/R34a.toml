note = "R34 left SectorData::Light writing only the edge fade, which never changes, yet the Lit stage and the relight countdowns (SetSun spreading them over the LightingFreq interval, RelightTick, ScheduleRelight, SetLightInterval, lightInterval / lightCountdown) stay: on the tick a sector's lighting drops, RunTick skips its AnimateTiles / AnimateWaves, and AnimateTiles draws from the global ISAAC; without the countdowns 15 goldens differ (levers_key, net_pair_join/kick/leave/master/quest/zone, rebirth_fixes_ui, terrain_water_waves, ui_base_dialogue/topic, ui_gallery_base/mp, ui_mp_host, zone_base_bz1g; the random group first; net_pair_quest's waitidle then times out). The patch that removed them is in R34's report (full_removal.patch). Way out without emulation: take the terrain's draws (FillTiles' start frames, AnimateTiles) off the game's ISAAC in both builds (the harness patches game.exe's sites, as address_order does for the relight sort; a harness change: --no-hooks suite, goldens re-recorded for the random group only), then drop the countdowns, the Lit stage (the fade written at Build) and the options' LightingFreq use. User approved 2026-10-29 ('give client only effects its own random'): one client-effects generator for every client-only draw, not only the terrain's: also check the ambient sounds (terrain_ambience.cpp), sound picks, particles and other draws whose count depends on the frame or camera; list each moved site.  Check: goldens, terrain_water_waves."
