note = "User 2026-11-06 after C173a-d: 'Surely things like ShowMessageBox don't need to take a const char*? Review usages again.' Rule: c_str() appears only as the argument of a function the project doesn't own (Win32, POSIX, SDL, sockets, Bink/Miles), on the line that calls it. Everything of ours takes std::string_view or const std::string& and returns std::string_view / const std::string&: platform::ShowMessageBox, video::Open, settings prepare callbacks, g_consoleLineObserver, the stream Write/WriteBytes text writers, gpu Error/DriverName/DeviceName/LostReason, map_database Word, ClassifyToken, LoadFunction, MessageWindow's key, ui_battle's name getters, text_split. C runtime string functions go too: snprintf into char buffers -> std::format / str::Format into std::string; atoi/strtol/strtof -> std::from_chars (same results incl. partial parses and errors; strtof under /fp:fast: check equal bits); strchr/strstr/strrchr/strpbrk/strcmp/strlen in str.cpp -> std::string / string_view members; pointer scanners walking to the NUL (ui_chat_overlay, ui_interface, ui_scroll_text, script_parse, crt_format) -> index or string_view loops. Behaviour kept where the old code cut at the first NUL (CutAtNull, UnitName, Assign, name2, the +4 read in ui_hero_screen_create): do it with find of the NUL character and document; never read past the end. Target: c_str() count in src down to the OS/third-party call lines only (about 25-30). Goldens the same."
