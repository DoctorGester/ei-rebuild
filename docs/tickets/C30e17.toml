id = "C30e17"
title = "SSE2 float selects keep the original's tie operand (+0 / -0)"
group = "cleanup"
note = "C30e9's equivalence test found that MSVC /fp:precise on SSE2 compiles a >= b ? a : b to MAXSS and a >= b ? b : a to MINSS, which return the second operand on a tie (and on NaN): where +0 meets -0 the zero's sign differs from the x87 original's compare and branch (FCOM / FNSTSW). float_select.h's MaxKeepB / MinKeepA (documented as keeping the tie operand) compile the same way in SSE2 objects, and so do the written-out selects of every moved file (unit AI: AIViewer::Refresh's reach, FearMode::Evaluate's distance, KeepLower; docs/notes/cleanup-tooling.md, C30e9). Make the helpers exact on SSE2 (a CMPLESS / CMPNLTSS mask and a blend through intrinsics, or a form MSVC keeps), route the >= selects of the SSE2 game files through them (a scripted search: ternaries of two floats on >= / <=), check the objects for MAXSS / MINSS left on >= forms, goldens unchanged, an equivalence test of the helpers on every pair of special operands."
order = 966
