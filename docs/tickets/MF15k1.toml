note = "User 2026-11-11: the effect viewer becomes a separate exe (MF15k4). ei_game is one OBJECT library today (render and platform are separate). Carve ei_engine: lib, data/resource and archives, models (textures, figures, animation), scene (camera, lights, clip, pipeline, scene renderer), core engine objects / transforms / random, the particle core (particle_data/manager/create/record/expr, effect_files builtin), mods' file layers. The engine never includes game headers (units, world, ai, net, spells, script, ui, app): a build check like layout.py's enforces it. Game-side effects (world_effect_*, weather, lightning, vis fog) stay in ei_game. Expect back-references (singletons.h, g_clientWorld, g_camera): move what belongs to the engine, leave hooks MF15k2 fills. Behaviour unchanged: vanilla/Rebirth --golden the same. Start after MF15g6 merges (it deletes the per-type particle code this split moves). Done 2026-11-11: ei_engine object library (lib, core, data, models, scene, mods, effects/particle_*) with tools/engine_layers.py in the build checks; 86 crossing includes down to 36 (tools/engine_layers.txt, each with what it needs). Particle core has no game include: its world calls are particle_host.h's free functions, defined by effects/effects_particles.cpp. Settings/options and maps as folders moved into data/, mod identity into net/. Engine objects linked alone leave 41 unresolved symbols (15 particlehost, g_clientWorld, item/spell texts, camera's terrain/sound, UiMesh, screen_layout, present_window, app message boxes, game::Warning/FatalExit). Follow-ups MF15k1a, MF15k1b."
