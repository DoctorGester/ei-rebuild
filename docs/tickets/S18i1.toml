model = "opus"
depends = ["S18i"]
note = "Since S18i every EI_ORIGINAL forwarder and ei::Code literal asks CodeAddress at run time (ei_code_dispatch: a binary search over ~9,350 registrations per call). Make the ones whose address has a registration call it directly (a generated forwarder -> replacement table, or the macro naming the replacement; harness redirections and unregistered addresses keep the lookup), and drop the lookup from the hot paths. Checked: goldens both installs, the frame time of a heavy scenario before / after.  Done: EI_ORIGINAL keeps a CodeLink per forwarder and jumps through it once bound (BindCode: registration or game.exe's own address; redirections and stubs keep the lookup); code literals left (about 20 lookups a frame). Measured (render_stats, vanilla, three 30-frame A/B pairs, harness step codebinding off/on): fight 9,000 -> 25 lookups a frame, main thread CPU 19.0 -> 18.45 ms; town 3,300 -> 20, 7.4 -> 6.7 ms (noisy)."
order = 623
