note = "Done (2026-10-27): (1) src/lib/import_prototypes.h declares the 93 imports the Windows SDK lacks (ei::import_fn::X: Miles with typed handles miles::Sample/Sequence/DigitalDriver/MidiDriver and SoundInfo, Bink, Winsock 1.1, DirectInput, DirectDraw, DirectSound, comctl32, comdlg32, winspool, GetVersion, the Interlocked pair); gen_iat types every ImportTable member from it or the SDK (fails on neither; no FARPROC, no ImportAs) and gameapi.h calls the 91 non-intrinsic ones through the slot. The sound/Bink/crt/mfc_state accessors and casts are gone (gameapi::AIL_x directly); CSoundManager's handles are typed (miles::Sample* sample/streamSample/streamDecoder, DigitalDriver* waveDriver, ...). (2) The harness names its slots by member: tests/verify/harness_imports.h PatchImport(&ImportTable::X, hook, original), TraceSlot<T>(&ImportTable::X), crash::WatchWrites(); the 66 kXxxSlot constants are gone; gen_iat routed() reads ImportTable::X in tests/ (gameapi.h unchanged by it). Left: addon_sites.inc's MoviesPatch site (0073B720, BinkOpen's slot) is a Rebirth patch-site address like its neighbours. (3) Decision, not done: keep image_imports.inc whole. The ImportTable layout must stay game.exe's while the harness patches game.exe's own table through it, so only the resolve list could shrink (343 slots of direct functions); the gain is ~343 GetProcAddress calls at start, against a generator coupling (static_init Import(&ImportTable::X) and every new route must be resolved) and zero slots that trap if anything ever reads them. Checked: image suite --golden 121 same 0 differ, original suite --no-hooks --golden 114 same 0 differ."
