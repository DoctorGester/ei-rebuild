title = "Replace Miles: our own audio mixer and decoders"
group = "port"
model = "opus"
note = "User 2026-10-30: Miles and Bink are dropped entirely, not kept as backends; our own backends replace them. User 2026-10-29: later, after the x87 work. Miles (mss32.dll, 39 AIL_* calls: samples, 3D-less pan/volume, streams, MIDI sequences, the ASI MP3 decoder, EOS callbacks) is a 32-bit proprietary DLL from the game folder; it blocks a 64-bit or non-Windows build. Replace with miniaudio, using its own decoders (dr_wav for WAV / IMA ADPCM, dr_mp3 for the 38 Stream/*.mp3 music tracks and the ASI path); no decoders of our own. MIDI: the game only ends and releases a sequence handle it never starts (sound_manager.cpp), so no MIDI path is needed (user 2026-10-30). Same volumes, pans, loops and timing as the game asks for; the harness's audio checks (if any) and play by ear. Bink's audio (BinkOpenMiles / BinkSetSoundSystem) moves with A2. PL6 (2026-10-30): the seam is src/platform/audio.h with a silent backend in src/platform/null/audio.cpp; A1 adds a miniaudio backend that implements the same header, keeping the timing rules in docs/notes/platform.md, 'Audio and video' / 'For A1 and A2' (voice ends from WaveMilliseconds on platform::FrameClock through DeliverEnds; DecodeMp3File's sample count)."
order = 651
