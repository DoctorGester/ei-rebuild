note = "Left by C74: (1) particle_callbacks.cpp (~120 .x/.y/.z assignments) and particle_emitters/lightning/camera/map_object_figures: x, y, z computed into separate locals (px, py, pz; ax, ay, az) and stored one by one; becomes Vector3 locals and operators (hand work, bit-identical). (2) Vector4 has no operators; the float[4] colour and the Vector4 points stay. (3) Pointer parameters left on purpose: SectorGrid::Move / AIMap chain, LineBatch::AddPoint(float[8][3] corners), DeltaField::WritePosition2D, figure_bones Lerp/Corner and map_object_animation LerpPoint (read from file streams as float*), script argument arrays f[]. (4) A few float* aliases kept because they loop with an index (particle_callbacks swirl, orbiter, ring offset).  User 2026-11-03 found Lightning::UpdateBounds untouched: also splat/constant fills, two-step code through locals (sumX.. then center.x = sumX*0.5f), wrapper helpers restating operators (AddVectors, NegateVector, ScaleVector), FromBits constants equal to a literal. Ends with an audit listing every remaining run of consecutive .x/.y/.z (or [0..2]) assignments to one object and every scalar xyz triple: converted or a one-line reason.  Audit (user 2026-11-03): temporarily rename the vector's x/y/z members and build the Linux gcc build with -fmax-errors=0 so every component access is listed; rewrite functions doing the same op on every component, keep single-component uses, leftover list grouped by reason in build/reviews/. The rename is not committed.  From PL15: UnitMotion::segmentStart/segmentEnd are uninitialised while segment == -1 and the NaN audit at ai_motion.cpp:324 reads them before the segment != -1 guard (new log lines after heap layout shifts); initialise them or move the audit inside the guard."
