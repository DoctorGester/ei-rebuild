note = "User 2026-11-04: the resolution row (R45/R45a, platform::DisplaySizes) uses the original's toggle control (click steps to the next value), which is a poor way to pick from a dozen sizes; the game has no drop-down of its own, so add one. A drop-down list widget in the native immediate-mode interface (docs/notes/ui-native.md section 3), drawn in the game's own look (its frame, font and highlight art; no foreign styling): the row shows the current size, a click opens a list below (or above near the screen bottom) with every size, the current one marked, a hover highlight, mouse wheel and a scroll bar when it doesn't fit, Up/Down/Home/End/Enter/Escape on the keyboard, a click outside closes it without a change. Choosing applies the same way the toggle's change did (R45's ChooseResolution path, confirm/revert as now). Make the widget general so other many-valued rows could use it later, but convert only the resolution row now. Harness: scenario steps to open the list, pick an entry by index and check the chosen size; captures of the list open in vanilla and Rebirth at 4:3 and widescreen; goldens of ui_options captures change only where the row's look changes (re-record those, name them)."
