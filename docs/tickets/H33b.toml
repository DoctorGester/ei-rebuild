id = "H33b"
title = "Build time: precompiled header, if a code change is acceptable"
group = "harness"
note = "H33 measured a precompiled header of the standard headers (target_precompile_headers on ei_hook, image_data.cpp left out for its init_seg): clean verify 58 -> 47 s (-18%), compiler time -22%. Not taken: it changes the code of ~120 objects (std::basic_string members inlined differently; dumpbin /disasm per function compared), so x87 code around them may round differently; it needs the goldens and the user's OK. Game headers in the PCH: tests/verify must be left out (the harness's own views clash: harness_address_order.cpp), and adding unit.h / ai_map.h / world.h broke per-file names (model_db.cpp). Gain with the core game headers (lib/crt.h, vecmath.h, engine_object.h, maths.h, script.h, model.h ...) not measured cleanly; estimate another ~10%. User 2026-10-29: probably not needed; dropped."
order = 787
status = "done"
done = "2026-10-29"
