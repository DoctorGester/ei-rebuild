s and party-member arrays as members of derived structs (PatrolPoints, GlobalMapZoneTable, MpAddresses, PartyMembers, SectorCellObjects, CountedUnits, CountedEngineObjects; the old names are using-aliases), string array copies, the deleting destructors as ScalarDelete<&Destruct>, ScriptStrings::CopyAt / CopyFrom, BridgeHeights (RestoreCell / HeightAt), RecordTable::RecordAtStride, CFixedAlloc::Construct registered directly, ListRemoveInt / ListRemoveHeld as plain functions. Verify and release builds clean, all checks at 0, check_x87 / check_stolen / check_signatures 0 problems. Suites: image 121 goldens the same (ALL PASS, 138 runs), original --no-hooks --fresh 114 the same (ALL PASS, 125 runs). Left (90): serialiser templates in mfc_slots.h (SerializeCArray / CList / CListThrough / StringArray / CMap, ScalarDelete: one per template), the Rebirth-patched input handlers, pair structs of hash_map / map instantiations (ConstructShapePair, ConstructGroupPair), void* / pointer-to-pointer selfs (holder assigns, PlayerMessage, Screen8 / Screen9 constructors, deleting destructors on void*), MatrixMultiply (float* self), CMemoryStream::Write / DriverLink::SendBytes (return value differs), U4 / UB1 files (ui_edit_field, net_link, net_state ...), TextConstruct (a constructor). Batch 30: shims 90 -> 46 (tools/progress.py). Members of types we can name: acks::Speeches / EnvironmentSpeeches::Pick, ShapePair / FiguredGroupPair::Construct, PathCells::Append / Reversed (derived structs, old names as using-aliases), AlignedArray ElementAt / SetAtGrowRef, ChunkArchive::SerializeLevers, CMemoryStream::WriteImpl, CRefCounted / CRefObject deleting destructors, UnitModelTable::At, FootprintPart::SetIgnored, DamageWords::ExcessOver (unit_db.h; the stats vector replay uses it), CSceneRenderer::BindHeldTexture; the particle iterator (00497D40 and its three copies) is CTypedPtrList<Particle>::GetNext; counted-pointer helpers are HeldEngineObject (Assign / Construct), HeldTexture::Load, HeldDevice::Assign (X::Of(&p)->...). Templates: ScalarDelete<X> -> ScalarDeleting<X>::Delete, the 400-range ones DeletingDestructor<Body>::Delete, the serialisers ArrayAbi / ListAbi / MapAbi::Serialize and ListAbi::SerializeThrough<T> (CompiledCollection takes a member pointer). Input handlers: about 11 via InputForward<&Class::Method>::Call, CCameraInput::OnKeyDown, TradePanelInput::OnLButtonUp. CreateUnitShape is __stdcall, PlayerMessage plain, CameraUpdateOf gone (FrameCameraUpdate). Fix found by the suites: records::IsPlain treated a type derived from stlp::vector as bytes (memcpy copies of acks::Speeches crashed at load); kVectorLike now excludes them. Verify and release clean, checks 0, check_x87 / check_signatures / check_stolen 0. Suites: image 121 goldens the same (138 runs), original --no-hooks --fresh 114 the same (125 runs). Left (46): DeleteName (CString deleting destructor), SerializeFourDwords, CorpsesPopHead, LeadingStringDelete, AssignWide, TextConstruct, RecordNamed, MatrixMultiply, ScriptAreaAddRect / Round, ResizeUntyped<Abi> / NewNode<Abi>, static __stdcall for this-ignoring functions (LoopbackLink::CreatePair, ReplayLink::Create, CreateFigureObject, ServerExtraScale, NewParticleSource, GuardPlayerData, EffectNotify); net-state readers, DriverSendBytesHook, mob / menu loaders, Screen8 / Screen9 constructors, ComposeTexture, SoundOpenStream; UnitSetController, QuaternionRotate, ObjectHolderAssign (C21 files). ReadDiff stays: a real fastcall (old in ECX, data in EDX), not a shim.  Batch 31: shims 46 -> 27 (tools/progress.py). The this-ignoring functions are static __stdcall (the originals are RET n and never read ECX/EDX; checked by disassembly): LoopbackLink::CreatePair, ReplayLink::Create, CreateFigureObject, ServerExtraScale, NewParticleSource, GuardPlayerData (GameGlueObject gone), EffectNotify. Members: CString::ConstructText / AssignWide (lib impl::CString), ScalarDeleting<&DestructName> (CString) and <&DestructLeadingString> (the 2 figure map pairs; Destruct functions must be __fastcall(T*) for DestructTarget), UnitGoldRoll::Serialize, CountedUnits::PopHead (CorpseList alias gone), RecordsByName::Named (callers converted except item_constructor / item_stock / ui_camp*, which keep the plain inline stlp::RecordNamed(table, nullptr, name) forwarder: C15/C19 files, inline it after they merge), Matrix4::Multiply, ScriptAreaParts::AddRect / AddRound (FindArea returns ScriptAreaParts*). ResizeUntyped<Abi> is a plain (vector, count) function (ResizeFn typedefs in item_db_load / model_db), script_load's NewNode<Abi> wrappers became AppendNode<Abi>. Verify and release clean, checks 0, check_x87 / check_stolen / check_signatures 0. Suites: image 121 goldens the same (138 runs), original --no-hooks --fresh 114 the same (125 runs); main merged afterwards, verify build clean. Left (27): net-state readers, DriverSendBytesHook, mob / menu loaders, Screen8 / Screen9, ComposeTexture, SoundOpenStream, UnitSetController, QuaternionRotate, ObjectHolderAssign (C21 files), the Rebirth-patched input handlers, serialiser templates; ReadDiff stays.  Batch 32: shims 24 -> 2 (tools/progress.py). Slot bodies as members: CMapObject / CUnit ::ReadNetStateImpl / WriteNetStateImpl (0050EC30 / 0050EAF0 / 0052EF90 / 0052EC70, EI_REPLACE_METHOD; the cell 0073DB64 reads 0050EC30). Unread registrations of compiled-table slots recorded as EI_REWRITTEN of the virtual members: DriverLink's six (00479C10 ... 004796B0; the int / bool return no longer matters) and the fake unit's Destroy / LoadScene / GetClassId. Loaders: MobFile (a RootChunk: ReadChunks 00481F00, Load 00481660), QuestDatabase::LoadRegistry (006AE8E0), CFigureManager::SetFigureAnimation / LoadMenuRects. Others: CFigureMesh::Rasterise (005A0E80; RasterTriangle / RasterTarget moved to raster_target.h, texture.h's windows.h broke a 'far' local), CHoover::CollectLoot (00461CB0), ClientsIterator::FindByAddress (0043D780), stlp::ListAbi::CopyConstruct (00437930 / 00437F60 / 00438690), CCreditsScreen / CExchangeScreen::Construct (005F6D50 / 005F6F30), CUiSurface::ConstructFromPicture (005FCF80); PartyReset, CursorSetShape, TextReadLine, BrainHearAlarm, SoundOpenStream, the shadow SetTexture inlined. constexpr addresses 10 -> 2: game.exe's text bounds and WinMain are ei::kGameTextBegin / kGameTextEnd / InGameText / kGameWinMain in include/ei/hook.h (three copies gone). Own At(): 3 -> 2 (scene_loader's gone). Verify and release clean, checks 0, check_x87 / check_signatures / check_stolen 0. Suites: image 121 goldens the same (140 runs), original --no-hooks --fresh 114 the same. Left: ComposeTexture (unit client files: callers in unit_client_models / unit_client_wounds / unit_skins, C19's area; make it CTextureManager::Compose after C19 merges), ReadDiff (a real fastcall); constexpr kEmptyTextAddress (pointer compared) and static_init.h's kCrtAtExit; At() in item_db.h (table accessors) and static_init.h (the generated initialisers' Code::At), both real accessors, not raw-offset helpers.  Batch 33: shims 2 -> 1, constexpr addresses 2 -> 0 (tools/progress.py). ComposeTexture is CTextureManager::Compose (00693180, EI_REWRITTEN; callers in unit_client_models / unit_client_wounds / unit_skins call it on the manager; SkinRequest forward-declared in texture.h). game::kEmptyTextAddress gone: EmptyText() reads 0079B298 itself (still the pointer the callers compare). static_init.h's kCrtAtExit is ei::kGameAtExit in include/ei/hook.h beside kGameWinMain. Left and kept, so C11 is finished: ReadDiff (the one counted shim, a real fastcall: old in ECX, data in EDX), and the three own-At() files are real accessors (item_db.h's table At(index), static_init.h's Code::At visitor operation, C21's stlp_list_refs.h RefListOf::At(node)), not raw-offset helpers. Verify and release clean, checks 0, check_x87 / check_signatures / check_stolen 0. Suites: image 121 goldens the same (143 runs ALL PASS), original --no-hooks --fresh 114 the same (126 runs ALL PASS). The umbrella can c