e named, still addresses until the S18 generated definitions. Batch 19: raw game addresses 19 -> 1 (render_state / render_game.h's went with R16h): ui_item_info's statistics are called by name (UnitStats::StrengthRatio / DexterityRatio / Period20 / Value6E8 / Value6E9 / RateValue / AttributeBase / AttributeWithBonus / SkillBase / SkillWithBonus / WeaponSkill / SkillLevelValue / SpellSchoolSkill / SkillPrice, WeaponStat84 / 88, WeaponPrototypeSkillBonus now declared in unit.h) and truncated as they come back in ST0 (the unrounded ones are declared double; the float ones return exact values), ItemHoverInfo::stats is a UnitStats*, and 0073BAB0 / 0073E124 / 0073E128 are named constants. Left: game::kEmptyTextAddress 1. Batch 20: the particle files' ~150 float / double constants were already tagged literals (EI_ macros, rdata_literals --list finds nothing left); the .rdata tables there (sphere / antimagic sizes, bag colours / alpha) are now arrays of tagged literals (the .data alpha tables stay by address: the tool covers .rdata) and the 12.0 in particle_create a tagged literal. The game flow 007AFE20, interface 007C7D50 and world tick 007AFFC4 accessors are one header (src/game/game_singletons.h: TheGameFlow / TheInterface / CurrentWorldTick; about 30 per-file copies and raw spellings gone, tests included). ui_item_info uses the shared accessors (GameTexts, itemdb::Spells / SpellModifiers / Weapons / Armors / QuickItems, unitdb::SkillLevels, SkillDb). Batch 21: the other cells with per-file accessor copies are in src/game/game_singletons.h too: the client tick 007AF61C (CurrentClientTick), client world 007AF5B8 (TheClientWorld, also the old WorldClient / UiClientWorld / GameClientWorld), server world 007AFF60 (TheServerWorld, also WorldServer), the managers (TheTextManager 007AF788, TheObjectManager 007AF5F8, TheTextureManager 007AF744, TheSoundManager 007AF784, TheMusicSystem 007AF760), TheRenderDevice 007AF080, TheDeviceLock 007AEE78, TheSceneRenderer 007AF060, TheCursor 007C7BD8, TheMapDatabase 0079BF00, TheMissionScript 007C27D4, TheSectorMap 007B01F4, TheCamera 0079B2A8; the global random generator is IsaacRandom::Global() everywhere (about 30 copies). About 220 files, spelling only; header-owned accessors (device::Lock, sound::Manager, camera::ObjectManager, GameTexts, GameCursor, ...) gone, redundant casts dropped. Kept per file: cells typed differently (script_group ObjectRegistry, script_exec_helpers World, map_database TextReader, script_load const CScript, player_client_handlers' writable tick, ui_item_view's byte-pointer device, ui_menus' UiSoundSystem, the Global<> helper copies in app / app_main / bink_video). Batch 22: the cells that had differently typed copies are one accessor each in game_singletons.h: TheDataFolder() (007AF460, mfc::CString&; DataFolderText() for its characters) replaces about 15 copies typed as CString, const char*, void* (world_data.h's DataPathString / DataFolderString and ui.h's GameDataPath gone), ThePartyManager() (007AA5A0, PartyManager*; was GamePartyManager and void* copies), the shared empty string is mfc::impl::PchNil() (about 14 copies typed char*, uint32, void*; CString members are default-constructed in place), the text glue 007AFEA4 was only this of GameClientTexts() (the TextGlue structs and kTextGlue gone, GameClientTexts() called directly). The Global<> helpers in app, app_main, app_frame and bink_video are gone (ei::GameData<> and the shared accessors); the GlobalRandom / Random / UiRandom wrappers of IsaacRandom::Global() gone. Kept: ui_menus' Global<UiSoundSystem*> and ui_item_view's byte-pointer device. Batch 28: shims 350 -> 282: render / device / script element deleting destructors and the debug panel are members (CRenderBase, CTextureDevice, CRenderHelper, CTransformPipeline, ScriptObjectRef / ScriptGroup / ScriptDecl ... ::DestroyElement, strmap::CDebugPanel as a header struct with its ten members); derived structs with members: SmoothEdges, TemplateTable, PartNames::Co