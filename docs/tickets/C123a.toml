note = "Left by C123 (2026-11-04; measurement in C123's note and docs/notes/sound.md, 'Why the stream has its own thread'). Stepping the music from the main loop breaks it whenever a pass is longer than the queued halves (~0.35 s): a zone change held the main loop 0.39 s warm (97 ms of silence measured) and 2.7 s cold. A deeper queue delays every Now / AtMarker switch by its depth and moves the no-device halves (goldens). The thread can go only if the long passes step the stream too: the zone load, the new game, saves and loads, and on Windows the window's move / size modal loop (SDL keeps the main loop out of it). Then one path (FollowClock) for device and no device, and streamBusy / lateRequests / threadsQuit / StreamThread go. Measure first which passes over 300 ms happen with music playing (EI_AUDIO_TRACE's longest pass); one or two short real-device runs at most (EI_HARNESS_SOUND plays aloud). Done 2026-11-05: measured first (one real-device run, WASAPI, the verify build in real time: menu, new game, a jingle, zone change to gz2g, F5, F8, with a gap probe on every stream step). The passes over 300 ms (new game 313-328 ms, zone change 207 ms, F8 load) all come with the music stopped (the main menu's and LoadZone's StopAll(true), the load's); with music playing the passes were 60-139 ms (gz2g on the verify build, the F5 save among them) and the stream starved 0 frames; the only starved frames (2514) fell in the new game's load with the stream idle. So the thread went: FollowClock steps the stream on the game's clock for device and no device, called by the main loop, each loading-screen step (ShowLoadingMovie -> app::StepMusic) and the system's modal move/size loop (platform::SetModalLoopStep: an SDL event watch on live-resize redraws). streamLock, streamBusy, lateRequests, StreamRequest, Submit/Make*, threadsQuit, StreamThread, streamOnMainLoop and MakeThreadTimeCritical (sdl_threads.cpp) gone. Residual: a pass over ~74 ms with music playing can starve up to its length less 74 ms in the worst alignment (none seen). Suites: image 198 the same, 0 differ; Rebirth 113 the same, 0 differ."
