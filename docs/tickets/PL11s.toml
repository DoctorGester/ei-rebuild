id = "PL11s"
title = "The shared-opens check read and removed"
group = "port"
depends = ["PL11"]
note = "2026-10-30 after the PL11a+b merge: the main, x64 and Rebirth suites logged only read-while-read opens, of .res files (database / menus / figures) and maps/zq.mq; no write, no sharing violation. Only the deletion is left. PL11b made every File / MappedFile open shared for reading and writing (most were exclusive). platform_win32.cpp's temporary check (OpenHandle, Held, Release; ei::Log lines 'opened (read|write) while open (read|write) already' and 'a sharing violation') runs until a main suite and the Rebirth suite have run with it: read ei-rebuild.log of every run (two read opens of a .res / .reg / the random seed file were shared before too; any other line is an open the old modes refused: look at it before going on), then delete the check, its hook/log.h include and docs/notes/platform.md's paragraph; keep tests/vectors/hook_stub.cpp's ei::Log stub only if the platform still logs."
order = 1093
status = "done"
done = "2026-10-30"
