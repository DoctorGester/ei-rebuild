note = "Parked 2026-10-15 (branch worktree-agent-aebf200856ca815e9, commit d4888138, unfinished, off by default). EI_HEAP_UNINIT=<size=|block=|site=[ei_hook+]hex|all>[,from=,updates=,reports=] (tests/verify/harness_uninit.h; hooks in harness_heap.cpp): picked blocks move to no-access pages of a two-view section, a VEH decodes each access (x86/x87/SSE/VEX), keeps a written bitmap, emulates plain MOV/MOVZX/MOVSX via the second view, single-steps the rest (REP MOVS/STOS as one range, bits carried block to block); reads of never-written bytes -> uninit.txt, tools/uninit_report.py names them. Works: levers --no-hooks site=004981D2 names 00496EB0+0x14D reading CParticleSource +0x98 (origin) in one 24 s run; hooked size=0x1F0 names CParticleSource::Tick+0x158 (plus verify-wrapper snapshot reads). Not done: broad selections too slow (all: stuck at game start; all,from=30,updates=20 on sandbox_actions: ~4M traps while the level loads, timeout at step 9; last run after adding CarryBits/NoteBusy timed out at step 5 with no traps after u30, possibly a hang to investigate); no golden check run yet; doc section in standalone-verification.md not written; SV7b7 also adds a block counter in RepeatableHeapAlloc (merge conflict expected). Re-review 2026-10-28: closed, not done. ASan (C35m1a) catches heap overflows and use-after-free but not reads of never-written bytes (MSVC has no MemorySanitizer), so I13 was not replaced by it. It is closed because the goldens are layout-independent, the game code is ours now, and the parked branch (worktree-agent-aebf200856ca815e9) was built on hook-era heap hooks. If uninitialised reads ever matter: zero-initialise members by default (a style rule) rather than trap reads."
