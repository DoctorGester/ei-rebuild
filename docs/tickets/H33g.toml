id = "H33g"
title = "Files through lib/file_io: the last windows.h of the game's file users"
group = "harness"
note = "From H33f (docs/notes/cleanup-tooling.md, Build time). camera_object, random, world_game, net_link, resource, mod_folders, console_addon and script_addon_commands include windows.h only for the file calls they make through gameapi:: and their constants (FILE_BEGIN / FILE_END, INVALID_HANDLE_VALUE, INVALID_FILE_ATTRIBUTES, OPEN_EXISTING): moving them onto lib/file_io's File / FileFind (UTF-8, windows.h-free header) would drop windows.h from ~8 objects (~0.17 s each) and the raw handle code. Check by dumpbin per function or the goldens (seek and error behaviour must stay)."
