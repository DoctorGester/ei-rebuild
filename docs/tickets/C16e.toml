note = "docs/notes/cleanup-tooling.md 'NaN audit (C16c)'. C16c made the x87::IsNaN / CompareStatus sites plain comparisons with EI_NAN_AUDIT; left are the helpers that keep the original's NaN results without IsNaN: LessOrUnordered (combat*, effects*, particle_*, quaternion, terrain, unit_vitals, world_client SelectLess), ZeroOrUnordered, NonZero, EqualOrNaN (ui_item_strip, unit_record), IsZeroOrNaN (unit_stats, world_effect_sequence), AtMostOne / AtLeastZero / AtMostZero, ClampToMap, the ZeroOrNaN bit tests in device_mesh / object_tables / scene_bones, about 30 files. Same rule (rewrite guide 8): the plain comparison the source had, EI_NAN_AUDIT where the NaN result changes, the NaN-keeping plain form where it reads as naturally; check a NaN can never hang a loop. Goldens --golden 0 differ and no 'NaN audit' line in the runs' logs. Opus (judgement per site)."
