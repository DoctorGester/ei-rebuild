id = "S23"
title = "One game exe: the game linked into the exe, the harness its own DLL"
group = "standalone"
model = "opus"
depends = ["C59"]
note = "User 2026-10-29 (approved). The split is history: ei_standalone.exe is a ~100-line host that loads ei_hook.dll, which holds the whole game plus the harness, because the harness is still injected into game.exe for the reference runs (tools/launcher/launch.cpp InjectDll). End state: the game statically linked into the exe (no host, no DLL in a play build; the address image setup and image_data/image_imports move with it; C48 already took the fixed base); the harness (tests/verify/harness_*: clock, heap, settings, imports, digest) a separate small DLL that ei_launch injects into game.exe and that the standalone loads only under the harness (or links in for test builds only: pick the one with the smaller seam and say why). Find every place the harness reaches into game code and make it an explicit interface. Keep: play.cmd, run_all, the --no-hooks suite (a harness change: run it once, no --fresh), gen_iat's import table, asan. Update docs/notes/standalone.md and the build docs. Goldens unchanged. Runs after C59 (both move many files). Goal (user 2026-10-29): one exe you drop into the original game's folder (GOG vanilla or Rebirth) and it fully works: no ei_launch, no DLL, no side files needed to play (shaders and anything else embedded; ei_settings.ini / ei_rebirth.ini written with defaults or found by itself; the Rebirth profile picked from the folder's contents); list every file the play build still needs today and remove each need, or file follow-ups for what does not fit here.  Outcome: the game is linked into ei_standalone.exe (no ei_hook.dll; host.cpp's main calls StandaloneMain, a windowed exe whose entry is main; --check replaces the old no---run check, the game runs by default). The exe's static initialisation enters its own folder unless EI_GAME_ROOT is set (EnterGameFolder from image_data.cpp's mover, before game.exe's imports load). Without an ei_rebirth.ini and EI_GAME_ROOT the exe picks the Rebirth profile from its folder (starter\\addon.dll or EI_Plugin.asi: config/ei_rebirth_standalone.ini's flags, a spec written at configure time, with EI_Plugin.ini's players / pause; else defaults + WideScreen); the exe's own imports from System32 (/DEPENDENTLOADFLAG). Harness seam: linked into the verify exe (shared harness objects + tests/verify/image), and ei_harness.dll (shared harness, src/hook game.exe side, recorders, original_data.cpp shift 0, tests/verify/original/image_absent.cpp stubs; no game code, 0.7 MB) for game.exe. Why linked: the image side reaches our code through image_side.h's ~120 functions and the hook points; a DLL would need the exe to export all of them and load before its static initialisers. Logs name ours <module>+offset (ei::OwnModuleName); resolve_crash, randtrace, profile_report, check_x87, check_signatures follow. Notes: standalone.md 'The drop-in exe' and 'The harness's homes'. Checked: image suite 150 PASS, goldens 122 same / 28 without; --no-hooks 127 PASS, 114 same / 13 without; --check of the release exe dropped into folders with the vanilla / Rebirth DLLs from C:\\ (imports, both profiles). Follow-ups S23a (a scenario of the drop-in layout), S23b (the exe's and log's names)."
