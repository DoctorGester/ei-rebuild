note = "The 'free' exit functions static_exit.cpp lists as 'atexit at' (function-local statics: the function sets a guard bit, constructs the array and calls GameAtExit(address)): renderer_strip 007AF000-007AF040, renderer_sprites 007AEF90-007AEFE8, world_sync 007AFF18-007AFF48, world_tick 007AFEE0 / 007AFEF0, figure_mesh / figure_part_draw* 007C2E00 / 007C2E48 / 007C2E60, lightning_draw 0079C1D0, world_object_sets 007A9738, particle_render 007A9BD0, effects_weather_draw 007ABA30, link_mesh_draw 007AEEB8, world_client_decals 007AF478, terrain_sector 007C88B8, terrain_animation 007C8938, camera.h's 0079B210 (several files: check first). Same rule as C18k: constinit definition, the exit function ported on the name and registered at its address (the hand code's GameAtExit keeps passing that address); the guard bytes may stay data (run-time state) unless only that function uses them. By area, one batch per area group. Done in the same branch: renderer_strip (5), renderer_sprites (6 aligned arrays), figure_rasterise, figure_part_draw / _plain, lightning_draw, particle_render, effects_weather_draw, link_mesh_draw, terrain_animation (sorted sectors). 1,505 -> 1,461 game data addresses with C18k1. Left: camera 0079B1E0 / 0079B1F8 / 0079B210 (00402310), terrain 007C8890 / 007C88A8 / 007C88B8 (006BFF40) and 007C8950 (006C8990): unported functions reach them, so they wait for those ports; world_sync / world_tick / world_object_sets / world_client_decals were already done."
order = 389
