title = "The x87 game files on SSE2: survey with C30a2's PC24 method, plan batches, move the first"
note = "From C30a2 (2026-10-29): the original ran the main thread at 24-bit precision control, so a decision made of +, -, *, /, sqrt and compares on floats in the original's order is reproduced exactly by float maths on SSE2 (rounding with FISTP's ties to even, _mm_cvtss_si32; truncation as _ftol). sound_manager.cpp moved whole on that proof (30M random cases, 0 differ; docs/notes/sound.md 'Floating point'). Survey every file still /arch:IA32 (EI_GAME_SOURCES minus EI_SSE2_GAME_SOURCES, and EI_X87_DRAW_SOURCES): per file, what keeps it x87 (transcendentals x87::fsin/fcos/fpatan/flog/fexp whose results ignore the precision control; double constants with more than 24 bits mixed into arithmetic; code on threads at 53-bit; Ftol on NaN/overflow; x87::FromUnsigned), and group the files into batches that can move with goldens unchanged, plus what needs an exact software helper for the transcendentals. Write the plan into docs/notes/cleanup-tooling.md (SSE2 build) and file the batches as C30e1.. ; move the first batch. Check: goldens unchanged (verify and --rebirth-only), check_x87 0, an equivalence test like C30a2's (scratchpad C30a2/eq) for any helper. Done 2026-10-29: survey of the 417 x87 files by their release objects (dumpbin): 126 without a float instruction, 75 loads and stores only, 7 int / float conversions, 171 float arithmetic, 38 transcendental or control word. Batch 1 = the 208 without float arithmetic, on SSE2 (their SSE2 objects checked: no float arithmetic either). CMake lists inverted: EI_X87_GAME_SOURCES lists the 209 left, grouped by ticket; the rest of src/game and src/lib is the ei_sse2 library (was ei_draw); check_x87 reads the new list. Source: x87::CopyBits to plain assignment (net_messages, script_vars), x87::fistp to lib::RoundEven (new src/lib/rounding.h, sound_manager's moved there; unit_create, unit_items), renderer_init's ambient colour 0xFF323232, registry's FloatToInt through int64 (both conversions equal to the x87 forms on all 2^32 floats). Plan and batches C30e1-C30e15: cleanup-tooling.md 'The x87 files to SSE2 (C30e)'. Goldens 122 the same / 32 without a golden; --rebirth-only 24 / 8. Dashboard x87: x87:: 377 to 367, Ftol( 129 to 128, casts unchanged."
