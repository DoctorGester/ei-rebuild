note = "R37f5 (frame-plan.md, 'Measured after R37f3 and R37e4'): CasterDraws::Sort is 0.11 ms of the save's main thread (the sun map's 1874 draws and the occlusion depth's about 1800; std::sort comparing BindingKey's seven-field tuple, made twice per comparison) and 0.04 in the town's crowd; Upload compares the tuples again for runs. The sort only groups draws that bind the same things (depth-only passes: their order changes no pixel), so: give each draw a 64-bit key once in Add (the binding's rank among the frame's distinct bindings, found through a small table keyed by the kept mesh's pool slot and texture, then firstIndex and indexCount) and sort the keys, or bucket the draws by binding in one counting pass (no comparison sort at all); runs from key changes. The occlusion depth's draws (the world's depth-writing meshes) and the sun map's drawn casters are mostly the same meshes met in the same frame order: if R37f4 has not deleted that pass by then, check whether one grouping can serve both. Expected 0.11 -> about 0.02 ms. Same calls a frame (or fewer), same pictures; no golden change. Measure with build/r37f5's kit."
