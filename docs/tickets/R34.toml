note = "SectorData::Light (terrain_lighting.cpp) still runs on the CPU though the GPU lights the terrain (R26): the water layer's specular word (LightSpecular, kept because the harness digest reads it) and the sun's ray march SunReaches (run only where it could change the sector cache: it loads the sectors the ray crosses). Neither is drawn. Find whether anything but the digest and the cache order reads them; if not, stop computing both (the digest drops the field: a harness change, run the --no-hooks suite) and keep only the edge fade if the GPU needs it, or move that into the shader. User rule: no code kept only for an edge case. Also sweep docs/notes/renderer.md and ui-native.md for stale inventories (classic shadows, CPU terrain lighting, the pre-P8 surface table) and rewrite them as current facts. Check: goldens (the digest change re-recorded only for that field, reported), render_terrain frames, terrain_water_waves."
