note = "Style review round 3 (2026-11-04, https://claude.ai/artifact/KKkymAu9dSoUWGGcbsLwPa, digests in build/style_review/round3/*.md; user: file the tickets). Patterns Y1-Y10 into the rewrite guide and the checks (beside C106's round-2 rules): documented UB is not a fix (rule 9); one little-endian reader and stream vocabulary, no p += outside a buffer's file; a field or parameter that holds a kind takes the enum; every field initialised, reset by Reset(); saved types pair Load/Save members; re-justify every parameter when a library is replaced; no current-object globals without a scope guard; Rebirth behaviour named by its flag or 'always on'; one helper per owner, unique names per subsystem, declare where initialised; never key on a code address. check_cleanup lists enums with no uses, (Send|On)\\w*[0-9A-F]{2} names, IsZero/1/255/server-running copies, literal-returning functions and scope blocks copying temporaries; comments.py bans 'installs in the vanilla launch', 'called through its address', 'verify wrapper', 'scalar deleting destructor', EAX, 'the new renderer'. Fix what the checks find outside the areas C109-C125 cover, or list it. Style only: goldens the same (wire, save and file bytes unchanged), float operation order untouched, no new forwarders, normal C++ classes."
