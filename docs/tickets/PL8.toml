note = "User 2026-10-30: the platform layer should not be spread over many small files: ideally one src/platform/platform.h and one implementation .cpp per backend. Today: 19 headers in src/platform (audio, audio_formats, clipboard, clock, cursor, debug, file, files, ini, keyboard, keys, message_box, mouse, net, paths, system, thread, video, window) and 17 win32 .cpp files plus system_text, utf16.h, win_types.h; miniaudio/ (3 files), null/video.cpp, and A2's bink/. Merge the headers into platform.h (one namespace platform, sections per area; keys can stay a section), the win32 .cpp files into one win32 platform .cpp (system_text's UTF-8 routes and win_types stay win32-private, e.g. platform_win32.h for the loader's use), audio into one backend file beside its vendored library, the Bink decoder in its own file(s) (a codec, not platform glue). Also the import layer (user 2026-10-30): src/lib/win_api.h and gameapi.h / .cpp (gen_iat.py's output) belong in src/platform/win32 too: only the win32 backend and tests/verify call them (not in the harness key; import_table.h / import_prototypes.h are, so they stay or move with check_harness_key updated and a --no-hooks run); five game files (map_object_shadow, random, sound_manager, ui_saveload, world_game) still include gameapi.h without calling it: drop those includes; point gen_iat.py at the new paths. Moves only, goldens unchanged; update includes tree-wide by script, docs/notes/platform.md, check_platform. Run after A2 merges (it adds src/platform/bink and touches video.h)."
