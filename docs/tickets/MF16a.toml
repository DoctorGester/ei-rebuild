note = "After MF16 a client learns the host's mod only from a refused join. Our server's info answer (PacketKind::Info) could carry the mod mark after the entry, where an original client reads nothing: the list then names the mod and marks hosts this game cannot join; a host whose mod is in the menu's list could offer the switch. A pair scenario with the showcase mod. Done: the info answer's mark, the list's mod line and dimmed rows (net_pair_mod_list). The optional switch to the host's mod is not offered: mods switch only in the main menu (RequestModSwitch refused elsewhere), so it is not small."
