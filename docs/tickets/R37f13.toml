note = "User 2026-11-06 ('ok, if that lets us simplify the renderer'). Today every frame the game walks each object's parts, builds (camera x object x scale) x part matrices, tests each part against the view, and hands every mesh over (MeshDraw, FigureLight taking the camera back out with CameraInverse, KeepMesh, FillRecord); R37f9's design (renderer.md, 'Still objects' draws kept across frames') showed a cache in front of that walk is large and fragile because the camera is baked into every matrix. Instead: each object keeps its world matrix and instance data (per part: model matrix, material, light inputs) in the renderer, written only when the object changes (pose, scale, part set, wounds, lights in reach), and the shaders apply the frame's view-projection; the sun/ambient/fog stay per-frame uniforms, so nothing per object needs rewriting for them. Frames need not match at tolerance 0 (user: renderer upgrades replace the old look; goldens hold no frames) but must look the same to the eye (captures page before/after). Game state the walk writes must stay exact: FigureMeshFlag::Drawn, MapObjectFlag::Shown, the picking rectangles of units and levers (find every reader; R37f8's report on branch worktree-agent-abe81c850ddeded64 lists them), touchTime/Redraw. Delete the leftovers of the CPU lighting: the Static/Lit relight rule (max(10, n/8) un-Static per frame) and LightFigurePart's constant refills, if no game state needs them (check saves and digests). DESIGN FIRST in renderer.md with an estimate of lines added and deleted and of the gain (save5 at 4K, Msaa 1, Anisotropy 1: objects' draws 1.34 ms + PlanMeshDraws 0.25 + FigureLight; still and moving camera; the town's crowd), then hand back for my go before building. The goal is a simpler renderer: net lines should go down, not up. Units and moving objects go the same path (their matrices rewritten when they move). Goldens the same. 2026-11-06 design (renderer.md, 'Retained world objects'): not built, handed back for the go. About 1500 lines removed, 860 added: net about -650 (-450 if the new code comes out half larger). Gain in the save (release terms): about -1.0 ms with the camera moving, about -1.5 with it still (kept verdicts); the town's crowd main thread 1.51 -> about 1.2 (GPU-bound). Static stays (digest: client units' flags) written from the verdicts; the relight rule, touchTime, Redraw, TouchedModels, FigureMeshFlag::Lit and the colour refills go. Order: record split, retained DrawParts and sky, shadows read instances, Static from verdicts, kept verdicts."
