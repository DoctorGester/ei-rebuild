note = "main's 11:48 suite on 2026-10-28 had six first-run crashes in ntdll's heap (779E4834 / 779E4353 / 779E4E4E, edi a heap base) in effects, ground_prints, ui_compare, ui_help_page, ui_hud, ui_trade_restore; C36's runs show the same (free in CLinkMesh::~CLinkMesh and CMappedResource::CloseResource at exit, ui_camp_make / ui_widescreen mid-run) and the 'game still running 3 s after the scenario quit' line at exit. A retry passes, so suites stay green. Find the overrun: a block written past its end (the heap header after it is what breaks). Also: ui_gallery_deals fails on standalone-rebirth (waitwindow objectives after clicking a zone on the global map) on main's code too (C36 checked it on its asserts-only commit).  Result (2026-10-28): the ntdll heap crashes of the 11:48 / 12:17 suites predate C35m1's fix (merged 12:28: CWorldServer::Destroy's PlayerIterator decremented the freed player list; every free after it at quit could fail). Since then: main's 13:56 suite, this branch's vanilla + Rebirth --golden suites (319 runs: 0 first-run crashes; 121 / 146 the same), the six named scenarios 6 times each (36 runs, 0 crashes) and ASan sweeps of vanilla and --rebirth on main with C36 (319 runs, 0 asan reports). Exit hangs and start-up hangs are load stalls, not heap damage: empty exit_hang.txt (no thread left, kernel teardown), the original code's too (DirectDraw / DXGI teardown), and under a Windows audio stall the main thread in CSoundManager::Close -> AIL_waveOutClose -> DSOUND while games starting then wait 60 s in AIL_waveOutOpen (docs/notes/harness.md). One silent end (render_smooth Rebirth, report left RUNNING with no failure): run_all now keeps ei_launch's output in ei_launch.txt and fails such a run with its exit code. C14zj1 is unrelated (a fixed zone point on Rebirth's map)."
