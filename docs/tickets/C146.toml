id = "C146"
title = "Unit AI style re-check 2: actions, states, alert modes, behaviour codes and sense slots as enums"
group = "cleanup"
model = "sonnet"
depends = ["C145"]
note = "Style re-check of round-1 areas against the later rules (2026-11-05, digest build/style_review/round1b/unit_ai.md). Item A4 (Y3, Z3). AIBrain::action and PlayerMode::state become enum classes with an int32 underlying type (unit_ai.h:617, :344), typed at the field and saved as the same four bytes; alertMode's 0 / 1 / 2 (unit_ai.cpp:89, :114, :356) an AlertMode enum; BehaviourType and Reaction (unit_ai.cpp:716-717) move to map_spec.h as enum classes and type mapspec::Behaviour::type / alarm (same bytes); a Sense enum for UnitStats::perception / conspicuity and a MoveFactor enum for moveFactors in unit.h (unit.h:780-785 describe the slots only in a comment), used at the ~35 AI sites and for MeasureExposure's array; kFlagNearbyListed (senses:38) is the bit of MapObjectFlag::RelationsChanged: use that name and say that the sight refresh sets it (if the original's refresh means something else, record it as a quirk in docs/notes/unit_ai.md; do not change behaviour); the console filter bit (unit_ai.cpp:499, senses:270) named in console.h; one constant for fightAtWill's 1 (modes:425, :805). Combat's own sense-index sites may follow in the same commit if small; otherwise list them. Style only: goldens the same (wire, save and file bytes unchanged), float operation order untouched, no new forwarders, normal C++ classes."
order = 1146
