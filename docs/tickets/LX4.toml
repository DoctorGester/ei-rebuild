note = "platform_posix.cpp's LayoutKey / LayoutControlCharacter give nothing (sdl_keys.cpp's US rules) and KeyName is SDL's English name. Through SDL's keymap (SDL_GetKeyFromScancode with the modifiers) the layout's key codes and Ctrl characters, as PL9a did on Windows; key names in the layout's language if SDL or xkb gives them. Check by hand with a Russian layout, or a Linux reference for ei_input_check's cases."
