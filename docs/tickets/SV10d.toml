note = "Dropped (user 2026-10-21): don't change the number of drawn frames; make the frames faster instead (R16 renderer tickets). SV10: the drawing is 70-85% of a frame's wall time (the game's own CPU drawing: terrain projection, mesh lighting, classic shadow textures, GDI text; our renderer's submission ~6%; the GPU ~0.7 ms at 4K). Skipping the frame step (00458010 / app::FrameStep) on frames no step reads would make those frames 3-5x cheaper. But drawing changes state the digest reads: the client's particles draw ISAAC numbers while drawn (shared with the server's AI), CollectVisible sets the client units' 'model kept loaded' flag 0x400 from what is in view, the classic shadows and picking (clickunit, the cursor over units) read what was drawn, and captures need their frame. So every golden changes (re-record from the original skipping the same frames, harness-redirected CALL in WinMain), and code reached only while drawing loses coverage on skipped frames (draw every Nth frame, and always around steps that click, pick or capture). Lower priority than SV10a / SV10c."
