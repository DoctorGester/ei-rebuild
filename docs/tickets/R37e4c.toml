note = "User 2026-11-06: don't rewrite water vertex data each frame; animate the waves in the shader and keep a thin height sampling layer for the client's visual uses, closed-form if possible. AnimateWaves (terrain_sector.cpp) is a sine of the vertex's position along the wave direction plus phase * material priority plus a per-vertex phase offset (wavePhases), amplitude waveHeight * priority, plus the crest's specular colour: upload the per-vertex phase offsets and materials once, pass the frame's phase/direction/height as uniforms, do the lift and crest colour in the vertex shader. The CPU keeps Terrain::SurfaceHeight / SurfaceClass answering with the same wave heights computed on demand at the queried point (evaluate the 3 vertices' closed-form waves and the plane, no per-frame vertex pass): the server never reads waves (its surface height is the AI map's), the client readers are flying units' displayed height (UnitParams::movementKind 2 is the flyers: Banshee, Bat, Beholder, Dragon, Succub, Willowisp, Ancient Curse, Shadow; the constant is misnamed kMovesOnWater, rename it), shallow-water footstep/print class, rain splashes, spell blasts and strikes, insect swarms. Those stay as today. The camera's terrain sample (camera.cpp SampleTerrain, and the listener height) uses the water's flat level instead (the user: camera bobbing is not intended): one golden re-record expected only if a scenario's camera sits over water. AnimateWaves and the moved-water writes (0.15 + 0.08 ms on the save, R37e4b) go. Measure with work.py test --quiet at the user's settings (Msaa 1, Anisotropy 1). Done: AnimateWaves and the water's per-frame writes deleted; terrain.hlsl's waved moves the water and gives the crests (phase offset in loss, material/column/row in the specular word's colour bytes, per-material uniforms); Terrain::WaterVertex answers SurfaceHeight/SurfaceClass; camera and listener on CalmSurfaceHeight; kFlies. Sampler vs old pass: 99.92% of vertices bit-identical to the old formula with its phase base at rest (rest one sine entry, <=0.00018); vs the old pass as it was (base read from its moved vertex 0, a frame late) 5% identical, mean 0.0017 units. Goldens re-recorded: camera focus.z (7 runs), two flyers' client place, terrain_water_waves. Save at msaa 1: RunTick walk 0.17 -> 0.012 ms, 334 KB -> 0 terrain writes, main thread median 4.79 -> 4.64 ms."
