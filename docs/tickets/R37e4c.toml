id = "R37e4c"
title = "Waves in the vertex shader: water vertices static on the GPU, a thin closed-form wave height sampler on the CPU for client visuals; the camera samples the flat water"
group = "renderer"
size = 2
model = "opus"
files = ["src/game/terrain/terrain_sector.cpp", "src/game/terrain/terrain.cpp", "src/render/render_terrain.cpp", "src/render/render_water.cpp", "src/render/shaders/terrain.hlsl", "src/game/scene/camera.cpp"]
note = "User 2026-11-06: don't rewrite water vertex data each frame; animate the waves in the shader and keep a thin height sampling layer for the client's visual uses, closed-form if possible. AnimateWaves (terrain_sector.cpp) is a sine of the vertex's position along the wave direction plus phase * material priority plus a per-vertex phase offset (wavePhases), amplitude waveHeight * priority, plus the crest's specular colour: upload the per-vertex phase offsets and materials once, pass the frame's phase/direction/height as uniforms, do the lift and crest colour in the vertex shader. The CPU keeps Terrain::SurfaceHeight / SurfaceClass answering with the same wave heights computed on demand at the queried point (evaluate the 3 vertices' closed-form waves and the plane, no per-frame vertex pass): the server never reads waves (its surface height is the AI map's), the client readers are flying units' displayed height (UnitParams::movementKind 2 is the flyers: Banshee, Bat, Beholder, Dragon, Succub, Willowisp, Ancient Curse, Shadow; the constant is misnamed kMovesOnWater, rename it), shallow-water footstep/print class, rain splashes, spell blasts and strikes, insect swarms. Those stay as today. The camera's terrain sample (camera.cpp SampleTerrain, and the listener height) uses the water's flat level instead (the user: camera bobbing is not intended): one golden re-record expected only if a scenario's camera sits over water. AnimateWaves and the moved-water writes (0.15 + 0.08 ms on the save, R37e4b) go. Measure with work.py test --quiet at the user's settings (Msaa 1, Anisotropy 1)."
order = 1277
