id = "PL9"
title = "SDL3 backend for the window, input and system layer"
group = "port"
model = "opus"
depends = ["PL8"]
note = "User 2026-10-30: sokol_app was rejected (the game's nested message loops, the renderer owning the D3D11 swapchain, the harness driving input through the window procedure), so use SDL3 instead. SDL3 fits: it does not own the main loop (SDL_PollEvent from the game's own loops), exposes the HWND for our D3D11 swapchain (SDL_GetPointerProperty(SDL_GetWindowProperties(w), SDL_PROP_WINDOW_WIN32_HWND_POINTER)), and covers window, keyboard and mouse (scancodes/keycodes mapped to platform::kKey*), cursor and warping, clipboard, message box, timing, threads, paths (SDL_GetBasePath / SDL_GetPrefPath), and audio. Plan: vendor SDL3 (zlib licence, third_party/, static or a DLL beside the exe: decide and say), implement platform.h with it, keep the win32 backend only where SDL has no equivalent or the harness needs it. The harness: today it drives input through PeekMessageA, the window procedure and the EIGAME window class (tests/verify): either inject through SDL (SDL_PushEvent) on the image side or keep the window procedure path for harness runs; the --no-hooks suite runs the original game.exe and must stay untouched. Audio (user 2026-10-30: my call): SDL3 audio streams for the device (our mixer stays), miniaudio dropped; dr_wav / dr_mp3 decoding stays as the single-header libraries (SDL does not decode MP3). No exclusive full screen or display mode switch (borderless desktop-size full screen). Goldens unchanged; x64 build too; play check."
order = 1087
