note = "R52b found: the ground (scene_lighting.hlsli ground_light) keeps the specular point lights (script and spell lights, pointColour.w 1) apart: lit = max(other lights, spec) and spec is added again after the texture (terrain.hlsl: t * lit + spec). A ground print's ground_shade (mesh.hlsl) takes every light as a max and GroundDecalLight drops the specular flag (its pointColour.w holds the point shadow slot), so a print under such a light misses the added glow its ground has: it shows darker than the ground by about spec x its alpha. Fix: carry the flag into MeshLightParams (a new float4 of flags, C++ and HLSL), ground_shade returns the specular part apart, and the print pixel takes rgb * shade + spec (darkened by the same shade as the ground's); 'full' stays the non-specular reference. Check with a frame capture of a blood print under a spell or script light (before / after on the captures page); goldens hold no frames."
