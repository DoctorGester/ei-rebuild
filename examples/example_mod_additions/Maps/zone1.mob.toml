# Records that ei-convert --example-mod appends to the game's zone1.mob as ei-convert writes it (the mod's
# Maps\zone1.mob.toml holds every object of the zone: docs/modding.md, "Map objects").

# A pig beside the party's start (54, 138) in a new game. A unit needs few fields: the keys left out take their
# defaults (no stats of its own: apply_stats is 0, so the prototype's are used). The id is one no record of the file
# has; parent_id is the object's class (52: a unit such as the zone's other pigs) and must be given.
[[object]]
kind = "unit"
id = 3001
name = "ExamplePig"
texture = "unanhopi"
primary_texture = "PigF0"
skin_texture = "default0"
parent_iname = "Pig00"
parent_id = 52
position = [51.0, 142.0, 0.0]
side = 5
prototype = "PigF0"

[[object.behaviour]]
type = "guard"
alarm = "watch_fearful"
guard = [51.0, 142.0, 0.0]
guard_radius = 5.0
call_radius = 5.0
