# The mod's spell (docs/modding.md, "Spells"): Chain Spark, a new record after the game's 42. Its `script` makes it
# scripted: Res\spells\chain_spark.lua runs each cast, on the server. The spark it throws and the sparks of a strike are
# the mod's data effects Res\effects\ChainSpark.effect.toml and ChainSparkHit.effect.toml, the shock it leaves on a
# struck unit (its own active effect: `look`) ChainSparkShock.effect.toml, the caster's while it casts (`cast_look`)
# ChainSparkCast.effect.toml; its pictures are Res\textures\spell0101.png and prototype0101.png (icon 101). The
# island's quest gives it (Maps\showcase.lua).

[[spell]]
name = "Chain Spark"
code = "spark"
script = "chain_spark.lua"
price = 300.0
school = "lightning"
mana = 8.0
complexity = 1
range = 15.0                    # how far the caster can throw it
area = 78.5                     # the jump's reach: radius sqrt(78.5 / pi), about 5; 'a' runes widen it
damage = 12.0                   # the first strike; each one after it deals 0.6 of the one before; 'e' runes raise it
target_kind = "unit"
target_count = 3                # strikes; 't' runes add
cast_time = 45
needs_sight = true
icon = 101
allowed_modifiers = { range = 1, targets = 1, effect = 1, area = 1 }
skill = 0                       # a new game's hero (no elemental skill) can put it on; runes raise the need
sold_by = ["ingos_trader", "rick"]
light_color = [0.3, 0.6, 0.9]
light_range = 2.0
light_rise_divisor = 10.0
ai = "attack"                   # a unit given it casts it at its enemies, its damage judged as lightning
damage_type = "lightning"
offensive = true                # the HUD's cast at once aims it at the nearest enemy
look = "ChainSparkShock"        # its own effect on a struck unit shows Res\effects\ChainSparkShock.effect.toml
cast_look = "ChainSparkCast"    # the caster shows Res\effects\ChainSparkCast.effect.toml while it casts

# The mod's buff (docs/modding.md, "Active effects"): Ember Brand, a curse on a unit, the spell's own active effect.
# Res\spells\ember_brand.lua gives it: OnStats saps the victim's strength (a stat none of the game's buffs touches),
# OnEffectTick burns it every 10 ticks, OnEffectEnded says how it went. Its look while it lasts is the game's fire
# sphere. No item carries it: a mission script (or the console) casts it with CastSpellUnit("ember", ...).
[[spell]]
name = "Ember Brand"
code = "ember"
script = "ember_brand.lua"
school = "fire"
target_kind = "unit"
damage = 5.0                    # the strength it saps (the effect's value)
duration = 120                  # ticks the brand lasts
icon = 101
damage_type = "fire"
offensive = true
look = "SphereFire"
