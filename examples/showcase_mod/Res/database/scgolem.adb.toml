# The golem's animation list (docs/modding.md, "Records as TOML"): a new file, no game file below it. Each
# animation is a glTF animation of Res\figures\scgolem.glb of the same name, played to its `frames`. `kind`, `move`,
# `play` and the kind's parts (an attack's `height` and `blow`, a death's `fall`) say when the game plays it, as the
# game's creatures have the same animations; `flags_other` are the bits nothing reads that the game's give them
# (docs/modding.md, "Animation lists"). `steps` are its footfalls, `moment` the frame a blow lands. It plays no sounds.
name = "Showcase Golem"
start = 0.5
length = 0.76
end = 1.0

