# The golem's animation list (docs/modding.md, "Records as TOML"): a new file, no game file below it. Each
# animation is a glTF animation of Res\figures\scgolem.glb of the same name, played to its `frames`; `key` and
# `flags` say what the game uses it for (the values the game's creatures give the same animations), `steps` its
# footfalls, `moment` the frame a blow lands. It plays no sounds.
