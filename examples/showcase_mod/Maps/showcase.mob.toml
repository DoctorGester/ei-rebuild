# The showcase island's objects (docs/modding.md, "Map objects"): the objects of the mod's own zone, which has no
# .mob. Its script is showcase.lua beside it.
script = "showcase.lua"
applies_relations = true

[[weather]]
wind = [-0.6, -0.8, 0.0]
wind_strength = 0.2
time = 11.0

# Player 0 is the party; the golem plays for player 3, named "Golems" here so the golem's side can say it (the game
# reads no player's name), hostile to it both ways. The other pairs keep the default relation (neutral; each player
# allied with itself), and every other player its name "Player-<n>".
[players]
names = { 3 = "Golems" }
hostile = [[0, 3], [3, 0]]

# The golem: the mod's creature (Res\database\units.udb.toml's "ShowcaseGolem"), guarding the path north-east of the
# party's landing. Its texture is Res\textures\scgolem00.png; the script finds it by its id.
[[object]]
kind = "unit"
id = 4001
name = "ShowcaseGolem"
texture = "scgolem"
primary_texture = "ShowcaseGolem"
parent_iname = "ScGolem00"
class = "creature"
position = [78.0, 116.0, 0.0]
side = "Golems"
shadow = true
prototype = "ShowcaseGolem"

[[object.behaviour]]
type = "guard"
guard = [78.0, 116.0, 0.0]
guard_radius = 8.0
call_radius = 12.0

# The golem's shards (Res\database\units.udb.toml's "ShowcaseShard") behind it, each within the Chain Spark's reach (5)
# of the one before: the golem, then 4002, then 4003. They play for the golems' side too, and keep near their posts
# (guard_radius 2: a guard wanders within its radius until it sees an enemy).
[[object]]
kind = "unit"
id = 4002
name = "ShowcaseShard"
texture = "scgolem"
primary_texture = "ShowcaseShard"
parent_iname = "ScShard00"
class = "creature"
position = [80.5, 115.0, 0.0]
side = "Golems"
shadow = true
prototype = "ShowcaseShard"

[[object.behaviour]]
type = "guard"
guard = [80.5, 115.0, 0.0]
guard_radius = 2.0
call_radius = 12.0

[[object]]
kind = "unit"
id = 4003
name = "ShowcaseShard"
texture = "scgolem"
primary_texture = "ShowcaseShard"
parent_iname = "ScShard00"
class = "creature"
position = [82.5, 117.5, 0.0]
side = "Golems"
shadow = true
prototype = "ShowcaseShard"

[[object.behaviour]]
type = "guard"
guard = [82.5, 117.5, 0.0]
guard_radius = 2.0
call_radius = 12.0
