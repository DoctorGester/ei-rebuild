; Evil Islands settings (ei-rebuild.exe). Each [section] holds name = value lines: numbers, true or
; false, text as it is (in "quotes" when it starts or ends with a space). Lines starting with ; or #
; are comments. The game rewrites this file when it saves its options; delete it to get the defaults.
; The comment above a line says what it does; docs/settings.md lists every setting the game reads.

[video]
; The size the game draws at. Full screen, the picture is scaled to the monitor keeping its shape; in a
; window, the window's size. (WxH)
VideoResolution = 1280x720
; A borderless window covering the monitor; false: a window with a title bar, the resolution's size, centred
; on the main monitor (it can be moved and resized). The display mode never changes. The options screen's
; display mode row sets it while the game runs.
FullScreen = true
; The game's movies: 0 none, 1 at their own size in the middle of the screen, 2 stretched to the screen's
; width. Loading screens show either way. (0, 1 or 2)
Video = 2
Brightness = 0
Gamma = 0

[sound]
; Sound on; false: no sound effects, voices, music or movie sound at all.
Audio = true
; The volume of the music and of the movies' sound; 0 turns the music off. (0 .. 100)
AudioStreaming = 100
; The volume of the sound effects. (0 .. 100)
AudioSFX = 100
; The volume of the characters' voices. (0 .. 100)
AudioSpeech = 100
Reverse Stereo = false

[shadows]
; Units, buildings and trees cast shadows, and hills and cliffs cast the sun's shadows across the ground. The
; options screen's switch sets it.
Shadows = true

[camera]
; A freer camera (Rebirth's starter's "Камера Чейза"), on the maps and the village screens alike:
; it tilts from 45 degrees above level to straight down, zooms from right at the point it looks at out to 50,
; may come down to the ground, and draws units and effects at any distance. While on, it stands in for the
; pitch, distance and height limits, NearClipDistance (1), FarClipDistance and CameraTerrainSensetiveArea
; (0.1); their lines keep your own values for when it is off. The speeds, flips and camera views stay yours.
; The options screen's chase camera row sets it.
ChaseCamera = false
; Reverses which way the camera turns when you drag sideways with the right mouse button. The keys are not
; affected.
CameraFlipXAxis = false
; Reverses which way the camera tilts when you drag up or down with the right mouse button. The keys are not
; affected.
CameraFlipYAxis = false
; The lowest the camera may sit above the ground under it or the tops of nearby trees and buildings; it is
; pushed up to keep this clearance. (world units)
CameraMinHeight = 3
; The most a tall object next to the camera (a tree, a building) can lift it above the ground. It does not
; limit zooming out. (world units)
CameraMaxHeight = 70
; The camera's height when the game launches. The menu scene and every map place the camera themselves right
; away, so it has no visible effect. (world units)
CameraDefaultHeight = 2
; The camera's map X position when the game launches. The menu scene and every map place the camera themselves
; right away, so it has no visible effect. (map X, world units)
CameraDefaultXDeploy = 30
; The camera's map Y position when the game launches. The menu scene and every map place the camera themselves
; right away, so it has no visible effect. (map Y, world units)
CameraDefaultYDeploy = 30
; The closest you normally zoom in during play: the wheel stops here and a key zoom past it drifts back.
; Panning speeds up as you zoom out from here. (world units)
CameraMinDistanceToCarrier = 10
; The farthest you normally zoom out during play: the wheel stops here and a key zoom past it drifts back.
; Panning speeds up as you zoom out toward it. (world units)
CameraMaxDistanceToCarrier = 50
; The hard limit on zooming in during play: a key zoom can pass the normal closest distance and drift back,
; but never gets nearer than this. (world units)
CameraMinLimitDistanceToCarrier = 3
; The hard limit on zooming out during play: a key zoom can pass the normal farthest distance and drift back,
; but never goes beyond this. (world units)
CameraMaxLimitDistanceToCarrier = 70
; How far the camera starts from the point it looks at when you first enter a map after launching; later map
; changes keep your own zoom. (world units)
CameraDefaultDistanceToCarrier = 30
; Anything closer to the camera than this is cut away and not drawn. Read when the game starts. (world units)
NearClipDistance = 2
; How far along the view units, levers, particles and lightning are shown. The ground, trees and buildings are
; drawn to the map's edge whatever this is, under a haze that thickens with distance. (world units)
FarClipDistance = 100
; The flattest you can tilt the camera during play, in degrees down from level. (degrees (0 level, 90 straight
; down))
CameraDefaultMinPitch = 30
; The steepest you can tilt the camera during play; 90 would look straight down. (degrees (0 level, 90
; straight down))
CameraDefaultMaxPitch = 60
; The closest you normally zoom in on the village screens between missions: the wheel stops here and a key
; zoom past it drifts back. (world units)
CameraBriefingMinDistanceToCarrier = 6
; The farthest you normally zoom out on the village screens between missions: the wheel stops here and a key
; zoom past it drifts back. (world units)
CameraBriefingMaxDistanceToCarrier = 27
; The hard limit on zooming in on the village screens between missions: the camera never gets nearer than
; this. (world units)
CameraBriefingMinLimitDistanceToCarrier = 3
; The hard limit on zooming out on the village screens between missions: the camera never goes beyond this.
; (world units)
CameraBriefingMaxLimitDistanceToCarrier = 30
; The flattest you can tilt the camera on the village screens between missions, in degrees down from level.
; (degrees (0 level, 90 straight down))
CameraBriefingMinPitch = 40
; The steepest you can tilt the camera on the village screens between missions; 90 would look straight down.
; (degrees (0 level, 90 straight down))
CameraBriefingMaxPitch = 60
; The camera's look-at point rides on the average ground height this far around it; larger smooths out bumps.
; Keep it above 0 (0 hangs the game). (world units, above 0)
CameraTerrainSensetiveArea = 10
; Base speed of panning with the camera keys and with Ctrl or Alt + right-drag; multiplied by the keyboard or
; mouse power below. (multiplier)
CameraDefaultScrollSpeed = 1.5
; Mouse factor for panning with Ctrl or Alt + right-drag. The options window's mouse speed slider sets all
; four mouse factors. (multiplier, 0..2 from the slider)
CameraDefaultScrollPowerMouse = 1
; Keyboard factor for panning with the camera keys. The options window's keyboard speed slider sets all four
; keyboard factors. (multiplier, 0..2 from the slider)
CameraDefaultScrollPowerKeyboard = 0.46
; Base speed of turning the camera: right-drag sideways, or Ctrl or Alt + the left/right camera keys.
; (multiplier)
CameraDefaultRotateSpeed = 0.15
; Mouse factor for turning the camera with a right-drag. The options window's mouse speed slider sets all four
; mouse factors. (multiplier, 0..2 from the slider)
CameraDefaultRotatePowerMouse = 1
; Keyboard factor for turning the camera with Ctrl or Alt + the left/right camera keys. The keyboard speed
; slider sets all four. (multiplier, 0..2 from the slider)
CameraDefaultRotatePowerKeyboard = 0.46
; Base speed of tilting the camera: right-drag up or down, or Ctrl or Alt + the up/down camera keys. Small
; because the game scales it up. (multiplier)
CameraDefaultPitchSpeed = 0.0015
; Mouse factor for tilting the camera with a right-drag. The options window's mouse speed slider sets all four
; mouse factors. (multiplier, 0..2 from the slider)
CameraDefaultPitchPowerMouse = 1
; Keyboard factor for tilting the camera with Ctrl or Alt + the up/down camera keys. The keyboard speed slider
; sets all four. (multiplier, 0..2 from the slider)
CameraDefaultPitchPowerKeyboard = 0.46
; Base speed of zooming with the zoom keys and the mouse wheel; at the defaults one wheel notch zooms about
; 10%. (multiplier)
CameraDefaultZoomSpeed = 2
; Mouse factor for zooming with the wheel. The options window's mouse speed slider sets all four mouse
; factors. (multiplier, 0..2 from the slider)
CameraDefaultZoomPowerMouse = 1
; Keyboard factor for zooming with the zoom keys. The options window's keyboard speed slider sets all four
; keyboard factors. (multiplier, 0..2 from the slider)
CameraDefaultZoomPowerKeyboard = 0.46
; How close to a screen edge the mouse must be to pan the camera; 0 turns edge scrolling off. Edge panning
; ignores the scroll speed settings. (pixels, 0 = off)
CameraBorderScrollArea = 1
; How far the mouse must move with the left button held before it starts a selection box; 0 turns box
; selection off. (pixels, 0 = off)
CameraFrameSelectionSensetiveArea = 30
; Part of the facing stored with camera view n (Ctrl or Alt + a camera view key saves one); recalling a view
; does not turn the camera, so it has no effect. (unit axis component)
CameraShortcut 0 AxisX = 0
; Part of the facing stored with camera view n (Ctrl or Alt + a camera view key saves one); recalling a view
; does not turn the camera, so it has no effect. (unit axis component)
CameraShortcut 0 AxisY = 0
; Part of the facing stored with camera view n (Ctrl or Alt + a camera view key saves one); recalling a view
; does not turn the camera, so it has no effect. (unit axis component)
CameraShortcut 0 AxisZ = 1
; The turn stored with camera view n's facing (Ctrl or Alt + a camera view key saves one); recalling a view
; does not turn the camera, so it has no effect. (radians)
CameraShortcut 0 Angle = 0
; The zoom of camera view n (0-3). Ctrl or Alt + camera view key n+1 saves the current zoom and tilt; the key
; alone brings them back. (world units)
CameraShortcut 0 Distance = 30
; The tilt of camera view n, recalled with its zoom by camera view key n+1. Saved in radians: the default 45
; tilts about 58 degrees down. (radians (a saved view writes radians))
CameraShortcut 0 Pitch = 45
CameraShortcut 1 AxisX = 0
CameraShortcut 1 AxisY = 0
CameraShortcut 1 AxisZ = 1
CameraShortcut 1 Angle = 0
CameraShortcut 1 Distance = 30
CameraShortcut 1 Pitch = 45
CameraShortcut 2 AxisX = 0
CameraShortcut 2 AxisY = 0
CameraShortcut 2 AxisZ = 1
CameraShortcut 2 Angle = 0
CameraShortcut 2 Distance = 30
CameraShortcut 2 Pitch = 45
CameraShortcut 3 AxisX = 0
CameraShortcut 3 AxisY = 0
CameraShortcut 3 AxisZ = 1
CameraShortcut 3 Angle = 0
CameraShortcut 3 Distance = 30
CameraShortcut 3 Pitch = 45

[game]
; 1: a small arrow on the ground under each selected unit shows where it faces. 0: no arrow, selected units
; are only highlighted. (0 or 1)
SelectionType = 1
DrawPath = true
DrawFlyingHP = true
ShowTutorial = false
Autosave = true
ToolTip Time = 0.5
SwitchFilters = true
Difficulty Level = 0

[network]
; The server the multiplayer screen asks for games and hosted games announce to (port 28004 unless given). The
; game reads it but never writes it back. (host[:port])
Master Server Name = a3master.nival.com

[renderer]
; Each frame waits for the monitor's refresh: no tearing. false: frames show as soon as they are drawn. The
; options screen's vertical sync row sets it.
VSync = true
; Multisampling of the 3D world: smoother edges on models and the ground. 1 is off; more than the graphics
; card offers takes its best. The options screen's antialiasing row sets it. (1, 2, 4 or 8)
Msaa = 8
; Sharper textures on surfaces seen at a slant, such as the ground into the distance. 1 is off. The options
; screen's anisotropic filtering row sets it (1, 2, 4, 8 or 16). (1 .. 16)
Anisotropy = 16
; Shows frames per second, frame and graphics card times and draw counts over the game. The options screen's
; performance overlay row sets it.
PerfOverlay = false

[autoexec]
; Console lines run before autoexec.cfg, one per line: 1 = <command>.

[paths]
Work path = .\
Resources path = .\res\

[terrain]
BorderFogDistance = 16
