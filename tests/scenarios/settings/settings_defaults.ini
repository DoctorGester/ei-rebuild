; Evil Islands settings (ei-rebuild.exe). Each [section] holds name = value lines: numbers, true or
; false, text as it is (in "quotes" when it starts or ends with a space). Lines starting with ; or #
; are comments. The game rewrites this file when it saves its options; delete it to get the defaults.

[video]
; FullScreen: a borderless window over the monitor (the display mode never changes).
VideoResolution = 1280x720
FullScreen = true
VideoColorDepthInBits = 32
Antialiasing = true
Mipmapping = true
Filtering = 2
TextureQuality = 0
ShowParticles = true
DrawingTarget = 0
VideoZBufferDepthInBits = 16
VideoRefreshRate = 0
Video = 0
Dithering = false
Specular = false
PerspectiveCorrection = true
FPSIndependentCursor = true
AutomaticQuantization = false
MovieCapturingFPS = 15
Brightness = 0
Contrast = 0
Gamma = 0

[sound]
; Volumes 0..100.
Audio = true
AudioStreaming = 100
AudioSFX = 100
AudioSpeech = 100
Reverse Stereo = false

[shadows]
ShadowQuality = 2
HeroShadow = true
UnitShadow = true
BuildingShadow = true
FloraShadow = true
OtherShadow = true
LightingFreq = 10000
FloraSpecialLight = false

[terrain]
LightingFreq = 1000
EnableWaterWaves = true
EnableDynamicLights = true
EnableSelfShadowing = true
EnableFootprints = true
EnableBloodprints = true
EnableFireprints = true
BorderFogDistance = 16
ShadowingFreq = 6000
EnableBloodprintsRelight = false

[camera]
CameraFlipXAxis = false
CameraFlipYAxis = false
CameraMinHeight = 3
CameraMaxHeight = 70
CameraDefaultHeight = 2
CameraDefaultXDeploy = 30
CameraDefaultYDeploy = 30
CameraMinDistanceToCarrier = 10
CameraMaxDistanceToCarrier = 50
CameraMinLimitDistanceToCarrier = 3
CameraMaxLimitDistanceToCarrier = 70
