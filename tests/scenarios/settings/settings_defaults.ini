CameraShortcut 3 AxisY = 0
CameraShortcut 3 AxisZ = 1
CameraShortcut 3 Angle = 0
CameraShortcut 3 Distance = 30
CameraShortcut 3 Pitch = 45

[game]
UseSWCursors = false
SelectionType = 1
Hero Light R = 216
Hero Light G = 216
Hero Light B = 116
Hero Light Radius = 5
Quest Light R = 120
Quest Light G = 72
Quest Light B = 120
Quest Light Radius = 5
ObjectsLightingCoeff = 2
DefaultMapName = Zone1.mpr
DefaultStreamingSound = melody.mp3
Joystick = false
DefaultWindForce = 0.4
DefaultTimeScale = 60
CornerSize = 0.5
DrawVisibleOnly = true
DrawPath = true
DrawFlyingHP = true
ShowTutorial = false
Autosave = true
ToolTip Time = 0.5
SwitchFilters = true
CD1 Label = EICD1
CD2 Label = EICD2
CD3 Label = EICD3
Font CharSet = english
Keyboard Layout = 1033
Difficulty Level = 0
FogNightStartDistance = 50
FogDayStartDistance = 90

[network]
Master Server Name = a3master.nival.com

[renderer]
; Msaa: the world's multisampling, 1 (off), 2, 4 or 8. Anisotropy: 1 (off) .. 16. PerfOverlay:
; FPS, frame and GPU times, draws.
VSync = true
Msaa = 8
Anisotropy = 16
PerfOverlay = false

[patches]
; Rebirth's patches (docs/notes/rebirth.md), name = true or false. A patch not named here takes the
; game folder's profile: Rebirth's in a Rebirth install, else none. NPlayers,
; Pause: EI_Plugin's player count and pause mode. SecondMaster: a second master server, host[:port].

[rebirth]
; Read with Rebirth's mod folder patches on ([patches]). AddonPath: the mod's folder.

[autoexec]
; Console lines run before autoexec.cfg, one per line: 1 = <command>.

[paths]
Work path = .\
Resources path = .\res\
CD-ROM Path = .\

[statistics]
CreateOutputInfo = false
NumberOfFrames = -1
