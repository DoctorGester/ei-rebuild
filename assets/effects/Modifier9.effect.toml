# Modifier9 (0x2023, the Stun texture, marker frame 8): a spell's mark on a unit, Modifier1's ring of points (its
# file says how they move) in every direction (a ball).
# Modifier10, Modifier11 and Modifier12 are built on it (like = "Modifier9"): what changes here changes them too.
# The original types on data: docs/notes/effects.md, "The original effects on data".

like = "Modifier1"

[[anchor]]
name = "point"

[anchor.vars]
vx = "a.spawn.x - 0 * (0 * a.spawn.x + 0 * a.spawn.y + 0 * a.spawn.z)"
vy = "a.spawn.y - 0 * (0 * a.spawn.x + 0 * a.spawn.y + 0 * a.spawn.z)"
vz = "a.spawn.z - 0 * (0 * a.spawn.x + 0 * a.spawn.y + 0 * a.spawn.z)"

[[particle]]
name = "marker"
frame = 8
