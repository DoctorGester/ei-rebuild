# CurseHolder (0x2050, the Tornado texture): a dark funnel around a cursed unit's body. Six rings, 4.8 high, sway with
# the carrier's motion (damped by 0.95 a tick, less towards the top), the bottom one 1 above the ground. Four particles
# a tick, as the Tornado's but black, turning about the funnel; let go, the source stops while it has particles.
# The original types on data: docs/notes/effects.md, "The original effects on data".

texture = "Tornado"
attach = "attached_only"
part = "body"

[source]
height = 0.2

[emit]
rate = 4
max = 800

# The funnel's height (fh). Each tick: the bottom ring's height over the source (z0) and the sway (w), the bottom
# ring's place less the motion, damped.
[vars]
fh = "12 * 0.4"
z0 = { tick = "ground(origin) - origin.z + 1" }
w = { tick = "(ring.r[0].xy - motion.xy) * 0.95" }

[[on]]
event = "tick"
when = "!attached && count > 0"
do = [{ stop = true }]

# The rings, bottom to top: the sway less a half cosine up the funnel.
[[anchor]]
name = "ring"
count = 6

[anchor.vars]
r = { tick = "vec3(w * cos(a.index / 5 * pi * 0.5), a.index == 0 ? z0 : 0)" }

# A particle: its height up the funnel (lv, 0..1) and its climb (cl), debris or dust (st), its turn about the funnel's
# centre (ang) and the turn's step (sp), its distance (rad) and opacity (op); placed between the two rings about its
# height.
[[particle]]
name = "piece"
lifetime = "pick(9) + 100"
position = { tick = "origin + vec3(circle(p.ang).yx * p.rad + lerp(ring.r[min(floor(p.lv * 5), 4)].xy, ring.r[min(floor(p.lv * 5), 4) + 1].xy, min(p.lv * 5 - min(floor(p.lv * 5), 4), 1)), p.lv * fh + ring.r[0].z)" }
size = { start = "p.st != 0 ? (p.rad + 0.3) * size : size * 0.15", tick = "p.st != 0 ? (p.rad + 0.3) * size : p.size" }
color = "vec3(0)"
alpha = { start = 25, tick = "round(sqrt(1 - p.lv) * p.op * 255)" }
frame = { start = "p.st != 0 ? pick(12) : pick(4) + 12", tick = "p.st != 0 ? (p.frame + 1) % 12 : (p.frame + 1) % 4 + 12" }
kill = "p.lv > 1"

[particle.vars]
lv = { start = "range(0, 1)", tick = "p.lv + p.cl" }
st = "pick(3)"
ang = { start = "range(-pi, pi)", tick = "p.ang + p.sp" }
rad = { start = "range(0.8, 2) * ((1 - p.lv) * (1 - p.lv) * ((1 - p.lv) * (1 - p.lv)) + 0.2) * 2", tick = "0.997 * p.rad" }
sp = { start = "range(pi * 0.06, pi * 0.07) * (1.1 - (1 - p.lv) * (1 - p.lv)) * 1.5", tick = "p.sp * 1.01" }
op = { start = 0.1, tick = "p.life > 8 ? min(p.op + 0.1, 1) : max(0.1, p.op)" }
cl = { start = 0, tick = "p.cl + 0.0001" }
