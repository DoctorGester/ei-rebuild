# CastingDomination (0x202C, the Casting3 texture): a dominator's cast, CastingIllusion's (its file says how the lights
# and sparks move) with one light, 1.6 of the caster's radius up, turning 0.5 radians a tick, its sparks falling.
# The original types on data: docs/notes/effects.md, "The original effects on data".

like = "CastingIllusion"
texture = "Casting3"

[vars]
orbiters = 1
turn = 0.5
lift = 1.6
sign = -1
