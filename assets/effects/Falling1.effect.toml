# Falling1 (0x2034, the RainSnow texture, frame 12): leaves dropping from a unit's body. Four to eight gusts (their
# count drawn when the source is made), each with a random reach of 0.1-0.3 and a direction of 0-6 radians; 45 leaves
# at the first tick, each blown by a random gust (a random 0.5-1.5 of its reach, along its direction), a random 0.1-0.2
# in size, falling faster and faster (a random -0.06-0.06 more a tick, down to a random -0.6 to -0.2 a tick) until it
# is below the ground's 0. From the second tick the source stops emitting and lets go of its carrier.
# Falling2, Falling3 and Falling4 are built on it (like = "Falling1"): what changes here changes them too.
# The original types on data: docs/notes/effects.md, "The original effects on data".

texture = "RainSnow"
attach = "attached_only"
part = "body"

[source]
spread_min = [-0.2, -0.2, -0.2]
spread_max = [0.2, 0.2, 0.2]

[emit]
rate = 45
max = 300

[vars]
gusts = { start = "pick(5) + 4", at_create = true }

[[on]]
event = "tick"
when = "age >= 1"
do = [{ stop_emitting = true }, { let_go = true }]

[[anchor]]
name = "gust"
count = "gusts"
vars.reach = "below(0.2) + 0.1"
vars.direction = "range(0, 6)"

[[particle]]
name = "leaf"
at = "gust"
anchor_index = "p.gust"
lifetime = 1000000000                           # until it is below the ground's 0
velocity = ["sin(p.angle) * p.reach", "cos(p.angle) * p.reach", 0]
size = "p.leaf_size"
frame = 12
kill = "p.z < 0"

[particle.vars]
leaf_size = "range(0.1, 0.2)"
gust = "pick(anchors.gust)"
z_step = { start = 0, tick = "p.fall" }        # the fall before this tick's change
fall = { start = 0, tick = "max(p.gravity + p.fall, p.terminal)" }
reach = { start = "range(0, a.reach * 0.5 - -(a.reach * 0.5)) + a.reach + -(a.reach * 0.5)", after_spawn = true }
angle = { start = "range(0, 0 * a.direction - -(0 * a.direction)) + a.direction + -(0 * a.direction)", after_spawn = true }
gravity = { start = "range(0, 0.12) + -0.12 - 0.06", after_spawn = true }
terminal = { start = "below(0.4) - 0.6", after_spawn = true }

[particle.position]
start = ["origin.x", "origin.y", "origin.z"]
tick = ["p.x + p.vx", "p.y + p.vy", "p.z + p.z_step"]
