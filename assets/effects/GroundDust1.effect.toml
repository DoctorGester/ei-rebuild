# GroundDust1 (0x203A, the ShapeChange texture, frame 15): the green dust of a marker on the ground. 128 grains at
# the source's first tick, all at the source, running out on a circle (grain i at i * 0.049 radians, 0.1 a tick; a
# grain from 128 on would take one of the four diagonals, 32 each), speeding up by 1.05 a tick, never below the
# ground nor the plane of the platform under the source (as measured at the first tick), 0.1 above them. Each lives
# 6 ticks, fading in and out by the table. It ticks while the game is paused.
# GroundDust2 is built on it (like = "GroundDust1"): what changes here changes it too.
# The original types on data: docs/notes/effects.md, "The original effects on data".

texture = "ShapeChange"
flags = ["ticks_while_paused"]

[emit]
rate = 128
max = 128

[vars]
plane_h = "platform_height(origin)"
normal = "platform_normal(origin)"

[tables]
axis_x = [0.707, -0.707, -0.707, 0.707]
axis_y = [0.707, -0.707, 0.707, -0.707]
fade = [0, 64, 144, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 128, 64]

[[on]]
event = "tick"
when = "age >= 1"
do = [{ stop_emitting = true }]

[[particle]]
name = "grain"
lifetime = 7
velocity = { start = "p.index >= 128 ? vec3(axis_x[floor((p.index - 128) / 32)], axis_y[floor((p.index - 128) / 32)], 0) * ((p.index - 128) % 32 * 0.0032258064) : vec3(sin(p.index * 0.049140625), cos(p.index * 0.049140625), 0) * 0.1", tick = "p.velocity * 1.05" }
size = { start = 0, tick = 0.07 }
color = "40FF40"
alpha = { start = 0, tick = "fade[p.life - 1]" }
frame = 15

[particle.position]
start = "p.position"                            # at the source; the grains run from the first tick
tick = "vec3((p.position + p.velocity).xy, max(ground(p.position + p.velocity) + 0.1, plane_h - dot((p.position + p.velocity - origin).xy, normal.xy) / normal.z + 0.1))"
