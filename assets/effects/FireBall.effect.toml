# FireBall (0x2000): the fire ball and its trail of smoke. The first particle of each tick is the ball, 1.2 of the
# size at the source, halved at its first tick; the others are smoke at random points of the last step. Both are
# thrown across the step (the spread box widened by half the size, along the motion's side and up axes): the ball
# 0.95 of that at its first tick, the smoke put that far out at once; then each is drawn back towards the step by a
# twentieth of what is left of that offset a tick, which shrinks by 0.95 a tick. Both run through the frames and die
# after the last, growing by the source's growth.
# The original types on data: docs/notes/effects.md, "The original effects on data".

texture = "FireSmoke"
frames = 15

[source]
size = 0.8
growth = 0.94
spread_min = [-0.2, -0.2, -1.0]
spread_max = [0.2, 0.2, 0.0]

[emit]
rate = 1
chance = 88
spacing = 0.09

[[particle]]
name = "ball"
when = "index == 0"
lifetime = 15
position = { start = "origin", tick = "p.position + p.velocity * (p.age == 1 ? 0.95 : -0.05)" }
velocity = { start = "range(spread_min.x - size * 0.5, size * 0.5 + spread_max.x) * side + range(spread_min.y - size * 0.5, size * 0.5 + spread_max.y) * up", tick = "p.velocity * 0.95" }
size = { start = "size * 1.2", tick = "p.age == 1 ? p.size * growth * 0.5 : p.size * growth" }
frame = { delay = 1, mode = "die" }

[[particle]]
name = "smoke"
lifetime = 15
spawn = "range(-1, 0) * motion"
vars = { out = "range(spread_min.x - size * 0.5, size * 0.5 + spread_max.x) * side + range(spread_min.y - size * 0.5, size * 0.5 + spread_max.y) * up" }
position = "p.position + p.out"
velocity = { start = "p.out * -0.05", tick = "p.velocity * 0.95" }
size = { start = "size * 0.5", tick = "p.size * growth" }
frame = { delay = 1, mode = "die" }
