# FireArrow (0x2011): a fire arrow's head and smoke. The first particle is the head, 0.4 of the size one step ahead
# of the source, flickering through three frames while the source emits; the others are puffs at random points of the
# last step, thrown across it (the spread box along the motion's side and up axes) and put that far out, flying on
# faster (a tenth of the offset at first, growing by 1.1 a tick) and swelling by 1.4 a tick over their first frames,
# then by the source's growth; three in ten linger in place. They run through the frames and die after the last.
# RikArrowSmoke is built on it (like = "FireArrow"): what changes here changes it too.
# The original types on data: docs/notes/effects.md, "The original effects on data".

texture = "FireArrowSmoke"
frames = 15

[source]
size = 0.3
growth = 1.03
spread_min = [-0.2, -0.2, -0.2]
spread_max = [0.2, 0.2, 0.2]

[emit]
rate = 1
spacing = 0.06

[[particle]]
name = "head"
when = "total == 0"
lifetime = 2147483647                           # lasts while the source emits
position = { start = "origin", tick = "origin + motion" }
size = "size * 0.4"
frame = { tick = "pick(3)" }
kill = "!emitting"

[[particle]]
name = "puff"
lifetime = 15
spawn = "range(-1, 0) * motion"
vars = { linger = "!chance(71)", out = "p.linger ? 0 : range(spread_min.x, spread_max.x) * side + range(spread_min.y, spread_max.y) * up" }
position = "p.position + p.out"
velocity = { start = "p.out * 0.1", tick = "p.velocity * 1.1" }
size = { start = "size * 0.2", tick = "p.frame + 1 < 6 ? p.size * 1.4 : p.linger ? p.size : p.size * growth" }   # the frame steps every tick
frame = { start = "pick(2) + 2", delay = 1, mode = "die" }
