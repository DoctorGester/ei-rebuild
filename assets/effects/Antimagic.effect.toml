# Antimagic (0x201A, the AntiMagic texture): the antimagic sphere around a unit, SphereFire's (its file says how the
# sphere follows and the sparks move) with 24 tries a tick per size, the sparks at the radius's part (one in eleven
# 2.5-3.5 of it), living 4 ticks by their own life table.
# The original types on data: docs/notes/effects.md, "The original effects on data".

like = "SphereFire"
texture = "AntiMagic"

[vars]
next_tries = { start = "follow ? round(size * 24) : 1", tick = "follow ? round(size * 24) : next_tries" }

[[particle]]
name = "spark"
size = { start = "by_life[4] * p.big * sphere_radius", tick = "(p.l < 0 ? 0.01 : by_life[p.l]) * p.big * last_radius" }

[particle.vars]
big = "pick(11) == 0 ? range(0, 1) + 2.5 : below(0.6) + 0.7"
l = { start = 4, tick = "p.l - 1" }

[tables]
by_life = [0.01, 0.015, 0.02, 0.03, 0.015, 0.01]   # before it (its update after its end): 0.01
