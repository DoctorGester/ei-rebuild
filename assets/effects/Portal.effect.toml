# Portal (0x203E): sparks spiralling up out of a portal. The first particle (again whenever none is left) is the glow 6.4
# above it, flickering at 1.2-1.8 while the source emits and its size is 1 or more (else hidden), gone once it stops.
# The others start at a random point of the disc of radius 2.5 (denser near the edge) a little above or below it and
# turn round it, 0.1 radians a tick (the inner ones, by a random draw, the other way and on frames 0-3; the outer on
# frames 4-14), rising by the source's size times their rate (higher nearer the centre, growing by 1.03 a tick) and
# fading above 8 units, where they vanish. The size times 10 sparks a tick.
# The original types on data: docs/notes/effects.md, "The original effects on data".

texture = "Teleport"
blend = "additive"

[emit]
rate = "size * 10"
max = 800

[[particle]]
name = "glow"
when = "count == 0"
lifetime = 2147483647                           # lasts while the source emits
position = "origin + vec3(0, 0, 6.4)"
size = { start = 0, tick = "size < 1 ? 0 : below(0.4) * 1.5 + 1.2" }
alpha = 96
frame = 15
kill = "!emitting"

[[particle]]
name = "spark"
lifetime = 2147483647                           # until it has climbed 8
# Its rate of rise is the velocity's z (growing by 1.03 a tick), times the source's size.
velocity = { start = "vec3(0, 0, (4 - p.spread) * 0.0375)", tick = "p.velocity * 1.03" }
size = { start = 0, tick = "(2 - p.spread) * 0.3" }
alpha = { start = 64, tick = "min(floor((round((8 - (p.position.z + size * p.velocity.z - origin.z)) * 25) + 55) / 4), 64)" }
frame = { start = "p.spin > 0 ? pick(11) + 4 : pick(4)", tick = "p.age % 3 != 0 ? p.frame : (p.frame + 1 == 4 ? 0 : (p.frame + 1 == 15 ? 4 : p.frame + 1))" }
kill = "p.position.z + size * p.velocity.z - origin.z > 8"

[particle.vars]
u = "range(0, 1)"
spread = "(p.u + 1) * p.u * 0.5"                # out from the axis, a part of 2.5
spin = "range(0, 1) > p.spread ? 0.1 : -0.1"    # the turn a tick
out = { start = "circle(range(0, 2 * pi)) * (p.spread * 2.5)", tick = "vec3(p.out.x * cos(p.spin) + p.out.y * sin(p.spin), p.out.y * cos(p.spin) - p.out.x * sin(p.spin), 0)" }

[particle.position]
start = "origin + p.out + vec3(0, 0, range(-0.5, 0.5) * (4 - p.spread) * 0.0375)"
tick = "vec3(origin.xy + p.out.xy, p.position.z + size * p.velocity.z)"
