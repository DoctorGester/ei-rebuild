# Portal (0x203E): sparks spiralling up out of a portal. The first particle (again whenever none is left) is the glow 6.4
# above it, flickering at 1.2-1.8 while the source emits and its size is 1 or more (else hidden), gone once it stops.
# The others start at a random point of the disc of radius 2.5 (denser near the edge) a little above or below it and
# turn round it, 0.1 radians a tick (the inner ones, by a random draw, the other way and on frames 0-3; the outer on
# frames 4-14), rising by the source's size times their rate (higher nearer the centre, growing by 1.03 a tick) and
# fading above 8 units, where they vanish. The size times 10 sparks a tick.
# The original types on data: docs/notes/effects.md, "The original effects on data".

texture = "Teleport"
blend = "additive"

[emit]
rate = "size * 10"
max = 800

[[particle]]
name = "glow"
when = "count == 0"
lifetime = 2147483647                           # lasts while the source emits
position = ["origin.x", "origin.y", "8 * 0.8 + origin.z"]
size = { start = 0, tick = "!emitting ? p.size : (size < 1 ? 0 : below(0.4) * 1.5 + 1.2)" }
alpha = 96
frame = 15
kill = "!emitting"

[[particle]]
name = "spark"
lifetime = 2147483647                           # until it has climbed 8 (out)
# The rise rate is the velocity's z (growing by the drag after the move), spread = (u + 1) * u * 0.5.
velocity = [0, 0, "(1 - (p.u + 1) * p.u * 0.5 + 3) * 2.5 * 0.015"]
drag = 1.03
size = { start = 0, tick = "p.out == 1 ? 0 : (2 - (p.u + 1) * p.u * 0.5) * 0.3" }
alpha = { start = 64, tick = "p.out == 1 ? 0 : min(floor((round((8 - (size * p.vz + p.z - origin.z)) * 25) + 55) / 4), 64)" }
frame = { start = "p.cell", tick = "p.age % 3 != 0 ? p.frame : (p.frame + 1 == 4 ? 0 : (p.frame + 1 == 15 ? 4 : p.frame + 1))" }
kill = "p.out == 2"

[particle.vars]
u = "range(0, 1)"
angle = "range(0, 6.2832)"
spin = "range(0, 1) > (p.u + 1) * p.u * 0.5 ? 0.1 : -0.1"   # the turn a tick
cell = "p.spin > 0 ? pick(11) + 4 : pick(4)"
next_x = { start = 0, tick = "p.off_y * sin(p.spin) + cos(p.spin) * p.off_x" }
off_y = { start = "cos(p.angle) * ((p.u + 1) * p.u * 0.5 * 2.5)", tick = "p.off_y * cos(p.spin) - p.off_x * sin(p.spin)" }
off_x = { start = "sin(p.angle) * ((p.u + 1) * p.u * 0.5 * 2.5)", tick = "p.next_x" }
out = { start = 0, tick = "p.out != 0 ? 2 : (size * p.vz + p.z - origin.z > 8 ? 1 : 0)" }   # 1: climbed out, 2: gone

[particle.position]
start = ["p.off_x + origin.x", "p.off_y + origin.y", "range(-0.5, 0.5) * ((1 - (p.u + 1) * p.u * 0.5 + 3) * 2.5 * 0.015) + origin.z"]
tick = ["p.next_x + origin.x", "p.off_y + origin.y", "size * p.vz + p.z"]
