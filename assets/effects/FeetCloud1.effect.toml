# FeetCloud1 (0x204A, the VisionFog texture): blue puffs at a unit's feet. Size * 8 a tick (rounded, as the last puff
# set it; 8 to begin with), each at a random foot (the carrier's "ll3" / "rl3" parts; without a unit carrier the
# source), raised by 1.2 times its size. A puff's offset from its foot grows by a random step inside the disc of 0.1
# of the carrier's radius times the source's size (slowing by 0.9 a tick), and the puff eases towards its foot plus
# the offset, the part of the way shrinking by 0.98 a tick from all of it; its size 0.4 of the source's size times the
# carrier's radius, shrinking by 0.8. It shows for 10 ticks, fading in by the life table; once the source stops
# emitting or loses its carrier at most 8 more.
# FeetCloud2 is built on it (like = "FeetCloud1"): what changes here changes it too.
# The original types on data: docs/notes/effects.md, "The original effects on data".

texture = "VisionFog"
blend = "additive"
attach = "attached_only"

[emit]
rate = "tries"
max = 300

[vars]
tries = 8

[[on]]
event = "emit"
do = [{ set = "tries", value = "round(size * 8)" }]

[[particle]]
name = "puff"
lifetime = 11                                   # or 8 more once the source stops (kill)
spawn = "disc()"
velocity = { start = "p.spawn * (0.1 * carrier_radius * size)", tick = "p.velocity * 0.9" }   # the offset's step
size = { start = 0, tick = "p.age == 1 ? p.puff : p.size * 0.8" }
color = "p.age == 0 ? 255 : vec3(0, 0, 255)"
alpha = { start = 0, tick = "fade[p.l]" }
frame = "pick(16)"
kill = "p.l < 0"

[particle.vars]
foot = "pick(2)"                                # 1: the left
puff = "size * carrier_radius * 0.4"
l = { start = 10, tick = "emitting && attached ? p.l - 1 : min(p.l - 1, 8)" }   # the life left
off = { start = 0, tick = "p.off + p.velocity" }
ease = { start = 1, tick = "p.age == 1 ? p.ease : p.ease * 0.98" }   # the part of the way this tick

[particle.position]
start = "(p.foot ? carrier_left_foot : carrier_right_foot) + vec3(0, 0, p.puff * 1.2)"
tick = "p.position * (1 - p.ease) + (p.off + (p.foot ? carrier_left_foot : carrier_right_foot)) * p.ease"

[tables]
fade = [0, 32, 64, 128, 255, 255, 255, 255, 255, 255, 255]
