# Cylinder1 (0x203F, the Casting2 texture): the casting circle, two stars circling the carrier. At the first particle
# the stars are placed opposite each other at 0.7 of the carrier's radius, 0.2 of it up; for 18 ticks they turn
# about the carrier (the turn itself turning the other way, slowly) and rise faster and faster, then the source stops
# emitting and the stars go. Sparks start along a random star's last step and spiral round on the stars' orbit,
# shrinking by 0.9 a tick and fading by their life (at most 13 ticks, fewer as the stars run out). The emission starts
# at 30 a tick and falls by 1, or 2 on star 0's odd counts, a tick.
# Cylinder2 is built on it (like = "Cylinder1"): what changes here changes it too.
# The original types on data: docs/notes/effects.md, "The original effects on data".

texture = "Casting2"
attach = "attached_only"

[server]
one_shot = 60
script_lifetime = 200

[emit]
rate = "tries"
max = 600

[vars]
tries = { start = 29, tick = "tries - (st0 % 2 != 0 ? 1 : 0) - 1" }   # star 0 counts 100 to 99 at the first tick
st0 = { start = 99, tick = "st0 - 1" }          # the stars' countdown (18 from their placing)
orbit = 0

[tables]
star_alpha = [0, 32, 64, 128, 255]

[[on]]
event = "before_emit"
when = "anchors.star == 0"
do = [{ set = "orbit", value = "carrier_radius * 0.7" }, { set = "st0", value = 18 }, { add_anchor = "star", count = 2 }]

[[on]]
event = "tick"
when = "st0 <= -1"
do = [{ stop_emitting = true }]

# A star's place relative to the source (p), its last step and its turn (r: the cosine and sine).
[[anchor]]
name = "star"
count = 0                                       # placed at the first particle
position = { tick = "a.p" }

[anchor.vars]
last = { start = 0, tick = "a.p" }
p = { start = "vec3(cos(a.index * pi) * orbit, sin(a.index * pi) * orbit, carrier_radius * 0.2)", tick = "st0 >= 0 ? vec3(a.r.y * a.p.y + a.r.x * a.p.x, a.r.x * a.p.y - a.r.y * a.p.x, a.p.z + a.rise) : a.p" }
step = { start = 0, tick = "st0 >= 0 ? a.p - a.last : a.step" }
rise = { start = "2 / 18 * carrier_radius * 0.04", tick = "st0 >= 0 ? a.rise * 1.25 : a.rise" }
r = { start = "vec2(cos(0.3 * pi * 0.13333334), sin(0.3 * pi * 0.13333334))", tick = "st0 >= 0 ? vec2(sin(pi * -0.013333334) * a.r.y + cos(pi * -0.013333334) * a.r.x, cos(pi * -0.013333334) * a.r.y - sin(pi * -0.013333334) * a.r.x) : a.r" }

[[particle]]
name = "star"
when = "count < 2"
at = "star"
anchor_index = "count"
lifetime = 1000000000                           # while the source emits
position = { tick = "origin + a.position" }
size = { start = 0, tick = 0.3 }
alpha = { start = 0, tick = "st0 >= 4 ? 255 : star_alpha[st0]" }
kill = "!emitting"

[[particle]]
name = "spark"
at = "star"
pick = "random"
lifetime = "min(st0 + 6, 14)"
position = { tick = "origin + p.r" }
size = { start = 0.1, tick = "p.size * 0.9" }
alpha = { start = 0, tick = "star_alpha[p.life]" }
frame = { start = 1, delay = 1 }
drop = "st0 + 6 < 0 || (a.step.x == 0 && a.step.y == 0)"

# The spark's place relative to the source (r) and its step (s); k: first the part of the star's step it starts back
# from, then each tick the factor that holds it on the orbit.
[particle.vars]
k = { start = "range(-1, 0)", tick = "orbit / length(p.r.xy + p.s.xy)" }
r = { start = "a.step * p.k + a.p", tick = "vec3((p.r.xy + p.s.xy) * p.k, p.r.z + p.s.z)" }
reach = { start = 0, tick = "length(p.s) / orbit" }
s = { start = "a.step", tick = "vec3(p.r.y * p.reach * 0.6, -p.r.x * p.reach * 0.6, p.s.z * 0.6)" }
