# Smoke (0x2004): smoke that drifts on. CampFire's puffs (CampFire.effect.toml) from their eighth frame: at random
# points of the spread box (two in five half the size and spread wider by 0.3 of it; half of the offset taken), at a
# random height up to the source's height, rising by that height a tick and growing by 1.06 while the wind carries them.
# A frame at the first tick and then every four ticks, each with a chance of one in four to end the puff, to the last.
# The original types on data: docs/notes/effects.md, "The original effects on data".

texture = "TendriSmoke"
frames = 15

[source]
size = 0.8
height = 0.3
growth = 0.85
spread_min = [-0.2, -0.2, 0]
spread_max = [0.2, 0.2, 0]

[emit]
rate = 6
chance = 88

[[particle]]
name = "puff"
lifetime = 25                                   # frame 8 to the last
vars = { small = "chance(40)" }
position = "origin + vec3(range(spread_min.xy - (p.small ? size * 0.3 : 0), spread_max.xy + (p.small ? size * 0.3 : 0)) * 0.5, range(0, height))"
velocity = { tick = "vec3(0, 0, height) + p.size * 1.06 * wind_strength * 0.15 * wind" }
size = { start = "p.small ? size * 0.5 : size", tick = "p.size * 1.06" }
frame = { start = 8, delay = "p.age == 0 ? 1 : 4" }
kill = "(p.age - 1) % 4 == 0 && pick(4) == 0"
