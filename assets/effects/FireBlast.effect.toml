# FireBlast (0x2002, the Explosion texture): the fireball's blast. Fifteen fragments fly out from the centre, each in a
# random direction (mostly upwards) at a random speed, slowing to 3/4 a tick and falling by 0.03; the flames' radius
# grows by 0.4, its growth falling to 0.7 a tick. For six ticks the blast emits 60 a tick, each of a random kind: the
# first is the core flash (2.3 times the size for one tick); about half are flames inside the radius, moving outwards,
# swelling, stepping through their frames faster and faster (the earlier and the further out, the more they skip) and
# fading by the frame; the others are smoke along a random fragment's last step, drifting and shrinking until their
# frame reaches 7 (mod 8). When the world's effect object makes it, a scorch mark as wide as its param is left on the
# ground.
# The original types on data: docs/notes/effects.md, "The original effects on data".

texture = "Explosion"

[server]
one_shot = 60
script_lifetime = 200

[source]
size = 0.6
height = 1
growth = 0.8
spread_min = [-0.02, -0.02, -0.02]
spread_max = [0.02, 0.02, 0.02]

[emit]
rate = 60
max = 600

# The fragments' flame radius (rad), its growth (gr) and age (fage); the starts are the first tick's. k: the kind of
# the particle being made.
[vars]
rad = { start = 0.4, tick = "rad + gr" }
gr = { start = "0.7 * 0.4", tick = "0.7 * gr" }
fage = { start = 1, tick = "fage + 1" }
k = 0

[tables]
blast_alpha = [255, 255, 207, 175, 128, 128, 128, 128, 128, 175, 207, 192, 128, 48, 0]   # a flame's, by frame

[[on]]
event = "spawn"
do = [{ scorch = "param", alpha = "alpha * 0.6" }]

[[on]]
event = "tick"
when = "fage > 6"
do = [{ stop_emitting = true }]

# Each particle first draws its kind: below 0 a flame, else the fragment its smoke follows.
[[on]]
event = "before_emit"
do = [{ set = "k", value = "pick(29) - 14" }]

# A fragment: its place (p) and velocity (v) relative to the centre, its direction a point of the ball turned up where
# it points well down, its frame (fr: 0 makes its smoke start at frame 8) and whether its smoke shows (sf).
[[anchor]]
name = "fragment"
count = 15
at_create = true
spawn = "ball()"

[anchor.vars]
p = { start = 0, tick = "a.p + a.v * size" }
v = { start = "normalize(vec3(a.spawn.xy, a.spawn.z < -0.3 ? -a.spawn.z : a.spawn.z)) * (below(0.4) + 0.8) * 0.8", tick = "a.v * 0.75 - vec3(0, 0, 0.03)" }
fr = "pick(6)"
sf = "pick(2)"

[[particle]]
name = "core"
when = "count == 0 && fage == 1"
lifetime = 2
frame = 15
size = { start = 0, tick = "size * 2.3" }

# A flame: out, how far inside the ball its point is (1 - its length squared) against th, the blast's age's threshold;
# its size (fs), frame position (fp) and the position's step (st).
[[particle]]
name = "flame"
when = "k < 0"
lifetime = 1000000000                           # until its frames run out
spawn = "ball()"
position = "origin + p.spawn * (size * rad)"
velocity = { start = "p.spawn * (size * gr)", tick = "p.velocity * 0.67" }
size = { start = 0, tick = "p.fs" }
alpha = { start = 255, tick = "blast_alpha[round(p.fp)]" }
frame = { start = "p.f0", tick = "round(p.fp + p.st)", mode = "free" }
kill = "p.frame >= 14"

[particle.vars]
out = "1 - dot(p.spawn, p.spawn)"
th = "floor(fage / 7) + 0.2"
f0 = "p.out < p.th ? 8 : pick(3)"
fs = { start = "rad * size * (below(0.4) + 0.8) * 0.6", tick = "p.fs * (p.frame > 7 ? 1.03 : 1.01)" }
fp = { start = "p.f0", tick = "p.fp + p.st" }
st = { start = "p.out < p.th ? range(0.35, 0.7) : range(0, 0.35) * 0.5 + p.out * 0.35 / p.th + 0.175", tick = "p.st * 1.02" }

# Smoke: at a random part (u) of its fragment's last step, sized by a random factor (g).
[[particle]]
name = "smoke"
at = "fragment"
anchor_index = "k"
lifetime = 1000000000                           # until its frames reach 7
position = "origin + a.p - a.v * (p.u * size)"
velocity = { start = "a.v * size", tick = "p.velocity * 0.7" }
size = { start = "p.g * (0.3 - p.u * 0.15) * (rad * 0.14285715 + 0.3) * a.sf * size", tick = "p.size * 0.8" }
frame = { start = "a.fr == 0 ? 8 : p.f3", tick = "p.frame + 1" }
kill = "(p.frame + 1) % 8 == 7"

[particle.vars]
f3 = "pick(3)"
u = "range(0, 1)"
g = "range(0.7, 1.5)"
