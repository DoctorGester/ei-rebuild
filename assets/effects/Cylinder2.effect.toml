# Cylinder2 (0x2040, the Casting1 texture): Cylinder1's casting circle (its file says how the stars and sparks move)
# turning the other way.
# The original types on data: docs/notes/effects.md, "The original effects on data".

like = "Cylinder1"
texture = "Casting1"

[[anchor]]
name = "star"

[anchor.vars]
r0 = { start = "cos(-(0.3 * pi * 0.13333334))", tick = "st0 >= 0 ? sin(pi * 0.013333334) * a.r1 + cos(pi * 0.013333334) * a.r0 : a.r0" }
r1 = { start = "sin(-(0.3 * pi * 0.13333334))", tick = "st0 >= 0 ? cos(pi * 0.013333334) * a.r1 - sin(pi * 0.013333334) * a.or0 : a.r1" }
