# Tendril (0x2010): the smoke along a fire wall. Fire's puffs (Fire.effect.toml), each moved by one random part of -1..1
# of the extent (the wall: x and y) and set on the ground there at its height over the source; 14.3 puffs a tick per
# unit of the extent's length, at least 6, at most 93.
# The original types on data: docs/notes/effects.md, "The original effects on data".

like = "Fire"

[emit]
rate = "clamp(floor(length(extent) * 14.285714), 6, 93)"
max = 1500

[[particle]]
name = "puff"

[particle.vars]
along = "range(-1, 1)"                           # the part of the wall

[particle.position]
start = "on_ground(origin + p.half + p.along * vec3(extent.xy, 0), range(0, height))"
