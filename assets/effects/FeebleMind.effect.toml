# FeebleMind (0x2049): wisps circling over a unit's head. Each starts 0.05 out from the source in a random direction
# and circles out (its offset turned by 0.07 radians and grown by 1.1 a tick) while it rises 0.05 a tick, growing by
# 1.04 and cycling through the frames for 20 ticks, fading in and out by the life left. Twice the size's wisps a tick
# (5 before the first): the count of the last tick that emitted.
# The original types on data: docs/notes/effects.md, "The original effects on data".

texture = "Link"
blend = "additive"
attach = "attached_only"
part = "head"

[emit]
rate = "tries"
max = 300

[vars]
tries = { start = 5, tick = "total > seen ? round(seen_size + seen_size) : tries" }
seen = { tick = "total" }                       # the particles emitted before this tick
seen_size = { tick = "size" }                   # the size those were emitted at

[[particle]]
name = "wisp"
lifetime = 21                                   # 20 shown, as the original counts down past 0
position = { tick = "p.base + p.out" }
size = { start = 0, tick = "p.age == 1 ? (below(0.2) + 0.9) * size * 0.035 : p.size * 1.04" }
alpha = { start = 0, tick = "fade[p.life - 1]" }
frame = { start = "pick(16)", delay = 1 }

[particle.vars]
base = { start = "origin", tick = "p.base + vec3(0, 0, 0.05)" }   # where it rises from
out = { start = "circle(range(0, 2 * pi)) * 0.05", tick = "vec3(p.out.x * cos(0.07) + p.out.y * sin(0.07), p.out.y * cos(0.07) - p.out.x * sin(0.07), 0) * 1.1" }

[tables]
fade = [0, 32, 64, 128, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255]
