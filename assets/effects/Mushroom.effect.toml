# Mushroom (0x200E, the ChangeHero texture): the cloud of a mushroom (the trap's blast). 10 puffs a tick for 30 ticks
# from the source, each in a random upward direction from the stem's foot (where the source was at its first
# particle), the cloud's spread growing with ln(ticks) times the size and its cap rising by 0.12 of the size a tick;
# a puff's size grows with the cloud's age. A puff fades in by 64 a tick and out over its last 4, steps a frame a
# tick from its second tick up to frame 14 (its start from the cloud's age), swells by 1.1 a tick before frame 8,
# drifts out slowing by 0.7, and while below the cap's height is pulled in towards the stem. It lives 15 to 18
# ticks. The camera shakes at the cloud's second tick.
# Transform is built on it (like = "Mushroom"): what changes here changes it too.
# The original types on data: docs/notes/effects.md, "The original effects on data".

texture = "ChangeHero"

[server]
one_shot = 60
script_lifetime = 200

[source]
height = 1

[emit]
rate = 10
max = 4000

[vars]
made = 0                                        # 1 from the first particle on (the stem placed)
ticks = { start = 0, tick = "made ? ticks + 1 : ticks" }
spread = { start = 0, tick = "made ? log(ticks + 1) * size * 0.2 : spread" }
cap = { start = 0, tick = "made ? size * 0.12 + cap : cap" }
stem = "vec3(0)"                                # the stem's foot

[[on]]
event = "emit"
when = "!made"
do = [{ set = "stem", value = "origin" }, { set = "made", value = 1 }]

[[on]]
name = "shake"
event = "tick"
when = "made && ticks == 1"
do = [{ shake = "size", time = 5, decay = 0.25 }]

[[on]]
event = "tick"
when = "made && ticks == 30"
do = [{ stop_emitting = true }]

[[particle]]
name = "puff"
lifetime = "pick(4) + 16"
position = "origin + p.out * p.reach + vec3(0, 0, cap)"
# Below the cap's height it is pulled in towards the stem (after its move).
velocity = { start = "p.out * (size * 0.06)", tick = "p.velocity * 0.7 + (cap > p.position.z + p.velocity.z - stem.z ? vec3(normalize((p.position + p.velocity - stem).xy) * -(size * 0.02), 0) : 0)" }
size = { start = "size * (ticks * 0.008 + 0.1)", tick = "p.frame + (p.age >= 2) < 8 ? p.size * 1.1 : p.size" }
alpha = { start = 64, tick = "p.life > 4 ? min(p.alpha + 64, 255) : (p.alpha + 192) % 256" }
frame = { start = "max(floor(ticks / 10) + pick(3) - 1, 0)", tick = "p.age >= 2 ? min(p.frame + 1, 14) : p.frame" }

[particle.vars]
reach = "(below(0.4) + 0.8) * spread"
out = "normalize(vec3(range(-1, 1), range(-1, 1), range(0.1, 1))) + vec3(0, 0, 0.12)"   # its way up and out
