# ClayRing (0x2018, the ClayRing texture): the earth spell's ring. Ten points run out from the source along the
# ground for 14 ticks, each on its own direction (the ten around the circle, turning by 18 degrees a tick), at the
# size times the reach table (read backwards for a positive size: the ring runs out fast, then slows; forwards for a
# negative one), 1 above the ground; then the source stops emitting. At the first tick one marker rides each point;
# after it 80 clods a tick start at a random point's last place, between it and its place, scatter out slowing by
# 0.9, fade by 48 and shrink by 0.9 a tick, stepping a frame every other tick. The markers' and clods' alpha at their
# start (the markers' all along) follows the points' countdown. A marker lives 14 ticks, a clod 4.
# A marker's and a clod's end is a `kill` at its own age: the update the original still gives them after their end
# moves them (docs/notes/effects.md, "Kept"), so a clod's velocity is left alone at that update.
# The original types on data: docs/notes/effects.md, "The original effects on data".

texture = "ClayRing"
blend = "additive"

[server]
one_shot = 60
script_lifetime = 200

[emit]
rate = 80

[vars]
cd = { start = 13, tick = "cd - 1" }            # the points' countdown

[tables]
clay_alpha = [0, 128, 255, 255, 255, 255, 255, 255, 255, 160, 80, 32, 0, 0]
reach = [0, 0.025, 0.056, 0.092, 0.136, 0.188, 0.251, 0.326, 0.417, 0.525, 0.656, 0.812, 1, 1, 1, 1]

[[on]]
event = "tick"
when = "cd < 0"
do = [{ stop_emitting = true }]

# A point's place (p*), its last place (q*) and its direction (d*) in the world; o*: the place before this tick's.
[[anchor]]
name = "point"
count = 10

[anchor.vars]
ox = { start = 0, tick = "a.px" }
oy = { start = 0, tick = "a.py" }
oz = { start = 0, tick = "a.pz" }
px = { start = "size * sin(a.index * 0.62832) * (size >= 0 ? reach[14 - cd] : reach[cd]) + origin.x", tick = "cd < 0 ? a.px : size * a.dx * (size >= 0 ? reach[14 - cd] : reach[cd]) + origin.x" }
py = { start = "size * cos(a.index * 0.62832) * (size >= 0 ? reach[14 - cd] : reach[cd]) + origin.y", tick = "cd < 0 ? a.py : size * a.dy * (size >= 0 ? reach[14 - cd] : reach[cd]) + origin.y" }
pz = { start = "ground(a.px, a.py) + 1", tick = "cd < 0 ? a.pz : ground(a.px, a.py) + 1" }
qx = { start = "a.px", tick = "cd < 0 ? a.qx : (a.ox == 0 && a.oy == 0 ? a.px : a.ox)" }
qy = { start = "a.py", tick = "cd < 0 ? a.qy : (a.ox == 0 && a.oy == 0 ? a.py : a.oy)" }
qz = { start = "a.pz", tick = "cd < 0 ? a.qz : (a.ox == 0 && a.oy == 0 ? a.pz : a.oz)" }
odx = { start = 0, tick = "a.dx" }
dx = { start = "sin(a.index * 0.62832) * 0.95 + cos(a.index * 0.62832) * 0.31225", tick = "cd < 0 ? a.dx : a.dx * 0.95 + a.dy * 0.31225" }
dy = { start = "cos(a.index * 0.62832) * 0.95 - sin(a.index * 0.62832) * 0.31225", tick = "cd < 0 ? a.dy : a.dy * 0.95 - a.odx * 0.31225" }

[[particle]]
name = "marker"
when = "cd == 13 && index < 10"
at = "point"
anchor_index = "index"
lifetime = 1000000000
size = { start = 0.2, tick = 0.2 }
alpha = { start = "cd < 0 ? 0 : clay_alpha[cd]", tick = "cd < 0 ? 0 : clay_alpha[cd]" }
kill = "p.age == 15"

[particle.position]
start = ["a.px", "a.py", "a.pz"]
tick = ["a.px", "a.py", "a.pz"]

[[particle]]
name = "clod"
at = "point"
pick = "random"
lifetime = 1000000000
velocity = ["p.sy", "p.sx", "p.sz"]             # the scatter (its x and y drawn the other way round)
drag = "p.age == 5 ? 1 : 0.9"
size = { start = 0.1, growth = 0.9 }
alpha = { start = "cd < 0 ? 0 : clay_alpha[cd]", tick = "max(p.alpha - 48, 0)" }
frame = { start = 1, tick = "p.age % 2 == 0 && p.age < 5 ? p.frame + 1 : p.frame" }
kill = "p.age == 5"

[particle.position]
start = ["a.qx", "a.qy", "a.qz"]
tick = ["p.bx + p.vx * 0.9", "p.by + p.vy * 0.9", "p.bz + p.vz * 0.9"]

[particle.vars]
f = "range(0, 1)"
bx = "p.f * a.px + (1 - p.f) * a.qx"           # its base between the point's places
by = "p.f * a.py + (1 - p.f) * a.qy"
bz = "p.f * a.pz + (1 - p.f) * a.qz"
sx = "range(-0.1, 0.1)"
sy = "range(-0.1, 0.1)"
sz = "range(-0.1, 0.1)"
