# Link (0x2014, the Link texture, 15 frames): a beam of sparks from the source along its extent (game code sets the
# extent to the beam). At the first particle the beam's frame is taken from the extent: its length, its direction, a
# side (across it; another for a nearly vertical beam) and their cross product. 10 sparks a tick, 80% each: a spark
# starts across the beam by a random offset (the spread box), spins round the beam by its distance from the axis,
# runs along it at a random speed (a slow, large one near the axis now and then), bulges up in the middle and is
# brightest there; it goes past the beam's end. Once the source stops emitting the sparks' alpha cap falls by 16 a
# tick. A spark's first frame can be one past the grid (drawn as the first, as the original drew it).
# The original types on data: docs/notes/effects.md, "The original effects on data".

texture = "Link"
frames = 15

[source]
spread_min = [-0.2, -0.2, -0.2]
spread_max = [0.2, 0.2, 0.2]
extent = [-10, 0, 0]

[emit]
rate = 10
chance = 80

[vars]
made = 0                                        # 1 once the beam's frame is taken
cap = { start = 255, tick = "made ? max(cap - (emitting ? 0 : 16), 0) : cap" }   # the sparks' alpha cap
len = 0
dir = "vec3(0)"
side = "vec3(0)"                                # across it (another for a nearly vertical beam)
across = "vec3(0)"                              # the cross product of the beam and the side

[[on]]
event = "before_emit"
when = "made == 0"
do = [
    { set = "len", value = "length(extent)" },
    { set = "side", value = "normalize(length(extent.xy) < 0.0000000001 ? vec3(extent.y - extent.z, -extent.x, extent.x) : vec3(extent.y, -extent.x, 0))" },
    { set = "across", value = "normalize(cross(extent, side))" },
    { set = "dir", value = "extent / len" },
    { set = "made", value = 1 },
]

[[particle]]
name = "spark"
lifetime = 1000000000                           # it ends past the beam
size = "(p.speed < 0.15 ? range(0.13, 0.16) : range(0.03, 0.05)) * size"
alpha = { start = 0, tick = "min(floor((0.5 - abs(p.covered / len - 0.5)) * 1000), cap)" }
frame = { start = "pick(16)", tick = "(p.frame + 1) % 15" }
kill = "p.covered > len"

[particle.position]
start = "origin + vec3(p.off, p.along)"
tick = "origin + p.off.x * side + p.off.y * across + p.along * dir + extent * (p.covered / len) + vec3(0, 0, (0.25 - (p.covered / len - 0.5) * (p.covered / len - 0.5)) * len * 0.9)"

[particle.vars]
ab = "vec2(range(-1, 1), range(-1, 1))"         # its place across the beam, a part of the spread box
along = "range(spread_min.z, spread_max.z)"     # along the beam
speed = "pick(4) == 0 && length(p.ab) < 0.5 ? range(0.1, 0.12) : range(0.17, 0.25)"
covered = { start = 0, tick = "p.covered + p.speed" }
off = { start = "p.ab * spread_min.xy", tick = "vec2(p.off.x * cos(length(p.ab) * 0.2) - p.off.y * sin(length(p.ab) * 0.2), p.off.y * cos(length(p.ab) * 0.2) + p.off.x * sin(length(p.ab) * 0.2))" }
