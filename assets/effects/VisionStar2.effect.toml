# VisionStar2 (0x2045, the Stun texture): a star and four satellites above a unit's head, three a tick until there are
# five. Each sits half a unit out from the source at 2 pi times 0, 0.2, 0.4, 0.6 and 0.8 (the first one too) and turns
# by 0.07 radians a tick, following the source; frame 1. Its size eases (by 0.95) towards a random 0.1-1.9 of 0.17 *
# 0.05 of the source's size. Once the source stops emitting or loses its carrier, the size shrinks a further 0.95 a
# tick, the source's size is zeroed (the stars after it this tick read 0) and a star below 0.03 is gone.
# VisionStar1's star (VisionStar1.effect.toml) with the satellites.
# The original types on data: docs/notes/effects.md, "The original effects on data".

like = "VisionStar1"

[[particle]]
name = "star"
when = "count <= 4"
position = { tick = "origin + p.out" }
frame = 1

[particle.vars]
eased = { tick = "(range(0.1, 1.9) * size * 0.17 * 0.05 + p.size * 0.95) * (emitting && attached ? 1 : 0.95)" }
out = { start = "circle(6.2831855 * min(count, 4) * 0.2) * 0.5", tick = "vec3(p.out.x * cos(0.07) + p.out.y * sin(0.07), p.out.y * cos(0.07) - p.out.x * sin(0.07), 0)" }
