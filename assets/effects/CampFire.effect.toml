# CampFire (0x2001): the smoke of a camp fire. Fire's puffs (Fire.effect.toml) going on past their eighth frame: from
# there a frame every four ticks, each with a chance of one in four to end the puff, rising at half the speed; 32 ticks
# at most.
# The original types on data: docs/notes/effects.md, "The original effects on data".

like = "Fire"

[[particle]]
name = "puff"
lifetime = 32
frame = { delay = "p.frame < 7 ? 1 : 4" }
kill = "p.age >= 8 && p.age % 4 == 0 && pick(4) == 0"

[particle.vars]
rise = { start = "height", tick = "p.age == 8 ? p.rise * 0.5 : p.rise" }
