# CastingDivination (0x202A, the Casting4 texture): a seer's cast above the head, sparks drawn in towards it round a
# flickering marker (the first particle). At the first particle the effect takes its radius (twice a unit's own
# radius, or 1.6 times the carrier's) and five swirls, points random-walking about the source (a random kick, damping
# and a pull back each tick). Each spark starts on a random direction, now and then pulled towards a swirl, 0.6 of the
# radius out, and spirals halfway in over its 13 ticks, swelling, its frames running back and fading in and out by its
# life. Once the cast ends (the source stops emitting or loses its carrier) the whole effect fades over 6 ticks.
# CastingFire's cast (CastingFire.effect.toml) with fewer, smaller sparks and the marker, a kind tried before them.
# The original types on data: docs/notes/effects.md, "The original effects on data".

like = "CastingFire"
texture = "Casting4"
blend = "additive"
part = "above_head"

[emit]
rate = 6

[vars]
picks = 6
reach = 2
spark_size = 0.07
swell = 1.05
inward = 0.03846154
first = 0                                       # 1 for the first particle: the marker

[tables]
life_alpha = [0, 32, 64, 112, 160, 208, 255, 255, 224, 192, 128, 64, 32, 16]

[[on]]
event = "before_emit"
do = [{ set = "r08", value = "carrier_radius * 0.8" }, { set = "radius", value = "(carrier_unit ? carrier_unit_radius : r08) * reach" }, { add_anchor = "swirl", count = 5 }, { set = "made", value = 1 }, { set = "first", value = 1 }]

[[on]]
event = "emit"
when = "first == 1"
do = [{ set = "first", value = 0 }]

[[particle]]
name = "marker"
before = "spark"
when = "first == 1"
lifetime = 1000000000
size = { start = 0, tick = "cap == 0 ? p.size : (below(0.3) + 0.85) * radius * 0.3" }
alpha = { start = 0, tick = "cap" }
kill = "cap == 0"

[particle.position]
start = ["origin.x", "origin.y", "origin.z"]
tick = ["origin.x", "origin.y", "origin.z"]

[[particle]]
name = "spark"
alpha = { tick = "min(13 - p.age < 0 ? 255 : life_alpha[13 - p.age], cap)" }
frame = { tick = "p.frame - 1" }
