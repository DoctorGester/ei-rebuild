# Modifier5 (0x201F, the Stun texture, marker frame 4): a spell's mark on a unit, Modifier1's ring of points (its
# file says how they move) around the carrier's own y axis.
# Modifier6, Modifier7 and Modifier8 are built on it (like = "Modifier5"): what changes here changes them too.
# The original types on data: docs/notes/effects.md, "The original effects on data".

like = "Modifier1"

[[anchor]]
name = "point"

[anchor.vars]
vx = "a.spawn.x - carrier_axis_y.x * (carrier_axis_y.x * a.spawn.x + carrier_axis_y.y * a.spawn.y + carrier_axis_y.z * a.spawn.z)"
vy = "a.spawn.y - carrier_axis_y.y * (carrier_axis_y.x * a.spawn.x + carrier_axis_y.y * a.spawn.y + carrier_axis_y.z * a.spawn.z)"
vz = "a.spawn.z - carrier_axis_y.z * (carrier_axis_y.x * a.spawn.x + carrier_axis_y.y * a.spawn.y + carrier_axis_y.z * a.spawn.z)"

[[particle]]
name = "marker"
frame = 4
