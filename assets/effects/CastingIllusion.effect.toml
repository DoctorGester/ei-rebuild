# CastingIllusion (0x202B, the Casting2 texture): an illusionist's cast, two lights orbiting the caster at half its
# radius, 0.4 of it up, turning 0.3 radians a tick, each shown by a flickering marker; sparks start between a random
# light's last place and its place now, a little off (the source's spread), and rise ever faster, shrinking, cycling
# their last frames and fading over their last 7 of 28 ticks. Once the cast ends (the source stops emitting or loses
# its carrier) each marker fades over 6 ticks.
# CastingDomination, CastingEnchantment and CastingHealing are built on it (like = "CastingIllusion"): what changes
# here changes them too.
# The original types on data: docs/notes/effects.md, "The original effects on data".

texture = "Casting2"
attach = "attached_only"

[source]
spread_min = [-0.04, -0.04, -0.04]
spread_max = [0.04, 0.04, 0.04]

[emit]
rate = 10
max = 600

# The lights (orbiters), their turn a tick, their height and the sign of their sparks' rise.
[vars]
orbiters = 2
turn = 0.3
lift = 0.4
sign = 1
seen = 0

[tables]
fade = [0, 0, 32, 64, 112, 160, 208, 255, 255, 255, 255, 255, 255, 255, 207, 159, 111, 63, 15]

# Each emission adds a light until there are `orbiters` of them, its marker the particle.
[[on]]
event = "before_emit"
do = [{ set = "seen", value = "anchors.orb" }]

[[on]]
event = "before_emit"
when = "anchors.orb < orbiters"
do = [{ add_anchor = "orb" }]

# A light: its place relative to the source (r), in the world (w) and last tick (o). A later light takes the first's
# orbit and carrier radius from its values (the original's reads; equal while the first has not turned).
[[anchor]]
name = "orb"
count = 0

[anchor.vars]
carrier = "a.index == 0 ? carrier_radius : orb.scale[0]"
orbit = "a.index == 0 ? carrier_radius * 0.5 : orb.r[0].x"
angle = "(a.index * pi + a.index * pi) / orbiters"
scale = "sign * a.carrier"
r = { start = "vec3(cos(a.angle) * a.orbit, sin(a.angle) * a.orbit, a.carrier * lift)", tick = "vec3(a.r.x * cos(turn) + a.r.y * sin(turn), a.r.y * cos(turn) - a.r.x * sin(turn), a.r.z)" }
o = { start = "origin + a.r", tick = "a.w" }
w = { tick = "origin + a.r" }

# A light's marker: on it, flickering; once the cast ends it fades by the table (l: its countdown).
[[particle]]
name = "marker"
when = "anchors.orb > seen"
at = "orb"
anchor_index = "anchors.orb - 1"
lifetime = 1000000000                           # until its fade ends
position = { tick = "a.w" }
size = { start = 0, tick = "(below(0.4) + 0.8) * size * 0.4" }
alpha = { start = 255, tick = "emitting && attached ? p.alpha : fade[p.l0 + 1]" }
kill = "!(emitting && attached) && p.l0 < 0"

[particle.vars]
l0 = { start = 6, tick = "p.l" }
l = { start = 6, tick = "emitting && attached || p.l < 0 ? p.l : p.l - 1" }

# A spark: from the light's last place plus the spread to a point between its last place and its place now (s); then
# up by its rise, which grows by 1.03 a tick.
[[particle]]
name = "spark"
at = "orb"
pick = "random"
lifetime = 28
spawn = "range(spread_min, spread_max)"
position = { start = "a.o + p.spawn", tick = "p.s" }
size = { start = "(below(0.8) + 0.6) * size * 0.2", tick = "p.size * 0.97" }
alpha = { start = 255, tick = "p.life < 7 ? fade[p.life] : p.alpha" }
frame = { start = 1, tick = "p.frame + 1 == 16 ? 12 : p.frame + 1" }

[particle.vars]
along = "range(0, 1)"
rb = "below(0.35)"
s = { start = "p.spawn + lerp(a.w, a.o, p.along)", tick = "p.s + vec3(0, 0, p.rise)" }
rise = { start = "(p.rb + 0.85) * a.scale * 0.03", tick = "1.03 * p.rise" }
