# SphereFire (0x2017, the ProtectionF texture): the fire protection sphere around a unit. Once a tick that emits, the
# sphere follows its carrier: its height eases (0.1 a tick) towards the carrier's centre and its radius towards 1.2
# times the carrier's radius, the carrier's motion is smoothed (0.7 of the last kept) and the next tick's tries are 6
# times the source's size (rounded; 1 to begin with), 90% each. A spark starts on the shell of 0.65 of the radius,
# turns 0.01 radians a tick about the vertical and, while the carrier moves, is squashed against its motion (the part
# of its offset against the motion taken off, up to all of the motion); its size by the life table over 15 ticks, a
# random 0.7-1.3 (one in eleven 1.5-2.5) of the radius, doubled; 15 frames from a random one of 0-10.
# SphereAcid, SphereElectricity and Antimagic are built on it (like = "SphereFire"): what changes here changes them too.
# The original types on data: docs/notes/effects.md, "The original effects on data".

texture = "ProtectionF"
frames = 15
blend = "additive"
attach = "attached_only"

[source]
spread_min = [-0.2, -0.2, -1]
spread_max = [0.2, 0.2, 0]

[emit]
rate = "tries"
chance = 90

[vars]
tries = { start = 1, tick = "next_tries" }      # this tick's
last_height = { start = 0, tick = "sphere_height" }     # the sphere before this tick's follow
last_radius = { start = 0, tick = "sphere_radius" }
last_speed = { start = 0, tick = "speed" }
last_moved = { start = 0, tick = "moved" }
was_set_up = { start = 0, tick = "set_up" }
follow = { tick = "emitting && attached && tries > 0" }
sphere_height = { tick = "follow ? (was_set_up ? sphere_height : carrier_z) * 0.9 + carrier_z * 0.1 : sphere_height" }
sphere_radius = { tick = "follow ? carrier_radius * 1.2 * 0.1 + (was_set_up ? sphere_radius : carrier_radius * 1.2) * 0.9 : sphere_radius" }
moved = { tick = "follow ? (was_set_up ? moved : 0) * 0.7 + motion : moved" }   # the smoothed motion
speed = { tick = "follow ? (length(moved) < 0.01 ? 0 : length(moved)) : speed" }
next_tries = { start = "follow ? round(size * 6) : 1", tick = "follow ? round(size * 6) : next_tries" }
set_up = { tick = "set_up || follow" }

# A spark's update reads the sphere as the last tick's follow left it (the sphere follows at this tick's emission).
[[particle]]
name = "spark"
lifetime = 15
spawn = "shell() * (sphere_radius * 0.65)"
size = { start = "by_life[p.life] * p.big * sphere_radius * 2", tick = "by_life[p.life] * p.big * last_radius * 2" }
frame = { start = "pick(11)", tick = "(p.frame + 1) % 15" }

[particle.vars]
big = "pick(11) == 0 ? range(0, 1) + 1.5 : below(0.6) + 0.7"
shell = { start = "p.spawn", tick = "vec3(cos(0.01) * p.shell.x - sin(0.01) * p.shell.y, cos(0.01) * p.shell.y + sin(0.01) * p.shell.x, p.shell.z)" }

# The offset: the shell point less the smoothed motion times t = -(motion . shell / speed), held to [0, 1], while the
# carrier moves.
[particle.position]
start = "origin + vec3(0, 0, sphere_height) + (speed > 0.01 ? p.shell - moved * clamp(-(dot(moved, p.shell) / speed), 0, 1) : p.shell)"
tick = "origin + vec3(0, 0, last_height) + (last_speed > 0.01 ? p.shell - last_moved * clamp(-(dot(p.shell, last_moved) / last_speed), 0, 1) : p.shell)"

[tables]
by_life = [0.01, 0.02, 0.03, 0.035, 0.035, 0.035, 0.035, 0.035, 0.035, 0.035, 0.035, 0.035, 0.035, 0.03, 0.02, 0.01]
