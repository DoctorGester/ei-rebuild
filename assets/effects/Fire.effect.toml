# Fire (0x2003): the smoke of a fire. Puffs at random points of the spread box (two in five half the size and spread
# wider by 0.3 of it), half of their offset taken at once and the other half at their first tick, at a random height
# up to the source's height, rising by that height a tick, growing by the source's growth to their seventh tick, then
# by 1.06 in the wind; a frame a tick, 8 ticks.
# CampFire and Tendril are built on it (like = "Fire"): what changes here changes them too.
# The original types on data: docs/notes/effects.md, "The original effects on data".

texture = "TendriSmoke"
frames = 15

[source]
size = 0.8
height = 0.3
growth = 0.85
spread_min = [-0.2, -0.2, 0]
spread_max = [0.2, 0.2, 0]

[emit]
rate = 6
chance = 88

[[particle]]
name = "puff"
lifetime = 8
size = { start = "p.small ? size * 0.5 : size", tick = "p.age < 7 ? p.size * growth : p.size * 1.06" }
frame = { start = 0, delay = 1 }

[particle.vars]
small = "chance(40)"
half = "vec3(range(spread_min.xy - (p.small ? size * 0.3 : 0), spread_max.xy + (p.small ? size * 0.3 : 0)) * 0.5, 0)"
rise = "height"

[particle.position]
start = "origin + p.half + vec3(0, 0, range(0, height))"
tick = "p.position + vec3(0, 0, p.rise) + (p.age < 2 ? p.half : (p.age < 7 ? 0 : p.size * 1.06 * wind_strength * 0.15 * wind))"
