# PoisonFog (0x2007, the PoisonCloud texture): the poison spell's cloud. Whenever the source has no particles and a
# try of its emission (one a tick, half of them passing) comes up, it lays one puff per cell of a grid of 1, the
# cells inside the disc of the size around it, each jittered by a quarter of a cell: on the ground, raised by its
# size (0.75 to 1.25), its alpha 160 times the source's alpha (at most 255), its frames cycling from a random one.
# The puffs stay while the source emits; once it stops, each tick their alpha falls by 4.5 times the source's alpha
# (at least 1) as a byte that wraps below 0, and a puff goes once its alpha is 9 or less.
# PoisonCloud is built on it (like = "PoisonFog"): what changes here changes it too.
# The original types on data: docs/notes/effects.md, "The original effects on data".

texture = "PoisonCloud"
frames = 15

[emit]
rate = 1
chance = 50
max = 2147483647

[vars]
half = { tick = "floor(size + 1)" }             # cells each way from the middle
width = { tick = "2 * half + 1" }

# The try's particle is only the trigger: the reaction lays the grid at once.
[[on]]
event = "emit"
when = "count == 0"
do = [{ emit = "width * width", kind = "puff" }]

[[particle]]
name = "try"
lifetime = 1
drop = true

[[particle]]
name = "puff"
when = false
lifetime = 2147483647                           # until it has faded (kill)
position = "on_ground(origin + p.cell, p.lift)"
size = "p.lift"
alpha = { start = "min(round(alpha * 160), 255)", tick = "emitting ? p.alpha : (p.alpha + 256 - max(round(alpha * 4.5), 1) % 256) % 256" }
frame = { start = "pick(15)", delay = 1 }
kill = "!emitting && p.alpha <= 9"
drop = "length(p.cell) >= size"

[particle.vars]
cell = "vec3(range(-0.25, 0.25) + p.index % width - half, range(-0.25, 0.25) + floor(p.index / width) - half, 0)"
lift = "range(0.75, 1.25)"
