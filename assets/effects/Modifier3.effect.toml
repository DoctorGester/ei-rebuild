# Modifier3 (0x201D, the Stun texture, marker frame 2): a spell's mark on a unit, Modifier1's ring of points (its
# file says how they move), raised by 0.8 of the radius more.
# The original types on data: docs/notes/effects.md, "The original effects on data".

like = "Modifier1"

[[on]]
event = "before_emit"
do = [{ set = "spread_min.x", value = "(carrier_radius + carrier_radius) * 0.4 + carrier_radius" }, { add_anchor = "point", count = "max(floor(abs(size) * 10), 1)" }]

[[particle]]
name = "marker"
frame = 2
