# GroundDust2 (0x203B, the ShapeChange texture, frame 15): the red dust of a marker on the ground, GroundDust1's (its
# file says how the grains run) with 256 grains: the first 128 on the circle, the others along the four diagonals.
# The original types on data: docs/notes/effects.md, "The original effects on data".

like = "GroundDust1"

[emit]
rate = 256
max = 256

[[particle]]
name = "grain"
color = "FF4040"
