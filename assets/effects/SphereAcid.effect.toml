# SphereAcid (0x2015, the ProtectionA texture): the acid protection sphere around a unit, SphereFire's (its file says
# how the sphere follows and the sparks move) with the sparks 1.6 times the radius's part where the fire's double it.
# The original types on data: docs/notes/effects.md, "The original effects on data".

like = "SphereFire"
texture = "ProtectionA"

[[particle]]
name = "spark"
size = { start = "by_life[p.life] * p.big * sphere_radius * 1.6", tick = "by_life[p.life] * p.big * last_radius * 1.6" }
