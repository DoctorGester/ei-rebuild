# SphereElectricity (0x2016, the ProtectionE texture): the electricity protection sphere around a unit, SphereFire's
# (its file says how the sphere follows and the sparks move) with the sparks at the radius's part, not doubled, one in
# eleven 3.5-4.5 of it.
# The original types on data: docs/notes/effects.md, "The original effects on data".

like = "SphereFire"
texture = "ProtectionE"

[[particle]]
name = "spark"
size = { start = "by_life[p.life] * p.big * sphere_radius", tick = "by_life[p.life] * p.big * last_radius" }

[particle.vars]
big = "pick(11) == 0 ? range(0, 1) + 3.5 : below(0.6) + 0.7"
