# FireStar (0x2041): the fire arrow's flash where it hits a unit. One particle at the source, hidden in the tick it is
# made, then shown two ticks at the source's size and 0.9 of it; the source stops emitting at once.
# AcidStar is built on it (like = "FireStar"): what changes here changes it too.
# The original types on data: docs/notes/effects.md, "The original effects on data".

texture = "FireArrowSmoke"
attach = "attached_only"
part = "body"

[server]
one_shot = 60
script_lifetime = 20

[emit]
rate = 1
once = true

[[particle]]
name = "flash"
lifetime = 3
vars = { flash = "size" }
size = { start = 0, tick = "p.size == 0 ? p.flash : p.size * 0.9" }
alpha = { start = 0, tick = 255 }
frame = 15
