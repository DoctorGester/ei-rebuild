# CastingElectricity (0x2028, the Casting8 texture): an electricity mage's cast, CastingFire's (its file says how the
# swirls and sparks move) with a swirl's pull more often (one pick in 6 none) and the sparks' frames running back
# every tick.
# The original types on data: docs/notes/effects.md, "The original effects on data".

like = "CastingFire"
texture = "Casting8"

[vars]
picks = 6

[[particle]]
name = "spark"
frame = { tick = "p.frame - 1" }
