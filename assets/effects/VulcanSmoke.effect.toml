# VulcanSmoke (0x2005): lava drops and smoke from a vent. Three in five are drops, thrown out at the vent's height (a
# random part of spread_min.y around spread_max.y) in a random direction by spread_min.x a tick, slowing by 0.965 and
# growing by the source's growth, a frame every 8 ticks; the others smoke at a random point of the vent (spread_max.x
# around it), rising by the source's height a tick and growing by 1.02, a frame every 4 ticks. Both end after their
# last frame.
# The original types on data: docs/notes/effects.md, "The original effects on data".

texture = "Vulkan"

[source]
size = 2.5
height = 0.0625                                 # the spread's top y (4) / 64
growth = 0.99
spread_min = [0.2, 0.5, 0]
spread_max = [0.3, 4, 0]

[emit]
rate = 2
chance = 88
max = 400

[[particle]]
name = "drop"
when = "chance(60)"
lifetime = 128
position = "origin + vec3(0, 0, spread_max.y + range(-0.5, 0.5) * spread_min.y)"
velocity = { start = "circle(range(0, 2 * pi)) * spread_min.x", tick = "p.velocity * 0.965" }
size = { start = "size", tick = "p.size * growth" }
frame = { start = 0, delay = 8, mode = "die" }

[[particle]]
name = "smoke"
lifetime = 64
position = "origin + circle(range(0, 2 * pi)) * range(0, spread_max.x)"
velocity = "vec3(0, 0, height)"
size = { start = "size * 0.3", tick = "p.size * 1.02" }
frame = { start = 0, delay = 4, mode = "die" }
