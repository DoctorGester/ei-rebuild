# Healing (0x2006, the Healing texture): rings of flames rising around the carrier. At the first particle the effect
# places 6 * size + 2 rings stacked from the carrier's feet (each lifted at random by a tenth of its height), their
# leading flames spaced evenly round; for 36 ticks each ring's flame point turns 10 degrees a tick about its centre and
# rises, the ring widening for 18 ticks and narrowing for 18, then the emission ends (the rings go on turning). Each
# ring's flame rides it 36 ticks, growing then shrinking and cycling 8 frames, then burns out over 8; sparks start
# round a random ring's centre.
# The original types on data: docs/notes/effects.md, "The original effects on data".

texture = "Healing"
blend = "additive"
attach = "attached_only"

[server]
one_shot = 60
script_lifetime = 200

[source]
size = 0.5

[emit]
rate = "rate_now"

# The rings' countdown (t, from the first particle), the emission's count and the flames made so far (one per ring,
# then one empty try).
[vars]
t = { start = -1000, tick = "t - 1" }
rate_now = 2147483647
emit_state = 0

[[on]]
event = "before_emit"
when = "anchors.ring == 0"
do = [{ set = "height", value = "carrier_radius * 1.1 * 0.027777778 + carrier_radius * 1.1 * 0.027777778" }, { set = "growth", value = "(size + 1) * 0.0069444445" }, { set = "t", value = 36 }, { set = "rate_now", value = "round(size * 6 + 2) * 3" }, { add_anchor = "ring", count = "round(size * 6 + 2)" }]

[[on]]
event = "emit"
when = "emit_state <= anchors.ring"
do = [{ set = "emit_state", value = "emit_state + 1" }]

[[on]]
event = "tick"
when = "t == 0"
do = [{ stop_emitting = true }]

# A ring: its random lift, its leading flame's angle (each ring's the one before's plus its share of the circle), its
# radius (growing by the source's height a tick, then shrinking), its rise a tick and its flame point (p, relative to
# the source).
[[anchor]]
name = "ring"
count = 0

[anchor.vars]
lift = "range((carrier_radius + carrier_radius) * -0.1, (carrier_radius + carrier_radius) * 0.1)"
angle = { start = "a.index == 0 ? 0 : ring.angle[a.index - 1] + deg * (360 / a.count)", tick = "t == 0 ? a.angle : deg * 10 + a.angle" }
radius = { start = 0, tick = "t == 0 ? a.radius : t >= 18 ? height + a.radius : a.radius - height" }
rise = "(carrier_radius + carrier_radius - a.lift) * 0.027777778"
p = { start = "vec3(0, 0, a.lift + (carrier_z - carrier_radius))", tick = "t == 0 ? a.p : vec3(sin(a.angle) * a.radius, cos(a.angle) * a.radius, a.rise + a.p.z)" }

# A ring's flame: rides it 36 ticks, then burns out where it is.
[[particle]]
name = "flame"
when = "emit_state < anchors.ring"
at = "ring"
anchor_index = "emit_state"
lifetime = 44
position = { tick = "p.age < 36 ? origin + a.p : p.position" }
size = { start = "(size + 1) * 0.1", tick = "p.age <= 18 ? growth + p.size : p.age < 36 ? p.size - growth : p.size" }
alpha = { tick = "p.age > 36 ? p.alpha - 31 : 255" }
frame = { start = 0, tick = "p.age < 36 ? (p.frame + 1) % 8 : p.frame" }

# The try after the flames emits nothing.
[[particle]]
name = "none"
when = "emit_state == anchors.ring"
lifetime = 1
drop = true

# A spark in a box of 0.15 of a ring's radius about its flame point, the point its top.
[[particle]]
name = "spark"
at = "ring"
pick = "random"
lifetime = 8
position = "origin + a.p + range(vec3(-1, -1, -1), vec3(1, 1, 0)) * (a.radius * 0.15)"
size = "(size + 1) * 0.07"
frame = { start = 8, tick = "p.frame + 1" }
