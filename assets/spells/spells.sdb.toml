# The fire wall: a wall at each target point it picks, across the line from the caster, burning every 4th tick. Its
# cast outlasts its duration (its light rises for 80 ticks after), so it has no tick limit: its script ends it.
[[spell]]
code = "firewall"
script = "LastingArea.lua"
per_target = true
ends_with_target = true
max_ticks = 0
ai = "lasting_area"
damage_type = "fire"
offensive = true
turns_victim = false
fighting = true

