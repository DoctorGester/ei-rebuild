# The buffs (Buff.lua): each puts its own effect on the unit it is cast at (`effect`: what that effect does, its
# stat effect and its look), for the cast's duration. None of them is fighting.

# Protection from fire: fire protection (the larger of it and antimagic's).
[[spell]]
code = "prot_fire"
script = "Buff.lua"
effect = "prot_fire"
per_target = true
ends_with_target = true
ai = "protect"
offensive = false
turns_victim = false
