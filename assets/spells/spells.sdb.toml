# The buffs (Buff.lua): each puts its own effect on the unit it is cast at (`effect`: what that effect does, its
# stat effect by Buff.lua's OnStats), for the cast's duration. The look and sound fields say how an effect of the
# kind shows on the unit (docs/modding.md, "Active effects"). None of them is fighting.

# Protection from fire: fire protection (the larger of it and antimagic's).
[[spell]]
code = "prot_fire"
script = "Buff.lua"
effect = "prot_fire"
look = "SphereFire"
sound_start = "magic\\Fireshield\\start.wav"
sound_end = "magic\\Fireshield\\end.wav"
per_target = true
ends_with_target = true
ai = "protect"
offensive = false
turns_victim = false
fighting = false

