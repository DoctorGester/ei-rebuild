; The Rebirth profile: the patches an exe takes in a Rebirth install (src/game/rebirth_profile.cpp: starter\addon.dll or
; EI_Plugin.asi in its game folder), each patch not named here off. What a hooked Rebirth launch of the install turned
; on (addon.dll's and EI_Plugin.asi's patches, until S21e), as ei_settings.ini's [patches] names them. The build turns
; it into the exe's profile (CMakeLists.txt, rebirth_profile.inc), which the runs on the Rebirth install take; the
; "folderprofile" step checks the exe's profile against it (tests/verify/harness_folder_profile.h). EI_Plugin's player count and pause mode are the install's EI_Plugin.ini's.
[patches]
DisableExitOnCrashReport = true
MQClient = true
Maps = true
ResOverride = true
MoviesPatch = true
CameraPatch = true
StreamPatch = true
EiPluginNPlayers = true
EiPluginPause = true
EiPluginNewMaster = true
EiPluginBriefings = true
EiPluginFixes = true
