; The Rebirth profile: the patches an exe takes in a Rebirth install (src/standalone/startup.cpp: starter\addon.dll or
; EI_Plugin.asi in its game folder), each patch not named here off. What a hooked Rebirth launch of the install turned
; on (addon.dll's and EI_Plugin.asi's patches, until S21e), as ei_settings.ini's [patches] names them. The build turns
; it into the exe's profile (CMakeLists.txt, rebirth_profile.inc); run_all passes the names as EI_REBIRTH for the
; image's runs on the Rebirth install (S19); the "dropin" step checks the exe's profile against it
; (tests/verify/harness_dropin.h). EI_Plugin's player count and pause mode are the install's EI_Plugin.ini's.
[patches]
DisableExitOnCrashReport = true
MQClient = true
Maps = true
ResOverride = true
MoviesPatch = true
CameraPatch = true
StreamPatch = true
EiPluginNPlayers = true
EiPluginPause = true
EiPluginNewMaster = true
EiPluginBriefings = true
EiPluginFixes = true
