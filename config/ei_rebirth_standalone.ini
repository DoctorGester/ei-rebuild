; The Rebirth flags of the standalone image on the Rebirth install (run_all --standalone, S19): what a hooked
; Rebirth launch of this install turns on (ei_hook.log "Rebirth flags on", FollowAddon), as ei_rebirth.ini
; would set them next to ei_hook.dll. run_all passes the names set to 1 as EI_REBIRTH. NPlayers and
; Pause are EI_Plugin.ini's [CONFIG] values (rebirth_hook::SettingsOnly reads them from ei_rebirth.ini; 7 and 1 are
; their defaults). SecondMaster is NewMaster's second master server (the plugin's is hat.gipath.org:28004),
; host[:port]: empty here and in every harness run, so nothing is looked up or sent (S19c).
[Rebirth]
Default=0
WideScreen=1
ObjectsDrawRadius=1
LandscapeDrawRadius=1
AllowScriptArgsInLoops=1
AllowScriptsInMainMenu=1
FixLeversActivate=1
FixSpellEffectsOverflow=1
FixProgressNames=1
AddNewConsoleCommands=1
ImproveConsole=1
NewStringEvents=1
FixSpellSelfCasting=1
FixProcessLogin=1
FixMoveObject=1
FixAddMapObject=1
FixPlaingBattleMusicFromAntimagic=1
FixRepairPrice=1
FixRemoveMapObject=1
FixCreateItem=1
DisableExitOnCrashReport=1
ExtendedServerName=1
NivalRegistry=1
AutoExec=1
MQClient=1
MPSpeedControl=1
SetEiPluginMode=1
PlayerNumbers=1
AddNewScriptCommands=1
PersistentGlobalVars=1
Maps=1
ResOverride=1
MoviesPatch=1
CameraPatch=1
StreamPatch=1
EiPluginInit=1
EiPluginNPlayers=1
EiPluginPause=1
EiPluginNewMaster=1
EiPluginBriefings=1
EiPluginFixes=1
NPlayers=7
Pause=1
SecondMaster=
