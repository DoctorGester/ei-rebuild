# Linux: builds the game and the harness's build of it (-DEI_HARNESS=ON, tests/verify) with gcc on GitHub's Ubuntu
# runner (CMakeLists.txt; docs/notes/linux.md) and runs the game's checks under a virtual display on Mesa's software
# OpenGL (ctest: the POSIX platform's checks, the interface canvases' glyph cases on OpenGL). No game data: no game
# runs here. A compiler warning fails the build (CMAKE_COMPILE_WARNING_AS_ERROR; this job only, not the Windows builds).
# On pushes to main and claude/** branches and by hand.
name: Linux

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

# Every push to main gets its own run (they go in parallel on GitHub's runners); on other branches a newer push
# cancels the older run.
concurrency:
  group: linux-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v5
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build ccache libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxss-dev libxfixes-dev libxtst-dev libxkbcommon-dev libgl-dev libegl-dev libasound2-dev libpulse-dev \
            xvfb mesa-utils libgl1-mesa-dri mesa-vulkan-drivers
      # The shader toolchain (shadercross, spirv-cross, DXC: tools/shader_toolchain), built at configure time, by its
      # pins; and ccache's objects of both builds, the newest run's (ccache checks every hit against the source).
      - name: Shader toolchain cache
        uses: actions/cache@v5
        with:
          path: build/third_party
          key: shader-toolchain-${{ runner.os }}-${{ hashFiles('tools/shader_toolchain/**') }}
      - name: Compiler cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - name: sokol-shdc
        run: |
          mkdir -p build/tools
          curl -sSfL https://raw.githubusercontent.com/floooh/sokol-tools-bin/b975d5642093d62e76a1e088bdae945d6d8b8ff2/bin/linux/sokol-shdc -o build/tools/sokol-shdc
          chmod +x build/tools/sokol-shdc
      - name: Build
        run: |
          cmake -S . -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_COMPILE_WARNING_AS_ERROR=ON             -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/linux
      - name: Build the harness
        run: |
          cmake -S . -B build/linux-harness -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_COMPILE_WARNING_AS_ERROR=ON             -DEI_HARNESS=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/linux-harness --target ei-rebuild
          ccache --show-stats
      - name: Checks
        run: |
          cd build/linux
          xvfb-run -a -s "-screen 0 1280x1024x24" ctest --output-on-failure
