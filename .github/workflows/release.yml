# Release: run by hand (Actions > Release > Run workflow) with a version such as v0.1.0. It tags the chosen commit,
# pushes the tag, builds ei-rebuild.exe for x86 and x64 (build.cmd release / x64, the build checks included; the
# goldens need the game's data and are not run here) and publishes a GitHub release with both exes.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v0.1.0"
        required: true
      ref:
        description: "Commit or branch to release"
        required: false
        default: main
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Check the version
        shell: bash
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Version must look like v1.2.3 or v1.2.3-beta.1"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${{ inputs.version }}" >/dev/null; then
            echo "Tag ${{ inputs.version }} already exists"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find Visual Studio
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          "EI_VSROOT=$vs" >> $env:GITHUB_ENV

      - name: Build x86
        shell: cmd
        run: build.cmd release

      - name: Build x64
        shell: cmd
        run: build.cmd x64

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build\release\ei-rebuild.exe dist\ei-rebuild-x86.exe
          Copy-Item build\x64\ei-rebuild.exe dist\ei-rebuild-x64.exe

      - name: Tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ inputs.version }}" -m "Release ${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then flags="--prerelease"; fi
          gh release create "${{ inputs.version }}" dist/ei-rebuild-x86.exe dist/ei-rebuild-x64.exe \
            --title "${{ inputs.version }}" --generate-notes $flags
