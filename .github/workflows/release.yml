# Release: run by hand (Actions > Release > Run workflow) with a version such as v0.1.0. It builds ei-rebuild.exe for
# x64 (build.cmd release, the build checks included; the bare exe and ei-rebuild-windows-x64.zip), the Linux build
# (ei-rebuild-linux-x64.tar.gz: built in an Ubuntu 22.04 container for an old glibc, its port checks run) and the macOS
# app (ei-rebuild-macos.zip: a universal arm64 + x86_64 ei-rebuild.app, ad-hoc signed only, its port checks run), then
# tags the chosen commit, pushes the tag and publishes a GitHub release with the four. Each archive holds ei-convert,
# ei-effects (the effect viewer) and the examples folder beside the game: the build's copy of the repository's
# examples, which ei-convert --example-mod reads from beside itself (a mod added under examples ships with no change
# here). The goldens need the game's data and are not run here.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v0.1.0"
        required: true
      ref:
        description: "Commit or branch to release"
        required: false
        default: main
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Check the version
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Version must look like v1.2.3 or v1.2.3-beta.1"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${{ inputs.version }}" >/dev/null; then
            echo "Tag ${{ inputs.version }} already exists"; exit 1
          fi

  windows:
    needs: version
    runs-on: windows-2022
    steps:
      # The generated-file checks compare bytes, so keep the repository's LF line endings.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install capstone==5.0.7

      - name: Find Visual Studio
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          "EI_VSROOT=$vs" >> $env:GITHUB_ENV

      - name: Build
        shell: cmd
        run: build.cmd release

      # The bare exe (dropped into the game folder) and the zip: the exe, ei-convert.exe, ei-effects.exe and the examples
      # folder.
      - name: Package
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $guide = "${{ github.server_url }}/${{ github.repository }}/blob/$version/docs/modding.md"
          $out = "dist"
          $dir = "$out/ei-rebuild-windows-x64"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item build/release/ei-rebuild.exe $out/
          Copy-Item build/release/ei-rebuild.exe, build/release/ei-convert.exe, build/release/ei-effects.exe, build/release/third_party_notices.txt $dir/
          Copy-Item -Recurse build/release/examples $dir/examples
          $readme = @"
          Evil Islands rebuild $version for Windows (x64)

          ei-rebuild.exe plays an installed Evil Islands 1.06 (the GOG or the Rebirth edition); the game's data is not
          in this archive. Copy ei-rebuild.exe into the game folder and start it there.

          Mods: ei-convert.exe writes the game's data as files a mod can change (TOML, PNG, glTF, Lua), and makes the
          example mod from your install. In a command prompt in this folder:

              ei-convert.exe --example-mod "C:\GOG Games\Evil Islands"

          writes the example mod into that game folder's starter\Mods\example_mod; pick "Example mod" in the main
          menu's list. Keep the examples folder beside ei-convert.exe: examples\readme.txt lists its mods.

              ei-convert.exe "C:\GOG Games\Evil Islands" converted

          writes all of the game's data as such files into the folder converted (about 350 MB; it only reads the
          install). The modding guide: $guide

          ei-effects.exe, the effect viewer, plays the game's particle effects and a mod's on a figure and edits
          them live. Copy it into the game folder too and start it there; ei-effects.exe --mod <folder> plays a
          mod's effects (the guide's "The effect viewer").

          third_party_notices.txt holds the licences of the code and fonts built in.
          "@
          ($readme -replace "`r?`n", "`r`n") + "`r`n" | Set-Content -NoNewline -Encoding ascii "$dir/README.txt"
          Compress-Archive -Force -Path $dir -DestinationPath "$out/ei-rebuild-windows-x64.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: |
            dist/ei-rebuild.exe
            dist/ei-rebuild-windows-x64.zip
          if-no-files-found: error

  # The renderer's compiled shaders for the Linux job (CMakeLists.txt's ei_shaders target: shaders/gpu_shaders.h and
  # .cpp), built on the runner itself: DXC's Linux release, which the shader toolchain links, needs glibc 2.38, newer
  # than the container's. The packages and the toolchain's cache are suites-linux.yml's.
  linux-shaders:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxss-dev libxfixes-dev libxtst-dev libxkbcommon-dev libgl-dev libegl-dev libasound2-dev libpulse-dev
      - name: Shader toolchain cache
        uses: actions/cache@v5
        with:
          path: build/third_party
          key: shader-toolchain-${{ runner.os }}-${{ hashFiles('tools/shader_toolchain/**') }}
      - name: Build
        run: |
          cmake -S . -B build/shaders -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/shaders --target ei_shaders
      - uses: actions/upload-artifact@v6
        with:
          name: linux-shaders
          path: |
            build/shaders/shaders/gpu_shaders.h
            build/shaders/shaders/gpu_shaders.cpp
          if-no-files-found: error

  # Ubuntu 22.04's glibc (2.35) is the baseline: the binary runs on it and on anything newer. Its gcc 11 has no
  # <format>, so gcc 13 comes from the toolchain PPA with its C++ runtime linked in (no newer libstdc++ needed at run
  # time); CMakeLists.txt wants cmake 3.24, newer than 22.04's 3.22, so cmake comes from pip. The shaders are the
  # linux-shaders job's (EI_PREBUILT_SHADERS: no shader toolchain in here). SDL3 is built in statically and opens X11,
  # sound and the rest itself; the binary needs glibc and libGL.
  linux:
    needs: [version, linux-shaders]
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - name: Packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -q
          apt-get install -y -q software-properties-common git curl ca-certificates python3-pip ninja-build binutils \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxfixes-dev libxtst-dev \
            libxkbcommon-dev libgl-dev libegl-dev libasound2-dev libpulse-dev xvfb xauth mesa-utils libgl1-mesa-dri mesa-vulkan-drivers
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt-get install -y -q g++-13
          pip3 install cmake==3.31.6
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v7
        with:
          name: linux-shaders
          path: build/prebuilt-shaders
      - name: Build
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -S . -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc" "-DEI_PREBUILT_SHADERS=$PWD/build/prebuilt-shaders"
          cmake --build build/linux
      - name: Checks
        run: |
          cd build/linux
          xvfb-run -a -s "-screen 0 1280x1024x24" ctest --output-on-failure
      - name: Package
        run: |
          exe=build/linux/ei-rebuild
          convert=build/linux/ei-convert
          effects=build/linux/ei-effects
          for program in $exe $convert $effects; do
            strip $program
            if objdump -T $program | grep -q GLIBCXX_; then echo "$program: libstdc++ is linked dynamically"; exit 1; fi
          done
          glibc=$(objdump -T $exe $convert | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "ei-rebuild needs glibc $glibc; libraries: $(readelf -d $exe | grep -o 'NEEDED.*' | grep -o '\[.*\]' | tr '\n' ' ')" | tee -a $GITHUB_STEP_SUMMARY
          mkdir -p dist/ei-rebuild-linux-x64
          cp $exe $convert $effects build/linux/third_party_notices.txt dist/ei-rebuild-linux-x64/
          cp -R build/linux/examples dist/ei-rebuild-linux-x64/
          cat > dist/ei-rebuild-linux-x64/README.txt <<EOF
          Evil Islands rebuild ${{ inputs.version }} for Linux (x86-64)

          ei-rebuild plays an installed Evil Islands 1.06 (the GOG or the Rebirth edition); the game's data is not
          in this archive. Copy ei-rebuild into the game folder and run it there, or run it from anywhere with the
          game folder named:

              EI_GAME_ROOT="/path/to/Evil Islands" ./ei-rebuild

          The settings are the game folder's ei_settings.ini (EI_SETTINGS_PATH names another file); the log is
          ei-rebuild.log beside the program.

          It needs glibc $glibc or newer, OpenGL 4.5 (Mesa or the GPU maker's driver) and an X11 desktop (XWayland
          on Wayland desktops).

          WSL (WSLg): Mesa draws on the CPU there unless told otherwise; GALLIUM_DRIVER=d3d12 ./ei-rebuild draws on
          the Windows GPU.

          Mods: ei-convert writes the game's data as files a mod can change (TOML, PNG, glTF, Lua), and makes the
          example mod from your install. In this folder:

              ./ei-convert --example-mod "/path/to/Evil Islands"

          writes the example mod into that game folder's starter/Mods/example_mod; pick "Example mod" in the main
          menu's list. Keep the examples folder beside ei-convert: examples/readme.txt lists its mods.
          ./ei-convert "/path/to/Evil Islands" converted writes all of the game's data as such files into the folder
          converted (about 350 MB; it only reads the install). The modding guide:
          ${{ github.server_url }}/${{ github.repository }}/blob/${{ inputs.version }}/docs/modding.md

          ei-effects, the effect viewer, plays the game's particle effects and a mod's on a figure and edits them
          live: run it as ei-rebuild (in the game folder, or with EI_GAME_ROOT); --mod <folder> plays a mod's effects.

          third_party_notices.txt holds the licences of the code and fonts built in.
          EOF
          sed -i 's/^          //' dist/ei-rebuild-linux-x64/README.txt
          tar -C dist -czf dist/ei-rebuild-linux-x64.tar.gz ei-rebuild-linux-x64
      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: dist/ei-rebuild-linux-x64.tar.gz
          if-no-files-found: error

  # macOS (docs/notes/macos.md): Apple Clang on GitHub's arm64 runner builds one universal ei-rebuild.app, its arm64
  # and x86_64 slices from one configure (CMAKE_OSX_ARCHITECTURES; the vendored SDL3 builds both). Deployment target
  # 13.3: Apple's libc++ has float std::to_chars (settings_document.cpp, std::format's floats) from 13.3 on. DXC for the
  # shader toolchain is the LunarG Vulkan SDK's (Microsoft ships no macOS DXC): its libdxcompiler.dylib and headers
  # are copied out of the installed SDK into ~/dxc-macos, cached by the SDK's version, and named by EI_DXC_ROOT. The
  # app is ad-hoc signed (codesign -s -: arm64 code must carry a signature) but neither Developer ID signed nor
  # notarised, so Gatekeeper refuses it until the quarantine flag is cleared (the zip's README.txt, the release notes).
  macos:
    needs: version
    runs-on: macos-15
    env:
      VULKAN_SDK_VERSION: 1.4.363.1
      MACOSX_TARGET: "13.3"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # cmake 3.31 as in the Linux job, and ninja, from pip.
      - name: Tools
        run: pip install cmake==3.31.6 ninja
      - name: DXC cache
        id: dxc-cache
        uses: actions/cache@v5
        with:
          path: ~/dxc-macos
          key: dxc-macos-${{ env.VULKAN_SDK_VERSION }}
      - name: DXC from the Vulkan SDK
        if: steps.dxc-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/vulkansdk.zip" \
            "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/mac/vulkansdk-macos-$VULKAN_SDK_VERSION.zip"
          echo "Vulkan SDK $VULKAN_SDK_VERSION: sha256 $(shasum -a 256 "$RUNNER_TEMP/vulkansdk.zip" | cut -d' ' -f1)" \
            | tee -a $GITHUB_STEP_SUMMARY
          unzip -q "$RUNNER_TEMP/vulkansdk.zip" -d "$RUNNER_TEMP/vulkansdk-installer"
          set -- "$RUNNER_TEMP"/vulkansdk-installer/*.app/Contents/MacOS/*
          sudo "$1" --root "$RUNNER_TEMP/vulkansdk-root" --accept-licenses --default-answer --confirm-command install
          sdk="$RUNNER_TEMP/vulkansdk-root/macOS"
          mkdir -p ~/dxc-macos/lib ~/dxc-macos/include
          cp -a "$sdk"/lib/libdxcompiler*.dylib ~/dxc-macos/lib/
          cp -a "$sdk/include/dxc" ~/dxc-macos/include/
          test -f ~/dxc-macos/include/dxc/dxcapi.h
          test -f ~/dxc-macos/lib/libdxcompiler.dylib
          otool -L ~/dxc-macos/lib/libdxcompiler.dylib
      # The shader toolchain (shadercross, spirv-cross: tools/shader_toolchain), built at configure time for the
      # runner's own arm64, by its pins, cached as in suites-linux.yml.
      - name: Shader toolchain cache
        uses: actions/cache@v5
        with:
          path: build/third_party
          key: shader-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ env.VULKAN_SDK_VERSION }}-${{ hashFiles('tools/shader_toolchain/**') }}
      - name: Build
        run: |
          cmake -S . -B build/macos -G Ninja -DCMAKE_BUILD_TYPE=Release "-DEI_DXC_ROOT=$HOME/dxc-macos" \
            "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" "-DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOSX_TARGET"
          cmake --build build/macos
      - name: Checks
        run: |
          ctest --test-dir build/macos --output-on-failure
          # The x86_64 slice's platform checks under Rosetta, where the runner has it.
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            (cd build/macos && arch -x86_64 ./ei_port_check)
          else
            echo "No Rosetta on the runner: the x86_64 slice's checks were not run" | tee -a $GITHUB_STEP_SUMMARY
          fi
      - name: Package
        run: |
          app=build/macos/ei-rebuild.app
          exe=$app/Contents/MacOS/ei-rebuild
          convert=build/macos/ei-convert
          effects=build/macos/ei-effects
          for program in $exe $convert $effects; do
            archs=$(lipo -archs $program)
            for a in arm64 x86_64; do
              case " $archs " in *" $a "*) ;; *) echo "$program not universal: $archs"; exit 1;; esac
            done
            # otool's library lines start with a tab, its "(architecture ...)" headers do not.
            if otool -L $program | grep -E '^[[:space:]]' | grep -v -E '^[[:space:]]*(/System/Library/|/usr/lib/)'; then
              echo "$program links a library outside the system"; exit 1
            fi
          done
          version="${{ inputs.version }}"
          plutil -replace CFBundleShortVersionString -string "${version#v}" $app/Contents/Info.plist
          plutil -replace CFBundleVersion -string "${version#v}" $app/Contents/Info.plist
          codesign --force --deep --sign - $app
          codesign --verify --deep --strict $app
          codesign --force --sign - $convert
          codesign --verify --strict $convert
          codesign --force --sign - $effects
          codesign --verify --strict $effects
          echo "ei-rebuild.app: $archs, macOS $MACOSX_TARGET or newer" | tee -a $GITHUB_STEP_SUMMARY
          mkdir -p dist/ei-rebuild-macos
          cp -R $app $convert $effects build/macos/examples build/macos/third_party_notices.txt dist/ei-rebuild-macos/
          cat > dist/ei-rebuild-macos/README.txt <<EOF
          Evil Islands rebuild ${{ inputs.version }} for macOS (Apple silicon and Intel, macOS $MACOSX_TARGET or newer)

          ei-rebuild.app plays an installed Evil Islands 1.06 (the GOG or the Rebirth edition, its folder copied from
          a Windows install); the game's data is not in this archive.

          The app is not signed with an Apple Developer ID nor notarised, so macOS refuses to open it as downloaded.
          Clear the download's quarantine flag once, in Terminal in this folder:

              xattr -dr com.apple.quarantine ei-rebuild.app ei-convert

          (or Control-click the app > Open and confirm; on macOS 15 and later open it once, then System Settings >
          Privacy & Security > Open Anyway).

          The game folder: put ei-rebuild.app into it (beside its Res and Maps folders) and open the app there, or
          open the app from anywhere and choose the folder when it asks. The choice is remembered in
          ~/Library/Application Support/ei-rebuild/game_folder.txt (delete that file to choose again). An app opened
          with the quarantine flag still set runs from a hidden read-only copy, so it asks even inside the game
          folder. From Terminal, EI_GAME_ROOT="/path/to/Evil Islands" before ./ei-rebuild.app/Contents/MacOS/ei-rebuild
          names the folder instead.

          The game writes its saves into the game folder, so use a copy of the install if you want the original
          kept as it is. The settings are ~/Library/Application Support/ei-rebuild/ei_settings.ini, outside the app
          (EI_SETTINGS_PATH names another file). The log is ~/Library/Logs/ei-rebuild/ei-rebuild.log (EI_OUT_DIR names another folder).

          Mods: ei-convert writes the game's data as files a mod can change (TOML, PNG, glTF, Lua), and makes the
          example mod from your install. In Terminal in this folder:

              ./ei-convert --example-mod "/path/to/Evil Islands"

          writes the example mod into that game folder's starter/Mods/example_mod; pick "Example mod" in the main
          menu's list. Keep the examples folder beside ei-convert: examples/readme.txt lists its mods.
          ./ei-convert "/path/to/Evil Islands" converted writes all of the game's data as such files into the folder
          converted (about 350 MB; it only reads the install). The modding guide:
          ${{ github.server_url }}/${{ github.repository }}/blob/${{ inputs.version }}/docs/modding.md

          ei-effects, the effect viewer, plays the game's particle effects and a mod's on a figure and edits them
          live: EI_GAME_ROOT="/path/to/Evil Islands" ./ei-effects (clear its quarantine flag as the app's);
          --mod <folder> plays a mod's effects.

          third_party_notices.txt holds the licences of the code and fonts built in.
          EOF
          ditto -c -k --keepParent dist/ei-rebuild-macos dist/ei-rebuild-macos.zip
      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: dist/ei-rebuild-macos.zip
          if-no-files-found: error

  publish:
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ inputs.version }}" -m "Release ${{ inputs.version }}"
          git push origin "${{ inputs.version }}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then flags="--prerelease"; fi
          # The downloads' notes, above GitHub's generated list of changes.
          cat > notes.md <<'EOF'
          - **Windows** (x64): `ei-rebuild.exe`, copied into the game folder (GOG or Rebirth, 1.06), or
            `ei-rebuild-windows-x64.zip`: the exe with `ei-convert.exe`, `ei-effects.exe` (the effect viewer) and the examples folder.
          - **Linux** (x86-64): `ei-rebuild-linux-x64.tar.gz`; its README.txt says how to name the game folder.
          - **macOS** (Apple silicon and Intel): `ei-rebuild-macos.zip`, an app neither Developer ID signed nor
            notarised: clear the quarantine flag once (`xattr -dr com.apple.quarantine ei-rebuild.app`, or
            Control-click > Open; on macOS 15 and later System Settings > Privacy & Security > Open Anyway), then
            open it inside the game folder or choose the folder when it asks; its README.txt has the details.
          - **Mods**: each archive holds `ei-convert`, which writes the game's data as editable files, and the
            examples folder: `ei-convert --example-mod "<game folder>"` makes the example mod from your own install
            into its `starter\Mods` (no game data is shipped). The archives' README.txt and
            [the modding guide](${{ github.server_url }}/${{ github.repository }}/blob/${{ inputs.version }}/docs/modding.md)
            say more.
          EOF
          gh release create "${{ inputs.version }}" dist/ei-rebuild.exe dist/ei-rebuild-windows-x64.zip \
            dist/ei-rebuild-linux-x64.tar.gz dist/ei-rebuild-macos.zip --title "${{ inputs.version }}" --notes-file notes.md --generate-notes $flags
