# Windows smoke: the Windows builds and a short list of scenarios on GitHub's windows-latest runner (4 vCPU, 16 GB, no
# GPU) on SDL_GPU's Direct3D 12 driver with WARP, the software adapter (docs/notes/harness.md, "The Windows CI job"; H61,
# H62g), as suites-macos.yml does for macOS. On every push to main or claude/** and on pull requests (as Linux), and by hand (Actions > Windows > Run workflow). The full suites were tried
# here (H62c to H62g) and cost more than they gave: WARP draws a frame in 0.3 to 0.8 s, so the runs took 70 to 140
# minutes a shard and some pictures grep -h "failed|error|out of date|differ|problem|lua_api" build_release.log from the desktop's; the user cut them to a smoke test (2026-11-06).
#
# build-release / build-verify (parallel): build.cmd release and build.cmd verify, as on a desktop: the MSVC of the
# runner's Visual Studio (EI_VSROOT from vswhere), warnings and the build checks included (build.cmd runs them; they
# draw on WARP here). build-verify uploads the harness exe and its map (build/verify/ei-rebuild.exe and .map: code
# only, no game data) for the smoke job; the map names a crashed run's stack (tools/resolve_crash.py). A failed build
# check on verify is a warning when the exe was built, so the smoke still runs.
#
# smoke: the stub game data (H41) fetched from the private repository with the read-only token (the variable
# EI_STUB_DATA_REPO and the secrets EI_STUB_DATA_TOKEN / EI_STUB_DATA_KEY, as suites-linux.yml and suites-macos.yml).
# The first game is `boot` alone as a gate. Then the scenarios of the `scenarios` input (empty: SMOKE_LIST below), one
# game at a time, vanilla data only, `--golden`; the summary has run_all's table, the goldens block, the device line and
# tools/ci_details.py for what did not pass. EI_GPU_D3D12_WARP=1 makes the vendored SDL pick the WARP adapter
# (third_party/SDL/README.txt); with no GPU on the runner it is the only adapter anyway.
#
# The data never leaves the runner (temp folder, nothing uploaded but the exe and its map).
name: Windows

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Scenarios to play (space-separated; empty: the smoke list in the workflow)"
        required: false
        default: ""
      builds_only:
        description: "Only the two builds"
        type: boolean
        default: false

# Every push to main gets its own run; on other branches a newer push cancels the older run.
concurrency:
  group: windows-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EI_GPU_D3D12_WARP: "1"
  EI_COMPILER_CACHE: "0"

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Shader toolchain cache
        uses: actions/cache@v5
        with:
          path: build/third_party
          key: shader-toolchain-${{ runner.os }}-${{ hashFiles('tools/shader_toolchain/**') }}
      - name: Visual Studio
        run: |
          vs=$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | tr -d '\r')
          [ -n "$vs" ] || { echo "::grep -h "failed|error|out of date|differ|problem|lua_api" build_release.log::no Visual Studio with the x64 C++ tools"; exit 1; }
          echo "EI_VSROOT=$vs" >> $GITHUB_ENV
          echo "Visual Studio: $vs"
          ls "$(cygpath -u "$vs")/VC/Tools/MSVC"
      - name: Build release
        run: |
          start=$(date +%s)
          cmd //c ".\\build.cmd release > build_release.log 2>&1" && ok=1 || ok=0
          echo "build release: $(( $(date +%s) - start )) s" | tee -a $GITHUB_STEP_SUMMARY
          tail -40 build_release.log
          grep -h "warning" build_release.log | head -20 || true
          grep -h "failed\|error\|out of date\|differ\|problem\|lua_api" build_release.log | grep -v "0 failed\|0 problems\|0 differ" | head -40 || true
          [ $ok = 1 ] || { echo "::grep -h "failed|error|out of date|differ|problem|lua_api" build_release.log::build release failed"; exit 1; }
          ! grep -q "warning C\|warning LNK" build_release.log

  build-verify:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Shader toolchain cache
        uses: actions/cache@v5
        with:
          path: build/third_party
          key: shader-toolchain-${{ runner.os }}-${{ hashFiles('tools/shader_toolchain/**') }}
      - name: Visual Studio
        run: |
          vs=$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | tr -d '\r')
          [ -n "$vs" ] || { echo "::grep -h "failed|error|out of date|differ|problem|lua_api" build_release.log::no Visual Studio with the x64 C++ tools"; exit 1; }
          echo "EI_VSROOT=$vs" >> $GITHUB_ENV
          echo "Visual Studio: $vs"
          ls "$(cygpath -u "$vs")/VC/Tools/MSVC"
      - name: Build verify
        run: |
          start=$(date +%s)
          cmd //c ".\\build.cmd verify > build_verify.log 2>&1" && ok=1 || ok=0
          echo "build verify: $(( $(date +%s) - start )) s" | tee -a $GITHUB_STEP_SUMMARY
          tail -60 build_verify.log
          grep -h "warning" build_verify.log | head -20 || true
          grep -h "failed|error|out of date|differ|problem|lua_api" build_release.log\|error\|out of date\|differ\|problem" build_verify.log | grep -v "0 failed\|0 problems\|0 differ" | head -40 || true
          if [ $ok = 0 ]; then
            # the build checks (they draw on WARP) can fail with the exe built: say so and let the suites run
            [ -f build/verify/ei-rebuild.exe ] || { echo "::grep -h "failed|error|out of date|differ|problem|lua_api" build_release.log::build verify failed"; exit 1; }
            echo "::warning::build verify failed after linking ei-rebuild.exe (the build checks?): see the log"
          fi
          ! grep -q "warning C\|warning LNK" build_verify.log
      - name: Harness exe
        uses: actions/upload-artifact@v5
        with:
          name: harness-exe
          path: |
            build/verify/ei-rebuild.exe
            build/verify/ei-rebuild.map
          retention-days: 3
          if-no-files-found: grep -h "failed|error|out of date|differ|problem|lua_api" build_release.log

  smoke:
    needs: build-verify
    if: >-
      !inputs.builds_only && vars.EI_STUB_DATA_REPO != ''
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      # The harness's real-time limits times 8: WARP on 4 vCPUs runs a game 2.4 times as long as Linux's lavapipe does
      # (which gets 3; H62d, H62g). The world's clock is not scaled.
      EI_TIME_SCALE: 8
      # The macOS list (suites-macos.yml): the menu, the interface (menus, HUD, save and load screens), a new game, a zone
      # change, saves written and loaded back, the renderer's frame (scene, present, water, shadows) and units and items.
      # Less render_stats: 616 s of a WARP run for its per-frame statistics.
      SMOKE_LIST: >-
        boot smoke settings_defaults batch_menus ui_screens ui_hud batch_items_saves rec_save_load batch_scripts world_load
        zone_gz3g render_scene render_present_shot render_water render_shadows
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: harness-exe
          path: build/verify
      - name: Fetch the stub data
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.EI_STUB_DATA_REPO }}
          token: ${{ secrets.EI_STUB_DATA_TOKEN }}
          path: stub-data-checkout
          persist-credentials: false
          lfs: false
      - name: Unpack the stub data
        env:
          KEY: ${{ secrets.EI_STUB_DATA_KEY }}
        run: |
          set +x
          command -v zstd >/dev/null || choco install zstandard -y --no-progress
          DATA=$(cygpath -u "$RUNNER_TEMP")/ei-data
          mkdir -p "$DATA"
          shopt -s nullglob
          parts=(stub-data-checkout/ei-stub-data.tar.zst*)
          [ ${#parts[@]} -gt 0 ] || { echo "::grep -h "failed|error|out of date|differ|problem|lua_api" build_release.log::no ei-stub-data.tar.zst* in the stub data repository"; exit 1; }
          case "${parts[0]}" in
            *.enc | *.enc.*)
              [ -n "$KEY" ] || { echo "::grep -h "failed|error|out of date|differ|problem|lua_api" build_release.log::the stub data is encrypted and EI_STUB_DATA_KEY is not set"; exit 1; }
              cat "${parts[@]}" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY | zstd -dq | tar -x -C "$DATA" ;;
            *)
              cat "${parts[@]}" | zstd -dq | tar -x -C "$DATA" ;;
          esac
          rm -rf stub-data-checkout
          [ -d "$DATA/vanilla" ] || { echo "::grep -h "failed|error|out of date|differ|problem|lua_api" build_release.log::the stub data has no vanilla/"; exit 1; }
          echo "stub data: $(du -sm "$DATA" | cut -f1) MB unpacked"
          echo "DATA_WIN=$(cygpath -w "$DATA")" >> $GITHUB_ENV

      # The gate: the first game alone. When it cannot draw, the log says so and the job stops.
      - name: Gate (boot)
        run: |
          export EI_BUILD_DIR="$(cygpath -w "$PWD/build/verify")" EI_GAME_VANILLA="$DATA_WIN\\vanilla" EI_GAME_REBIRTH="$DATA_WIN\\rebirth"
          export PYTHONUNBUFFERED=1
          if python tools/run_all.py --vanilla-only --golden --jobs 1 boot 2>&1 | tee gate.txt; then ok=1; else ok=0; fi
          {
            echo "### Gate (boot)"
            echo '```'
            grep -h "gpu: " build/verify/runs/*/ei-rebuild.log 2>/dev/null | head -10 || true
            sed -n '/^not passed:/,/^$/p; /^goldens (tests\/golden)/,$p' gate.txt | head -60
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          if [ $ok = 0 ] || grep -q "not passed:" gate.txt; then
            echo "::grep -h "failed|error|out of date|differ|problem|lua_api" build_release.log::boot did not pass: WARP may not draw on the runner; the logs follow"
            for f in build/verify/runs/*/launch.txt build/verify/runs/*/ei-rebuild.log; do
              echo "=== $f"; tail -40 "$f" || true
            done
            exit 1
          fi

      - name: Smoke scenarios
        env:
          SCENARIOS: ${{ inputs.scenarios }}
        run: |
          export EI_BUILD_DIR="$(cygpath -w "$PWD/build/verify")" EI_GAME_VANILLA="$DATA_WIN\\vanilla" EI_GAME_REBIRTH="$DATA_WIN\\rebirth"
          export PYTHONUNBUFFERED=1
          names="$SCENARIOS"
          [ -n "${names// }" ] || names="$SMOKE_LIST"
          echo "scenarios: $names"
          python tools/run_all.py --vanilla-only --golden --jobs 1 $names 2>&1 | tee suite_image.txt || true
          {
            echo "### Smoke scenarios"
            echo '```'
            sed -n '/^not passed:/,/^$/p; /^goldens (tests\/golden)/,$p' suite_image.txt | head -300
            echo '```'
            echo "### GPU device"
            echo '```'
            grep -h "gpu: .* device" build/verify/runs/*/ei-rebuild.log 2>/dev/null | sort | uniq -c | head -5 || true
            echo '```'
          } | tee -a $GITHUB_STEP_SUMMARY

      # What a run that did not pass or grep -h "failed|error|out of date|differ|problem|lua_api" build_release.logs needs to be understood without the machine (tools/ci_details.py).
      - name: Differences in detail
        if: always()
        env:
          SCENARIOS: ${{ inputs.scenarios }}
        run: |
          names="$SCENARIOS"
          [ -n "${names// }" ] || names="$SMOKE_LIST"
          {
            echo "### Differences in detail"
            echo '```'
            python -I tools/ci_details.py build/verify/runs $names
            echo '```'
          } 2>&1 | tee -a $GITHUB_STEP_SUMMARY

      # The job fails on a grep -h "failed|error|out of date|differ|problem|lua_api" build_release.logence or a run that did not pass.
      - name: Verdict
        run: |
          bad=0
          if [ ! -s suite_image.txt ]; then echo "::grep -h "failed|error|out of date|differ|problem|lua_api" build_release.log::the smoke suite printed nothing"; bad=1; fi
          if grep -q "GOLDENS DIFFER" suite_image.txt; then echo "::grep -h "failed|error|out of date|differ|problem|lua_api" build_release.log::GOLDENS DIFFER on WARP (see the summary)"; bad=1; fi
          if grep -q "^not passed:" suite_image.txt; then echo "::grep -h "failed|error|out of date|differ|problem|lua_api" build_release.log::scenarios did not pass"; bad=1; fi
          if ! grep -q "GOLDENS THE SAME" suite_image.txt; then echo "::grep -h "failed|error|out of date|differ|problem|lua_api" build_release.log::no GOLDENS THE SAME line in the suite output"; bad=1; fi
          exit $bad

      - name: Remove the data
        if: always()
        run: rm -rf "$(cygpath -u "$RUNNER_TEMP")/ei-data" stub-data-checkout build/verify/runs
