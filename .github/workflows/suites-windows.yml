# Windows CI: the Windows builds and the suites on GitHub's windows-latest runner (4 vCPU, 16 GB, no GPU), on SDL_GPU's
# Direct3D 12 driver with WARP, the software adapter (docs/notes/harness.md, "The Windows CI job"; H61). By hand only
# until a run has shown what passes (Actions > Windows > Run workflow).
#
# build-release / build-verify (parallel): build.cmd release and build.cmd verify, as on a desktop: the MSVC of the
# runner's Visual Studio (EI_VSROOT from vswhere), warnings and the build checks included (build.cmd runs them; they
# draw on WARP here). build-verify uploads the harness exe and its map (build/verify/ei-rebuild.exe and .map: code
# only, no game data) for the suites jobs; the map names a crashed run's stack (tools/resolve_crash.py). A failed build check on verify is a warning when the exe was built, so the suites still run.
#
# suites: the suites-linux.yml job's way: the stub game data (H41) fetched from the private repository with the
# read-only token, both suites, the scenarios dealt round the SHARDS jobs, `jobs` games at once each. EI_GPU_D3D12_WARP=1
# makes the vendored SDL pick the WARP adapter (third_party/SDL/README.txt); with no GPU on the runner it is the
# only adapter anyway, and the variable makes a local run on a GPU machine use the same path.
#
# The suites need the repository variable EI_STUB_DATA_REPO and the secrets EI_STUB_DATA_TOKEN / EI_STUB_DATA_KEY, as
# suites-linux.yml does. The data never leaves the runner (temp folder, nothing uploaded but the exe and its map).
name: Windows

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Only these scenarios (space-separated; empty: the suites less WINDOWS_SKIP)"
        required: false
        default: ""
      shards:
        description: "Suites jobs the scenarios are dealt round (1 to 8; a few scenarios: 1)"
        required: false
        default: "8"
      suites:
        description: "full: image and Rebirth suites; image: the image suite only; builds: only the two builds"
        type: choice
        options: [full, image, builds]
        default: full
      jobs:
        description: "Games at once in each suites job (run_all --jobs; WARP draws on the runner's 4 vCPUs)"
        required: false
        default: "1"
      retries:
        description: "Reruns of a failed scenario (run_all --retries; on WARP a rerun repeats a timeout)"
        required: false
        default: "0"
      warp:
        description: "true: Microsoft's WARP from NuGet next to the exe (H62g: 1.0.21 ran 1.6 times as long as the runner's in-box WARP, so the default is false)"
        type: choice
        options: ["false", "true"]
        default: "false"
      time_scale:
        description: "EI_TIME_SCALE: the scenarios' real-time limits times this (the runner's WARP runs 2.4 times as long as lavapipe)"
        required: false
        default: "8"

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EI_GPU_D3D12_WARP: "1"
  EI_COMPILER_CACHE: "0"

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Shader toolchain cache
        uses: actions/cache@v5
        with:
          path: build/third_party
          key: shader-toolchain-${{ runner.os }}-${{ hashFiles('tools/shader_toolchain/**') }}
      - name: Visual Studio
        run: |
          vs=$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | tr -d '\r')
          [ -n "$vs" ] || { echo "::error::no Visual Studio with the x64 C++ tools"; exit 1; }
          echo "EI_VSROOT=$vs" >> $GITHUB_ENV
          echo "Visual Studio: $vs"
          ls "$(cygpath -u "$vs")/VC/Tools/MSVC"
      - name: Build release
        run: |
          start=$(date +%s)
          cmd //c ".\\build.cmd release > build_release.log 2>&1" && ok=1 || ok=0
          echo "build release: $(( $(date +%s) - start )) s" | tee -a $GITHUB_STEP_SUMMARY
          tail -40 build_release.log
          grep -h "warning" build_release.log | head -20 || true
          [ $ok = 1 ] || { echo "::error::build release failed"; exit 1; }
          ! grep -q "warning C\|warning LNK" build_release.log

  build-verify:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Shader toolchain cache
        uses: actions/cache@v5
        with:
          path: build/third_party
          key: shader-toolchain-${{ runner.os }}-${{ hashFiles('tools/shader_toolchain/**') }}
      - name: Visual Studio
        run: |
          vs=$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | tr -d '\r')
          [ -n "$vs" ] || { echo "::error::no Visual Studio with the x64 C++ tools"; exit 1; }
          echo "EI_VSROOT=$vs" >> $GITHUB_ENV
          echo "Visual Studio: $vs"
          ls "$(cygpath -u "$vs")/VC/Tools/MSVC"
      - name: Build verify
        run: |
          start=$(date +%s)
          cmd //c ".\\build.cmd verify > build_verify.log 2>&1" && ok=1 || ok=0
          echo "build verify: $(( $(date +%s) - start )) s" | tee -a $GITHUB_STEP_SUMMARY
          tail -60 build_verify.log
          grep -h "warning" build_verify.log | head -20 || true
          if [ $ok = 0 ]; then
            # the build checks (they draw on WARP) can fail with the exe built: say so and let the suites run
            [ -f build/verify/ei-rebuild.exe ] || { echo "::error::build verify failed"; exit 1; }
            echo "::warning::build verify failed after linking ei-rebuild.exe (the build checks?): see the log"
          fi
          ! grep -q "warning C\|warning LNK" build_verify.log
      - name: Harness exe
        uses: actions/upload-artifact@v5
        with:
          name: harness-exe
          path: |
            build/verify/ei-rebuild.exe
            build/verify/ei-rebuild.map
          retention-days: 3
          if-no-files-found: error

  suites:
    needs: build-verify
    if: >-
      inputs.suites != 'builds' && vars.EI_STUB_DATA_REPO != ''
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      # Microsoft's WARP (NuGet; H62g; only with the input warp=true, it was slower): version and the package's checksums.
      WARP_VERSION: "1.0.21"
      WARP_SHA512: "lSVCC7GxvoyjCE4YmoxaSjAIB/rXsfSuCSiZSbHLgsJvN+7IQ5hTcpyZWU3TWF1onaZqE50EEJ3Tsh78XAKLEA=="
      WARP_SHA256: "ea44b77eb30eec14427193e20f40cdb2e4c31ed11ab39cb880538fdf4bac2681"
      # Linux's factor (3: suites-linux.yml; linux.md, "The CI job") times WARP's pace against lavapipe's on the same
      # runner class: the 166 runs that passed on both, one game at a time, took a median 2.4 times as long here (run
      # 42016421240 against Linux's 42040984380; docs/notes/harness.md, "The Windows CI job").
      EI_TIME_SCALE: ${{ inputs.time_scale || '8' }}
      # Scenarios that need a 3840x2160 desktop (they say `resolution desktop`: ui_widescreen*, whose layout and clicks
      # follow the screen; the pair scenarios among the net ones) and that the runner's small screen cannot give (first
      # two lines). Then the ones still past a real-time limit at scale 8, one game at a time, in run 42057942638
      # (2026-11-05): their own `timeout` or a frames step's ("N frames still to go"; net_pair_portraits on Rebirth's
      # install), after which a scenario goes on early and differs; and render_weather / render_weather_units, which pass
      # but take 37 to 55 minutes a run (render_weather 2222 s, 3289 s on Rebirth's), most of a shard's 180 minutes
      # (docs/notes/harness.md, "The Windows CI job"). Then, from H62g's runs on one commit (2026-11-06): camera_drag_rate,
      # camera_smooth, camera_spin, past their limits at scale 8 in every run since H62d (960, 960 and 1600 s spent each
      # run, 3500 s of a shard), and render_device_lost_*, whose `losedevice` leaves the game running on WARP (the
      # scenarios expect the renderer's fatal message: "the game did not crash"), in every run.
      WINDOWS_SKIP: >-
        net_pair_leave net_pair_quest net_pair_speed net_pair_zone net_zone_leader net_zone_vars
        ui_widescreen ui_widescreen_dialogue ui_widescreen_hud ui_widescreen_more ui_widescreen_screens
        net_pair_portraits render_drawn_lights render_drawn_motion render_weather_panel ui_minimap_edges unit_ai_bridge
        zone_gz15h_tornado_client
        render_weather render_weather_units
        camera_drag_rate camera_smooth camera_spin
        render_device_lost_acquire render_device_lost_commands render_device_lost_pass render_device_lost_submit
        render_device_lost_uniforms render_device_lost_wait render_device_lost_write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: harness-exe
          path: build/verify
      - name: WARP package cache
        if: inputs.warp == 'true'
        uses: actions/cache@v5
        with:
          path: warp-cache
          key: warp-nuget-${{ env.WARP_VERSION }}-${{ env.WARP_SHA512 }}
      - name: Microsoft WARP (NuGet)
        if: inputs.warp == 'true'
        run: |
          # Microsoft's current WARP next to the harness exe: D3D12 loads d3d10warp.dll from the exe's folder instead of
          # the runner's in-box one (H62g). Pinned by version and checksums (nuget.org lists the package's SHA512; the
          # SHA256 is the one a first run printed); the package is cached. Used in this job only: never run elsewhere.
          mkdir -p warp-cache
          f=warp-cache/microsoft.direct3d.warp.$WARP_VERSION.nupkg
          [ -f "$f" ] || curl -fsSL --retry 3 -o "$f" "https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.warp/$WARP_VERSION/microsoft.direct3d.warp.$WARP_VERSION.nupkg"
          sha512=$(openssl dgst -sha512 -binary "$f" | base64 -w0)
          sha256=$(sha256sum "$f" | cut -d' ' -f1)
          echo "Microsoft.Direct3D.WARP $WARP_VERSION: sha256 $sha256"
          [ "$sha512" = "$WARP_SHA512" ] || { echo "::error::Microsoft.Direct3D.WARP $WARP_VERSION: SHA512 $sha512 is not the pinned one"; rm -f "$f"; exit 1; }
          [ "$sha256" = "$WARP_SHA256" ] || { echo "::error::Microsoft.Direct3D.WARP $WARP_VERSION: SHA256 $sha256 is not the pinned one"; rm -f "$f"; exit 1; }
          python -I - "$f" build/verify <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              data = z.read("build/native/bin/x64/d3d10warp.dll")
          open(sys.argv[2] + "/d3d10warp.dll", "wb").write(data)
          print("d3d10warp.dll:", len(data), "bytes")
          PY
          echo "WARP: Microsoft.Direct3D.WARP $WARP_VERSION (d3d10warp.dll next to the harness exe)" | tee -a $GITHUB_STEP_SUMMARY

      - name: Fetch the stub data
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.EI_STUB_DATA_REPO }}
          token: ${{ secrets.EI_STUB_DATA_TOKEN }}
          path: stub-data-checkout
          persist-credentials: false
          lfs: false
      - name: Unpack the stub data
        env:
          KEY: ${{ secrets.EI_STUB_DATA_KEY }}
        run: |
          set +x
          command -v zstd >/dev/null || choco install zstandard -y --no-progress
          DATA=$(cygpath -u "$RUNNER_TEMP")/ei-data
          mkdir -p "$DATA"
          shopt -s nullglob
          parts=(stub-data-checkout/ei-stub-data.tar.zst*)
          [ ${#parts[@]} -gt 0 ] || { echo "::error::no ei-stub-data.tar.zst* in the stub data repository"; exit 1; }
          case "${parts[0]}" in
            *.enc | *.enc.*)
              [ -n "$KEY" ] || { echo "::error::the stub data is encrypted and EI_STUB_DATA_KEY is not set"; exit 1; }
              cat "${parts[@]}" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY | zstd -dq | tar -x -C "$DATA" ;;
            *)
              cat "${parts[@]}" | zstd -dq | tar -x -C "$DATA" ;;
          esac
          rm -rf stub-data-checkout
          [ -d "$DATA/vanilla" ] && [ -d "$DATA/rebirth" ] || { echo "::error::the stub data has no vanilla/ and rebirth/"; exit 1; }
          echo "stub data: $(du -sm "$DATA" | cut -f1) MB unpacked"
          echo "DATA_WIN=$(cygpath -w "$DATA")" >> $GITHUB_ENV

      - name: Suites
        env:
          SCENARIOS: ${{ inputs.scenarios }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shards || '8' }}
          SUITES: ${{ inputs.suites || 'full' }}
          JOBS: ${{ inputs.jobs || '1' }}
          RETRIES: ${{ inputs.retries || '0' }}
        run: |
          # fewer shards than jobs: the jobs past the last shard have nothing to do
          [ "$SHARD" -lt "$SHARDS" ] || { echo "shard $SHARD: not used (shards=$SHARDS)"; exit 0; }
          export EI_BUILD_DIR="$(cygpath -w "$PWD/build/verify")" EI_GAME_VANILLA="$DATA_WIN\\vanilla" EI_GAME_REBIRTH="$DATA_WIN\\rebirth"
          names="$SCENARIOS"
          if [ -z "$names" ]; then
            names=$(ls tests/scenarios/*.txt | xargs -n1 basename | sed 's/\.txt$//' | grep -v '^screenshots_' | grep -vxF -f <(tr ' ' '\n' <<< "$WINDOWS_SKIP"))
          fi
          names=$(tr ' ' '\n' <<< "$names" | grep . | sort | awk -v n="$SHARDS" -v s="$SHARD" '(NR - 1) % n == s' | tr '\n' ' ')
          echo "shard $SHARD of $SHARDS: $names"
          : > suite_image.txt; : > suite_rebirth.txt
          if [ -n "${names// }" ]; then
            PYTHONUNBUFFERED=1 python tools/run_all.py --golden --jobs "$JOBS" --retries "$RETRIES" $names 2>&1 | tee suite_image.txt || true
            echo "::group::Image suite: the runs that did not pass or differ, in detail (tools/ci_details.py)"
            python tools/ci_details.py build/verify/runs $names || true
            echo "::endgroup::"
            if [ "$SUITES" = full ]; then
              rebirth=$(python -c "import sys; sys.path.insert(0, 'tools'); import run_all; print(' '.join(run_all.rebirth_scenarios(sys.argv[1:], goldens=False)))" $names)
              if [ -n "${rebirth// }" ]; then
                PYTHONUNBUFFERED=1 python tools/run_all.py --rebirth-only --golden --jobs "$JOBS" --retries "$RETRIES" $rebirth 2>&1 | tee suite_rebirth.txt || true
                echo "::group::Rebirth suite: the runs that did not pass or differ, in detail (tools/ci_details.py)"
                python tools/ci_details.py build/verify/runs --install rebirth $rebirth || true
                echo "::endgroup::"
              fi
            fi
          fi
          for f in suite_image.txt suite_rebirth.txt; do
            echo "### shard $SHARD ${f%.txt}" | tee -a $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            sed -n '/^not passed:/,/^$/p; /^goldens (tests\/golden)/,$p' "$f" | head -400 | tee -a $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done
          grep -rh "gpu: .* device" build/verify/runs/*/launch.txt build/verify/runs/*/*.log 2>/dev/null | sort | uniq -c | head -5 | tee -a $GITHUB_STEP_SUMMARY || true
          ! grep -q "GOLDENS DIFFER" suite_*.txt

      - name: Remove the data
        if: always()
        run: rm -rf "$(cygpath -u "$RUNNER_TEMP")/ei-data" stub-data-checkout build/verify/runs
