# Linux: on GitHub's Ubuntu runners (docs/notes/linux.md). One build job, then the suites split over parallel jobs.
#
# build: the game and its harness build (-DEI_HARNESS=ON, tests/verify) with gcc, a compiler warning failing the build
# (CMAKE_COMPILE_WARNING_AS_ERROR; Linux only, not the Windows builds), and the game's checks under a virtual display
# on Mesa's software rendering (ctest: the POSIX platform's checks, the interface canvases' glyph cases). No game data.
# Its compiler cache is saved under this commit's key, so each suites job rebuilds the harness from it in about a
# minute instead of compiling it again (the same flags: ccache matches the whole command line).
#
# suites: the harness's goldens on the stub game data (H41; tools/stub_data.py, linux.md, "The stub data"): the stub set
# fetched from a private repository with a read-only token, both suites under a virtual display on llvmpipe, the
# scenarios dealt round the SHARDS jobs (one game at a time each: llvmpipe draws on the runner's 4 cores).
#
# The suites are off until the repository variable EI_STUB_DATA_REPO names the private repository (owner/name) and the
# secret EI_STUB_DATA_TOKEN holds a fine-grained token that reads it (linux.md has the one-time setup). EI_STUB_DATA_KEY,
# a second secret, decrypts the stub set when it is stored encrypted.
#
# The data never leaves the runner: it is fetched into the runner's temp folder, outside every cached path, and the
# jobs upload nothing (no artifacts: run folders hold saves and frames made from the data). The token and the key are
# given only to pushes and to pull requests from branches of this repository (a fork's pull request gets no secrets,
# and the suites do not run for one).
name: Linux

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Only these scenarios (space-separated; empty: the suites less LINUX_SKIP)"
        required: false
        default: ""

# Every push to main gets its own run; on other branches a newer push cancels the older run.
concurrency:
  group: linux-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CCACHE_MAXSIZE: 2G
  PACKAGES: >-
    ninja-build ccache libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxfixes-dev
    libxtst-dev libxkbcommon-dev libgl-dev libegl-dev libasound2-dev libpulse-dev xvfb mesa-utils libgl1-mesa-dri
    mesa-vulkan-drivers zstd
  HARNESS_CONFIGURE: >-
    cmake -S . -B build/linux-harness -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
    -DEI_HARNESS=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q $PACKAGES
      # The shader toolchain (shadercross, spirv-cross, DXC: tools/shader_toolchain), built at configure time, by its
      # pins; and ccache's objects of both builds, the newest run's (ccache checks every hit against the source).
      - name: Shader toolchain cache
        uses: actions/cache@v5
        with:
          path: build/third_party
          key: shader-toolchain-${{ runner.os }}-${{ hashFiles('tools/shader_toolchain/**') }}
      - name: Compiler cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - name: Build
        run: |
          cmake -S . -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/linux
      - name: Build the harness
        run: |
          $HARNESS_CONFIGURE
          cmake --build build/linux-harness --target ei-rebuild
          ccache --show-stats
      - name: Checks
        run: |
          cd build/linux
          xvfb-run -a -s "-screen 0 1280x1024x24" ctest --output-on-failure

  suites:
    needs: build
    if: >-
      vars.EI_STUB_DATA_REPO != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      SHARDS: 8
      # The harness's real-time limits (a frames step's, the scenario's) times 3: the runner draws 4K frames in software
      # on 4 cores and some scenarios take 2 to 3 times a desktop's time (linux.md, "The CI job"; H58). The world's
      # clock is not scaled.
      EI_TIME_SCALE: 3
      # Scenarios that cannot match on llvmpipe, for reasons other than speed (linux.md, "The harness"; H47b):
      # - every net_pair_* (two games at once: their frames stall past the harness's 16 s wait) and the two-game zone
      #   scenarios net_zone_leader / net_zone_vars;
      # - render_terrain_seams (its level steps differ on lavapipe, which a GPU does not);
      # - render_smooth (llvmpipe's multisampling gives 4 samples whatever is asked, and edges too few pixels).
      # The slow ones ran with this list until H58 and came back under EI_TIME_SCALE 3; run 41953378949 (2026-11-05)
      # still cut these past 3x their limits on llvmpipe (weather, drawn frames, Rebirth widescreen, the tornado client).
      # (render_shadows_decals / render_weather_panel found 0% there: blank textures in the stub set, not lavapipe; C159.)
      # The four render_weather* scenarios are out of it again (H60): their own `timeout` lines, which this scale
      # multiplies, give the minutes their drawn frames take on 4 cores (linux.md, "The CI job").
      LINUX_SKIP: >-
        net_pair_join net_pair_kick net_pair_leave net_pair_lobby net_pair_master net_pair_party net_pair_password
        net_pair_quest net_pair_speed net_pair_zone net_zone_leader net_zone_vars
        render_terrain_seams render_smooth
        camera_smooth render_drawn_lights render_drawn_motion ui_minimap_edges ui_widescreen ui_widescreen_hud
        ui_widescreen_more unit_ai_bridge zone_gz15h_tornado_client
    steps:
      - uses: actions/checkout@v5
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q $PACKAGES
      - name: Shader toolchain cache
        uses: actions/cache/restore@v5
        with:
          path: build/third_party
          key: shader-toolchain-${{ runner.os }}-${{ hashFiles('tools/shader_toolchain/**') }}
      # The build job's objects of this very commit: the harness build below is all cache hits and a link.
      - name: Compiler cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
      - name: Build the harness
        run: |
          $HARNESS_CONFIGURE
          cmake --build build/linux-harness --target ei-rebuild
          ccache --show-stats

      # The private repository's files: ei-stub-data.tar.zst (or its parts, .tar.zst.00, .01, ..., when split under
      # GitHub's 100 MB a file), encrypted: the same names with .enc. Checked out with the token, which is not kept
      # in the checkout's config (persist-credentials false), then unpacked into the temp folder and the checkout
      # removed.
      - name: Fetch the stub data
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.EI_STUB_DATA_REPO }}
          token: ${{ secrets.EI_STUB_DATA_TOKEN }}
          path: stub-data-checkout
          persist-credentials: false
          lfs: false
      - name: Unpack the stub data
        env:
          KEY: ${{ secrets.EI_STUB_DATA_KEY }}
        run: |
          set +x
          DATA=$RUNNER_TEMP/ei-data
          echo "DATA=$DATA" >> $GITHUB_ENV
          mkdir -p "$DATA"
          shopt -s nullglob
          parts=(stub-data-checkout/ei-stub-data.tar.zst*)
          [ ${#parts[@]} -gt 0 ] || { echo "::error::no ei-stub-data.tar.zst* in the stub data repository"; exit 1; }
          case "${parts[0]}" in
            *.enc | *.enc.*)
              [ -n "$KEY" ] || { echo "::error::the stub data is encrypted and EI_STUB_DATA_KEY is not set"; exit 1; }
              cat "${parts[@]}" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY | zstd -dq | tar -x -C "$DATA" ;;
            *)
              cat "${parts[@]}" | zstd -dq | tar -x -C "$DATA" ;;
          esac
          rm -rf stub-data-checkout
          [ -d "$DATA/vanilla" ] && [ -d "$DATA/rebirth" ] || { echo "::error::the stub data has no vanilla/ and rebirth/"; exit 1; }
          echo "stub data: $(du -sm "$DATA" | cut -f1) MB unpacked"

      # This job's share of the scenarios (every SHARDS-th of the sorted list), one game at a time. The summary prints
      # run_all's table and the goldens block (scenario names, results, the digest's differences), never the data's files.
      - name: Suites
        env:
          SCENARIOS: ${{ inputs.scenarios }}
          SHARD: ${{ matrix.shard }}
        run: |
          export EI_BUILD_DIR=$PWD/build/linux-harness EI_GAME_VANILLA=$DATA/vanilla EI_GAME_REBIRTH=$DATA/rebirth
          names="$SCENARIOS"
          if [ -z "$names" ]; then
            names=$(ls tests/scenarios/*.txt | xargs -n1 basename | sed 's/\.txt$//' | grep -v '^screenshots_' | grep -vxF -f <(tr ' ' '\n' <<< "$LINUX_SKIP"))
          fi
          names=$(tr ' ' '\n' <<< "$names" | grep . | sort | awk -v n="$SHARDS" -v s="$SHARD" '(NR - 1) % n == s' | tr '\n' ' ')
          echo "shard $SHARD of $SHARDS: $names"
          : > suite_image.txt; : > suite_rebirth.txt
          if [ -n "${names// }" ]; then
            PYTHONUNBUFFERED=1 xvfb-run -a -s "-screen 0 3840x2160x24" python3 tools/run_all.py --golden --jobs 1 $names 2>&1 | tee suite_image.txt || true
            rebirth=$(python3 -c "import sys; sys.path.insert(0, 'tools'); import run_all; print(' '.join(run_all.rebirth_scenarios(sys.argv[1:], goldens=False)))" $names)
            if [ -n "${rebirth// }" ]; then
              PYTHONUNBUFFERED=1 xvfb-run -a -s "-screen 0 3840x2160x24" python3 tools/run_all.py --rebirth-only --golden --jobs 1 $rebirth 2>&1 | tee suite_rebirth.txt || true
            fi
          fi
          for f in suite_image.txt suite_rebirth.txt; do
            echo "### shard $SHARD ${f%.txt}" | tee -a $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            sed -n '/^not passed:/,/^$/p; /^goldens (tests\/golden)/,$p' "$f" | head -400 | tee -a $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done
          ! grep -q "GOLDENS DIFFER" suite_*.txt

      - name: Remove the data
        if: always()
        run: rm -rf "$DATA" stub-data-checkout build/linux-harness/runs
