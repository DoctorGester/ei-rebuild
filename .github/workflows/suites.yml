# Suites: builds and plays the goldens on the self-hosted runner (Kirill's machine, label ei-game), which has the game
# installs (F:\games\EvilIslands, the Rebirth one) and a GPU. Runs on pushes to main and claude/** branches (cloud
# sessions; docs/cloud-handoff.md) and by hand (Actions > Suites > Run workflow). Never on pull_request: a fork's workflow must not reach this machine.
# Games go through the machine's one scheduler (WORK_DB is the main checkout's), so they share its 16 game slots with
# local work; EI_RUN_DIR names the main checkout's run folder (game.exe copies for the tools that read its file), so no
# junction sits in this checkout.
# By hand with "record" set, it re-records the goldens from the image instead (H40; tools/golden.py record) and pushes
# them to the branch as a commit of its own; that push starts no run, so check the branch with another run after it.
name: Suites

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to test"
        required: false
        default: main
      suites:
        description: "full: every merge build and suite; quick: verify + release, the image suite"
        type: choice
        options: [full, quick]
        default: full
      record:
        description: "Instead of the suites: re-record the goldens of these installs from the image's runs and push them to ref (a branch, not main)"
        type: choice
        options: ["no", both, vanilla, rebirth]
        default: "no"
      scenarios:
        description: "record: only these scenarios (space-separated; empty: every scenario)"
        required: false
        default: ""
      reason:
        description: "record: why (golden.json's reason)"
        required: false
        default: "H40: our own goldens, recorded from the image"
      diff_base:
        description: "Instead of the suites: play the scenarios on this ref's build and on ref's, and print where each run's state first differs (golden.py diff)"
        required: false
        default: ""
      resolution:
        description: "diff: both builds' runs at this window size (EI_RESOLUTION, WxH; a scenario's own resolution line wins)"
        required: false
        default: ""

concurrency:
  group: ei-game
  cancel-in-progress: false

permissions:
  contents: read

# The sokol-shdc shader compiler on the runner (cmake/shaders.cmake; build.cmd sets the same by default).
env:
  EI_SHDC: E:\bin\sokol-shdc\sokol-shdc.exe

jobs:
  suites:
    if: ${{ (!inputs.record || inputs.record == 'no') && !inputs.diff_base }}
    runs-on: [self-hosted, ei-game]
    timeout-minutes: 120
    defaults:
      run:
        # Git's bash (no spaces in the path: the runner splits a quoted one); plain "bash" here is WSL's.
        shell: E:\bin\git\bin\bash.exe --noprofile --norc -eo pipefail {0}
    env:
      WORK_DB: E:\workspace\ei\build\live\work.db
      EI_RUN_DIR: E:\workspace\ei\run
      SUITES: ${{ inputs.suites || 'full' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != 'main' && inputs.ref || github.ref }}   # the input's default main: the branch the run was started on
          # Keep the ignored build folders between runs: a clean checkout rebuilt all seven builds from nothing
          # (6.5 of a run's 9.5 minutes); incremental they take a fraction of that.
          clean: false

      - name: Build
        id: build
        run: |
          rm -f suite_*.txt build_*.log
          git clean -ffdq -e build/   # untracked files of an earlier ref, but not the build folders
          builds="verify release"
          if [ "$SUITES" = full ]; then
            builds="verify release x64 verify-x64"
            # debug / asan / play (the merge builds) on main only; a branch push gets the ones the suites use
            [ "$GITHUB_REF_NAME" = main ] && builds="verify release debug asan play x64 verify-x64"
          fi
          fail=0
          for c in $builds; do
            cmd //c ".\\build.cmd $c > build_$c.log 2>&1" || { echo "::error::build $c failed"; tail -40 build_$c.log; fail=1; }
            grep -h "warning C" build_$c.log | head -5 || true
          done
          exit $fail

      # Each suite runs whenever the builds passed, so one suite's differences never hide another's.
      - name: Image suite (vanilla)
        run: python tools/work.py test CI --golden --jobs 4 2>&1 | tee suite_image.txt | tail -40

      - name: Rebirth suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.SUITES == 'full' }}
        run: python tools/work.py test CI --rebirth-only --golden --jobs 4 2>&1 | tee suite_rebirth.txt | tail -40

      - name: x64 suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.SUITES == 'full' }}
        run: python tools/work.py test CI --x64 --golden --jobs 4 2>&1 | tee suite_x64.txt | tail -40

      - name: Summary
        if: always()
        run: |
          for f in suite_*.txt; do
            [ -f "$f" ] || continue
            echo "### ${f%.txt}" | tee -a $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            # also into the log (the API gives sessions the log, not the summary page): the failed runs with their
            # failures and notes, then the goldens block
            sed -n '/^not passed:/,/^$/p; /^goldens (tests\/golden)/,$p' "$f" | head -400 | tee -a $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done
          ! grep -q "GOLDENS DIFFER" suite_*.txt

  record:
    if: ${{ inputs.record && inputs.record != 'no' && !inputs.diff_base }}
    runs-on: [self-hosted, ei-game]
    timeout-minutes: 180
    permissions:
      contents: write   # pushes the goldens to the branch
    defaults:
      run:
        shell: E:\bin\git\bin\bash.exe --noprofile --norc -eo pipefail {0}
    env:
      WORK_DB: E:\workspace\ei\build\live\work.db
      EI_RUN_DIR: E:\workspace\ei\run
      # The ref input, or with its default (main) the branch the run was started on
      REF: ${{ inputs.ref != 'main' && inputs.ref || github.ref_name }}
      RECORD: ${{ inputs.record }}
      SCENARIOS: ${{ inputs.scenarios }}
      REASON: ${{ inputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
          clean: false   # the build folders stay (incremental builds), as in the suites job

      - name: Check the ref
        run: |
          [ "$REF" != main ] || { echo "::error::record pushes goldens: give a branch other than main"; exit 1; }
          git ls-remote --exit-code --heads origin "$REF" > /dev/null || { echo "::error::$REF is not a branch"; exit 1; }

      - name: Build
        run: |
          rm -rf pass_*.txt record.txt build_verify.log build/record
          git clean -ffdq -e build/   # untracked files of an earlier ref, but not the build folders
          cmd //c ".\\build.cmd verify > build_verify.log 2>&1" || { echo "::error::build verify failed"; tail -40 build_verify.log; exit 1; }

      # Each pass plays the suite (golden.py IMAGE_RUNS: twice, and the runs must agree) and keeps its run folders; a
      # pass's failures and golden differences only mean those scenarios are not recorded.
      - name: Play the passes
        run: |
          installs="--vanilla-only --rebirth-only"
          [ "$RECORD" = vanilla ] && installs=--vanilla-only
          [ "$RECORD" = rebirth ] && installs=--rebirth-only
          for pass in run1 run2; do
            for i in $installs; do
              install=vanilla
              [ $i = --rebirth-only ] && install=rebirth
              # the run folders stay between workflow runs: the snapshot takes only this pass's (--since)
              mkdir -p build/record && touch build/record/start
              python tools/work.py test CI $i --golden --jobs 4 $SCENARIOS > pass_${pass}_$install.txt 2>&1 || true
              sed -n '/^not passed:/,/^$/p; /^[0-9]* runs in/p; /^ALL PASS/p; /^SOME RUNS FAILED/p' pass_${pass}_$install.txt | sed "s/^/$pass $install: /" || true
              python tools/golden.py snapshot build/record/$pass --install $install --since build/record/start $SCENARIOS | grep -v "left out" || true
            done
          done

      - name: Record
        run: |
          installs="vanilla rebirth"
          [ "$RECORD" = both ] || installs=$RECORD
          for install in $installs; do
            python tools/golden.py record $SCENARIOS --install $install --reason "$REASON" \
              --runs build/record/run1 build/record/run2 2>&1 | tee -a record.txt || true
          done
          git add -A tests/golden
          {
            echo "### record"
            echo '```'
            grep -E "not recorded|\(new\)|\(changed|^[0-9]+ of [0-9]+ recorded" record.txt | head -200 || true
            echo "$(grep -c "the same as its golden, kept" record.txt || true) the same as their goldens (left as they were)"
            echo '```'
            echo "### what changed (golden.json left out)"
            echo '```'
            git diff --cached --stat -- tests/golden ':(exclude)tests/golden/*/golden.json' | tail -100
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Push
        run: |
          if git diff --cached --quiet; then echo "nothing recorded changed"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Goldens re-recorded from the image ($RECORD${SCENARIOS:+: $SCENARIOS})" \
            -m "$REASON" -m "Suites run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin HEAD:refs/heads/$REF

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: record-logs
          path: |
            pass_*.txt
            record.txt
            build_verify.log
          if-no-files-found: ignore

  # By hand with diff_base: the scenarios (default every one) on both installs with the base ref's verify build (a
  # worktree in build/base, kept between runs and never deleted: run folders can hold junctions into the installs)
  # and with ref's, and for each run where its digest first differs, field by field (golden.py diff of the full
  # digests, which a golden's hashes cannot show), its console's first lines that differ and its failures.
  diff:
    if: ${{ inputs.diff_base }}
    runs-on: [self-hosted, ei-game]
    timeout-minutes: 120
    defaults:
      run:
        shell: E:\bin\git\bin\bash.exe --noprofile --norc -eo pipefail {0}
    env:
      WORK_DB: E:\workspace\ei\build\live\work.db
      EI_RUN_DIR: E:\workspace\ei\run
      REF: ${{ inputs.ref != 'main' && inputs.ref || github.ref_name }}
      BASE: ${{ inputs.diff_base }}
      SCENARIOS: ${{ inputs.scenarios }}
      RESOLUTION: ${{ inputs.resolution }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
          clean: false

      - name: Build both
        run: |
          rm -f diff_*.txt build_*.log
          git clean -ffdq -e build/
          git fetch -q --depth=1 origin "$BASE"
          base=$(git rev-parse FETCH_HEAD)   # FETCH_HEAD is this worktree's: the base's would not see it
          git worktree prune   # a build/base deleted by hand is still registered
          [ -e build/base/.git ] || git worktree add -q --detach build/base "$base"
          git -C build/base checkout -q --force --detach "$base"
          git -C build/base clean -ffdq -e build/
          echo "base $BASE: $(git -C build/base log -1 --format='%h %s')"
          echo "head $REF: $(git log -1 --format='%h %s')"
          cmd //c ".\\build.cmd verify > build_verify.log 2>&1" || { echo "::error::build verify failed"; tail -40 build_verify.log; exit 1; }
          (cd build/base && cmd //c ".\\build.cmd verify > ..\\..\\build_base.log 2>&1") || { echo "::error::the base's build failed"; tail -40 build_base.log; exit 1; }

      - name: Play both
        run: |
          [ -z "$RESOLUTION" ] || export EI_RESOLUTION=$RESOLUTION
          python tools/work.py test CI --golden --jobs 4 $SCENARIOS > diff_head.txt 2>&1 || true
          (cd build/base && python tools/work.py test CI --golden --jobs 4 $SCENARIOS > ../../diff_base.txt 2>&1) || true
          for f in diff_base.txt diff_head.txt; do echo "== $f"; sed -n '/^not passed:/,/^$/p; /^[0-9]* runs in/p' $f; done

      - name: Where they part
        run: |
          names="$SCENARIOS"
          [ -n "$names" ] || names=$(ls tests/scenarios/*.txt | xargs -n1 basename | sed 's/\.txt$//')
          for s in $names; do
            for install in standalone standalone-rebirth; do
            for side in "" peer; do
              a=build/base/build/verify/runs/$s-$install${side:+/$side}
              b=build/verify/runs/$s-$install${side:+/$side}
              [ -e "$a/harness_report.txt" ] && [ -e "$b/harness_report.txt" ] || continue
              out=$(python tools/golden.py diff "$a" "$b" --records 1 --fields 30 --labels "base,head" 2>&1 || true)
              con=$(diff <(sed -n '/^console output:/,$p' "$a/harness_report.txt") <(sed -n '/^console output:/,$p' "$b/harness_report.txt") | head -12 || true)
              case "$out" in *"records, the same"*) [ -z "$con" ] && continue;; esac
              echo "==== $s ($install${side:+, $side})   base = $BASE, head = $REF (console: < base, > head)"
              echo "$out"
              [ -z "$con" ] || { echo "console:"; echo "$con"; }
              grep -h "^FAILED" "$a/harness_report.txt" | sed 's/^/base /' || true
              grep -h "^FAILED" "$b/harness_report.txt" | sed 's/^/head /' || true
              # where the camera looks and what the ground clicks found (harness.cpp groundview, clickground)
              grep -h "harness: \(ground\|clickground\|starter settings\)" "$a/ei-rebuild.log" 2>/dev/null | head -12 | sed 's/^/base /' || true
              grep -h "harness: \(ground\|clickground\|starter settings\)" "$b/ei-rebuild.log" 2>/dev/null | head -12 | sed 's/^/head /' || true
            done
            done
          done
